<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AI Video Learning</title>

<style>

body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  min-height: 100vh;
}

/* الكونتينر */
.container {
  width: 100%;
  max-width: 800px;
  margin: auto;
  padding: 20px 15px 100px;
  box-sizing: border-box;
}

/* العنوان */
h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* صندوق الإدخال */
.top-box {
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
}

/* الإدخال */
input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-bottom: 10px;
  box-sizing: border-box;
}

/* الزر */
button {
  width: 100%;
  background: #22c55e;
  padding: 12px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* الكارد */
.card {
  background: #1e293b;
  margin-top: 15px;
  padding: 15px;
  border-radius: 15px;
}

/* الفيديو */
iframe {
  width: 100%;
  height: 220px;
  border-radius: 15px;
}

/* الجدول */
.table {
  width: 100%;
  border-collapse: collapse;
}

.table td {
  padding: 10px;
  border-bottom: 1px solid #334155;
}

/* الكلمة */
.en {
  color: #38bdf8;
  font-weight: bold;
}

/* العربي */
.ar {
  color: #f87171;
}

/* زر الصوت */
.speak-btn {
  background: #0ea5e9;
  border: none;
  border-radius: 8px;
  padding: 6px 10px;
  color: white;
  cursor: pointer;
}

/* loading */
#loading {
  text-align: center;
  margin-top: 10px;
  display: none;
}

</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بالذكاء الاصطناعي</h2>

<div class="top-box">
  <input id="url" placeholder="ضع رابط YouTube">
  <button onclick="sendUrl()">🔗 تحليل الرابط</button>
</div>

<p id="loading">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <iframe id="videoFrame" allowfullscreen></iframe>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let videoId = "";

/* استخراج ID */
function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

/* عرض الفيديو */
function showVideo(url) {
  videoId = getVideoId(url);
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}`;
  document.getElementById("videoBox").style.display = "block";
}

/* إرسال */
async function sendUrl() {
  const url = document.getElementById("url").value;
  if (!url) return alert("اكتب رابط");

  document.getElementById("loading").style.display = "block";

  showVideo(url);

  const res = await fetch(WEBHOOK, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ url })
  });

  const data = await res.json();

  document.getElementById("loading").style.display = "none";

  show(data);
}

/* عرض البيانات */
function show(data) {
  let html = "";

  for (let cat in data) {
    if (!data[cat] || data[cat].length === 0) continue;

    html += `<div class="card"><h3>${cat}</h3><table class="table">`;

    data[cat].forEach(w => {
      html += `
      <tr>
        <td class="en">${w.en || w.word || ""}</td>
        <td>
          <button class="speak-btn" onclick="speak('${w.en || w.word}')">🔊</button>
        </td>
        <td class="ar">${w.ar || w.arabic || ""}</td>
      </tr>
      `;
    });

    html += "</table></div>";
  }

  document.getElementById("result").innerHTML = html;
}

/* 🎤 صوت رجالي بطيء */
function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);

  msg.lang = "en-US";
  msg.rate = 0.75;
  msg.pitch = 0.8;

  const voices = speechSynthesis.getVoices();

  const maleVoice = voices.find(v =>
    v.name.toLowerCase().includes("male") ||
    v.name.toLowerCase().includes("david") ||
    v.name.toLowerCase().includes("mark")
  );

  if (maleVoice) msg.voice = maleVoice;

  speechSynthesis.speak(msg);
}

/* إصلاح الكيبورد */
window.addEventListener("resize", () => {
  document.body.style.height = window.innerHeight + "px";
});

</script>

</body>
</html>
