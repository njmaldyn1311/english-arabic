<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{margin:0;background:#0f172a;font-family:Arial;color:white;text-align:center;}
.header{display:flex;justify-content:space-between;padding:10px;}
.home-btn{background:#38bdf8;padding:8px 15px;border-radius:10px;border:none;color:white;}
.card{background:#e5e7eb;color:black;margin:15px;padding:15px;border-radius:20px;}
.btn{width:100%;padding:12px;border:none;border-radius:12px;margin-top:10px;color:white;font-size:16px;}
.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}
canvas{width:100%;border-radius:15px;margin-top:10px;}
.bottom-buttons{display:flex;gap:5px;margin-top:10px;}
.bottom-buttons button{flex:1;padding:10px;border:none;border-radius:10px;color:white;font-size:13px;background:#22c55e;}
textarea{width:100%;height:60px;padding:10px;border-radius:10px;border:none;margin-top:10px}

/* 🔥 التحليل */
#analysisBox{
  display:none;
  margin-top:15px;
  background:#1e293b;
  color:white;
  padding:15px;
  border-radius:15px;
  text-align:right;
}
.title{color:#38bdf8;font-weight:bold;margin-top:10px}

/* ⏳ */
#loadingBox{
  display:none;
  margin-top:10px;
  background:#334155;
  padding:10px;
  border-radius:10px;
}

/* ❌ */
#errorBox{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:red;
  padding:10px;
  border-radius:10px;
  display:none;
}
</style>

</head>
<body>

<div class="header">
  <div id="userName">👤</div>
  <button class="home-btn">🏠</button>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <button id="openBtn" class="btn download" onclick="openBook()">📥 تحميل وفتح</button>

  <canvas id="pdf"></canvas>

  <!-- 🔥 الأزرار فوق -->
  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅</button>
    <button onclick="nextPage()">➡</button>
    <button onclick="savePage()">⭐</button>
    <button onclick="readPage()">🔊</button>
  </div>

  <!-- ✍️ ملاحظات -->
  <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>
  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

  <!-- 🧠 زر التحليل -->
  <button class="btn orange" onclick="analyzePage()">🧠 تحليل الصفحة</button>

  <div id="loadingBox">⏳ جاري التحليل...</div>

  <!-- 🔥 النتيجة -->
  <div id="analysisBox"></div>

</div>

<div id="errorBox"></div>

<script>

const AI_WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/headway";

let pdfDoc=null;
let currentPage=1;

async function openBook(){
  const loadingTask = pdfjsLib.getDocument("https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf");
  pdfDoc = await loadingTask.promise;
  renderPage(currentPage);
}

async function renderPage(num){
  const page = await pdfDoc.getPage(num);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");
  const viewport = page.getViewport({scale:1.5});
  canvas.height = viewport.height;
  canvas.width = viewport.width;
  await page.render({canvasContext:ctx,viewport}).promise;
}

function nextPage(){currentPage++;renderPage(currentPage);}
function prevPage(){currentPage--;renderPage(currentPage);}

function savePage(){showError("تم حفظ ⭐");}

function saveNote(){showError("تم حفظ الملاحظة");}

function readPage(){}

function showError(msg){
  let e=document.getElementById("errorBox");
  e.innerText=msg;
  e.style.display="block";
  setTimeout(()=>e.style.display="none",2000);
}

/* 🔥 التحليل */
async function analyzePage(){

  if(!pdfDoc){
    showError("افتح الكتاب أولاً");
    return;
  }

  document.getElementById("loadingBox").style.display="block";

  try{

    const page = await pdfDoc.getPage(currentPage);
    const content = await page.getTextContent();
    let text = content.items.map(i=>i.str).join(" ");

    const res = await fetch(AI_WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ text })
    });

    const raw = await res.json();

    let data;

    try{
      let txt = raw.content?.[0]?.text || raw.text || "";
      txt = txt.replace(/```json/g,"").replace(/```/g,"").trim();
      data = JSON.parse(txt);
    }catch{
      showError("خطأ في البيانات");
      return;
    }

    document.getElementById("loadingBox").style.display="none";
    showAnalysis(data);

  }catch{
    document.getElementById("loadingBox").style.display="none";
    showError("فشل التحليل");
  }
}

/* 🔥 عرض */
function showAnalysis(data){

  let keywords = data.keywords || [];

  document.getElementById("analysisBox").style.display="block";
  document.getElementById("analysisBox").innerHTML = `
    <div class="title">🧠 الشرح</div>
    <div>${data.summary}</div>

    <div class="title">🌍 الترجمة</div>
    <div>${data.translation}</div>

    <div class="title">📌 كلمات مهمة</div>
    <div>${keywords.join(" - ")}</div>
  `;
}

</script>

</body>
</html>
