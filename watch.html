<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎥 فصل مباشر ذكي</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{max-width:900px;margin:auto;padding:15px;}

.video-box{
  position:relative;
  width:100%;
  padding-top:56.25%;
  border-radius:15px;
  overflow:hidden;
  background:#000;
}

#player{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

.controls{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:12px;
  color:white;
  cursor:pointer;
}

.sub-en{color:#38bdf8;font-weight:bold;margin-top:20px;}
.sub-ar{color:#facc15;font-size:20px;font-weight:bold;margin-top:10px;}

.mic-status{
  margin-top:10px;
  font-size:14px;
  color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

<h2>🎥 فصل مباشر + ترجمة صوتية</h2>

<div class="video-box">
  <div id="player"></div>
</div>

<div class="controls">
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔄 إعادة</button>
  <button onclick="startMic()">🎙 تشغيل الترجمة الصوتية</button>
</div>

<div class="mic-status" id="micStatus">🎤 المايك متوقف</div>

<div class="sub-en" id="subEn"></div>
<div class="sub-ar" id="subAr"></div>

</div>

<script>

/* ================= الفيديو ================= */

let player;

function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    videoId: new URLSearchParams(location.search).get("video"),
  });
}

function play(){ player.playVideo(); }
function pause(){ player.pauseVideo(); }
function restart(){ player.seekTo(0,true); }

/* ================= الترجمة بالصوت ================= */

let ws;
let mediaRecorder;

/* 🔥 تشغيل المايك */
async function startMic(){

  document.getElementById("micStatus").innerText = "🎤 جاري التشغيل...";

  const stream = await navigator.mediaDevices.getUserMedia({audio:true});

  // 🔥 WebSocket (غير الرابط حسب سيرفرك)
  ws = new WebSocket("wss://your-server.com/stt");

  ws.onopen = () => {
    document.getElementById("micStatus").innerText = "🎙 الترجمة تعمل";
  };

  ws.onmessage = (msg) => {

    let data = JSON.parse(msg.data);

    // 🔥 ترجمة مباشرة
    subEn.innerText = data.en || "";
    subAr.innerText = data.ar || "";

  };

  mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });

  mediaRecorder.ondataavailable = e => {
    if(ws.readyState === 1){
      ws.send(e.data);
    }
  };

  mediaRecorder.start(500); // إرسال كل 0.5 ثانية
}

</script>

</body>
</html>
