<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.header{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.user-name{ color:#38bdf8; font-size:14px; }

.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 14px;
  border-radius:12px;
  color:#38bdf8;
  cursor:pointer;
}

.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:420px;
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  text-align:center;
}

.title{font-size:22px;margin-bottom:10px;}
.question{font-size:18px;margin:15px 0;}
.speaker{font-size:26px;cursor:pointer;}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  text-align:center;
  margin-top:10px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
}

.option{
  width:100%;
  background:#334155;
  margin:6px 0;
  color:white;
}

.check{background:#22c55e;}

.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:20px 35px;
  border-radius:18px;
  display:none;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}

.success{background:#22c55e;}
.error{background:#ef4444;}
</style>
</head>

<body>

<div class="header">
  <div class="user-name" id="username">👤</div>
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">
  <div class="card">

    <div class="title">🧠 اختبار ذكي</div>

    <div id="question" class="question">...</div>

    <div id="speaker" class="speaker" onclick="play()">🔊</div>

    <div id="answers"></div>

    <input id="input" placeholder="اكتب الإجابة">

    <button id="mainBtn" class="check" onclick="check()">تحقق</button>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 🔥 توحيد user_id */
let user_id = localStorage.getItem("user_id");

if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

console.log("USER:", user_id);

/* 🔥 تتبع */
async function track(action){
  await fetch(SUPABASE_URL + "/rest/v1/user_activity", {
    method: "POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id: user_id,
      page: "quiz_page",
      action: action
    })
  });
}

track("دخول صفحة الاختبار");

/* 👤 الاسم */
let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");
document.getElementById("username").innerText =
  "👤 " + parts[0] + (parts[1] ? " " + parts[1] : "");

/* البيانات */
let words = [];
let current = 0;
let type = "";
let currentWord = null;

let correctCount = 0;
let total = 0;

function normalizeArabic(text){
  return text.replace(/ال/g,"").replace(/[يتن]/g,"").replace(/[أإآ]/g,"ا").trim();
}

/* تحميل الكلمات */
async function load(){

  let { data } = await client
    .from("user_star_words") // 🔥 تم التعديل
    .select("*")
    .eq("user_id", user_id);

  words = data || [];

  if(words.length === 0){
    document.getElementById("question").innerText = "⚠️ ما عندك كلمات";
    return;
  }

  next();
}

/* السؤال */
function next(){

  if(current >= words.length){
    finish();
    return;
  }

  currentWord = words[current];

  let en = currentWord.word;
  let ar = currentWord.translation;

  let types = ["mcq","write","listen"];
  type = types[Math.floor(Math.random()*types.length)];

  answers.innerHTML = "";
  input.value = "";

  total++;

  if(type === "mcq"){
    hideAll();
    question.innerText = "ما معنى: " + en;

    let options = [...words].sort(()=>0.5-Math.random()).slice(0,3);
    options.push(currentWord);
    options = options.sort(()=>0.5-Math.random());

    options.forEach(o=>{
      let btn=document.createElement("button");
      btn.className="option";
      btn.innerText=o.translation;
      btn.onclick=()=>checkChoice(btn.innerText, ar);
      answers.appendChild(btn);
    });
  }

  if(type === "write"){
    showInput();
    question.innerText = "اكتب المعنى بالعربي: " + en;
  }

  if(type === "listen"){
    showInput();
    question.innerText = "🎧 استمع واكتب المعنى";
    speak(en);
  }
}

function hideAll(){
  speaker.style.display="none";
  input.style.display="none";
}

function showInput(){
  speaker.style.display="block";
  input.style.display="block";
}

function speak(text){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

function play(){
  speak(currentWord.word);
}

/* الإجابة */
function checkChoice(selected, correct){
  let ok = selected === correct;
  if(ok) correctCount++;

  track("إجابة " + (ok ? "صحيحة" : "خطأ"));

  toast(correct, ok);
  nextStep();
}

function check(){
  if(type==="mcq") return;

  let val = input.value.trim();
  let correct = currentWord.translation;

  let ok =
    normalizeArabic(val).includes(normalizeArabic(correct)) ||
    normalizeArabic(correct).includes(normalizeArabic(val));

  if(ok) correctCount++;

  track("إجابة كتابة " + (ok ? "صحيحة" : "خطأ"));

  toast(correct, ok);
  nextStep();
}

function nextStep(){
  current++;
  setTimeout(next,800);
}

/* النهاية */
async function finish(){

  let percent=Math.round((correctCount/total)*100);

  question.innerHTML = `🎉 انتهى الاختبار<br><br>نتيجتك: ${percent}%`;

  input.style.display="none";
  answers.innerHTML="";

  await client.from("results").insert({
    user_id:user_id,
    score:percent
  });

  track("انتهى الاختبار: " + percent + "%");

  mainBtn.innerText="🔄 إعادة الاختبار";
  mainBtn.onclick=restart;
}

function restart(){
  current=0;
  correctCount=0;
  total=0;

  mainBtn.innerText="تحقق";
  mainBtn.onclick=check;

  input.style.display="block";

  next();
}

/* toast */
function toast(correct, ok){

  let t=document.getElementById("toast");

  t.innerHTML = ok ? "✅<br>إجابة صحيحة" : "❌<br>" + correct;

  t.className="toast "+(ok?"success":"error");
  t.style.display="block";

  setTimeout(()=>t.style.display="none",1200);
}

function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
