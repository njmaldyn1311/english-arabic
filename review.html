<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
}

.home{
  background:#38bdf8;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

.container{
  padding:15px;
}

.card{
  background:#e5e7eb;
  color:black;
  padding:15px;
  border-radius:20px;
}

.mainBtn{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  background:#3b82f6;
  color:white;
}

.controls{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:15px;
  flex-wrap:wrap;
}

.ctrlBtn{
  background:#22c55e;
  border:none;
  padding:10px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* alert */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  width:85%;
  max-width:280px;
}

.buy{
  background:#f59e0b;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  margin-top:10px;
}

.close{
  background:#64748b;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  margin-top:10px;
}

canvas{
  width:100% !important;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <div id="userName">...</div>
  <div class="home" onclick="location.href='index.html'">🏠 الرئيسية</div>
</div>

<div class="container">

  <h2>📘 كتابي</h2>

  <div class="card">

    <h2>💰 سعر الكتاب: 250 ريال</h2>

    <button id="openBtn" class="mainBtn" onclick="openBook()">
      📥 تحميل وفتح
    </button>

    <canvas id="pdf"></canvas>

  </div>

  <div class="controls">
    <button class="ctrlBtn" onclick="prev()">⬅️ السابق</button>
    <button class="ctrlBtn" onclick="next()">➡️ التالي</button>
    <button class="ctrlBtn" onclick="savePage()">⭐ حفظ</button>
    <button class="ctrlBtn" onclick="speak()">🔊 قراءة</button>
  </div>

</div>

<!-- 🔒 popup -->
<div id="alert" class="overlay">
  <div class="popup">
    <h3 id="alertText">🔒 الكتاب للمشتركين فقط</h3>
    <button class="buy" onclick="buy()">📱 شراء عبر واتساب</button>
    <button class="close" onclick="closeAlert()">إغلاق</button>
  </div>
</div>

<script>

const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userId = localStorage.getItem("user_id");
let isPaid = false;

let pdfDoc=null;
let currentPage=1;
let totalPages=0;

async function checkUser(){

  const { data } = await client
    .from("users")
    .select("name,plan")
    .eq("id", userId)
    .single();

  if(data){
    isPaid = data.plan === "paid";

    let names = (data.name || "").split(" ");
    document.getElementById("userName").innerText =
      (names[0]||"") + " " + (names[1]||"");
  }
}

async function openBook(){

  let btn = document.getElementById("openBtn");

  btn.innerText="⏳ جاري التحميل...";
  btn.disabled=true;

  await checkUser();

  if(!isPaid){
    btn.innerText="📥 تحميل وفتح";
    btn.disabled=false;
    document.getElementById("alert").style.display="flex";
    return;
  }

  try{

    const { data, error } = await client.storage
      .from("books")
      .createSignedUrl("newHEADWAYbeginnerstudentbook.pdf",60);

    if(error || !data?.signedUrl){
      throw new Error("URL Error");
    }

    const loadingTask = pdfjsLib.getDocument({
      url: data.signedUrl
    });

    pdfDoc = await loadingTask.promise;

    totalPages = pdfDoc.numPages;
    currentPage = 1;

    renderPage();

  }catch(e){
    console.error(e);

    document.getElementById("alertText").innerText =
      "❌ فشل تحميل الكتاب";

    document.getElementById("alert").style.display="flex";
  }

  btn.innerText="📖 تم فتح الكتاب";
  btn.disabled=false;
}

async function renderPage(){

  const page = await pdfDoc.getPage(currentPage);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");

  const viewport = page.getViewport({ scale:1.2 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext:ctx, viewport }).promise;

  // 📊 تتبع
  client.from("users")
    .update({ last_page: currentPage })
    .eq("id", userId);
}

function next(){
  if(currentPage < totalPages){
    currentPage++;
    renderPage();
  }
}

function prev(){
  if(currentPage > 1){
    currentPage--;
    renderPage();
  }
}

function savePage(){
  localStorage.setItem("saved_page", currentPage);
  alert("⭐ تم حفظ الصفحة");
}

function speak(){
  let u = new SpeechSynthesisUtterance("Reading page");
  speechSynthesis.speak(u);
}

function buy(){
  window.open("https://wa.me/966000000000","_blank");
}

function closeAlert(){
  document.getElementById("alert").style.display="none";
}

</script>

</body>
</html>
