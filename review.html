<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتاب</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
body{
  margin:0;
  background:#0f172a;
  text-align:center;
  color:white;
}

canvas{
  width:100%;
  max-width:800px;
  margin:auto;
}

.controls{
  margin:10px;
}
button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
}
</style></head><body><h3>📘 الكتاب</h3><div class="controls">
  <button onclick="prev()">⬅️ السابق</button>
  <span id="page"></span>
  <button onclick="next()">التالي ➡️</button>
</div><canvas id="pdf"></canvas>

<script>

const url = "https://YOUR-PDF-LINK.pdf";

let pdfDoc = null;
let pageNum = 1;

pdfjsLib.getDocument(url).promise.then(pdf=>{
  pdfDoc = pdf;
  renderPage(pageNum);
});

function renderPage(num){

  pdfDoc.getPage(num).then(page=>{

    let canvas = document.getElementById("pdf");
    let ctx = canvas.getContext("2d");

    let viewport = page.getViewport({scale:1.5});
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    page.render({canvasContext:ctx, viewport:viewport});

    document.getElementById("page").innerText =
      `صفحة ${num} / ${pdfDoc.numPages}`;
  });
}

function next(){
  if(pageNum < pdfDoc.numPages){
    pageNum++;
    renderPage(pageNum);
  }
}

function prev(){
  if(pageNum > 1){
    pageNum--;
    renderPage(pageNum);
  }
}

</script></body>
</html>
