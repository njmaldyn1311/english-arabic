<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
:root{
  --bg:#0f172a; --card:#1e293b; --main:#22c55e; --sub:#94a3b8;
}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial;text-align:center;}
.container{max-width:900px;margin:auto;padding:15px;}
#player{width:100%;height:240px;border-radius:15px;}
.card{background:var(--card);padding:15px;border-radius:15px;margin-top:15px;}
.controls{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
button{background:var(--main);border:none;padding:10px 15px;border-radius:10px;color:white;cursor:pointer;}
.sub-en{color:#38bdf8;font-weight:bold;}
.sub-ar{color:#facc15;font-size:18px;font-weight:bold;}
@media(min-width:768px){ #player{height:360px;} }
</style>
</head>

<body>

<div class="container">

<h2>🎥 فصل مباشر</h2>

<select id="role">
  <option value="teacher">👨‍🏫 معلم</option>
  <option value="student">🎓 طالب</option>
</select>

<div class="card">
  <div id="player"></div>

  <div class="controls">
    <button onclick="play()">▶️ تشغيل</button>
    <button onclick="pause()">⏸️ إيقاف</button>
  </div>

  <div id="subEn" class="sub-en"></div>
  <div id="subAr" class="sub-ar"></div>
</div>

<div id="result"></div>

</div>

<script>

/* 🔥 إعداداتك */
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let player;
let channel;
let room="room_main";
let isTeacher=false;
let currentVideo="";
let subtitles=[];

/* قراءة الرابط */
const params = new URLSearchParams(location.search);
const listId = params.get("list");

/* ✅ YT جاهز */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:listId
    },
    events:{
      onReady:()=>{
        init();
      },
      onStateChange:syncSend
    }
  });
}

/* 🔄 إرسال (المعلم) */
function syncSend(){

  if(!isTeacher) return;

  channel.send({
    type:'broadcast',
    event:'sync',
    payload:{
      time:player.getCurrentTime(),
      state:player.getPlayerState(),
      video:player.getVideoData().video_id
    }
  });

}

/* 🔄 استقبال (الطلاب) */
function listen(){

  channel = supa.channel(room);

  channel.on('broadcast',{event:'sync'},(msg)=>{

    if(isTeacher) return;

    let {time,state,video} = msg.payload;

    if(player.getVideoData().video_id !== video){
      player.loadVideoById(video);
    }

    if(Math.abs(player.getCurrentTime()-time)>1){
      player.seekTo(time,true);
    }

    if(state===1) player.playVideo();
    else player.pauseVideo();

  }).subscribe();

}

/* 🎮 تحكم */
function play(){ player.playVideo(); }
function pause(){ player.pauseVideo(); }

/* 🤖 AI */
async function analyze(videoId){

  let url="https://www.youtube.com/watch?v="+videoId;

  let res=await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  let data=await res.json();

  let html="";
  subtitles=[];

  for(let cat in data){
    html+=`<div class="card"><h3>${cat}</h3>`;
    data[cat].forEach(w=>{
      subtitles.push({
        time:w.time||0,
        en:w.example||"",
        ar:w.example_ar||""
      });
      html+=`<div>${w.en} - ${w.ar}</div>`;
    });
    html+="</div>";
  }

  result.innerHTML=html;
}

/* 🔤 ترجمة مباشرة */
setInterval(()=>{
  if(!player) return;

  let t=player.getCurrentTime();

  let current=subtitles.find(s=>t>=s.time && t<s.time+4);

  if(current){
    subEn.innerHTML=current.en;
    subAr.innerText=current.ar;
  }

},500);

/* 🎙 صوت مباشر */
let stream;
async function startVoice(){

  stream = await navigator.mediaDevices.getUserMedia({audio:true});

  // بسيط (broadcast mock)
  console.log("🎙 الصوت شغال");

}

/* 🚀 تشغيل */
function init(){

  isTeacher = document.getElementById("role").value==="teacher";

  listen();

  // تحليل أول فيديو
  setTimeout(()=>{
    let vid = player.getVideoData().video_id;
    if(vid){
      currentVideo=vid;
      analyze(vid);
    }
  },2000);

}

</script>

</body>
</html>
