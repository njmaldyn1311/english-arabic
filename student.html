<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراجعة الذكية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo";
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.question{
  font-size:20px;
  margin-bottom:15px;
}

.option{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
}

.correct{background:#22c55e;}
.wrong{background:#ef4444;}

</style>
</head>

<body>

<div class="top">
  <div>🔁 مراجعة ذكية</div>
  <div onclick="goHome()" style="cursor:pointer;">🏠</div>
</div>

<div class="card">
  <div id="quiz"></div>
</div>

<script>

const SUPABASE_URL = "YOUR_URL";
const SUPABASE_KEY = "YOUR_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

let words = [];
let questions = [];
let current = 0;

/* 📅 اليوم */
function isToday(date){
  let d = new Date(date);
  let now = new Date();
  return d.toDateString() === now.toDateString();
}

/* 🚀 تحميل */
async function load(){

  let { data } = await supabaseClient
    .from("words")
    .select("*")
    .eq("user_id", user_id);

  words = data || [];

  buildReview();
}

/* 🧠 بناء المراجعة */
function buildReview(){

  let today = words.filter(w => isToday(w.created_at));
  let old = words.filter(w => !isToday(w.created_at));

  // خذ من اليوم أكثر
  let mix = [
    ...today.sort(()=>0.5-Math.random()).slice(0,5),
    ...old.sort(()=>0.5-Math.random()).slice(0,3)
  ];

  questions = mix.sort(()=>0.5-Math.random());

  show();
}

/* عرض */
function show(){

  if(current >= questions.length){
    document.getElementById("quiz").innerHTML =
      "🎉 خلصت المراجعة اليوم!";
    return;
  }

  let q = questions[current];

  let options = words.sort(()=>0.5-Math.random()).slice(0,3);
  options.push(q);
  options = options.sort(()=>0.5-Math.random());

  let html = `
    <div class="question">ما معنى: ${q.en} ؟</div>
  `;

  options.forEach(o=>{
    html += `
      <button class="option"
      onclick="check(this,'${q.ar}','${o.ar}')">
      ${o.ar}
      </button>
    `;
  });

  document.getElementById("quiz").innerHTML = html;
}

/* تحقق */
function check(btn, correct, ans){

  let buttons = document.querySelectorAll(".option");

  buttons.forEach(b=>b.disabled=true);

  if(ans === correct){
    btn.classList.add("correct");
  }else{
    btn.classList.add("wrong");

    buttons.forEach(b=>{
      if(b.innerText === correct){
        b.classList.add("correct");
      }
    });
  }

  setTimeout(()=>{
    current++;
    show();
  },800);
}

/* رجوع */
function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
