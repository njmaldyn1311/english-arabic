<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* الحاوية */
.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* الهيدر */
.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 140px;
  position: relative;
}

/* صورة */
.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

/* المحتوى */
.content {
  padding: 70px 20px 20px;
}

h1 {
  margin: 10px 0;
  color: white;
}

.subtitle {
  color: #cbd5e1;
}

/* الطلاب */
.students {
  color: #22c55e;
  font-weight: bold;
  margin: 10px 0;
}

/* الكروت */
.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}

/* الأزرار */
button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

/* تسجيل خروج */
.logout {
  background: #ef4444;
  margin-top: 10px;
}

/* واتساب */
.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
  font-weight: bold;
}

/* زر عائم */
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  font-size: 20px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
}

/* 🔔 الإشعارات */
.notification {
  position: fixed;
  top: 20px;
  right: 50%;
  transform: translateX(50%);
  background: #1e293b;
  color: white;
  padding: 15px 20px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  display: none;
  z-index: 999;
  animation: fadeIn 0.5s;
}

.notification.success { border-left: 5px solid #22c55e; }
.notification.error { border-left: 5px solid #ef4444; }
.notification.info { border-left: 5px solid #3b82f6; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(50%) translateY(0); }
}
</style>
</head>

<body>

<!-- 🔔 الإشعار -->
<div id="notification" class="notification"></div>

<div class="container">

  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students" id="students">
      👨‍🎓 أكثر من 120 طالب
    </div>

    <div class="card">
      <span>📚 الفصل الذكي</span>
      <button onclick="goClass()">ابدأ</button>
    </div>

    <div class="card">
      <span>📺 تحليل فيديو</span>
      <button onclick="goYoutube()">ابدأ</button>
    </div>

    <div class="card">
      <span>📄 تحليل PDF</span>
      <button onclick="goPDF()">ابدأ</button>
    </div>

    <div class="card">
      <span>🔍 البحث</span>
      <button onclick="goSearch()">ابدأ</button>
    </div>

    <div class="card">
      <span>📝 اختبار</span>
      <button onclick="goTest()">ابدأ</button>
    </div>

    <div class="card">
      <span>📊 مراجعة</span>
      <button onclick="goReview()">فتح</button>
    </div>

    <div class="card">
      <span>📘 كتابي </span>
      <button onclick="goHeadway()">فتح</button>
    </div>

    <div class="card">
      <span>✨ ميزة جديدة</span>
      <button onclick="goUpdate1()">عرض</button>
    </div>

    <div class="card">
      <span>🆕 التحديثات</span>
      <button onclick="goUpdate2()">عرض</button>
    </div>

    <div class="card">
      <span>👤 حسابي</span>
      <button onclick="goProfile()">فتح</button>
    </div>

    <a id="whatsappLink" target="_blank" class="whatsapp">
      💬 تواصل معي على واتساب
    </a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<a id="whatsappFloat" target="_blank" class="whatsapp-float">💬</a>

<script>

// تحقق تسجيل الدخول
const userId = localStorage.getItem("user_id");
if(!userId){
  window.location.href = "login.html";
}

// اسم الطالب
let userName = localStorage.getItem("user_name") || "طالب";

// واتساب
let message = `السلام عليكم، أنا ${userName} وأحتاج مساعدة 🙏`;
let encoded = encodeURIComponent(message);
let whatsappURL = `https://wa.me/message/735SJORMFI74H1?text=${encoded}`;

document.getElementById("whatsappLink").href = whatsappURL;
document.getElementById("whatsappFloat").href = whatsappURL;

// 🔔 إشعارات
function showNotification(text, type="info") {
  const notif = document.getElementById("notification");
  notif.className = "notification " + type;
  notif.innerText = text;
  notif.style.display = "block";

  setTimeout(() => {
    notif.style.display = "none";
  }, 4000);
}

// 👨‍🎓 عداد طبيعي
let count = parseInt(localStorage.getItem("studentsCount")) || 120;

function updateStudents() {
  if (Math.random() > 0.5) return;
  count += 1;
  document.getElementById("students").innerText =
    "👨‍🎓 أكثر من " + count + " طالب";
  localStorage.setItem("studentsCount", count);
}

function randomInterval() {
  updateStudents();
  const next = Math.floor(Math.random() * 30000) + 30000;
  setTimeout(randomInterval, next);
}

randomInterval();

// 🔁 تنقل
function goClass(){ window.location.href = "myclass.html"; }
function goYoutube(){ window.location.href = "youtube.html"; }
function goPDF(){ window.location.href = "pdf.html"; }
function goSearch(){ window.location.href = "search.html"; }
function goProfile(){ window.location.href = "student.html"; }
function goTest(){ window.location.href = "test.html"; }
function goReview(){ window.location.href = "review.html"; }
function goHeadway(){ window.location.href = "headwaybook.html"; }
function goUpdate1(){ window.location.href = "update1.html"; }
function goUpdate2(){ window.location.href = "update2.html"; }

// تسجيل خروج
function logout(){
  const studentsCount = localStorage.getItem("studentsCount");
  localStorage.clear();
  localStorage.setItem("studentsCount", studentsCount);
  window.location.href = "login.html";
}

// 🔥 أمثلة إشعارات (تشيلها لاحقاً)
setTimeout(()=>{
  showNotification("✨ تم إضافة ميزة جديدة!", "success");
},2000);

setTimeout(()=>{
  showNotification("🆕 تم تحديث النظام", "info");
},6000);

</script>

</body>
</html>
