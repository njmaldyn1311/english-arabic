<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل PDF</title><style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #1e88e5, #26c6da);
  margin: 0;
  padding: 0;
}

/* 🔥 الحاوية */
.container {
  display: flex;
  justify-content: center;
  padding: 20px;
}

/* 🔥 الكرت الأبيض (مثل الصفحة الرئيسية) */
.card {
  background: #f3f4f6;
  width: 80%;
  max-width: 420px; /* 👈 نفس شكل الجوال */
  border-radius: 30px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

/* العنوان */
h2 {
  margin-bottom: 20px;
}

/* زر */
button {
  background: linear-gradient(135deg, #1e88e5, #26c6da);
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 15px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  opacity: 0.9;
}

/* النتائج */
#result {
  margin-top: 20px;
}

/* عنصر الكلمة */
.word {
  background: white;
  border-radius: 12px;
  padding: 10px;
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* الإنجليزي */
.en {
  flex: 1;
  text-align: left;
}

/* العربي */
.ar {
  flex: 1;
  text-align: right;
}

/* تحميل */
.loading {
  margin-top: 15px;
  color: #1e88e5;
}

/* 🔥 موبايل */
@media (max-width: 600px) {
  .card {
    max-width: 95%;
    border-radius: 25px;
    padding: 20px;
  }
}
</style></head><body><div class="container">  <div class="card"><h2>📄 رفع PDF</h2>

<input type="file" id="file" accept="application/pdf"><br><br>

<button onclick="upload()">🚀 تحليل</button>

<p id="status"></p>

<div id="result"></div>

  </div></div><script>
async function upload() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!file) {
    alert("اختر ملف");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  status.innerText = "⏳ جاري التحليل...";
  result.innerHTML = `<div class="loading">⏳ جاري استخراج الكلمات...</div>`;

  try {
    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
      method: "POST",
      body: formData
    });

    let data = await res.json();

    if (data.raw) {
      try {
        data = JSON.parse(data.raw);
      } catch {}
    }

    status.innerText = "✅ تم التحليل";

    function renderList(list) {
      return (list || []).map(item => `
        <div class="word">
          <span class="en">${item.word || item.phrase}</span>
          <button onclick="speak('${item.word || item.phrase}')">🔊</button>
          <span class="ar">${item.arabic}</span>
        </div>
      `).join("");
    }

    result.innerHTML = `
      <h3>📌 الأفعال</h3>
      ${renderList(data.verbs)}

      <h3>📌 الأسماء</h3>
      ${renderList(data.nouns)}
    `;

  } catch (err) {
    status.innerText = "❌ خطأ";
  }
}

function speak(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  speechSynthesis.speak(utterance);
}
</script></body>
</html>
