<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔝 الأعلى */
.top{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.user{color:#38bdf8;}

.home{
  background:#6366f1;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

/* 📦 */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:90%;
  max-width:420px;
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.question{margin:15px 0;font-size:18px;}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:10px;
  text-align:center;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
}

.option{
  background:#334155;
  color:white;
  margin:5px 0;
}

.check{background:#22c55e;}

.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:20px;
  border-radius:12px;
  display:none;
  font-size:20px;
}

.success{background:#22c55e;}
.error{background:#ef4444;}

</style>
</head>

<body>

<div class="top">
  <div class="user" id="username">👤</div>
  <div class="home" onclick="goHome()">🏠</div>
</div>

<div class="container">

  <div class="card">

    <div class="question" id="question">...</div>

    <div id="answers"></div>

    <input id="input" placeholder="اكتب الإجابة">

    <button class="check" onclick="check()">تحقق</button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

/* 👤 الاسم */
let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");
document.getElementById("username").innerText =
  "👤 " + parts[0] + (parts[1] ? " " + parts[1] : "");

let words = [];
let queue = [];
let currentWord;
let type;

let correctCount = 0;
let total = 0;

/* 🔥 تحميل الكلمات */
async function load(){

  let { data } = await client
    .from("user_words")
    .select("*")
    .eq("user_id", user_id);

  words = data || [];

  // 🔥 نكرر الكلمات لعمل وزن
  words.forEach(w=>{
    queue.push(w,w); // تكرار
  });

  next();
}

/* 🎯 اختيار ذكي */
function getNextWord(){
  return queue[Math.floor(Math.random()*queue.length)];
}

/* السؤال */
function next(){

  if(total >= 20){ // عدد الأسئلة
    finish();
    return;
  }

  currentWord = getNextWord();

  let en = currentWord.word;
  let ar = currentWord.translation;

  let types = ["mcq","write","listen","reverse"];
  type = types[Math.floor(Math.random()*types.length)];

  document.getElementById("answers").innerHTML="";
  document.getElementById("input").value="";

  total++;

  if(type === "mcq"){

    document.getElementById("input").style.display="none";
    document.getElementById("question").innerText = "ما معنى: " + en;

    let options = [...words].sort(()=>0.5-Math.random()).slice(0,3);
    options.push(currentWord);
    options = options.sort(()=>0.5-Math.random());

    options.forEach(o=>{
      let btn=document.createElement("button");
      btn.className="option";
      btn.innerText=o.translation;
      btn.onclick=()=>checkChoice(btn.innerText, ar);
      document.getElementById("answers").appendChild(btn);
    });
  }

  if(type === "write"){
    document.getElementById("input").style.display="block";
    document.getElementById("question").innerText = "اكتب معنى: " + en;
  }

  if(type === "listen"){
    document.getElementById("input").style.display="block";
    document.getElementById("question").innerText = "🎧 استمع واكتب المعنى";
    speak(en);
  }

  if(type === "reverse"){
    document.getElementById("input").style.display="block";
    document.getElementById("question").innerText = "اكتب بالإنجليزي: " + ar;
  }
}

/* 🔊 */
function speak(text){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* تحقق */
function checkChoice(sel, correct){
  handle(sel === correct);
}

function check(){

  if(type==="mcq") return;

  let val=document.getElementById("input").value.toLowerCase();
  let correct=(type==="reverse")?currentWord.word.toLowerCase():currentWord.translation.toLowerCase();

  handle(val===correct);
}

/* 🔥 الذكاء */
function handle(ok){

  if(ok){
    correctCount++;
  }else{
    // 🔥 إعادة الكلمة الصعبة
    queue.push(currentWord,currentWord,currentWord);
  }

  toast(ok?"✅":"❌",ok);

  saveProgress(ok);

  setTimeout(next,700);
}

/* 💾 حفظ */
async function saveProgress(ok){
  await client.from("progress").insert([{
    user_id,
    word: currentWord.word,
    correct: ok
  }]);
}

/* النهاية */
async function finish(){

  let percent=Math.round((correctCount/total)*100);

  document.getElementById("question").innerHTML=
    `🎉 انتهى الاختبار<br><br>نتيجتك: ${percent}%`;

  document.getElementById("input").style.display="none";
  document.getElementById("answers").innerHTML="";

  // 🔥 حفظ النتيجة
  await client.from("results").insert([{
    user_id,
    score: percent
  }]);
}

/* toast */
function toast(msg,ok){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast "+(ok?"success":"error");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",800);
}

function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
