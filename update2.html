<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📦 الأسماء</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
}

.user-name{
  color:#38bdf8;
  font-size:13px;
}

.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:6px 10px;
  border-radius:10px;
  color:#38bdf8;
  cursor:pointer;
}

.container{
  padding:10px;
  max-width:1000px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:20px;
  margin:10px 0;
}

.card{
  display:grid;
  grid-template-columns: 25px 1fr 100px 70px 40px;
  align-items:center;
  gap:4px;
  background:#1e293b;
  border-radius:10px;
  padding:6px;
  margin-bottom:6px;
}

@media(max-width:600px){
  .card{
    grid-template-columns: 20px 1fr 80px 60px 35px;
  }
}

.index{
  text-align:center;
  color:#38bdf8;
  font-weight:bold;
  font-size:11px;
}

.item{
  background:#334155;
  padding:3px 5px;
  border-radius:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
}

.translation{
  background:#0ea5e9;
  padding:4px;
  border-radius:6px;
  text-align:center;
  font-weight:bold;
  font-size:11px;
}

.unit{
  background:#22c55e;
  text-align:center;
  padding:4px;
  border-radius:6px;
  font-size:10px;
}

button{
  border:none;
  border-radius:6px;
  padding:2px 4px;
  cursor:pointer;
  font-size:10px;
}

.speak{ background:#22c55e; color:white; }
.save{ background:#0ea5e9; color:#000; }
.saved{ background:#0ea5e9; color:white; }
</style>
</head>

<body>

<div class="header">
  <div class="user-name" id="username">👤</div>
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">

  <div class="title">
    📦 الأسماء (<span id="totalNouns">0</span>)
  </div>

  <div id="list"></div>
</div>

<script>

// 🔥 Supabase
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* 🔥 user_id موحد */
let user_id=localStorage.getItem("user_id");
if(!user_id){
  user_id="user_"+Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id",user_id);
}

/* 🔥 تتبع */
function track(action){
  fetch(SUPABASE_URL+"/rest/v1/user_activity",{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id:user_id,
      page:"nouns",
      action:action
    })
  });
}

track("دخول صفحة الأسماء");

/* 👤 الاسم */
let name=localStorage.getItem("user")||"طالب";
let parts=name.split(" ");
username.innerText="👤 "+parts[0];

/* 🔊 صوت */
function speak(text){
  let u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* ⭐ حفظ */
async function saveWord(word,translation,btn){

  await client.from("user_star_words").insert({
    user_id:user_id,
    word:word,
    translation:translation
  });

  track("حفظ اسم: "+word);

  btn.classList.add("saved");
  btn.innerText="✔";
}

/* تحميل */
async function load(){

  let {data,count}=await client
    .from("headway_nouns")
    .select("*",{count:"exact"});

  totalNouns.innerText=count||0;

  list.innerHTML="";

  data.forEach((w,i)=>{

    let word=w.word;
    let translation=w.translation||"";

    list.innerHTML+=`
    <div class="card">

      <div class="index">${i+1}</div>

      <div class="item">
        ${word}
        <button class="speak" onclick="speak('${word}')">🔊</button>
      </div>

      <div class="translation">${translation}</div>

      <div class="unit">${w.unit||'-'}</div>

      <button class="save" onclick="saveWord('${word}','${translation}',this)">⭐</button>

    </div>`;
  });
}

function goHome(){
  location.href="index.html";
}

load();

</script>

</body>
</html>
