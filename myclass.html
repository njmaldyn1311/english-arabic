<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفصل الذكي</title>

<style>
body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user{ display:flex; gap:8px; color:#38bdf8; }
.points{ color:#FFD700; }
.review{ background:#6366f1; padding:10px 15px; border-radius:12px; }

.title{text-align:center;}
.subtitle{text-align:center;color:#94a3b8;}

.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.select{
  background:#e5e7eb;
  color:black;
  padding:15px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.options{
  display:none;
  background:white;
  border-radius:15px;
  margin-top:10px;
}

.option{
  padding:15px;
  border-bottom:1px solid #ddd;
  color:black;
  cursor:pointer;
}

.input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  box-sizing:border-box;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
  margin-top:10px;
  font-size:18px;
}

.loading{text-align:center;margin-top:20px;color:#ccc;}

/* 🔥 عرض الكلمات */
.word{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #334155;
}
.en{color:#38bdf8;}
.ar{color:#f87171;}
</style>
</head>

<body>

<div class="top">
  <div class="user">👤 نجم</div>
  <div class="points">⭐ كلماتك: 0</div>
  <div class="review">📖 مراجعة</div>
</div>

<h2 class="title">📚 الفصل الذكي</h2>
<p class="subtitle">📘 عنوان الدرس</p>

<div class="card">

  <div class="select" onclick="toggleOptions()">
    <span id="typeText">📝 نص</span>
    <span>▼</span>
  </div>

  <div class="options" id="options">
    <div class="option" onclick="selectType('text')">📝 نص</div>
    <div class="option" onclick="selectType('link')">🔗 رابط</div>
    <div class="option" onclick="selectType('pdf')">📄 PDF</div>
  </div>

  <input id="textInput" class="input" placeholder="... اكتب النص هنا">

  <button class="btn" onclick="generateLesson()">🚀 إنشاء الدرس</button>

</div>

<div id="lesson"></div>

<script>

/* user id */
let user_id = localStorage.getItem("user_id");
if(!user_id){
  user_id = "user_" + Math.random().toString(36).substring(2,10);
  localStorage.setItem("user_id", user_id);
}

let selectedType="text";

function toggleOptions(){
  let o=document.getElementById("options");
  o.style.display=o.style.display==="block"?"none":"block";
}

function selectType(type){
  selectedType=type;
  document.getElementById("options").style.display="none";

  let text="📝 نص";
  if(type==="link") text="🔗 رابط";
  if(type==="pdf") text="📄 PDF";

  document.getElementById("typeText").innerText=text;
}

/* 🔥 عرض الكلمات */
function renderWords(words){

  let html="";

  for(let section in words){

    html += `<h3>${section}</h3>`;

    words[section].forEach(w=>{
      html+=`
        <div class="word">
          <div class="en">${w.en}</div>
          <div class="ar">${w.ar}</div>
        </div>
      `;
    });

  }

  return html;
}

async function generateLesson(){

  let input=document.getElementById("textInput").value;

  if(!input){
    alert("اكتب شي");
    return;
  }

  /* ✅ فضي الحقل */
  document.getElementById("textInput").value="";

  document.getElementById("lesson").innerHTML=
    `<div class="loading">⏳ جاري إنشاء الدرس...</div>`;

  try{

    let res=await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/lesson",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        inputPart:input,
        type:selectedType,
        user_id:user_id
      })
    });

    let data=await res.json();

    document.getElementById("lesson").innerHTML=`
      <div class="card">
        <p>${data.story || ""}</p>
        <hr>
        <p>${data.translation || ""}</p>
        ${data.words ? renderWords(data.words) : ""}
      </div>
    `;

  }catch(e){
    document.getElementById("lesson").innerHTML=
      `<div class="loading" style="color:red;">❌ خطأ</div>`;
  }

}

</script>

</body>
</html>
