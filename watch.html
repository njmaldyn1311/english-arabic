<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>

body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

#player{
  width:100%;
  height:220px;
  border-radius:15px;
}

/* أزرار */
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* ترجمة */
.sub-en{color:#38bdf8;font-weight:bold;}
.sub-ar{color:#facc15;font-size:18px;font-weight:bold;}

/* كروت */
.card{
  background:#1e293b;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
}

.word-box{
  border-bottom:1px solid #334155;
  padding:10px;
  text-align:right;
}

.icon{
  cursor:pointer;
  background:#0f172a;
  padding:8px;
  border-radius:10px;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:white;
  padding:10px 20px;
  border-radius:12px;
  font-size:14px;
  opacity:0;
  transition:0.3s;
}
.toast.show{opacity:1;}

@media(min-width:768px){
  #player{height:360px;}
}

</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو</h2>

<div id="player"></div>

<div class="controls">
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔄 إعادة</button>
</div>

<div id="subEn" class="sub-en"></div>
<div id="subAr" class="sub-ar"></div>

<div id="result"></div>

</div>

<div id="toast" class="toast">تم الحفظ</div>

<script>

/* 🔥 بياناتك */
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let player;
let subtitles=[];

/* قراءة الرابط */
const params = new URLSearchParams(location.search);
const listId = params.get("list");

/* تحميل الفيديو */
function onYouTubeIframeAPIReady(){

  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:listId
    },
    events:{
      onReady:()=>{
        setTimeout(loadAI,2000);
      }
    }
  });

}

/* تحكم */
function play(){ player.playVideo(); }
function pause(){ player.pauseVideo(); }
function restart(){ player.seekTo(0,true); }

/* Toast */
function showToast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },2000);
}

/* صوت */
function speak(text){
  let u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* حفظ */
async function saveWord(word,ar){

  try{
    await supa.from("user_star_words").insert({
      user_id:"user_test",
      word:word,
      translation:ar
    });

    showToast("⭐ تم الحفظ");

  }catch{
    showToast("❌ فشل الحفظ");
  }

}

/* AI */
async function loadAI(){

  let video = player.getVideoData().video_id;
  if(!video) return;

  let res=await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      url:"https://www.youtube.com/watch?v="+video
    })
  });

  let data=await res.json();

  let html="";
  subtitles=[];

  for(let cat in data){

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      subtitles.push({
        time:w.time||0,
        en:w.example||"",
        ar:w.example_ar||""
      });

      html+=`
      <div class="word-box">

        <div style="display:flex;justify-content:space-between;align-items:center">

          <div>
            <div class="sub-en">${w.en}</div>
            <div class="sub-ar">${w.ar}</div>
          </div>

          <div style="display:flex;gap:8px">
            <div class="icon" onclick="speak('${w.en}')">🔊</div>
            <div class="icon" onclick="saveWord('${w.en}','${w.ar}')">⭐</div>
          </div>

        </div>

      </div>
      `;
    });

    html+="</div>";
  }

  result.innerHTML=html;
}

/* ترجمة متزامنة */
setInterval(()=>{

  if(!player) return;

  let state = player.getPlayerState();

  // ⛔ تجاهل الإعلان والإيقاف
  if(state !== 1) return;

  let t = player.getCurrentTime();

  let current = subtitles.find(s=>t>=s.time && t<s.time+4);

  if(current){
    subEn.innerHTML=current.en;
    subAr.innerText=current.ar;
  }

},500);

</script>

</body>
</html>
