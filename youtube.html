<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

input {
  padding: 10px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;
  text-align: center;
}

button {
  background: #22c55e;
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

/* 🎬 فيديو */
#player {
  width: 100%;
  height: 300px;
  border-radius: 15px;
}

/* 🔘 CC */
#ccBtn {
  margin-top:10px;
  background:#00000088;
}
#ccBtn.active{
  background:#22c55e;
}

/* 📝 الترجمة */
#subtitleBox{
  margin-top:10px;
}

.sub-en{
  font-size:18px;
  color:#38bdf8;
}

.sub-ar{
  font-size:20px; /* 🔥 أكبر */
  color:#facc15; /* 🔥 أصفر */
  font-weight:bold;
}

/* الكلمات */
.line {
  text-align: left;
  margin: 10px 0;
  line-height:1.6;
}

.en { color: #38bdf8; font-weight:bold; }
.ar { color: #f87171; }

.example { color:#e2e8f0; }
.example-ar { color:#94a3b8; font-size:13px; }

.icon{
  cursor:pointer;
  margin-left:8px;
  background:#0f172a;
  padding:6px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<input id="url" placeholder="ضع رابط YouTube">
<br>
<button onclick="sendUrl()">تحليل</button>

<div id="videoBox" class="card" style="display:none;">
  <div id="player"></div>

  <button id="ccBtn" onclick="toggleCC()">CC</button>

  <div id="subtitleBox">
    <div id="subEn" class="sub-en"></div>
    <div id="subAr" class="sub-ar"></div>
  </div>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let player;
let subtitles = [];
let cc = true;

/* استخراج ID */
function getVideoId(url){
  if(url.includes("youtu.be")) return url.split("/").pop();
  return url.split("v=")[1]?.split("&")[0];
}

/* تشغيل الفيديو */
function loadVideo(id){

  if(player) player.destroy();

  player = new YT.Player("player",{
    videoId:id,
    events:{ onReady:startSync }
  });

}

/* مزامنة */
function startSync(){

  setInterval(()=>{

    if(!cc || !player) return;

    let t = player.getCurrentTime();

    subtitles.forEach(s=>{
      if(t >= s.start && t <= s.end){
        document.getElementById("subEn").innerText = s.en;
        document.getElementById("subAr").innerText = s.ar;
      }
    });

  },300);

}

/* 🔊 صوت */
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=0.9;
  speechSynthesis.speak(u);
}

/* CC */
function toggleCC(){
  cc = !cc;

  let btn=document.getElementById("ccBtn");

  if(cc){
    btn.classList.add("active");
  }else{
    btn.classList.remove("active");
    subEn.innerText="";
    subAr.innerText="";
  }
}

/* عرض */
function show(data){

  let html="";

  for(let cat in data){

    if(!Array.isArray(data[cat])) continue;

    html += `<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      subtitles.push({
        start:w.time || 0,
        end:(w.time||0)+3,
        en:w.example || w.en || "",
        ar:w.example_ar || w.ar || ""
      });

      html+=`
        <div class="line">
          <span class="en">${w.en || w.word}</span>
          <span class="icon" onclick="speak('${w.en || w.word}')">🔊</span>

          <span class="ar">${w.ar || w.arabic}</span>

          <div class="example">${w.example || ""}</div>
          <div class="example-ar">${w.example_ar || ""}</div>
        </div>
      `;
    });

    html += `</div>`;
  }

  document.getElementById("result").innerHTML=html;
}

/* إرسال */
async function sendUrl(){

  const url = document.getElementById("url").value;
  if(!url) return alert("حط الرابط");

  subtitles=[];

  document.getElementById("videoBox").style.display="block";

  const id = getVideoId(url);
  loadVideo(id);

  const res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  const data = await res.json();

  show(data);
}

</script>

</body>
</html>
