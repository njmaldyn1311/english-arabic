<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 مراجعة الدرس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user-name{ color:#38bdf8; font-size:14px; }

.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:6px 12px;
  border-radius:10px;
  color:#38bdf8;
  cursor:pointer;
  font-size:13px;
}

.container{
  max-width:500px;
  margin:auto;
  padding:10px;
}

.card{
  background:#1e293b;
  padding:18px;
  border-radius:18px;
  margin-bottom:12px;
}

.title{ font-size:18px; margin-bottom:10px; }

.input-group{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.input-group input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  text-align:center;
}

.input-group button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
}

.word{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #334155;
  padding:8px 0;
}

.en{color:#38bdf8;}
.ar{color:#facc15;}

.note{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  color:#cbd5f5;
}

.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:18px 25px;
  border-radius:12px;
  display:none;
  font-size:18px;
}

.success{background:#22c55e;}
.error{background:#ef4444;}
</style>
</head>

<body>

<div class="header">
  <div id="username" class="user-name">👤</div>
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">

  <div class="card">
    <div class="title">📝 ملاحظاتي</div>
    <div id="notes"></div>
  </div>

  <div class="card">
    <div class="title">⭐ كلمات الدرس</div>
    <div id="words"></div>
  </div>

  <div class="card">
    <div class="title">🧠 اختبار</div>
    <div id="question"></div>

    <div class="input-group">
      <input id="input" placeholder="اكتب المعنى">
      <button onclick="check()">تحقق</button>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 🔥 توحيد user_id */
let user_id = localStorage.getItem("user_id");

if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

console.log("USER:", user_id);

/* 🔥 تتبع */
async function track(action){
  await fetch(SUPABASE_URL + "/rest/v1/user_activity", {
    method: "POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id: user_id,
      page: "review_page",
      action: action
    })
  });
}

track("دخول صفحة المراجعة");

/* 👤 الاسم */
let name = localStorage.getItem("user") || "طالب";
let p = name.split(" ");
document.getElementById("username").innerText =
  "👤 " + p[0] + (p[1] ? " " + p[1] : "");

/* 📝 الملاحظات */
let notes = JSON.parse(localStorage.getItem("notes") || "[]");

let html="";
notes.forEach(n=>{
  html += `<div class="note">• ${n}</div>`;
});

document.getElementById("notes").innerHTML =
  html || "لا توجد ملاحظات";

/* ⭐ الكلمات */
let words = [];
let current = 0;

async function loadWords(){

  let { data } = await client
    .from("user_star_words")
    .select("*")
    .eq("user_id", user_id)
    .order("created_at", { ascending:false });

  words = data || [];

  renderWords();
  next();
}

function renderWords(){
  let html="";
  words.forEach(w=>{
    html+=`
      <div class="word">
        <div class="ar">${w.translation}</div>
        <div class="en">${w.word}</div>
      </div>
    `;
  });
  document.getElementById("words").innerHTML = html;
}

/* 🧠 اختبار */
function next(){

  if(current >= words.length){
    question.innerText="🎉 انتهى الدرس";
    track("انتهى المراجعة");
    return;
  }

  question.innerText = "ما معنى: " + words[current].word;
  input.value="";
}

function check(){

  let val = normalize(input.value);
  let correct = normalize(words[current].translation);

  let ok = val.includes(correct) || correct.includes(val);

  track("إجابة مراجعة " + (ok ? "صحيحة" : "خطأ"));

  toast(ok ? "✅ صح" : "❌ " + words[current].translation, ok);

  current++;
  setTimeout(next,700);
}

function normalize(t){
  return t.replace(/[أإآ]/g,"ا").trim();
}

function toast(msg, ok){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast "+(ok?"success":"error");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1000);
}

function goHome(){
  location.href="index.html";
}

loadWords();

</script>

</body>
</html>
