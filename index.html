<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* alert احترافي */
.custom-alert{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  width:80%;
  max-width:300px;
  text-align:center;
  z-index:9999;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}
.custom-alert button{
  margin-top:10px;
  background:#22c55e;
  border:none;
  padding:10px 20px;
  border-radius:10px;
  color:white;
}

/* باقي تصميمك بدون تغيير */
.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

.content {
  padding: 70px 20px 20px;
}

h1 { color:white; }

.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  color: white;
}

button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
}

.logout { background:#ef4444; }

.whatsapp {
  display:block;
  margin-top:15px;
  background:#25D366;
  padding:12px;
  border-radius:15px;
  text-decoration:none;
  color:white;
}

.whatsapp-float {
  position:fixed;
  bottom:20px;
  left:20px;
  background:#25D366;
  padding:15px;
  border-radius:50%;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>

    <div class="card">
      <span>📚 الفصل الذكي</span>
      <button onclick="goClass()">ابدأ</button>
    </div>

    <div class="card">
      <span>📄 تحليل PDF</span>
      <button onclick="goPDF()">ابدأ</button>
    </div>

    <div class="card">
      <span>📘 كتابي</span>
      <button onclick="goBook()">فتح</button>
    </div>

    <div class="card">
      <span>📊 مراجعة</span>
      <button onclick="goReview()">فتح</button>
    </div>

    <div class="card">
      <span>🛠 لوحة التحكم</span>
      <button onclick="goDashboard()">فتح</button>
    </div>

    <div class="card">
      <span>🚧 ميزة جديدة</span>
      <button onclick="comingSoon()">عرض</button>
    </div>

    <div class="card">
      <span>🔄 تحديثات</span>
      <button onclick="comingSoon()">عرض</button>
    </div>

    <!-- واتساب -->
    <a id="whatsappLink" class="whatsapp">💬 تواصل معي</a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<a id="whatsappFloat" class="whatsapp-float">💬</a>

<script>

// ✅ Supabase
const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// ✅ alert احترافي
function showAlert(msg){
  const div=document.createElement("div");
  div.className="custom-alert";
  div.innerHTML=`<p>${msg}</p><button onclick="this.parentElement.remove()">حسناً</button>`;
  document.body.appendChild(div);
}

// ✅ واتساب
let name = localStorage.getItem("user_name") || "طالب";
let phone = "0544507401";
let url = `https://wa.me/${phone}?text=${encodeURIComponent("السلام عليكم أنا "+name)}`;
document.getElementById("whatsappLink").href=url;
document.getElementById("whatsappFloat").href=url;

// ✅ التنقل (بدون تغيير روابطك)
function goClass(){ location.href="myclass.html"; }
function goPDF(){ location.href="pdf.html"; }
function goBook(){ location.href="headwaybook.html"; }
function goReview(){ location.href="review.html"; }

// 🔥 الداشبورد (تم إصلاحه)
async function goDashboard(){

  const phone = localStorage.getItem("user_phone");

  if(!phone){
    showAlert("⚠️ سجل دخول أولاً");
    return;
  }

  if(phone === "0544507401"){
    location.href="mydashboard.html";
  }else{
    showAlert("🚫 هذه الصفحة للمسؤول فقط");
  }
}

// 🔥 صفحات تحت التطوير
function comingSoon(){
  showAlert("🚧 الصفحة تحت التحديث");
}

// تسجيل خروج
function logout(){
  localStorage.clear();
  location.href="login.html";
}

</script>

</body>
</html>
