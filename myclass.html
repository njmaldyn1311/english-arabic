<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 الفصل الذكي</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 15px;
}

.story {
  text-align: left;
  line-height: 1.8;
  white-space: pre-line;
}

.translation {
  text-align: right;
  line-height: 1.8;
  white-space: pre-line;
}

.en {
  color:#38bdf8;
  font-weight:bold;
  cursor:pointer;
}

.ar {
  color:#f87171;
}

button {
  background:#22c55e;
  border:none;
  padding:12px;
  border-radius:10px;
  color:white;
  cursor:pointer;
  width:100%;
  margin-top:10px;
}

table {
  width:100%;
}
td {
  padding:8px;
  border-bottom:1px solid #334155;
}
</style>
</head>

<body>

<div class="container">

<h2>📚 الفصل الذكي</h2>

<textarea id="textInput" placeholder="اكتب النص هنا..."></textarea>
<button onclick="generateLesson()">🚀 إنشاء الدرس</button>

<div id="lesson"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/lesson";

//// 🔊 صوت
function speak(word){
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

//// 🚀 إنشاء الدرس
async function generateLesson(){

  const content = document.getElementById("textInput").value;

  document.getElementById("lesson").innerHTML = "⏳ جاري التحميل...";

  const res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      content,
      type:"text"
    })
  });

  const data = await res.json();
  render(data);
}

//// 🎨 عرض الدرس
function render(data){

  // ✨ ترتيب القصة
  const storyLines = data.story
    .replace(/\./g, ".\n")
    .split("\n")
    .filter(l => l.trim() !== "")
    .map(l => `<div>${l}</div>`).join("");

  const transLines = data.translation
    .replace(/\./g, ".\n")
    .split("\n")
    .filter(l => l.trim() !== "")
    .map(l => `<div>${l}</div>`).join("");

  let html = `
  <div class="card">
    <div class="story">${storyLines}</div>
    <hr>
    <div class="translation">${transLines}</div>
  </div>
  `;

  // الكلمات
  for(let cat in data.words){

    html += `<div class="card"><h3>${cat}</h3><table>`;

    data.words[cat].forEach(w => {

      html += `
      <tr>
        <td class="en" onclick="speak('${w.en}')">🔊 ${w.en}</td>
        <td class="ar">${w.ar}</td>
      </tr>
      `;
    });

    html += `</table></div>`;
  }

  document.getElementById("lesson").innerHTML = html;
}

</script>

</body>
</html>
