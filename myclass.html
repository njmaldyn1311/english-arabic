<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📚 الفصل الذكي</title><style>

body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  margin: 0;
}

* { box-sizing: border-box; }

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

/* 🔥 Overlay */
.overlay {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.3);
  display: none;
}

/* 🔥 Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  padding: 12px;
  border-radius: 12px;
}

.username { color: #38bdf8; }
.count { color: #fbbf24; }

.review-btn {
  background: #6366f1;
  padding: 10px;
  border-radius: 10px;
}

/* 🔥 Titles */
.main-title {
  text-align: center;
  font-size: 22px;
  margin-top: 15px;
}

.lesson-title {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 15px;
}

/* 🔥 Card */
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
}

/* 🔥 Inputs */
input, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin: 8px 0;
  text-align: center;
  font-size: 15px;
}

/* 🔥 Button */
button {
  background: #22c55e;
  border: none;
  padding: 14px;
  border-radius: 12px;
  color: white;
  width: 100%;
  cursor: pointer;
}

/* ===================== */
/* 🔥 Dropdown احترافي */
/* ===================== */

.dropdown {
  position: relative;
}

/* 🔥 زر الاختيار */
.dropdown-btn {
  background: linear-gradient(135deg,#ffffff,#f1f5f9);
  color: #000;
  padding: 14px;
  border-radius: 14px;
  text-align: center;
  cursor: pointer;
  font-weight: bold;
  position: relative;

  /* تأثير */
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: 0.3s;
}

/* 🔥 Hover */
.dropdown-btn:hover {
  transform: scale(1.02);
}

/* 🔥 السهم */
.dropdown-btn::after {
  content: "⌄";
  position: absolute;
  left: 15px;
  font-size: 18px;
  transition: 0.3s;
}

/* 🔥 دوران السهم */
.dropdown.active .dropdown-btn::after {
  transform: rotate(180deg);
}

/* 🔥 القائمة */
.dropdown-menu {
  position: absolute;
  top: 60px;
  width: 100%;
  background: white;
  color: black;
  border-radius: 14px;
  display: none;
  overflow: hidden;
  z-index: 10;

  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.dropdown-menu div {
  padding: 14px;
  cursor: pointer;
  font-weight: bold;
}

.dropdown-menu div:hover {
  background: #e2e8f0;
}

/* 🔥 hidden */
.hidden { display:none; }

</style></head><body><div class="overlay" id="overlay" onclick="closeMenu()"></div><div class="container"><div class="header">
  <div class="username" id="username">👤</div>
  <div class="count">⭐ كلماتك: 0</div>
  <div class="review-btn">📖 مراجعة</div>
</div><div class="main-title">📚 الفصل الذكي</div>
<div class="lesson-title">📘 عنوان الدرس</div><div class="card"><!-- 🔥 Dropdown --><div class="dropdown" id="dropdown">  <div class="dropdown-btn" onclick="toggleMenu()" id="selectedType">
    📝 نص
  </div>  <div class="dropdown-menu" id="menu">
    <div onclick="selectType('text','📝 نص')">📝 نص</div>
    <div onclick="selectType('link','🔗 رابط')">🔗 رابط</div>
    <div onclick="selectType('pdf','📄 PDF')">📄 PDF</div>
  </div></div><textarea id="textInput" placeholder="اكتب النص هنا..."></textarea><input type="text" id="linkInput" class="hidden" placeholder="ضع الرابط هنا">
<input type="file" id="pdfInput" class="hidden"><button onclick="generateLesson()">🚀 إنشاء الدرس</button>

</div><div id="lesson"></div></div><script>

/* 🔥 الاسم الأول */
const fullName = localStorage.getItem("user") || "طالب";
document.getElementById("username").innerText =
"👤 " + fullName.split(" ")[0];

let currentType = "text";

/* فتح */
function toggleMenu(){
  document.getElementById("menu").style.display = "block";
  document.getElementById("overlay").style.display = "block";
  document.getElementById("dropdown").classList.add("active");
}

/* إغلاق */
function closeMenu(){
  document.getElementById("menu").style.display = "none";
  document.getElementById("overlay").style.display = "none";
  document.getElementById("dropdown").classList.remove("active");
}

/* اختيار */
function selectType(type,label){

  currentType = type;

  document.getElementById("selectedType").innerText = label;

  closeMenu();

  document.getElementById("textInput").classList.add("hidden");
  document.getElementById("linkInput").classList.add("hidden");
  document.getElementById("pdfInput").classList.add("hidden");

  if(type === "text") document.getElementById("textInput").classList.remove("hidden");
  if(type === "link") document.getElementById("linkInput").classList.remove("hidden");
  if(type === "pdf") document.getElementById("pdfInput").classList.remove("hidden");
}

/* تجربة */
function generateLesson(){
  document.getElementById("lesson").innerHTML = `
  <div class="card">
    <p>🔥 جاهز للربط مع n8n</p>
  </div>`;
}

</script></body>
</html>
