<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* 📦 الكرت */
.card{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:350px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* 🧠 السؤال */
.word{
  font-size:22px;
  margin-bottom:20px;
}

/* 📝 الإدخال */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
  text-align:center;
}

/* 🔘 زر */
button{
  margin-top:12px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

/* 🔊 */
.speaker{
  font-size:24px;
  cursor:pointer;
  margin:10px 0;
}

/* 🔔 تنبيه جميل */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1e293b;
  padding:15px 20px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
  display:none;
  font-size:16px;
}

.toast.success{background:#22c55e;}
.toast.error{background:#ef4444;}

</style>
</head>

<body>

<div class="card">

  <div id="question" class="word">⏳ جاري التحميل...</div>

  <div class="speaker" onclick="playSound()">🔊</div>

  <input id="inputAnswer" placeholder="اكتب المعنى بالعربي">

  <button onclick="check()">تحقق</button>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let words = [];
let current = 0;
let currentWord = null;

// تحميل الكلمات
async function load(){

  let { data } = await client.from("words").select("*");

  words = data;
  next();
}

// عرض السؤال
function next(){

  if(current >= words.length){
    document.getElementById("question").innerText = "🎉 انتهى الاختبار";
    return;
  }

  currentWord = words[current];

  let en = currentWord.en || currentWord.word;

  document.getElementById("question").innerText = "🎧 اسمع واكتب المعنى";
  document.getElementById("inputAnswer").value = "";

  speak(en);
}

// تحقق
function check(){

  let ar = currentWord.ar || currentWord.arabic;
  let val = document.getElementById("inputAnswer").value.trim();

  if(val === ar){
    showToast("✅ صح", true);
  }else{
    showToast("❌ خطأ - " + ar, false);
  }

  current++;
  setTimeout(next,1000);
}

// 🔊 الصوت
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

function playSound(){
  let en = currentWord.en || currentWord.word;
  speak(en);
}

// 🔔 تنبيه
function showToast(msg, success){

  let t = document.getElementById("toast");
  t.innerText = msg;

  t.className = "toast " + (success ? "success" : "error");
  t.style.display = "block";

  setTimeout(()=>{
    t.style.display = "none";
  },1500);
}

load();

</script>

</body>
</html>
