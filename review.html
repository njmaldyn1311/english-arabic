<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
  user-select:none; /* 🔒 منع النسخ */
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.username{
  font-size:14px;
  color:#94a3b8;
}

.home{
  background:#38bdf8;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.viewer{
  width:100%;
  height:70vh;
  border:none;
  border-radius:15px;
  background:white;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:10px;
}

button{
  background:#22c55e;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.lock{
  background:#ef4444;
}

.page{
  margin-top:10px;
  font-size:14px;
  color:#cbd5f5;
}
</style>

</head>

<body oncontextmenu="return false"> <!-- 🔒 منع كلك يمين -->

<div class="container">

  <!-- header -->
  <div class="header">
    <div class="username" id="username">...</div>
    <div class="home" onclick="goHome()">🏠 الرئيسية</div>
  </div>

  <h2>📘 كتابي</h2>

  <iframe id="pdf" class="viewer"></iframe>

  <!-- الأزرار -->
  <div class="controls">
    <button onclick="prev()">⬅️ السابق</button>
    <button onclick="next()">التالي ➡️</button>

    <button onclick="savePage()">⭐ حفظ</button>
    <button onclick="speakPage()">🔊 قراءة</button>

    <button id="downloadBtn" onclick="downloadBook()">📥 تحميل</button>
  </div>

  <div class="page" id="page">صفحة 1</div>

</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let page = 1;
let userId = localStorage.getItem("user_id");
let isPaid = false;

// تحميل الصفحة
function loadPage(){
  document.getElementById("pdf").src = PDF_URL + "#page=" + page;
  document.getElementById("page").innerText = "صفحة " + page;

  track();
}

// التنقل
function next(){ page++; loadPage(); }
function prev(){ if(page>1){page--; loadPage();} }

// الرئيسية
function goHome(){ window.location.href="/"; }

// ⭐ حفظ الصفحة
function savePage(){
  localStorage.setItem("saved_page", page);
  alert("تم حفظ الصفحة ✅");
}

// 🔊 قراءة صوتية
function speakPage(){
  let text = "You are reading page " + page;
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

// 🔒 تحميل
function downloadBook(){

  if(!isPaid){
    alert("🔒 الكتاب للمشتركين فقط\nاشترك للوصول الكامل");
    return;
  }

  window.open(PDF_URL);
}

// 👤 جلب المستخدم
async function loadUser(){

  if(!userId){
    document.getElementById("username").innerText="زائر";
    return;
  }

  const { data } = await client
    .from("users")
    .select("*")
    .eq("id",userId)
    .single();

  document.getElementById("username").innerText = data?.name || "بدون اسم";

  isPaid = data?.plan === "paid";

  // تغيير لون زر التحميل
  if(!isPaid){
    document.getElementById("downloadBtn").classList.add("lock");
  }

  // رجوع لآخر صفحة
  if(data?.last_page_number){
    page = data.last_page_number;
  }

}

// 📊 تتبع
async function track(){

  if(!userId) return;

  await client.from("users").update({
    last_page: "book",
    last_page_number: page,
    last_active: new Date(),
    total_pages_read: (page || 1)
  }).eq("id", userId);

}

// 🚀 تشغيل
loadUser();
loadPage();

</script>

</body>
</html>
