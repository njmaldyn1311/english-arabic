<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي</title>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.user{color:#38bdf8;}
.points{color:#FFD700;}

.review{
  background:#6366f1;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
}

.card{
  background:#1e293b;
  margin:15px;
  padding:18px;
  border-radius:18px;
}

.word{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #334155;
}

.en{color:#38bdf8;}
.ar{color:#f87171;}

.quiz button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#334155;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

.quiz button:hover{
  background:#475569;
}

.correct{
  background:#22c55e !important;
}

.wrong{
  background:#ef4444 !important;
}

</style>
</head>

<body>

<div class="top">
  <div class="user" id="username">👤</div>
  <div class="points">⭐ كلماتك: <span id="count">0</span></div>
  <div class="review" onclick="goHome()">🏠 الرئيسية</div>
</div>

<div class="card">
  <h3>⭐ الكلمات المحفوظة</h3>
  <div id="words">⏳ تحميل...</div>
</div>

<div class="card">
  <h3>🧠 اختبار ذكي</h3>
  <div id="quiz"></div>
</div>

<script>

// 🔥 Supabase
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

let user_id = localStorage.getItem("user_id");

/* الاسم */
let fullName = localStorage.getItem("user") || "طالب";
document.getElementById("username").innerText = "👤 " + fullName;

/* الكلمات */
let words = [];

async function loadWords(){

  let res = await fetch(
    SUPABASE_URL + "/rest/v1/user_words?user_id=eq." + user_id + "&order=created_at.desc",
    {
      headers:{
        "apikey": SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      }
    }
  );

  let data = await res.json();

  // 🔥 ناخذ آخر درس (آخر 20 كلمة)
  words = data.slice(0,20);

  document.getElementById("count").innerText = words.length;

  renderWords();
  nextQuestion();

}

function renderWords(){
  let html="";
  words.forEach(w=>{
    html+=`
      <div class="word">
        <div class="ar">${w.translation}</div>
        <div class="en">${w.word}</div>
      </div>
    `;
  });
  document.getElementById("words").innerHTML = html || "لا توجد كلمات";
}

/* 🧠 اختبار ذكي */
let currentQuestion;

function nextQuestion(){

  if(words.length < 3){
    document.getElementById("quiz").innerHTML = "أضف كلمات أولاً ⭐";
    return;
  }

  currentQuestion = words[Math.floor(Math.random()*words.length)];

  let options = [...words]
    .sort(()=>0.5-Math.random())
    .slice(0,3);

  options.push(currentQuestion);
  options = options.sort(()=>0.5-Math.random());

  let html = `<div class="quiz">
    <p>ما معنى: <strong>${currentQuestion.word}</strong>؟</p>
  `;

  options.forEach(opt=>{
    html+=`
      <button onclick="answer(this,'${opt.translation}')">
        ${opt.translation}
      </button>
    `;
  });

  html+=`</div>`;

  document.getElementById("quiz").innerHTML = html;
}

function answer(btn, selected){

  let correct = currentQuestion.translation;

  if(selected === correct){
    btn.classList.add("correct");
  }else{
    btn.classList.add("wrong");
  }

  // ⏳ بعد ثانية يجيب سؤال جديد
  setTimeout(()=>{
    nextQuestion();
  }, 1000);

}

/* رجوع */
function goHome(){
  window.location.href="index.html";
}

/* تشغيل */
loadWords();

</script>

</body>
</html>
