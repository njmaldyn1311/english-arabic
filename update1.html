<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تدريب الأفعال</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:"Cairo",sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}

.container{
  margin:20px;
  padding:20px;
  background:#1e293b;
  border-radius:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111827;
  padding:12px;
  border-radius:12px;
  margin:8px 0;
}

input{
  width:90%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
}

button{
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

.listen{background:#3b82f6;color:white;}
.record{background:#f59e0b;color:white;}
.star{background:#facc15;color:black;}
</style>
</head>

<body>

<h2>🎤 تدريب الأفعال</h2>

<div class="container">

  <!-- 🔍 بحث -->
  <input id="search" placeholder="ابحث عن فعل..." oninput="searchVerb()">

  <!-- base -->
  <div class="row">
    <span id="base">-</span>
    <button class="listen" onclick="speak(base.innerText)">🔊</button>
  </div>

  <!-- past -->
  <div class="row">
    <span id="past">-</span>
    <button class="listen" onclick="speak(past.innerText)">🔊</button>
    <button class="record" onclick="record(past.innerText)">🎤</button>
  </div>

  <!-- pp -->
  <div class="row">
    <span id="pp">-</span>
    <button class="listen" onclick="speak(pp.innerText)">🔊</button>
  </div>

  <!-- ing -->
  <div class="row">
    <span id="ing">-</span>
    <button class="listen" onclick="speak(ing.innerText)">🔊</button>
    <button class="record" onclick="record(ing.innerText)">🎤</button>
  </div>

  <!-- ترجمة -->
  <div class="row">
    <span id="ar">-</span>
  </div>

  <!-- ⭐ حفظ -->
  <button class="star" onclick="saveVerb()">⭐ حفظ الكلمة</button>

  <div id="result"></div>

</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let currentVerb = null;
const userId = localStorage.getItem("user_id");

// 🔍 البحث
async function searchVerb(){

  const text = search.value;

  if(text.length < 2) return;

  const { data } = await client
    .from("verbs")
    .select("*")
    .ilike("base", `%${text}%`)
    .limit(1);

  if(data && data.length){

    const v = data[0];
    currentVerb = v;

    base.innerText = v.base;
    past.innerText = v.past;
    pp.innerText = v.pp;
    ing.innerText = v.ing;
    ar.innerText = v.ar;
  }
}

// 🔊 صوت
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  speechSynthesis.speak(msg);
}

// 🎤 تدريب
function record(correct){

  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";

  recognition.start();

  recognition.onresult = function(e){

    const spoken = e.results[0][0].transcript.toLowerCase();

    if(spoken.includes(correct.toLowerCase())){
      result.innerHTML = `<div style="color:#22c55e">✅ ممتاز</div>`;
    }else{
      result.innerHTML = `<div style="color:#ef4444">❌ قلت: ${spoken}</div>`;
    }

  };
}

// ⭐ حفظ
async function saveVerb(){

  if(!currentVerb){
    result.innerHTML = "❌ ابحث عن كلمة أولاً";
    return;
  }

  await client.from("saved_verbs").insert({
    user_id: userId,
    verb_id: currentVerb.id
  });

  result.innerHTML = "⭐ تم الحفظ";
}

</script>

</body>
</html>
