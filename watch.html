<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 تعلم بذكاء</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* HEADER */
.header{
  text-align:center;
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

/* VIDEO */
.video-box{
  width:90%;
  max-width:700px;
  margin:auto;
  border-radius:20px;
  overflow:hidden;
}

iframe{
  width:100%;
  height:220px;
  border:none;
}

/* BUTTONS */
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px;
}

.btn{
  background:#22c55e;
  padding:10px 20px;
  border-radius:12px;
  cursor:pointer;
}

/* CARD */
.card{
  width:90%;
  max-width:700px;
  margin:15px auto;
  background:linear-gradient(135deg,#1e293b,#334155);
  border-radius:20px;
  padding:15px;
}

/* WORD ROW */
.word{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 5px;
  border-bottom:1px solid #334155;
}

.en{
  color:#38bdf8;
  font-weight:bold;
}

.ar{
  color:#facc15;
}

.actions{
  display:flex;
  gap:10px;
}

.icon{
  background:#0f172a;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}

/* MOBILE */
@media(min-width:768px){
  iframe{height:350px;}
}

</style>
</head>

<body>

<div class="header">🎥 تعلم من الفيديو</div>

<div class="video-box">
  <iframe id="player"></iframe>
</div>

<div class="controls">
  <div class="btn" onclick="reloadVideo()">🔄 إعادة</div>
</div>

<div id="result"></div>

<script>

/* 🔥 بياناتك */
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 🎯 playlist */
const params = new URLSearchParams(location.search);
const listId = params.get("list");

/* تشغيل الفيديو */
function loadVideo(){

  document.getElementById("player").src =
  `https://www.youtube.com/embed/videoseries?list=${listId}`;

}

/* إعادة */
function reloadVideo(){
  loadVideo();
}

/* 🔊 صوت */
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* ⭐ حفظ */
async function saveWord(word,ar){

  try{
    await supa.from("user_star_words").insert({
      user_id:"user_test",
      word:word,
      translation:ar
    });

    alert("✅ تم الحفظ");

  }catch(e){
    alert("❌ فشل الحفظ");
  }

}

/* 🤖 AI */
async function analyze(){

  let url = "https://www.youtube.com/watch?v=Ls47b0lFP7o";

  let res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  let data = await res.json();

  let html="";

  for(let cat in data){

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      html+=`
      <div class="word">

        <div>
          <div class="en">${w.en}</div>
          <div class="ar">${w.ar}</div>
        </div>

        <div class="actions">
          <div class="icon" onclick="speak('${w.en}')">🔊</div>
          <div class="icon" onclick="saveWord('${w.en}','${w.ar}')">⭐</div>
        </div>

      </div>
      `;
    });

    html+="</div>";
  }

  result.innerHTML=html;
}

/* تشغيل */
loadVideo();
analyze();

</script>

</body>
</html>
