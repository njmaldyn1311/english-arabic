<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live AI Classroom</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

#player{
  width:100%;
  height:230px;
  border-radius:15px;
}

.card{
  background:#1e293b;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
}

.sub-en{color:#38bdf8;font-weight:bold;}
.sub-ar{color:#facc15;font-size:20px;font-weight:bold;}

.highlight{color:#22c55e;font-weight:bold;}
.word-box{padding:10px;border-bottom:1px solid #334155;text-align:left;}
</style>
</head>

<body>

<div class="container">

<h2>🎥 فصل مباشر</h2>

<select id="role">
  <option value="teacher">👨‍🏫 معلم</option>
  <option value="student">🎓 طالب</option>
</select>

<div id="videoBox" class="card">
  <div id="player"></div>
  <div id="subEn" class="sub-en"></div>
  <div id="subAr" class="sub-ar"></div>
</div>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let player;
let subtitles=[];
let room="room_main";
let isTeacher=false;
let channel;

/* USER */
let user_id = localStorage.getItem("user_id") || ("user_"+Math.random());

/* 🔥 قراءة الرابط */
const params = new URLSearchParams(location.search);
const listId = params.get("list");

/* 🎥 تشغيل Playlist */
function createPlayer(){

  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:listId
    },
    events:{
      onReady:()=>{
        if(isTeacher){
          setInterval(sendSync,2000);
        }
        syncSubs();
      }
    }
  });

}

/* 🔄 مزامنة */
function sendSync(){

  if(!player) return;

  channel.send({
    type:'broadcast',
    event:'sync',
    payload:{
      time:player.getCurrentTime(),
      state:player.getPlayerState(),
      video:player.getVideoData().video_id
    }
  });

}

/* استقبال */
function listen(){

  channel = supa.channel(room);

  channel.on('broadcast',{event:'sync'},(msg)=>{

    if(isTeacher) return;

    let {time,state,video}=msg.payload;

    if(player.getVideoData().video_id !== video){
      player.loadVideoById(video);
    }

    if(Math.abs(player.getCurrentTime()-time)>1){
      player.seekTo(time,true);
    }

    if(state===1) player.playVideo();
    else player.pauseVideo();

  }).subscribe();

}

/* 🎯 AI */
async function analyze(videoId){

  let url="https://www.youtube.com/watch?v="+videoId;

  let res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  let data = await res.json();
  show(data);
}

/* عرض AI */
function show(data){

  subtitles=[];
  let html="";

  for(let cat in data){

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      subtitles.push({
        time:w.time||0,
        en:w.example||"",
        ar:w.example_ar||""
      });

      html+=`
      <div class="word-box">
        <b>${w.en}</b> - ${w.ar}
      </div>`;
    });

    html+="</div>";
  }

  result.innerHTML=html;
}

/* 🔤 ترجمة مباشرة */
function syncSubs(){

  setInterval(()=>{

    if(!player) return;

    let t = player.getCurrentTime();

    let current = subtitles.find(s=>t>=s.time && t<s.time+4);

    if(current){
      subEn.innerHTML=current.en;
      subAr.innerText=current.ar;
    }

  },500);
}

/* 🚀 تشغيل */
function init(){

  isTeacher = document.getElementById("role").value==="teacher";

  createPlayer();
  listen();

  // أول فيديو تحليل
  setTimeout(()=>{
    let vid = player.getVideoData().video_id;
    if(vid) analyze(vid);
  },3000);

}

init();

</script>

</body>
</html>
