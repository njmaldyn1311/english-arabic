<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  text-align:center;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:10px 15px;
}

.home-btn{
  background:#38bdf8;
  padding:8px 15px;
  border-radius:10px;
  border:none;
  color:white;
}

.username{ font-size:14px; }

.card{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:20px;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

.bottom-buttons{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.bottom-buttons button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:13px;
  background:#22c55e;
}

textarea{
  width:100%;
  height:60px;
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<div class="header">
  <div class="username" id="userName">👤 ...</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <button id="openBtn" class="btn download" disabled onclick="openBook()">
    ⏳ جاري التحقق...
  </button>

  <canvas id="pdf"></canvas>

  <button class="btn orange" onclick="analyzePage()">🧠 تحليل الصفحة</button>

  <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>

  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
    <button onclick="savePage()">⭐ حفظ</button>
    <button onclick="readPage()">🔊 قراءة</button>
  </div>

</div>

<script>

// ✅ Supabase (مرة واحدة فقط)
const supabase = window.supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let isSubscribed = false;
let pdfDoc = null;
let currentPage = 1;

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

// 🔍 تحقق المستخدم
async function checkUser(){

  const { data: { user } } = await supabase.auth.getUser();

  if(!user){
    alert("⚠️ لازم تسجل دخول");
    location.href="login.html";
    return;
  }

  document.getElementById("userName").innerText =
    "👤 " + (user.email || "طالب");

  const { data } = await supabase
    .from("students")
    .select("is_subscribed")
    .eq("id", user.id)
    .single();

  isSubscribed = data?.is_subscribed ?? false;

  const btn = document.getElementById("openBtn");
  btn.disabled = false;

  if(isSubscribed){
    btn.innerText = "📥 تحميل وفتح";
  }else{
    btn.innerText = "🔒 يتطلب اشتراك";
    btn.classList.add("orange");
  }
}

checkUser();

// 📥 فتح الكتاب
async function openBook(){

  if(!isSubscribed){
    alert("🚫 هذا الكتاب للمشتركين فقط");
    return;
  }

  const btn = document.getElementById("openBtn");
  btn.innerText = "⏳ جاري التحميل...";

  try{
    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    await renderPage(currentPage);

    btn.innerText = "📖 تم فتح الكتاب";
    document.getElementById("priceBox").style.display = "none";

  }catch(e){
    btn.innerText="❌ فشل التحميل";
  }
}

// عرض
async function renderPage(num){
  const page = await pdfDoc.getPage(num);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");

  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({canvasContext:ctx,viewport}).promise;
}

// تنقل
function nextPage(){ if(pdfDoc && currentPage < pdfDoc.numPages){ currentPage++; renderPage(currentPage);} }
function prevPage(){ if(pdfDoc && currentPage > 1){ currentPage--; renderPage(currentPage);} }

// حفظ
function savePage(){ localStorage.setItem("savedPage", currentPage); alert("تم الحفظ ⭐"); }

// قراءة
async function readPage(){
  if(!pdfDoc) return;
  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();
  let text = content.items.map(i=>i.str).join(" ");
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speechSynthesis.speak(speech);
}

// تحليل (تم الإصلاح)
function analyzePage(){
  alert("🧠 تحليل الصفحة قريباً");
}

// ملاحظات
function saveNote(){
  let note = document.getElementById("noteInput").value;
  if(!note) return;
  localStorage.setItem("note_"+currentPage, note);
  alert("تم حفظ الملاحظة ✅");
}

// الرئيسية
function goHome(){ location.href="index.html"; }

</script>

</body>
</html>
