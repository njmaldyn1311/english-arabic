<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الرئيسية</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
}

/* 👤 زر صغير */
#miniAccount{
  position:fixed;
  bottom:15px;
  right:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  border-radius:50px;
  padding:8px 12px;
  font-size:12px;
  color:white;
  display:flex;
  align-items:center;
  gap:6px;
  z-index:9999;
  cursor:pointer;
}

/* ⚙️ قائمة */
#miniMenu{
  position:fixed;
  bottom:55px;
  right:15px;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);
  border-radius:12px;
  padding:10px;
  display:none;
  z-index:9999;
  min-width:120px;
  text-align:center;
}

/* 🔥 Toast */
#miniToast{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:white;
  padding:8px 14px;
  border-radius:20px;
  font-size:13px;
  display:none;
  z-index:9999;
}
</style>
</head>

<body>

<!-- 👤 -->
<div id="miniAccount">
  👤 <span id="miniName">...</span>
</div>

<!-- ⚙️ -->
<div id="miniMenu">
  <button onclick="logout()" style="
    width:100%;
    background:#ef4444;
    border:none;
    padding:6px;
    border-radius:8px;
    color:white;
    font-size:12px;
    cursor:pointer;
  ">
    تسجيل خروج
  </button>
</div>

<!-- 🔥 Toast -->
<div id="miniToast"></div>

<!-- ⏳ الاشتراك -->
<div id="planBox" style="
  position:fixed;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  border-radius:12px;
  padding:8px 12px;
  font-size:12px;
  color:white;
  z-index:9999;
">
  ⏳ جاري الحساب...
</div>

<!-- 📈 التقدم -->
<div id="progressBox" style="
  position:fixed;
  bottom:15px;
  left:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  border-radius:12px;
  padding:8px 12px;
  font-size:12px;
  color:white;
  z-index:9999;
">
  📈 0%
</div>

<script>

// 🔥 user_id موحد
let user_id = localStorage.getItem("user_id");
if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

// 🔐 session_id
if(!localStorage.getItem("session_id")){
  localStorage.setItem("session_id", Date.now());
}

// 🔥 Supabase
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔥 تحقق
async function checkAccess(){

  const localSession = localStorage.getItem("session_id");

  const { data } = await client
    .from("users")
    .select("*")
    .eq("id", user_id)
    .single();

  if(!data){
    showMiniToast("👋 حساب جديد");
    location.href="signup.html";
    return;
  }

  updatePlan(data);

  if(data.status === "banned"){
    logout("🚫 تم حظرك");
    return;
  }

  if(data.session_id !== localSession){
    logout("🚫 تم تسجيل الدخول من جهاز آخر");
    return;
  }

  if(data.plan === "free"){
    let created = new Date(data.created_at);
    let now = new Date();
    let days = Math.floor((now - created)/(1000*60*60*24));

    if(days >= 3){
      logout("⏳ انتهت الفترة التجريبية");
    }
  }
}

// 🔁
setInterval(checkAccess, 5000);

// 🔥 تشغيل
window.onload = ()=>{
  checkAccess();

  let name=localStorage.getItem("user")||"طالب";
  document.getElementById("miniName").innerText=name;

  startProgress();
}

// 🔥 Toast
function showMiniToast(msg){
  let t = document.getElementById("miniToast");
  t.innerText = msg;
  t.style.display = "block";

  setTimeout(()=>{ t.style.display = "none"; },1500);
}

// 🔥 الاشتراك
function updatePlan(data){

  if(data.plan === "free"){
    let created = new Date(data.created_at);
    let now = new Date();
    let days = Math.floor((now - created)/(1000*60*60*24));
    let left = 3 - days;
    if(left < 0) left = 0;

    document.getElementById("planBox").innerText =
      "⏳ باقي " + left + " يوم 🔥";
  }else{
    document.getElementById("planBox").innerText =
      "✅ اشتراك مفعل";
  }
}

// 🔥 تقدم
function startProgress(){

  let progress = localStorage.getItem("progress");

  if(!progress){
    progress = 1;
  }else{
    progress = parseFloat(progress);
  }

  setInterval(()=>{

    progress += 0.02;

    if(progress > 100) progress = 100;

    localStorage.setItem("progress", progress);

    document.getElementById("progressBox").innerText =
      "📈 " + progress.toFixed(1) + "%";

  }, 5000);
}

// 🔥 تتبع
async function track(action){
  fetch(SUPABASE_URL+"/rest/v1/user_activity",{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id:user_id,
      page:"home",
      action:action
    })
  });
}

track("دخول الرئيسية");

// خروج
function logout(msg){

  if(typeof track === "function"){
    track("خروج");
  }

  localStorage.setItem("force_logout", Date.now());

  localStorage.clear();

  if(msg){
    alert(msg);
  }

  setTimeout(()=>{
    location="login.html";
  },800);
}

/* 👇 القائمة */
document.getElementById("miniAccount").onclick = ()=>{
  let menu = document.getElementById("miniMenu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
};

document.addEventListener("click",(e)=>{
  let box = document.getElementById("miniAccount");
  let menu = document.getElementById("miniMenu");

  if(!box.contains(e.target) && !menu.contains(e.target)){
    menu.style.display="none";
  }
});

</script>

</body>
</html>
