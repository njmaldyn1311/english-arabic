<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.home{
  background:#38bdf8;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

.card{
  background:#e5e7eb;
  color:black;
  border-radius:20px;
  padding:20px;
}

button{
  border:none;
  padding:14px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  width:100%;
  margin-top:10px;
  font-size:16px;
}

.download{background:#3b82f6;}

.viewer{
  width:100%;
  height:75vh;
  border:none;
  border-radius:15px;
  margin-top:15px;
  display:none;
}

/* alert */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.alert{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  width:85%;
  max-width:260px;
}

.buy{background:#f59e0b;}
.close{background:#64748b;}
</style>

</head>

<body>

<div class="container">

<div class="topbar">
  <div id="username">...</div>
  <div class="home" onclick="location.href='/'">🏠 الرئيسية</div>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <h2>💰 سعر الكتاب: 250 ريال</h2>

  <!-- زر واحد فقط -->
  <button class="download" onclick="openInside()">📥 تحميل وفتح</button>

  <!-- PDF -->
  <iframe id="pdf" class="viewer"></iframe>

</div>

</div>

<!-- alert -->
<div class="overlay" id="alertBox">
  <div class="alert">
    <h4>🔒 الكتاب للمشتركين فقط</h4>

    <button class="buy" onclick="buy()">📲 شراء</button>
    <button class="close" onclick="closeAlert()">إغلاق</button>
  </div>
</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let userId = localStorage.getItem("user_id");
let isPaid = false;

// تحميل اسم المستخدم
async function loadUser(){
  if(!userId) return;

  const { data } = await client
    .from("users")
    .select("name")
    .eq("id",userId)
    .single();

  if(data?.name){
    document.getElementById("username").innerText = data.name;
  }
}

// تحقق الاشتراك
async function checkUser(){

  if(!userId) return;

  const { data } = await client
    .from("users")
    .select("plan")
    .eq("id",userId)
    .single();

  isPaid = data?.plan === "paid";
}

// 🔥 فتح داخل الصفحة فقط (بدون أي تحميل خارجي)
async function openInside(){

  await checkUser();

  if(!isPaid){
    showAlert();
    return;
  }

  let viewer = document.getElementById("pdf");

  // أهم سطر يمنع أي فتح خارجي
  viewer.src = PDF_URL + "#toolbar=0&navpanes=0&scrollbar=0";

  viewer.style.display = "block";

}

// شراء
function buy(){
  let phone = "966509079576";
  let msg = "أبغى شراء الكتاب";

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
}

// alert
function showAlert(){
  document.getElementById("alertBox").style.display="flex";
}

function closeAlert(){
  document.getElementById("alertBox").style.display="none";
}

// تشغيل
loadUser();

</script>

</body>
</html>
