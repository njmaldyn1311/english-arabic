<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

/* 🔥 العنوان */
h2{
  margin-top:20px;
}

/* 📦 الكرت */
.card{
  background:#1e293b;
  margin:20px auto;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* 🧠 السؤال */
.word{
  font-size:24px;
  margin:20px 0;
}

/* 🔘 الخيارات */
.option{
  background:#334155;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin:8px 0;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#475569;
}

/* 🟢 صح */
.correct{
  background:#22c55e !important;
}

/* 🔴 خطأ */
.wrong{
  background:#ef4444 !important;
}

/* 📝 إدخال */
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  font-size:16px;
}

/* 🔘 زر */
button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}

/* 🔊 زر الصوت */
.speaker{
  font-size:24px;
  cursor:pointer;
  margin-top:10px;
}

</style>
</head>

<body>

<h2>🧠 اختبار ذكي</h2>

<div class="card">

  <div id="question" class="word">⏳ جاري التحميل...</div>

  <div id="speaker" class="speaker" onclick="playSound()">🔊</div>

  <div id="answers"></div>

  <input id="inputAnswer" placeholder="اكتب الإجابة">

  <button onclick="checkInput()">تحقق</button>

</div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let words = [];
let current = 0;
let currentWord = null;
let currentType = "";

// تحميل
async function load(){

  let { data } = await client.from("words").select("*");

  words = data;
  next();
}

// عرض سؤال
function next(){

  if(current >= words.length){
    document.getElementById("question").innerText = "🎉 انتهى الاختبار";
    return;
  }

  currentWord = words[current];

  let en = currentWord.en || currentWord.word;
  let ar = currentWord.ar || currentWord.arabic;

  let types = ["mcq","write","listen"];
  currentType = types[Math.floor(Math.random()*types.length)];

  document.getElementById("answers").innerHTML = "";
  document.getElementById("inputAnswer").value = "";

  // 🎯 اختيار
  if(currentType === "mcq"){

    document.getElementById("speaker").style.display="none";
    document.getElementById("question").innerText = "ما معنى: " + en;

    let options = shuffle([...words]).slice(0,3);
    options.push(currentWord);
    options = shuffle(options);

    options.forEach(opt=>{
      let btn = document.createElement("button");
      btn.className = "option";
      btn.innerText = opt.ar || opt.arabic;

      btn.onclick = ()=>{
        if(btn.innerText === ar){
          btn.classList.add("correct");
        }else{
          btn.classList.add("wrong");
        }
        setTimeout(()=>{ current++; next(); },1000);
      };

      document.getElementById("answers").appendChild(btn);
    });

    hideInput();
  }

  // ✍️ كتابة
  if(currentType === "write"){

    document.getElementById("speaker").style.display="none";
    document.getElementById("question").innerText = "اكتب بالإنجليزي: " + ar;
    showInput();
  }

  // 🔊 استماع
  if(currentType === "listen"){

    document.getElementById("speaker").style.display="block";
    document.getElementById("question").innerText = "🎧 اضغط الصوت واكتب الكلمة";
    speak(en);
    showInput();
  }
}

// تحقق كتابة
function checkInput(){

  let en = currentWord.en || currentWord.word;
  let val = document.getElementById("inputAnswer").value.trim().toLowerCase();

  if(val === en.toLowerCase()){
    alert("✅ صح");
  }else{
    alert("❌ خطأ\n" + en);
  }

  current++;
  next();
}

// 🔊 تشغيل الصوت
function speak(text){
  window.currentAudio = new SpeechSynthesisUtterance(text);
  currentAudio.lang = "en-US";
  speechSynthesis.speak(currentAudio);
}

function playSound(){
  let en = currentWord.en || currentWord.word;
  speak(en);
}

// أدوات
function showInput(){
  document.getElementById("inputAnswer").style.display="block";
}

function hideInput(){
  document.getElementById("inputAnswer").style.display="none";
}

// منع تكرار
function shuffle(arr){
  return arr.sort(()=>0.5 - Math.random());
}

load();

</script>

</body>
</html>
