<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قوائم الدروس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#020617;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.video{
  display:flex;
  gap:10px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
}

.video:hover{
  background:#1e293b;
}

.thumb{
  width:140px;
  height:80px;
  border-radius:10px;
}

.progress{
  height:4px;
  background:#334155;
  margin-top:5px;
}

.progress span{
  display:block;
  height:100%;
  background:#22c55e;
}

.lock{
  color:#f87171;
  font-size:12px;
}

</style>
</head>

<body>

<div class="header">
  <div>📚 القوائم</div>

  <select id="role">
    <option value="teacher">👨‍🏫 معلم</option>
    <option value="student">🎓 طالب</option>
  </select>
</div>

<div class="container" id="list"></div>

<script>

const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let lessons=[];
let user;
let role;

/* 🔥 روابطك هنا */
const DATA = [
  {id:"abc123",title:"https://www.youtube.com/watch?v=Ls47b0lFP7o&list=PLTDDyGdXPtkI9OdEki1HpORrQOClWQnpC"},
  {id:"def456",title:"https://www.youtube.com/watch?v=O9ARUuYqUkI&list=PLlcQE71Tw-F3bKWJtsNGhHKXfjIFvo4g1"},
  {id:"ghi789",title:"https://www.youtube.com/watch?v=m85MeUJCYac&list=PLOCvbe7RB9fZtcG_9TaB6CHogFpIDYRgK"}
];

/* تحميل */
async function init(){

  role = document.getElementById("role").value;

  user = (await supa.auth.getUser()).data.user;

  render([]);

}

/* عرض */
function render(progressData){

  let html="";

  DATA.forEach((v,i)=>{

    let percent=0;

    html+=`
    <div class="video"
      onclick="openVideo('${v.id}',${i})">

      <img class="thumb"
      src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg">

      <div style="flex:1">

        <div>${i+1}. ${v.title}</div>

        <div class="progress">
          <span style="width:${percent}%"></span>
        </div>

      </div>

    </div>
    `;
  });

  list.innerHTML=html;
}

/* 🔥 فتح الفيديو (هنا السر) */
async function openVideo(videoId,index){

  let room = "room_main";

  // 👨‍🏫 المعلم يحدد الفيديو للجميع
  if(role === "teacher"){

    const channel = supa.channel(room);

    await channel.send({
      type:'broadcast',
      event:'start',
      payload:{
        video:videoId
      }
    });

    window.location.href =
      `watch.html?room=${room}&video=${videoId}&role=teacher`;

  }

  // 🎓 الطالب ينتظر الأمر
  else{

    window.location.href =
      `watch.html?room=${room}&role=student`;

  }

}

init();

</script>

</body>
</html>
