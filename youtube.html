<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<!-- 🔥 منع التكبير العشوائي -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>AI Video Learning PRO+</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>

/* 🔥 منع مشاكل التكبير في iPhone */
html {
  -webkit-text-size-adjust: 100%;
}

body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

/* 🔥 تثبيت عرض التصميم */
.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

/* 🔥 أهم تعديل هنا */
input {
  padding: 12px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;

  font-size: 16px; /* 🚀 يمنع zoom في الآيفون */
}

/* تحسين الأزرار */
button {
  background: #22c55e;
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
  font-size: 15px;
}

/* الكروت */
.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

/* الفيديو */
#player {
  width: 100%;
  height: 220px;
  border-radius: 15px;
}

/* النصوص */
.sub-en {
  color: #38bdf8;
  font-weight: bold;
  font-size: 16px;
}

.sub-ar {
  color: #facc15;
  font-size: 20px;
  font-weight: bold;
}

/* الكلمات */
.word-box{
  border-bottom:1px solid #334155;
  padding:10px;
  text-align:left;
}

.word-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.en{color:#38bdf8;font-weight:bold;}
.ar{color:#f87171;}

.icon{
  cursor:pointer;
  margin-left:5px;
  font-size:18px;
}

.example{
  margin-top:5px;
  color:#e2e8f0;
  cursor:pointer;
  font-size:14px;
}

.example-ar{
  color:#facc15;
  font-size:14px;
}

.highlight{
  color:#22c55e;
  font-weight:bold;
}

/* 🔥 تحسين الجوال */
@media (max-width: 500px){

  #player{
    height:180px;
  }

  .sub-ar{
    font-size:18px;
  }

}

</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<input id="url" placeholder="ضع رابط YouTube">
<br>
<button onclick="sendUrl()">🔗 تحليل</button>

<p id="loading" style="display:none;">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <div id="player"></div>

  <div id="subEn" class="sub-en"></div>
  <div id="subAr" class="sub-ar"></div>
</div>

<div id="result"></div>

</div>

</body>
</html>
