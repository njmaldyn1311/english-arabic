<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الفصل الذكي</title><style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* الهيدر */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user{
  display:flex;
  align-items:center;
  gap:8px;
  color:#38bdf8;
}

.points{
  color:#FFD700;
}

.review{
  background:#6366f1;
  padding:10px 15px;
  border-radius:12px;
}

/* العنوان */
.title{
  text-align:center;
  margin-top:10px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:15px;
}

/* الكرت */
.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

/* اختيار */
.select{
  background:#e5e7eb;
  color:black;
  padding:15px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

/* القائمة */
.options{
  display:none;
  margin-top:10px;
  background:white;
  border-radius:15px;
  overflow:hidden;
}

.option{
  padding:15px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
  color:black;
}

/* input */
.input{
  width:80%;
  padding:15px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  font-size:16px;
}

/* زر */
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
  font-size:18px;
  margin-top:10px;
  cursor:pointer;
}

.loading{
  text-align:center;
  margin-top:20px;
  color:#ccc;
}

</style></head>
<body><!-- الهيدر --><div class="top">
  <div class="user">👤 نجم</div>
  <div class="points">⭐ كلماتك: 0</div>
  <div class="review">📖 مراجعة</div>
</div><!-- العنوان --><h2 class="title">📚 الفصل الذكي</h2>
<p class="subtitle">📘 عنوان الدرس</p><!-- الكرت --><div class="card">  <!-- اختيار -->  <div class="select" onclick="toggleOptions()">
    <span id="typeText">📝 نص</span>
    <span>▼</span>
  </div>  <!-- الخيارات -->  <div class="options" id="options">
    <div class="option" onclick="selectType('نص')">📝 نص</div>
    <div class="option" onclick="selectType('رابط')">🔗 رابط</div>
    <div class="option" onclick="selectType('PDF')">📄 PDF</div>
  </div>  <!-- الإدخال -->  <input id="textInput" class="input" placeholder="... اكتب النص هنا">  <!-- الزر --><button class="btn" onclick="generateLesson()">🚀 إنشاء الدرس</button>

</div><!-- النتيجة --><div id="lesson"></div><script>

let selectedType = "نص";

function toggleOptions(){
  let box = document.getElementById("options");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function selectType(type){
  selectedType = type;
  document.getElementById("typeText").innerText = type;
  document.getElementById("options").style.display = "none";
}

/* إنشاء الدرس */
async function generateLesson(){

  let input = document.getElementById("textInput").value;

  if(!input){
    alert("اكتب شي");
    return;
  }

  // ✅ لودينق بدون تخريب التصميم
  document.getElementById("lesson").innerHTML = `
    <div class="loading">⏳ جاري إنشاء الدرس...</div>
  `;

  try{

    let res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/lesson",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        inputPart: input,
        type: selectedType
      })
    });

    let data = await res.json();

    document.getElementById("lesson").innerHTML = `
      <div class="card">
        <p>${data.story}</p>
        <hr>
        <p>${data.translation}</p>
      </div>
    `;

  }catch(e){
    document.getElementById("lesson").innerHTML = `
      <div class="loading" style="color:red;">❌ خطأ</div>
    `;
  }

}

</script></body>
</html>
