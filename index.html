<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 400px;
  background: #f3f3f3;
  border-radius: 30px;
  overflow: hidden;
}

.header {
  height: 150px;
  background: linear-gradient(135deg, #0072ff, #00c6ff);
}

.profile {
  text-align: center;
  margin-top: -60px;
}

.profile img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 5px solid #f3f3f3;
  object-fit: cover;
}

h1 { margin: 10px 0; }

.subtitle {
  color: #00aaff;
  font-size: 14px;
}

.students {
  margin: 10px 0;
  font-weight: bold;
  color: #00aaff;
}

.card {
  background: #eaeaea;
  margin: 15px;
  padding: 15px;
  border-radius: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: #00aaff;
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 20px;
  cursor: pointer;
}

/* تسجيل الدخول */
.login {
  text-align: center;
  margin-top: 100px;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  width: 80%;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
  <h2>👋 أهلاً بك</h2>
  <input id="name" placeholder="اكتب اسمك">
  <br>
  <button onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="app" style="display:none;" class="container">

  <div class="header"></div>

  <div class="profile">
    <img src="me.jpeg">

    <h1>إنجلش بالعربي</h1>
    <p class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</p>

    <p id="welcome"></p>
    <p class="students" id="students"></p>
  </div>

  <div class="card">
    <span>📺 تحليل فيديو يوتيوب</span>
    <button onclick="goYoutube()">ابدأ</button>
  </div>

  <div class="card">
    <span>📄 تحليل كتاب PDF</span>
    <button onclick="goPDF()">ابدأ</button>
  </div>

  <div class="card">
    <span>🔍 البحث عن كلمة</span>
    <button onclick="goSearch()">ابدأ</button>
  </div>

</div>

<script>

// ================= LOGIN =================
function login() {
  const name = document.getElementById("name").value;
  if (!name) return alert("اكتب اسمك");

  localStorage.setItem("user", name);
  showApp();
}

function showApp() {
  const name = localStorage.getItem("user");

  if (!name) return;

  document.getElementById("loginPage").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("welcome").innerText = "👋 أهلاً " + name;
}

showApp();


// ================= COUNTER =================
let count = localStorage.getItem("studentsCount");

if (!count) count = 129;
else count = parseInt(count);

function updateStudents() {
  document.getElementById("students").innerText =
    "👨‍🎓 أكثر من " + count + " طالب";
}

updateStudents();

setInterval(() => {
  const increase = Math.random() > 0.8 ? 1 : 0;
  count += increase;

  updateStudents();
  localStorage.setItem("studentsCount", count);
}, 5000);


// ================= N8N LINKS =================

function goYoutube() {
  window.location.href = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";
}

function goPDF() {
  window.location.href = "https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf";
}

function goSearch() {
  window.location.href = "https://n8n.srv1495053.hstgr.cloud/webhook/69c0fd9b-1072-4c11-93f0-aa96f41ed012";
}

</script>

</body>
</html>
