<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{margin:0;background:#0f172a;font-family:Arial;color:white;text-align:center;}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;}
.home-btn{background:#38bdf8;padding:8px 15px;border-radius:10px;border:none;color:white;}
.username{font-size:14px;}
.card{background:#e5e7eb;color:black;margin:15px;padding:15px;border-radius:20px;}
.btn{width:100%;padding:12px;border:none;border-radius:12px;margin-top:10px;color:white;font-size:16px;}
.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}
canvas{width:100%;border-radius:15px;margin-top:10px;}
.bottom-buttons{display:flex;gap:5px;margin-top:10px;}
.bottom-buttons button{flex:1;padding:10px;border:none;border-radius:10px;color:white;font-size:13px;background:#22c55e;}
.note-box{width:100%;margin-top:10px;}
textarea{width:100%;height:70px;padding:10px;border-radius:10px;border:none;box-sizing:border-box;}
.analysis-box{background:#1e293b;color:white;margin-top:15px;padding:15px;border-radius:15px;text-align:right;display:none;}
.loader{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#334155;}
.spinner{border:4px solid #ccc;border-top:4px solid #38bdf8;border-radius:50%;width:25px;height:25px;animation:spin 1s linear infinite;margin:auto;}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:white;padding:12px 20px;border-radius:12px;display:none;z-index:9999;}
</style>

</head>

<body>

<div class="header">
  <div class="username">👤</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <button id="openBtn" class="btn download" onclick="openBook()">📥 تحميل وفتح</button>

  <canvas id="pdf"></canvas>

  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
    <button onclick="savePage()">⭐ حفظ</button>
  </div>

  <div class="note-box">
    <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>
  </div>

  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

</div>

<div id="toast" class="toast">تم</div>

<script>

// 🔥 Supabase
const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 👤 user
let userId = localStorage.getItem("user_id");
if(!userId){
  userId = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", userId);
}

// ⚠️ غيرها للمعلم فقط
let role = "student"; // teacher

let pdfDoc = null;
let currentPage = 1;

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

// 🔔 Toast
function showToast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

// 📥 فتح الكتاب
async function openBook(){

  const btn = document.getElementById("openBtn");

  btn.innerText="⏳ جاري التحميل...";
  btn.disabled=true;

  try{
    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    renderPage(currentPage);

    document.getElementById("priceBox").style.display="none";

    btn.innerText="📖 تم فتح الكتاب";
    btn.disabled=false;

    showToast("تم فتح الكتاب ✅");

  }catch(e){
    btn.innerText="📥 تحميل وفتح";
    btn.disabled=false;
    showToast("❌ فشل التحميل");
  }
}

// 📄 عرض الصفحة (🔥 تم إصلاح المشكلة هنا)
async function renderPage(num){

  // 🔥 يفتح الكتاب تلقائي للطلاب
  if(!pdfDoc){
    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;
  }

  const page = await pdfDoc.getPage(num);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");
  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext:ctx, viewport }).promise;

  loadNote();
}

// ➡
async function nextPage(){
  if(pdfDoc && currentPage < pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);

    if(role==="teacher"){
      await client.from("room_state").update({ page: currentPage }).eq("id",1);
    }
  }
}

// ⬅
async function prevPage(){
  if(pdfDoc && currentPage > 1){
    currentPage--;
    renderPage(currentPage);

    if(role==="teacher"){
      await client.from("room_state").update({ page: currentPage }).eq("id",1);
    }
  }
}

// 🔄 مزامنة مباشرة
client
.channel('room')
.on('postgres_changes',{
  event:'UPDATE',
  schema:'public',
  table:'room_state'
},payload=>{

  if(role==="student"){

    if(payload.new.page !== currentPage){
      currentPage = payload.new.page;
      renderPage(currentPage);
    }

  }

})
.subscribe();

// 🔁 fallback قوي
setInterval(async ()=>{

  if(role !== "student") return;

  const { data } = await client
    .from("room_state")
    .select("page")
    .eq("id",1)
    .single();

  if(data && data.page !== currentPage){
    currentPage = data.page;
    renderPage(currentPage);
  }

},2000);

// 💾 ملاحظات
async function saveNote(){

  const note = document.getElementById("noteInput").value;

  await client.from("user_notes").upsert({
    user_id: userId,
    page: currentPage,
    note: note
  });

  showToast("تم الحفظ ✍️");
}

async function loadNote(){

  const { data } = await client
  .from("user_notes")
  .select("*")
  .eq("user_id", userId)
  .eq("page", currentPage)
  .maybeSingle();

  document.getElementById("noteInput").value = data?.note || "";
}

// إضافي
function savePage(){
  localStorage.setItem("savedPage", currentPage);
  showToast("⭐ تم حفظ الصفحة");
}

function goHome(){
  location.href="index.html";
}

</script>

</body>
</html>
