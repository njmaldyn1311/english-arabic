<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEP PRO</title>

<style>
body{
  margin:0;
  font-family:"Cairo";
  background:#020617;
  color:white;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:#0f172a;
  padding:20px;
  border-radius:20px;
}

.option{
  background:#1e293b;
  margin:10px 0;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.option:hover{background:#334155;}

.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.progress{
  height:8px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  background:#22c55e;
  width:0%;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="header">
      <div id="section">Section</div>
      <div id="timer">00:00</div>
    </div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <h3 id="question"></h3>

    <audio id="audio" controls></audio>

    <div id="answers"></div>

    <button onclick="next()">التالي</button>

  </div>
</div>

<script>

let questions = [];
let index = 0;
let score = 0;
let selected = null;
let answersLog = [];

/* 🔥 جلب أسئلة من n8n */
async function loadQuestions(){

  let res = await fetch("https://YOUR-N8N/webhook/step");
  let data = await res.json();

  questions = data.questions;

  load();
}

/* تحميل السؤال */
function load(){

  let q = questions[index];

  document.getElementById("section").innerText = q.type;
  document.getElementById("question").innerText = q.question;

  let audio = document.getElementById("audio");

  if(q.audio){
    audio.style.display="block";
    audio.src = q.audio;
  }else{
    audio.style.display="none";
  }

  let answers = document.getElementById("answers");
  answers.innerHTML="";

  q.options.forEach(opt=>{
    let div=document.createElement("div");
    div.className="option";
    div.innerText=opt;

    div.onclick=()=>{
      selected = opt;
      document.querySelectorAll(".option").forEach(o=>o.style.background="#1e293b");
      div.style.background="#22c55e";
    }

    answers.appendChild(div);
  });

  /* progress */
  document.getElementById("bar").style.width =
    ((index+1)/questions.length)*100 + "%";
}

/* التالي */
function next(){

  if(!selected){
    alert("اختر إجابة");
    return;
  }

  let correct = questions[index].answer;

  if(selected === correct) score++;

  answersLog.push({
    q:questions[index].question,
    correct,
    user:selected,
    type:questions[index].type
  });

  selected=null;
  index++;

  if(index >= questions.length){
    finish();
    return;
  }

  load();
}

/* النهاية */
function finish(){

  let percent = Math.round((score / questions.length)*100);

  let weak = {
    Vocabulary:0,
    Grammar:0,
    Reading:0,
    Listening:0
  };

  answersLog.forEach(a=>{
    if(a.user !== a.correct){
      weak[a.type]++;
    }
  });

  document.body.innerHTML = `
  <h2>🎉 النتيجة: ${percent}%</h2>

  <h3>📊 نقاط ضعفك:</h3>
  <div>Vocabulary: ${weak.Vocabulary}</div>
  <div>Grammar: ${weak.Grammar}</div>
  <div>Reading: ${weak.Reading}</div>
  <div>Listening: ${weak.Listening}</div>

  <button onclick="location.reload()">إعادة</button>
  `;
}

/* ⏱️ TIMER */
let time = 3600;

setInterval(()=>{
  time--;
  let m = Math.floor(time/60);
  let s = time % 60;

  document.getElementById("timer").innerText =
    `${m}:${s<10?"0"+s:s}`;

  if(time<=0) finish();
},1000);

loadQuestions();

</script>

</body>
</html>
