<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning PRO+</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

input {
  padding: 8px;
  width: 95%;
  max-width: 350px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;
  text-align: right;
}

button {
  background: #22c55e;
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

#player {
  width: 100%;
  height: 260px;
  border-radius: 15px;
}

.sub-en {
  color: #38bdf8;
  font-weight: bold;
}

.sub-ar {
  color: #facc15;
  font-size: 24px;
  font-weight: bold;
}

.word-box{
  border-bottom:1px solid #334155;
  padding:10px;
  text-align:left;
}

.word-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.en{color:#38bdf8;font-weight:bold;}
.ar{color:#f87171;}

.icon{
  cursor:pointer;
  margin-left:5px;
}

.example{
  margin-top:5px;
  color:#e2e8f0;
  cursor:pointer;
}

.example-ar{
  color:#facc15;
  font-size:15px;
}

.highlight{
  color:#22c55e;
  font-weight:bold;
}

/* 📱 موبايل */
@media (max-width:600px){
  h2{font-size:18px;}
  input{width:95%;font-size:14px;}
  button{width:95%;font-size:14px;}
  #player{height:200px;}
  .sub-ar{font-size:18px;}
}

/* 🔥 Alert */
.alert{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#ef4444;
  color:white;
  padding:12px 20px;
  border-radius:12px;
  font-size:14px;
  z-index:9999;
  animation:fadeInOut 4s ease forwards;
}

@keyframes fadeInOut{
  0%{opacity:0; bottom:0;}
  10%{opacity:1; bottom:20px;}
  90%{opacity:1;}
  100%{opacity:0;}
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<input id="url" placeholder="🔗 ضع رابط الفيديو هنا" dir="rtl">
<br>
<button onclick="sendUrl()">🔗 تحليل</button>

<p id="loading" style="display:none;">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <div id="player"></div>

  <div id="subEn" class="sub-en"></div>
  <div id="subAr" class="sub-ar"></div>
</div>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let player;
let subtitles=[];

/* 🔥 Alert */
function showAlert(msg){
  let div=document.createElement("div");
  div.className="alert";
  div.innerText=msg;
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),4000);
}

/* ID */
function getVideoId(url){
  try{
    if(url.includes("youtu.be")){
      return url.split("/").pop().split("?")[0];
    }
    if(url.includes("youtube.com")){
      const u = new URL(url);
      return u.searchParams.get("v");
    }
    if(url.length === 11){
      return url;
    }
    return null;
  }catch{
    return null;
  }
}

/* فيديو */
function createPlayer(id){
  if(player) player.destroy();
  player = new YT.Player('player',{
    videoId:id,
    events:{ onReady:syncLoop }
  });
}

/* 🔥 مزامنة ذكية */
function syncLoop(){

  setInterval(()=>{

    if(!player) return;

    let t = player.getCurrentTime();

    let index = subtitles.findIndex(s => t >= s.time);

    if(index === -1) return;

    let current = subtitles[index];
    let next = subtitles[index + 1];

    let end = next ? next.time : current.time + 3;

    if(t >= current.time && t <= end){
      document.getElementById("subEn").innerHTML=current.en;
      document.getElementById("subAr").innerText=current.ar;
    }

  },300);

}

/* صوت */
function speak(t){
  let u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* حفظ */
async function saveWord(el,en,ar){
  await client.from("user_words").insert({
    user_id:"user_1",
    word:en,
    translation:ar
  });
  el.innerText="✅";
}

/* قفز */
function goTo(sec){
  if(player) player.seekTo(sec,true);
}

/* عرض */
function show(data){

  subtitles=[];
  let html="";

  for(let cat in data){

    if(!Array.isArray(data[cat])) continue;

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      subtitles.push({
        time:w.time||0,
        en:w.example||"",
        ar:w.example_ar||""
      });

      html+=`
        <div class="word-box">
          <div class="word-top">
            <div>
              <span class="en">${w.en}</span>
              <span class="ar">${w.ar}</span>
            </div>
            <div>
              <span class="icon" onclick="speak('${w.en}')">🔊</span>
              <span class="icon" onclick="saveWord(this,'${w.en}','${w.ar}')">⭐</span>
            </div>
          </div>
          <div class="example" onclick="goTo(${w.time||0})">${w.example||""}</div>
          <div class="example-ar">${w.example_ar||""}</div>
        </div>
      `;
    });

    html+="</div>";
  }

  document.getElementById("result").innerHTML=html;
}

/* إرسال */
async function sendUrl(){

  let url=document.getElementById("url").value;
  if(!url) return showAlert("⚠️ اكتب رابط");

  let id = getVideoId(url);
  if(!id) return showAlert("❌ رابط غير صحيح");

  document.getElementById("loading").style.display="block";
  document.getElementById("videoBox").style.display="block";

  createPlayer(id);

  let timeout=setTimeout(()=>{
    showAlert("⏳ الفيديو طويل...");
  },7000);

  try{

    let res=await fetch(WEBHOOK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url})
    });

    let data=await res.json();

    clearTimeout(timeout);
    document.getElementById("loading").style.display="none";

    if(!data || Object.keys(data).length===0){
      return showAlert("❌ لا توجد ترجمة");
    }

    show(data);

  }catch(e){
    showAlert("❌ خطأ، أعد المحاولة");
  }

}

</script>

</body>
</html>
