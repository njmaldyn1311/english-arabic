<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.home{
  background:#38bdf8;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

.card{
  background:#e5e7eb;
  color:black;
  border-radius:20px;
  padding:20px;
}

button{
  border:none;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  color:white;
  flex:1;
}

.mainBtn{
  background:#3b82f6;
  width:100%;
  margin-top:10px;
}

.controls{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

#pdfContainer canvas{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

.alert{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.6);
}

.alertBox{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  width:80%;
  max-width:250px;
}

.buy{background:#f59e0b;width:100%;}
.close{background:#64748b;width:100%;margin-top:8px;}
</style>

</head>

<body oncontextmenu="return false" oncopy="return false">

<div class="container">

<div class="topbar">
  <div id="username">...</div>
  <div class="home" onclick="location.href='index.html'">🏠 الرئيسية</div>
</div>

<h2>📘 كتابي</h2>

<div class="card">

<h2>💰 سعر الكتاب: 250 ريال</h2>

<button class="mainBtn" onclick="openBook()">📥 تحميل وفتح</button>

<div id="pdfContainer"></div>

<div class="controls">
  <button onclick="prev()">⬅️</button>
  <button onclick="next()">➡️</button>
  <button onclick="savePage()">⭐</button>
  <button onclick="speakPage()">🔊</button>
</div>

<div id="pageNum"></div>

</div>
</div>

<!-- alert -->
<div class="alert" id="alert">
  <div class="alertBox">
    <h4>🔒 للمشتركين فقط</h4>
    <button class="buy" onclick="buy()">📲 شراء</button>
    <button class="close" onclick="closeAlert()">إغلاق</button>
  </div>
</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userId = localStorage.getItem("user_id");
let isPaid=false;

let pdfDoc=null;
let currentPage=1;
let totalPages=0;

/* 👤 الاسم */
async function loadUser(){
  const { data } = await client
    .from("users")
    .select("name")
    .eq("id",userId)
    .single();

  if(data?.name){
    let parts=data.name.split(" ");
    document.getElementById("username").innerText=parts.slice(0,2).join(" ");
  }
}

/* 🔐 تحقق */
async function checkUser(){
  const { data } = await client
    .from("users")
    .select("plan")
    .eq("id",userId)
    .single();

  isPaid = data?.plan==="paid";
}

/* 📥 فتح */
async function openBook(){

  await checkUser();

  if(!isPaid){
    document.getElementById("alert").style.display="flex";
    return;
  }

  const { data } = await client.storage
    .from("books")
    .createSignedUrl("newHEADWAYbeginnerstudentbook.pdf",60);

  const url = data.signedUrl;

  const loadingTask = pdfjsLib.getDocument(url);
  pdfDoc = await loadingTask.promise;

  totalPages = pdfDoc.numPages;
  currentPage = 1;

  renderPage();
}

/* 📖 عرض */
async function renderPage(){

  const container=document.getElementById("pdfContainer");
  container.innerHTML="";

  const page = await pdfDoc.getPage(currentPage);

  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d");

  const viewport=page.getViewport({scale:1.3});

  canvas.height=viewport.height;
  canvas.width=viewport.width;

  await page.render({
    canvasContext:ctx,
    viewport:viewport
  }).promise;

  container.appendChild(canvas);

  document.getElementById("pageNum").innerText=
    currentPage+" / "+totalPages;

  track();
}

/* أزرار */
function next(){
  if(currentPage<totalPages){
    currentPage++;
    renderPage();
  }
}

function prev(){
  if(currentPage>1){
    currentPage--;
    renderPage();
  }
}

/* حفظ */
async function savePage(){
  await client.from("book_progress").upsert({
    user_id:userId,
    page:currentPage
  });
  alert("تم الحفظ ⭐");
}

/* صوت */
function speakPage(){
  let u=new SpeechSynthesisUtterance("Page "+currentPage);
  speechSynthesis.speak(u);
}

/* تتبع */
async function track(){
  await client.from("book_tracking").insert({
    user_id:userId,
    page:currentPage
  });
}

/* alert */
function closeAlert(){
  document.getElementById("alert").style.display="none";
}

function buy(){
  let phone="966509079576";
  window.open(`https://wa.me/${phone}`);
}

loadUser();

</script>

</body>
</html>
