<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  text-align:center;
}

/* الكارد */
.card{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:20px;
}

/* زر */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}
.gray{background:#64748b;}

/* PDF */
canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

/* أزرار تحت */
.bottom-buttons{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  gap:5px;
}

.bottom-buttons button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:13px;
}

/* ملاحظات */
textarea{
  width:100%;
  height:60px; /* 🔥 صغرناه */
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>

</head>
<body>

<h2>📘 كتابي</h2>

<div class="card">

  <h2>💰 سعر الكتاب: 250 ريال</h2>

  <!-- زر التحميل -->
  <button id="openBtn" class="btn download" onclick="openBook()">
    📥 تحميل وفتح
  </button>

  <canvas id="pdf"></canvas>

  <!-- تحليل -->
  <button class="btn orange" onclick="analyzePage()">
    🧠 تحليل الصفحة
  </button>

  <!-- ملاحظات -->
  <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>

  <button class="btn green" onclick="saveNote()">
    💾 حفظ
  </button>

  <!-- 🔥 أزرار التنقل -->
  <div class="bottom-buttons">
    <button class="green" onclick="prevPage()">⬅ السابق</button>
    <button class="green" onclick="nextPage()">التالي ➡</button>
    <button class="green" onclick="savePage()">⭐ حفظ</button>
    <button class="green" onclick="readPage()">🔊 قراءة</button>
  </div>

</div>

<script>

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc = null;
let currentPage = 1;


// 📥 فتح الكتاب
async function openBook(){

  const btn = document.getElementById("openBtn");
  btn.innerText = "⏳ جاري التحميل...";

  try{

    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    await renderPage(currentPage);

    // 🔥 هنا التعديل المهم
    btn.innerText = "📖 تم فتح الكتاب";

  }catch(e){
    btn.innerText="❌ فشل التحميل";
  }
}


// 📖 عرض الصفحة
async function renderPage(num){

  const page = await pdfDoc.getPage(num);

  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");

  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({
    canvasContext:ctx,
    viewport
  }).promise;
}


// التالي
function nextPage(){
  if(currentPage < pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);
  }
}

// السابق
function prevPage(){
  if(currentPage > 1){
    currentPage--;
    renderPage(currentPage);
  }
}


// ⭐ حفظ الصفحة
function savePage(){
  localStorage.setItem("savedPage", currentPage);
  alert("تم حفظ الصفحة ⭐");
}


// 🔊 قراءة
async function readPage(){

  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();

  let text = content.items.map(i=>i.str).join(" ");

  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";

  speechSynthesis.speak(speech);
}


// 🧠 تحليل
async function analyzePage(){

  alert("تم تحليل الصفحة 🔥 (اربطها مع OpenAI لاحقًا)");
}


// ✍️ حفظ ملاحظة
function saveNote(){

  let note = document.getElementById("noteInput").value;

  if(!note) return;

  alert("تم حفظ الملاحظة ✅");
}


// 🔒 منع نسخ
document.addEventListener("contextmenu",e=>e.preventDefault());

</script>

</body>
</html>
