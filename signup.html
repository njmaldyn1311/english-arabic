<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل طالب</title>

<style>
*{ box-sizing:border-box; }

body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e3a8a);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px;
}

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.08;
  z-index:-1;
}

.box {
  width:100%;
  max-width:420px;
  padding:25px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  text-align:center;
  color:white;
}

.stats{
  background: rgba(34,197,94,0.15);
  border:1px solid rgba(34,197,94,0.3);
  padding:10px;
  border-radius:12px;
  margin-bottom:15px;
}

h2 { margin-bottom:15px; }

input {
  width:100%;
  height:50px;
  padding:0 14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  text-align:center;
  font-size:16px;
}

.custom-select {
  background:white;
  color:black;
  height:50px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin:8px 0;
  position:relative;
}

.options {
  position:absolute;
  top:55px;
  right:0;
  left:0;
  background:white;
  border-radius:12px;
  display:none;
  z-index:10;
}

.options div {
  padding:12px;
}

button {
  width:100%;
  height:50px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
}

</style>
</head>

<body>

<div class="box">

<h2>🚀 تسجيل طالب</h2>

<input id="name" placeholder="اسم الطالب">
<input id="phone" placeholder="رقم الجوال">

<!-- الجنس -->
<div class="custom-select" onclick="toggleDropdown()">
  <div id="selected">اختر الجنس ▼</div>
</div>

<div class="options" id="dropdown">
  <div onclick="selectOption(event,'ذكر')">ذكر</div>
  <div onclick="selectOption(event,'أنثى')">أنثى</div>
</div>

<!-- المستوى -->
<div class="custom-select" onclick="toggleLevelDropdown()">
  <div id="selectedLevel">المستوى ▼</div>
</div>

<div class="options" id="levelDropdown">
  <div onclick="selectLevel(event,'مبتدئ')">مبتدئ</div>
  <div onclick="selectLevel(event,'متوسط')">متوسط</div>
  <div onclick="selectLevel(event,'متقدم')">متقدم</div>
</div>

<button onclick="signup()">تسجيل</button>

</div>

<script>

let selectedGender="";
let selectedLevel="";

/* 🔽 فتح */
function toggleDropdown(){
  const drop=document.getElementById("dropdown");
  const level=document.getElementById("levelDropdown");

  level.style.display="none";
  drop.style.display = drop.style.display==="block"?"none":"block";
}

function toggleLevelDropdown(){
  const drop=document.getElementById("dropdown");
  const level=document.getElementById("levelDropdown");

  drop.style.display="none";
  level.style.display = level.style.display==="block"?"none":"block";
}

/* اختيار */
function selectOption(e,val){
  e.stopPropagation();
  selectedGender=val;
  document.getElementById("selected").innerText=val+" ▼";
  document.getElementById("dropdown").style.display="none";
}

function selectLevel(e,val){
  e.stopPropagation();
  selectedLevel=val;
  document.getElementById("selectedLevel").innerText=val+" ▼";
  document.getElementById("levelDropdown").style.display="none";
}

/* إغلاق */
document.addEventListener("click",()=>{
  document.getElementById("dropdown").style.display="none";
  document.getElementById("levelDropdown").style.display="none";
});

/* تسجيل */
function signup(){

  if(!name.value || !phone.value){
    alert("اكتب البيانات");
    return;
  }

  if(!selectedGender || !selectedLevel){
    alert("اختر الجنس والمستوى");
    return;
  }

  alert("تم التسجيل ✅");
}

</script>

</body>
</html>
