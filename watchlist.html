<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القوائم</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#020617;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  position:relative;
  margin-bottom:15px;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.02);
}

/* IMAGE */
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

/* OVERLAY */
.overlay{
  position:absolute;
  bottom:0;
  width:100%;
  padding:15px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

/* TEXT */
.title{
  font-size:20px;
  font-weight:bold;
}

.sub{
  font-size:14px;
  color:#ccc;
}
</style>
</head>

<body>

<div class="header">
  <div>📚 القوائم</div>
</div>

<div class="container" id="list"></div>

<script>

/* 🔥 روابطك */
const DATA = [
  {
    url:"https://www.youtube.com/watch?v=Ls47b0lFP7o&list=PLTDDyGdXPtkI9OdEki1HpORrQOClWQnpC",
    title:"🟢 مبتدئ"
  },
  {
    url:"https://www.youtube.com/watch?v=O9ARUuYqUkI&list=PLlcQE71Tw-F3bKWJtsNGhHKXfjIFvo4g1",
    title:"🟡 متوسط"
  },
  {
    url:"https://www.youtube.com/watch?v=m85MeUJCYac&list=PLOCvbe7RB9fZtcG_9TaB6CHogFpIDYRgK",
    title:"🔴 متقدم"
  }
];

/* استخراج playlist id */
function getListId(url){
  return new URL(url).searchParams.get("list");
}

/* استخراج أول فيديو (لصورة الغلاف) */
function getVideoId(url){
  return new URL(url).searchParams.get("v");
}

/* عرض */
function render(){

  let html="";

  DATA.forEach((item)=>{

    let listId = getListId(item.url);
    let videoId = getVideoId(item.url);

    html+=`
    <div class="card" onclick="openList('${listId}')">

      <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg">

      <div class="overlay">
        <div class="title">${item.title}</div>
        <div class="sub">اضغط لفتح القائمة</div>
      </div>

    </div>
    `;
  });

  list.innerHTML=html;
}

/* فتح القائمة */
function openList(listId){

  window.location.href =
  `watch.html?list=${listId}`;

}

render();

</script>

</body>
</html>
