<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{max-width:900px;margin:auto;padding:15px;}

#player{width:100%;height:240px;border-radius:15px;}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:12px;
  color:white;
  cursor:pointer;
}

.sub-en{color:#38bdf8;font-weight:bold;margin-top:20px;}
.sub-ar{color:#facc15;font-size:20px;font-weight:bold;margin-bottom:25px;}

</style>
</head>

<body>

<div class="container">

<h2>🎥 فصل مباشر (متزامن)</h2>

<select id="role">
  <option value="teacher">👨‍🏫 معلم</option>
  <option value="student">🎓 طالب</option>
</select>

<div id="player"></div>

<div class="controls">
  <button onclick="prev()">⏮ السابق</button>
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔄 إعادة</button>
  <button onclick="next()">⏭ التالي</button>
</div>

<div id="subEn" class="sub-en"></div>
<div id="subAr" class="sub-ar"></div>

</div>

<script>

/* 🔥 Supabase */
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let role = "student";
let room = "class_room_1";
let channel;

/* 🎬 YouTube */
let player;

function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:new URLSearchParams(location.search).get("list")
    },
    events:{
      onReady:init
    }
  });
}

/* 🎮 التحكم */
function play(){ player.playVideo(); }
function pause(){ player.pauseVideo(); }
function restart(){ player.seekTo(0,true); }
function next(){ player.nextVideo(); }
function prev(){ player.previousVideo(); }

/* 🔥 INIT */
function init(){

  role = document.getElementById("role").value;

  channel = supa.channel(room);

  /* 🎓 الطالب يستقبل */
  channel.on('broadcast',{event:'sync'},(msg)=>{

    if(role === "teacher") return;

    let {time,state,video} = msg.payload;

    if(player.getVideoData().video_id !== video){
      player.loadVideoById(video);
    }

    if(Math.abs(player.getCurrentTime() - time) > 1){
      player.seekTo(time,true);
    }

    if(state === 1){
      player.playVideo();
    }else{
      player.pauseVideo();
    }

  }).subscribe();

  /* 👨‍🏫 المعلم يرسل */
  setInterval(()=>{

    if(role !== "teacher") return;
    if(!player) return;

    channel.send({
      type:'broadcast',
      event:'sync',
      payload:{
        time: player.getCurrentTime(),
        state: player.getPlayerState(),
        video: player.getVideoData().video_id
      }
    });

  },500); // 🔥 سرعة مزامنة عالية

}

</script>

</body>
</html>
