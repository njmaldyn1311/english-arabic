<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔝 شريط علوي */
.topbar{
  position:absolute;
  top:15px;
  right:15px;
}

.home{
  background:#6366f1;
  padding:10px 15px;
  border:none;
  border-radius:12px;
  color:white;
  cursor:pointer;
}

/* 📱 */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:420px;
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  text-align:center;
}

.title{font-size:22px;margin-bottom:10px;}

.question{
  font-size:18px;
  margin:15px 0;
  line-height:1.6;
}

.speaker{
  font-size:26px;
  cursor:pointer;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  text-align:center;
  margin-top:10px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
}

.check{background:#22c55e;}

/* 🔔 toast في الوسط */
.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:15px 25px;
  border-radius:12px;
  display:none;
  font-size:18px;
  z-index:999;
}

.success{background:#22c55e;}
.error{background:#ef4444;}

</style>
</head>

<body>

<div class="topbar">
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">

  <div class="card">

    <div class="title">🧠 اختبار ذكي</div>

    <div id="question" class="question">...</div>

    <div id="speaker" class="speaker" onclick="play()">🔊</div>

    <input id="input" placeholder="اكتب الترجمة">

    <button class="check" onclick="check()">تحقق</button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

let words = [];
let current = 0;
let currentWord = null;

let correctCount = 0;
let total = 0;

// تحميل
async function load(){

  let { data } = await client
    .from("user_words")
    .select("*")
    .eq("user_id", user_id);

  words = data || [];

  if(words.length === 0){
    document.getElementById("question").innerText = "⚠️ ما عندك كلمات";
    return;
  }

  next();
}

// سؤال جديد (جملة)
function next(){

  if(current >= words.length){
    finish();
    return;
  }

  currentWord = words[current];

  let en = currentWord.word;
  let ar = currentWord.translation;

  document.getElementById("input").value = "";

  // 🔥 نحولها جملة
  document.getElementById("question").innerText =
    "ترجم الجملة:\nI can " + en;

  total++;
}

// صوت
function speak(text){
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=0.9;
  speechSynthesis.speak(u);
}

function play(){
  speak("I can " + currentWord.word);
}

// تحقق
function check(){

  let val = document.getElementById("input").value.trim();
  let correct = currentWord.translation;

  let ok = val.includes(correct);

  if(ok) correctCount++;

  toast(ok ? "✅ صح" : "❌ " + correct, ok);

  current++;
  setTimeout(next,800);
}

// نهاية
function finish(){

  let percent = Math.round((correctCount / total) * 100);

  document.getElementById("question").innerHTML =
    `🎉 انتهى الاختبار<br><br>نتيجتك: ${percent}%`;

  document.getElementById("input").style.display="none";
}

// toast
function toast(msg, ok){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast " + (ok?"success":"error");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1000);
}

// رجوع
function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
