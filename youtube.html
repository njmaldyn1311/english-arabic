<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

input {
  padding: 10px;
  width: 90%;
  border-radius: 10px;
  border: none;
  margin: 5px 0;
}

button {
  background: #22c55e;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

#videoBox {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #0f172a;
  padding-top: 10px;
}

iframe {
  width: 100%;
  height: 250px;
  border-radius: 15px;
}

.en { color:#38bdf8; font-weight:bold; cursor:pointer; }
.ar { color:#f87171; }

.star {
  cursor:pointer;
  margin-left:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<input type="text" id="url" placeholder="ضع رابط YouTube">
<br>

<button onclick="sendUrl()">🔗 تحليل</button>

<p id="loading" style="display:none;">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <iframe id="videoFrame"></iframe>
</div>

<div id="result"></div>

</div>

<script>

/* 🔥 Supabase */
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

/* 🎥 فيديو */
const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";
let videoId = "";

function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

function showVideo(url) {
  videoId = getVideoId(url);
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}`;
  document.getElementById("videoBox").style.display = "block";
}

/* 🔊 الصوت */
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
}

loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  msg.rate = 0.9;

  const voice = voices.find(v => v.lang.startsWith("en"));
  if (voice) msg.voice = voice;

  speechSynthesis.speak(msg);
}

/* ⭐ حفظ */
async function saveWord(el, word, translation) {

  const { data } = await supabase
    .from("user_words")
    .select("*")
    .eq("user_id", user_id)
    .eq("word", word);

  if (data.length > 0) {
    el.innerText = "✅";
    return;
  }

  await supabase.from("user_words").insert([{
    user_id: user_id,
    word: word,
    translation: translation
  }]);

  el.innerText = "✅";
}

/* 🚀 إرسال */
async function sendUrl() {

  const url = document.getElementById("url").value;
  if (!url) return alert("اكتب رابط");

  document.getElementById("loading").style.display = "block";

  showVideo(url);

  // 🧹 مسح الحقل
  document.getElementById("url").value = "";

  const res = await fetch(WEBHOOK, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({url})
  });

  const data = await res.json();

  document.getElementById("loading").style.display = "none";

  show(data);
}

/* عرض النتائج */
function show(data) {

  let html = "";

  for (let cat in data) {

    html += `<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w => {

      const word = w.en || w.word || "";
      const ar = w.ar || w.arabic || "";

      html += `
        <div style="margin:10px 0;">
          <span class="en" onclick="speak('${word}'); event.stopPropagation();">
            ${word}
          </span>

          <span class="ar">${ar}</span>

          <span class="star"
            onclick="saveWord(this,'${word}','${ar}')">
            ⭐
          </span>

          <div style="margin-top:5px; color:#cbd5f5;">
            ${w.example || ""}
          </div>

          <div style="color:#64748b;">
            ${w.example_ar || ""}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  document.getElementById("result").innerHTML = html;
}

</script>

</body>
</html>
