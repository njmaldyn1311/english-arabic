<!-- نفس كودك + تعديل بسيط -->

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userData = null;

// 🔐 المستخدم
async function initUser(){

  const userId = localStorage.getItem("user_id");

  if(!userId || userId === "undefined"){
    window.location.href = "login.html";
    return;
  }

  const { data } = await client
    .from("users")
    .select("role, status, name, subscription_status, subscription_end, book_purchased")
    .eq("id", userId)
    .single();

  if(!data) return;

  userData = data;

  // 🚫 حظر
  if(userData.status === "banned"){
    showNotify("🚫 تم إيقاف حسابك","تواصل معنا عبر واتساب");
  }

  // الاشتراك
  const now = new Date();
  const end = new Date(userData.subscription_end);

  userData.isSubscribed =
    userData.subscription_status === "active" && end > now;

  // الكتاب
  userData.hasBook = userData.book_purchased === true;

  // واتساب
  let msg = `السلام عليكم، أنا ${userData.name}`;
  let url = `https://wa.me/message/735SJORMFI74H1?text=${encodeURIComponent(msg)}`;
  whatsappLink.href = url;
  whatsappFloat.href = url;
  whatsappBtn.href = url;
}

initUser();


// 🔐 حماية الأدمن (🔥 الحل هنا)
function goDashboard(){

  if(!userData){
    showNotify("⏳ انتظر","جاري تحميل البيانات");
    return;
  }

  if(userData.role !== "admin"){
    showNotify("🚫 غير مصرح","هذه الصفحة للأدمن فقط");
    return;
  }

  location.href="mydashboard.html";
}


// الاشتراك
function checkSub(){

  if(!userData){
    showNotify("⏳ انتظر","جاري تحميل بياناتك");
    return false;
  }

  if(userData.isSubscribed) return true;

  showNotify("🚫 الاشتراك مطلوب","يجب الاشتراك للوصول للكلاسات");
  return false;
}

// الكتاب
function goBook(){

  if(!userData){
    showNotify("⏳ انتظر","جاري تحميل بياناتك");
    return;
  }

  if(!userData.hasBook){
    showNotify("📘 شراء الكتاب مطلوب","تواصل واتساب لشراء الكتاب");
    return;
  }

  location.href="headwaybook.html";
}

// التنقل
function goClass(){ if(!checkSub()) return; location.href="myclass.html"; }
function goYoutube(){ if(!checkSub()) return; location.href="youtube.html"; }
function goPDF(){ if(!checkSub()) return; location.href="pdf.html"; }

function goUpdate1(){ location.href="update1.html"; }
function goUpdate2(){ location.href="update2.html"; }

function goSearch(){ location.href="search.html"; }
function goProfile(){ location.href="student.html"; }
function goTest(){ location.href="test.html"; }
function goReview(){ location.href="review.html"; }

// Alert
function showNotify(title,msg){
  notifyTitle.innerText = title;
  notifyText.innerText = msg;

  if(title.includes("اشتراك") || title.includes("شراء") || title.includes("إيقاف")){
    whatsappBtn.style.display = "block";
  }else{
    whatsappBtn.style.display = "none";
  }

  notifyBox.style.display = "flex";
}

function closeNotify(){
  notifyBox.style.display = "none";
}

// خروج
function logout(){
  localStorage.clear();
  location.href="login.html";
}

// ⭐ عداد
let base = localStorage.getItem("studentsBase") || 120;
let startTime = localStorage.getItem("startTime");

if(!startTime){
  startTime = new Date().getTime();
  localStorage.setItem("startTime", startTime);
}

function updateCounter(){
  let now = new Date().getTime();
  let diff = Math.floor((now - startTime) / 30000);
  let total = parseInt(base) + diff;

  students.innerText = "👨‍🎓 أكثر من " + total + " طالب";
}

setInterval(updateCounter, 30000);
updateCounter();

</script>
