<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

#player{
  width:100%;
  height:220px;
  border-radius:15px;
  border:none;
}

.card{
  background:#1e293b;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
}

.sub-en{color:#38bdf8;font-weight:bold;}
.sub-ar{color:#facc15;font-size:20px;font-weight:bold;}

.word{padding:8px;border-bottom:1px solid #334155;}

</style>
</head>

<body>

<div class="container">

<h2>🎥 فصل مباشر</h2>

<select id="role">
  <option value="teacher">👨‍🏫 معلم</option>
  <option value="student">🎓 طالب</option>
</select>

<div class="card">
  <iframe id="player"></iframe>
  <div id="subEn" class="sub-en"></div>
  <div id="subAr" class="sub-ar"></div>
</div>

<div id="result"></div>

</div>

<script>

/* 🔥 إعداداتك */
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let room="room_main";
let channel;

/* 🎯 قراءة playlist */
const params = new URLSearchParams(location.search);
const listId = params.get("list");

/* 🎥 تشغيل playlist */
function loadVideo(){

  if(!listId){
    alert("❌ لا يوجد قائمة");
    return;
  }

  document.getElementById("player").src =
  `https://www.youtube.com/embed/videoseries?list=${listId}&autoplay=1`;

}

/* 🔄 مزامنة (فتح القائمة فقط) */
function setupSync(){

  channel = supa.channel(room);

  // الطالب يستقبل
  channel.on('broadcast',{event:'open'},(msg)=>{

    let list = msg.payload.list;

    document.getElementById("player").src =
    `https://www.youtube.com/embed/videoseries?list=${list}&autoplay=1`;

  }).subscribe();

}

/* 👨‍🏫 المعلم يرسل */
function sendOpen(){

  channel.send({
    type:'broadcast',
    event:'open',
    payload:{ list:listId }
  });

}

/* 🤖 تحليل AI */
async function analyze(){

  let firstVideo = new URLSearchParams(window.location.search).get("v");

  if(!firstVideo) return;

  let url = "https://www.youtube.com/watch?v="+firstVideo;

  let res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  let data = await res.json();

  let html="";

  for(let cat in data){

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{
      html+=`<div class="word">${w.en} - ${w.ar}</div>`;
    });

    html+="</div>";
  }

  result.innerHTML=html;
}

/* 🚀 تشغيل */
function init(){

  let role = document.getElementById("role").value;

  loadVideo();
  setupSync();

  // لو معلم → أرسل
  setTimeout(()=>{
    if(role==="teacher"){
      sendOpen();
    }
  },1000);

  analyze();
}

init();

</script>

</body>
</html>
