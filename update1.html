<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 الأفعال</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔥 الهيدر */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user-name{
  color:#38bdf8;
}

.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 14px;
  border-radius:12px;
  color:#38bdf8;
  cursor:pointer;
}

/* 📦 */
.container{
  padding:15px;
  max-width:900px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:24px;
  margin:15px 0;
}

/* 🔥 الكرت */
.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

/* الترقيم */
.index{
  color:#38bdf8;
  font-weight:bold;
}

/* الإنجليزي يسار */
.left{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* العربي يمين */
.right{
  display:flex;
  align-items:center;
  gap:10px;
}

/* عنصر */
.item{
  background:#334155;
  padding:8px 10px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:6px;
}

/* زر */
button{
  border:none;
  background:#22c55e;
  color:white;
  border-radius:6px;
  padding:4px 8px;
  cursor:pointer;
}

/* ترجمة */
.translation{
  background:#0ea5e9;
  padding:8px 12px;
  border-radius:10px;
  font-weight:bold;
}

/* ⭐ حفظ */
.save{
  background:#f59e0b;
}

.saved{
  background:#22c55e;
}

</style>

</head>
<body>

<div class="header">
  <div class="user-name" id="username">👤</div>
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">

  <div class="title">📚 الأفعال</div>

  <div id="list"></div>

</div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

/* 👤 الاسم */
let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");

document.getElementById("username").innerText =
  "👤 " + parts[0] + (parts[1] ? " " + parts[1] : "");

//////////////////////////
// 🔊 صوت
//////////////////////////

function speak(text){
  if(!text) return;
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

//////////////////////////
// ⭐ حفظ
//////////////////////////

async function saveWord(word){

  await client.from("saved_verbs").insert({
    user_id: user_id,
    word: word
  });

  alert("✅ تم الحفظ");
}

//////////////////////////
// 📥 تحميل
//////////////////////////

async function load(){

  let { data, error } = await client
    .from("headway_verbs")
    .select("*");

  const container = document.getElementById("list");

  if(error){
    container.innerHTML = "❌ " + error.message;
    return;
  }

  if(!data.length){
    container.innerHTML = "⚠️ لا توجد بيانات";
    return;
  }

  container.innerHTML = "";

  data.forEach((w, i) => {

    container.innerHTML += `
      <div class="card">

        <!-- يمين (عربي + حفظ + رقم) -->
        <div class="right">
          <div class="index">${i+1}</div>

          <div class="translation">
            ${w.translation || ''}
          </div>

          <button class="save" onclick="saveWord('${w.word}')">⭐</button>
        </div>

        <!-- يسار (إنجليزي) -->
        <div class="left">

          <div class="item">
            ${w.base || w.word}
            <button onclick="speak('${w.base || w.word}')">🔊</button>
          </div>

          <div class="item">
            ${w.past || '-'}
            <button onclick="speak('${w.past}')">🔊</button>
          </div>

          <div class="item">
            ${w.past_participle || '-'}
            <button onclick="speak('${w.past_participle}')">🔊</button>
          </div>

        </div>

      </div>
    `;
  });

}

//////////////////////////

function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
