<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل PDF</title><style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #1e88e5, #26c6da);
  margin: 0;
}

/* الحاوية */
.container {
  display: flex;
  justify-content: center;
  padding: 20px;
}

/* الكرت الأبيض */
.card {
  background: #f3f4f6;
  width: 98%;
  max-width: 420px;
  border-radius: 30px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

/* زر */
button {
  background: linear-gradient(135deg, #1e88e5, #26c6da);
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 12px;
  cursor: pointer;
}

/* عنصر كلمة */
.word {
  background: white;
  border-radius: 12px;
  padding: 10px;
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.en { text-align: left; flex: 1; }
.ar { text-align: right; flex: 1; }

h3 {
  margin-top: 20px;
}

/* تحميل */
.loading {
  margin-top: 15px;
  color: #1e88e5;
}
</style></head><body><div class="container">
  <div class="card"><h2>📄 رفع PDF</h2>

<input type="file" id="file" accept="application/pdf"><br><br>

<button onclick="upload()">🚀 تحليل</button>

<p id="status"></p>

<div id="result"></div>

  </div>
</div><script>
async function upload() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!file) {
    alert("اختر ملف");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  status.innerText = "⏳ جاري التحليل...";
  result.innerHTML = `<div class="loading">⏳ جاري استخراج الكلمات...</div>`;

  try {
    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
      method: "POST",
      body: formData
    });

    let data = await res.json();

    if (data.raw) {
      try {
        data = JSON.parse(data.raw);
      } catch {}
    }

    status.innerText = "✅ تم التحليل";

    function renderSection(title, list) {
      if (!list || list.length === 0) return "";

      return `
        <h3>${title}</h3>
        ${list.map(item => `
          <div class="word">
            <span class="en">${item.word || item.phrase || ""}</span>

            <button onclick="speak('${item.word || item.phrase}')">🔊</button>

            <span class="ar">${item.arabic || ""}</span>
          </div>
        `).join("")}
      `;
    }

    result.innerHTML = `
      ${renderSection("📌 الأفعال (Verbs)", data.verbs)}
      ${renderSection("📌 الأسماء (Nouns)", data.nouns)}
      ${renderSection("📌 الصفات (Adjectives)", data.adjectives)}
      ${renderSection("📌 العبارات (Idioms)", data.idioms)}
      ${renderSection("📌 الأفعال المركبة (Phrasal Verbs)", data.phrasal_verbs)}
    `;

  } catch (err) {
    status.innerText = "❌ خطأ في الاتصال";
  }
}

function speak(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  speechSynthesis.speak(utterance);
}
</script></body>
</html>
