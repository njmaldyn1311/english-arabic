<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
}
.header { height: 140px; position: relative; }
.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}
.content { padding: 70px 20px 20px; }
h1 { color: white; }
.subtitle { color: #cbd5e1; }

.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  color: white;
}

button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
}

.logout { background: #ef4444; }

.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
}

#notifyBox{
  display:none;
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:999;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="card"><span>📚 الفصل الذكي</span><button onclick="goClass()">ابدأ</button></div>
    <div class="card"><span>📺 تحليل فيديو</span><button onclick="goYoutube()">ابدأ</button></div>
    <div class="card"><span>📄 تحليل PDF</span><button onclick="goPDF()">ابدأ</button></div>

    <div class="card"><span>📘 كتابي</span><button onclick="goBook()">فتح</button></div>

    <a id="whatsappLink" class="whatsapp">💬 تواصل معي</a>
    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<!-- Alert -->
<div id="notifyBox">
  <div style="background:#111827;padding:20px;border-radius:20px;width:85%;max-width:300px;color:white;text-align:center;">
    <h3 id="notifyTitle"></h3>
    <p id="notifyText"></p>

    <a id="whatsappBtn" target="_blank" style="display:none;margin-top:10px;background:#25D366;padding:10px;border-radius:10px;color:white;text-decoration:none;">
      💬 تواصل
    </a>

    <button onclick="closeNotify()" style="margin-top:10px;background:#22c55e;padding:10px;border-radius:10px;width:100%">
      تمام 👍
    </button>
  </div>
</div>

<script>

// Supabase
const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userData = null;

// 🔐 تحميل المستخدم
async function initUser(){

  const userId = localStorage.getItem("user_id");

  if(!userId || userId === "undefined"){
    window.location.href = "login.html";
    return;
  }

  const { data } = await client
    .from("users")
    .select("name, subscription_status, subscription_end, book_purchased")
    .eq("id", userId)
    .single();

  if(!data) return;

  userData = data;

  // 🔐 الاشتراك
  const now = new Date();
  const end = new Date(userData.subscription_end);

  userData.isSubscribed =
    userData.subscription_status === "active" && end > now;

  // 📘 الكتاب
  userData.hasBook = userData.book_purchased === true;

  // واتساب
  let msg = `السلام عليكم، أنا ${userData.name}`;
  let url = `https://wa.me/message/735SJORMFI74H1?text=${encodeURIComponent(msg)}`;
  whatsappLink.href = url;
  whatsappBtn.href = url;
}

initUser();

// 🔒 حماية الاشتراك
function checkSub(){
  if(userData?.isSubscribed) return true;

  showNotify("🚫 الاشتراك مطلوب","هذه الميزة للمشتركين فقط","subscribe");
  return false;
}

// 🔒 حماية الكتاب
function checkBook(){
  if(userData?.hasBook) return true;

  showNotify("📘 شراء الكتاب مطلوب","يجب شراء الكتاب أولاً","book");
  return false;
}

// التنقل
function goClass(){ if(!checkSub()) return; location.href="myclass.html"; }
function goYoutube(){ if(!checkSub()) return; location.href="youtube.html"; }
function goPDF(){ if(!checkSub()) return; location.href="pdf.html"; }

function goBook(){ if(!checkBook()) return; location.href="headwaybook.html"; }

// 🔔 Alert ذكي
function showNotify(title,msg,type){

  notifyTitle.innerText = title;
  notifyText.innerText = msg;

  whatsappBtn.style.display = "block";

  if(type === "subscribe"){
    whatsappBtn.innerText = "💬 اشترك الآن";
  }else if(type === "book"){
    whatsappBtn.innerText = "📘 شراء الكتاب";
  }else{
    whatsappBtn.innerText = "💬 تواصل";
  }

  notifyBox.style.display = "flex";
}

function closeNotify(){
  notifyBox.style.display = "none";
}

// خروج
function logout(){
  localStorage.clear();
  location.href="login.html";
}

</script>

</body>
</html>
