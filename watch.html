<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎥 مشاهدة الفيديو</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* 🎬 فيديو احترافي */
.video-box{
  position:relative;
  width:100%;
  padding-top:56.25%;
  border-radius:15px;
  overflow:hidden;
  background:#000;
}

#player{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

/* 🎮 أزرار */
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

/* 🧾 ترجمة */
.sub-en{
  color:#38bdf8;
  font-weight:bold;
  margin-top:20px;
}

.sub-ar{
  color:#facc15;
  font-size:20px;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 مشاهدة الفيديو</h2>

<div class="video-box">
  <div id="player"></div>
</div>

<div class="controls">
  <button onclick="prev()">⏮ السابق</button>
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔄 إعادة</button>
  <button onclick="next()">⏭ التالي</button>
</div>

<div id="subEn" class="sub-en"></div>
<div id="subAr" class="sub-ar"></div>

</div>

<script>

/* ================== إعداد الفيديو ================== */

let player;

function onYouTubeIframeAPIReady(){

  const params = new URLSearchParams(location.search);

  let list = params.get("list");
  let video = params.get("video");

  if(!list && !video){
    alert("❌ الرابط غير صحيح (لا يوجد فيديو)");
    return;
  }

  // 🎬 playlist
  if(list){
    player = new YT.Player('player',{
      playerVars:{
        listType:'playlist',
        list:list
      },
      events:{ onReady:()=>console.log("✅ playlist جاهز") }
    });
  }

  // 🎬 فيديو واحد
  else{
    player = new YT.Player('player',{
      videoId:video,
      events:{ onReady:()=>console.log("✅ video جاهز") }
    });
  }
}

/* ================== التحكم ================== */

function play(){
  if(player && player.playVideo) player.playVideo();
}

function pause(){
  if(player && player.pauseVideo) player.pauseVideo();
}

function restart(){
  if(player && player.seekTo) player.seekTo(0,true);
}

function next(){
  if(player && player.nextVideo) player.nextVideo();
}

function prev(){
  if(player && player.previousVideo) player.previousVideo();
}

</script>

</body>
</html>
