<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبار الذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.stats{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.question{
  font-size:20px;
  margin-bottom:15px;
}

.option{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
  cursor:pointer;
}

.correct{ background:#22c55e !important; }
.wrong{ background:#ef4444 !important; }

.btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="top">
  <div>🧠 اختبارك</div>
  <div onclick="goHome()" style="cursor:pointer;">🏠 الرئيسية</div>
</div>

<div class="card">

  <div class="stats">
    <div>⭐ XP: <span id="xp">0</span></div>
    <div>🏆 Level: <span id="level">1</span></div>
  </div>

  <div id="quizBox"></div>

  <button class="btn" onclick="startQuiz()">🔁 إعادة</button>

</div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "__n8n_BLANK_VALUE_e5362baf-c777-4d57-a609-6eaf1f9e87f6";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

let words = [];
let questions = [];
let current = 0;
let score = 0;

let xp = 0;
let level = 1;

/* تحميل البيانات */
async function loadData(){

  // كلمات
  let { data: w } = await supabaseClient
    .from("words")
    .select("*")
    .eq("user_id", user_id);

  words = w || [];

  // progress
  let { data: p } = await supabaseClient
    .from("progress")
    .select("*")
    .eq("user_id", user_id)
    .single();

  if(!p){
    await supabaseClient.from("progress").insert([{
      user_id,
      xp:0,
      level:1,
      total_tests:0
    }]);
  }else{
    xp = p.xp;
    level = p.level;
  }

  updateUI();
  startQuiz();
}

/* تحديث */
function updateUI(){
  document.getElementById("xp").innerText = xp;
  document.getElementById("level").innerText = level;
}

/* بدء */
function startQuiz(){

  if(words.length < 4){
    document.getElementById("quizBox").innerHTML =
      "❌ تحتاج كلمات";
    return;
  }

  current = 0;
  score = 0;

  questions = [...words].sort(()=>0.5-Math.random()).slice(0,5);

  showQuestion();
}

/* عرض */
function showQuestion(){

  if(current >= questions.length){
    finishQuiz();
    return;
  }

  let q = questions[current];

  let options = [...words].sort(()=>0.5-Math.random()).slice(0,3);
  options.push(q);
  options = options.sort(()=>0.5-Math.random());

  let html = `<div class="question">ما معنى: ${q.en} ؟</div>`;

  options.forEach(opt=>{
    html += `
      <button class="option"
      onclick="answer(this,'${q.ar}','${opt.ar}')">
      ${opt.ar}
      </button>
    `;
  });

  document.getElementById("quizBox").innerHTML = html;
}

/* إجابة */
function answer(btn, correct, ans){

  let buttons = document.querySelectorAll(".option");

  buttons.forEach(b=>b.disabled=true);

  if(ans === correct){
    btn.classList.add("correct");
    score++;
    xp += 10;
  }else{
    btn.classList.add("wrong");
  }

  setTimeout(()=>{
    current++;
    showQuestion();
  },800);
}

/* نهاية */
async function finishQuiz(){

  xp += 20;

  level = Math.floor(xp / 100) + 1;

  await supabaseClient
    .from("progress")
    .update({
      xp,
      level,
      total_tests:1
    })
    .eq("user_id", user_id);

  updateUI();

  document.getElementById("quizBox").innerHTML =
    `🎉 نتيجتك: ${score} / ${questions.length}`;
}

/* رجوع */
function goHome(){
  window.location.href="index.html";
}

loadData();

</script>

</body>
</html>
