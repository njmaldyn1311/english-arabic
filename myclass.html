<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📚 الفصل الذكي</title><style>

body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  margin: 0;
}

/* 🔥 إصلاح الانحراف */
* {
  box-sizing: border-box;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* 🔥 الهيدر */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  padding: 12px;
  border-radius: 12px;
}

.username { color: #38bdf8; }
.count { color: #fbbf24; }

.review-btn {
  background: #6366f1;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

/* 🔥 العنوان */
.main-title {
  text-align: center;
  font-size: 22px;
}

.lesson-title {
  text-align: center;
  color: #94a3b8;
}

/* 🔥 الكارد */
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
}

/* 🔥 أهم إصلاح للمشكلة */
input, textarea, select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin: 8px 0;
  text-align: center;
  font-size: 15px;
}

/* 🔥 إصلاح textarea */
textarea {
  resize: none;
}

/* 🔥 زر */
button {
  background: #22c55e;
  border: none;
  padding: 14px;
  border-radius: 12px;
  color: white;
  width: 100%;
  cursor: pointer;
}

/* 🔥 القصة */
.story {
  line-height: 1.8;
  text-align: left;
  white-space: pre-line;
}

.translation {
  direction: rtl;
  text-align: right;
  line-height: 1.8;
}

.hidden {
  display: none;
}

/* 🔥 تحسين select للجوال */
select {
  appearance: none;
  -webkit-appearance: none;
  background: #fff;
  color: #000;
  font-weight: bold;
}

</style></head><body><div class="container"><div class="header">
  <div class="username">👤 أحمد</div>
  <div class="count">⭐ كلماتك: 0</div>
  <div class="review-btn">📖 مراجعة</div>
</div><div class="main-title">📚 الفصل الذكي</div>
<div class="lesson-title">📘 عنوان الدرس</div><div class="card"><select id="type" onchange="changeType()">
  <option value="text">📝 نص</option>
  <option value="link">🔗 رابط</option>
</select><textarea id="textInput" placeholder="اكتب النص هنا..."></textarea><input type="text" id="linkInput" class="hidden" placeholder="ضع الرابط هنا"><button onclick="generateLesson()">🚀 إنشاء الدرس</button>

</div><div id="lesson"></div></div><script>

function changeType(){
  const type = document.getElementById("type").value;

  document.getElementById("textInput").classList.add("hidden");
  document.getElementById("linkInput").classList.add("hidden");

  if(type === "text") document.getElementById("textInput").classList.remove("hidden");
  if(type === "link") document.getElementById("linkInput").classList.remove("hidden");
}

function generateLesson(){
  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <p class="story">This is a sample story...</p>
      <hr>
      <p class="translation">هذه ترجمة تجريبية...</p>
    </div>
  `;
}

</script></body>
</html>
