<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفصل الذكي</title>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{display:flex;justify-content:space-between;padding:15px;}
.user{color:#38bdf8;}
.points{color:#FFD700;}

.title{text-align:center;}
.subtitle{text-align:center;color:#94a3b8;}

.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.input, .select{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  box-sizing:border-box;
}

.select{
  background:#e5e7eb;
  color:black;
  cursor:pointer;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
  margin-top:10px;
}

.loading{text-align:center;margin-top:20px;}

.story-en{direction:ltr;}
.story-ar{direction:rtl;}

.word{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #334155;
}

.en{color:#38bdf8;}
.ar{color:#facc15;}

.actions{
  display:flex;
  gap:10px;
}

.icon{
  cursor:pointer;
}

iframe{
  width:100%;
  height:220px;
  border-radius:15px;
}

</style>
</head>

<body>

<div class="top">
  <div class="user">👤</div>
  <div class="points">⭐ 0</div>
</div>

<h2 class="title">📚 الفصل الذكي</h2>

<div class="card">

<select id="type" class="select">
  <option value="text">📝 نص</option>
  <option value="link">🔗 رابط</option>
  <option value="pdf">📄 PDF</option>
</select>

<input id="textInput" class="input" placeholder="اكتب هنا">

<button class="btn" onclick="generateLesson()">🚀 إنشاء</button>

</div>

<div id="lesson"></div>

<script>

let isLoading = false;

/* صوت */
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* كلمات */
function renderWords(words){
  let html="";
  for(let k in words){
    words[k].forEach(w=>{
      html+=`
        <div class="word">
          <div class="ar">${w.ar}</div>
          <div class="actions">
            <span class="icon" onclick="speak('${w.en}')">🔊</span>
          </div>
          <div class="en">${w.en}</div>
        </div>
      `;
    });
  }
  return html;
}

/* فيديو */
function renderVideo(data){
  let html = `
    <iframe src="https://www.youtube.com/embed/${data.videoID}" allowfullscreen></iframe>
  `;

  if(data.verbs){
    data.verbs.forEach(w=>{
      html+=`
        <div class="word">
          <div class="ar">${w.ar}</div>
          <div class="actions">
            <span class="icon" onclick="speak('${w.en}')">🔊</span>
          </div>
          <div class="en">${w.en}</div>
        </div>
        <div>${w.example||""}</div>
      `;
    });
  }

  return html;
}

/* PDF */
function renderPDF(data){
  return renderWords(data);
}

/* 🚀 */
async function generateLesson(){

  if(isLoading) return;

  let input = document.getElementById("textInput").value;
  let type = document.getElementById("type").value;

  if(!input){
    alert("اكتب شي");
    return;
  }

  isLoading = true;

  document.getElementById("lesson").innerHTML =
    `<div class="loading">⏳ جاري التحميل...</div>`;

  try{

    let res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/lesson",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        inputPart: input,
        type: type,
        user_id: "user_test"
      })
    });

    if(!res.ok){
      throw new Error("Server error");
    }

    let data = await res.json();

    /* TEXT */
    if(type==="text"){
      document.getElementById("lesson").innerHTML=`
        <div class="card">
          <div class="story-en">${data.story||""}</div>
          <hr>
          <div class="story-ar">${data.translation||""}</div>
          ${data.words ? renderWords(data.words) : ""}
        </div>
      `;
    }

    /* VIDEO */
    else if(type==="link"){
      document.getElementById("lesson").innerHTML=`
        <div class="card">
          ${renderVideo(data)}
        </div>
      `;
    }

    /* PDF */
    else if(type==="pdf"){
      document.getElementById("lesson").innerHTML=`
        <div class="card">
          ${renderPDF(data)}
        </div>
      `;
    }

    document.getElementById("textInput").value="";

  }catch(e){
    document.getElementById("lesson").innerHTML =
      `<div style="color:red;">❌ خطأ: تأكد من webhook</div>`;
  }

  isLoading = false;
}

</script>

</body>
</html>
