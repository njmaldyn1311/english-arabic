<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشاهدة الدرس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>

body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
}

/* 🔥 HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#020617;
  border-bottom:1px solid #1e293b;
}

.user{
  font-weight:bold;
  color:#38bdf8;
}

.home-btn{
  background:#22c55e;
  padding:8px 15px;
  border-radius:10px;
  cursor:pointer;
}

/* محتوى */
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

#player{
  width:100%;
  height:350px;
  border-radius:15px;
}

</style>
</head>

<body>

<!-- ✅ HEADER -->
<div class="header">

  <div class="user" id="userName">...</div>

  <div class="home-btn" onclick="goHome()">🏠 الرئيسية</div>

</div>

<div class="container">

  <div class="card">
    <div id="player"></div>
  </div>

</div>

<script>

const SUPABASE_URL="YOUR_URL";
const SUPABASE_KEY="YOUR_KEY";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let player;
let roomId;
let videoId;
let isTeacher=false;
let channel;

/* ✅ قراءة الرابط */
function getParams(){
  const params=new URLSearchParams(location.search);
  return {
    room:params.get("room"),
    video:params.get("video")
  };
}

/* 🔥 جلب اسم الطالب */
async function loadUser(){

  let {data}=await supa.auth.getUser();

  if(!data.user) return;

  // نفترض الاسم محفوظ في metadata
  let first=data.user.user_metadata.first_name || "";
  let last=data.user.user_metadata.last_name || "";

  userName.innerText = first + " " + last;

}

/* 🎥 إنشاء الفيديو */
function createPlayer(id){

  player=new YT.Player('player',{
    videoId:id,
    events:{
      onReady:()=>{
        setInterval(syncSend,1500);
      }
    }
  });

}

/* 🔄 مزامنة */
function startSync(){

  channel=supa.channel(roomId);

  channel.on('broadcast',{event:'sync'},(msg)=>{

    let {time,state}=msg.payload;

    if(Math.abs(player.getCurrentTime()-time)>1){
      player.seekTo(time,true);
    }

    if(state==="play") player.playVideo();
    else player.pauseVideo();

  }).subscribe();

}

/* إرسال */
function syncSend(){

  if(!player) return;

  channel.send({
    type:'broadcast',
    event:'sync',
    payload:{
      time:player.getCurrentTime(),
      state:player.getPlayerState()==1?"play":"pause"
    }
  });

}

/* 🏠 رجوع */
function goHome(){
  window.location.href="index.html";
}

/* 🚀 تشغيل الصفحة */
async function init(){

  await loadUser();

  let p=getParams();

  roomId=p.room;
  videoId=p.video;

  if(!roomId || !videoId){
    alert("الرابط ناقص");
    return;
  }

  createPlayer(videoId);
  startSync();

}

init();

</script>

</body>
