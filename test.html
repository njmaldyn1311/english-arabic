<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔝 */
.top{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.user{color:#38bdf8;}

/* 📦 */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:420px;
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  text-align:center;
}

.question{
  font-size:20px;
  margin:15px 0;
}

input{
  width:100%;
  padding:15px;
  border-radius:15px;
  border:none;
  margin-top:10px;
  text-align:center;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  cursor:pointer;
  font-size:16px;
}

.btn{background:#22c55e;}

.option{
  background:#334155;
  margin-top:8px;
  color:white;
}

/* 🔔 وسط الشاشة */
.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:20px;
  border-radius:15px;
  display:none;
  font-size:18px;
}

.success{background:#22c55e;}
.error{background:#ef4444;}

</style>
</head>

<body>

<div class="top">
  <div class="user" id="username">👤</div>
  <div onclick="goHome()">🏠</div>
</div>

<div class="container">

  <div class="card">

    <div id="question" class="question">...</div>

    <div id="answers"></div>

    <input id="input" placeholder="اكتب الإجابة">

    <button class="btn" onclick="check()">تحقق</button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

/* 👤 الاسم */
let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");
document.getElementById("username").innerText =
  "👤 " + parts[0] + (parts[1] ? " " + parts[1] : "");

/* البيانات */
let words = [];
let queue = [];
let currentWord;
let type;

let correctCount = 0;
let total = 0;

/* تحميل */
async function load(){

  let { data } = await client
    .from("user_words")
    .select("*")
    .eq("user_id", user_id);

  words = data || [];

  words.forEach(w=>{
    queue.push(w,w); // وزن
  });

  next();
}

/* اختيار ذكي */
function getWord(){
  return queue[Math.floor(Math.random()*queue.length)];
}

/* السؤال */
function next(){

  if(total >= 15){
    finish();
    return;
  }

  currentWord = getWord();

  let en = currentWord.word;
  let ar = currentWord.translation;

  let types = ["mcq","write","reverse","listen"];
  type = types[Math.floor(Math.random()*types.length)];

  document.getElementById("answers").innerHTML="";
  document.getElementById("input").value="";

  total++;

  if(type==="mcq"){

    document.getElementById("input").style.display="none";
    document.getElementById("question").innerText="ما معنى: "+en;

    let options=[...words].sort(()=>0.5-Math.random()).slice(0,3);
    options.push(currentWord);
    options=options.sort(()=>0.5-Math.random());

    options.forEach(o=>{
      let btn=document.createElement("button");
      btn.className="option";
      btn.innerText=o.translation;
      btn.onclick=()=>handle(btn.innerText===ar);
      document.getElementById("answers").appendChild(btn);
    });
  }

  if(type==="write"){
    document.getElementById("input").style.display="block";
    document.getElementById("question").innerText="اكتب معنى: "+en;
  }

  if(type==="reverse"){
    document.getElementById("input").style.display="block";
    document.getElementById("question").innerText="اكتب بالإنجليزي: "+ar;
  }

  if(type==="listen"){
    document.getElementById("input").style.display="block";
    document.getElementById("question").innerText="🎧 استمع واكتب";
    speak(en);
  }
}

/* صوت */
function speak(t){
  let u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* تحقق */
function check(){

  if(type==="mcq") return;

  let val=document.getElementById("input").value.toLowerCase();
  let correct=(type==="reverse")?currentWord.word.toLowerCase():currentWord.translation.toLowerCase();

  handle(val===correct);
}

/* الذكاء */
function handle(ok){

  if(ok){
    correctCount++;
  }else{
    queue.push(currentWord,currentWord); // إعادة
  }

  toast(ok?"✅":"❌",ok);

  save(ok);

  setTimeout(next,700);
}

/* حفظ */
async function save(ok){
  await client.from("progress").insert([{
    user_id,
    word: currentWord.word,
    correct: ok
  }]);
}

/* النهاية */
async function finish(){

  let percent=Math.round((correctCount/total)*100);

  document.getElementById("question").innerHTML=
    `🎉 انتهى الاختبار<br><br>⭐ نتيجتك: ${percent}%`;

  document.getElementById("input").style.display="none";
  document.getElementById("answers").innerHTML="";

  await client.from("results").insert([{
    user_id,
    score: percent
  }]);
}

/* toast */
function toast(msg,ok){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast "+(ok?"success":"error");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",800);
}

function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
