<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>رفع PDF</title>
</head>

<body style="text-align:center; padding:50px;">

<h2>📄 ارفع الكتاب</h2>

<input type="file" id="file" accept="application/pdf"><br><br>

<button onclick="upload()">رفع</button>

<script>
async function upload() {
  const file = document.getElementById("file").files[0];

  if (!file) {
    alert("اختر ملف PDF");
    return;
  }

  const formData = new FormData();
  formData.append("file", file); // 👈 مهم الاسم

  try {
    const res = await fetch("https://YOUR-WEBHOOK-URL", {
      method: "POST",
      body: formData
    });

    alert("تم الإرسال ✅");
  } catch (err) {
    alert("خطأ ❌");
    console.log(err);
  }
}
</script>

</body>
</html>
