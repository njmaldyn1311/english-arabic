<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الأفعال</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", Arial;
  background:#0f172a;
  color:white;
}

/* 🔥 الهيدر */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.home-btn{
  background:#38bdf8;
  border:none;
  padding:8px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.username{
  font-size:14px;
}

/* 🔥 العنوان */
.title{
  text-align:center;
  font-size:28px;
  margin:10px 0 20px;
}

/* 🔥 الكارد */
.card{
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:15px;
}

/* صف */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
}

/* زر الصوت */
.sound{
  background:#22c55e;
  border:none;
  border-radius:8px;
  padding:5px 10px;
  color:white;
  cursor:pointer;
  font-size:12px;
}

/* الترجمة */
.translation{
  text-align:center;
  margin-top:10px;
  color:#38bdf8;
  font-weight:bold;
}

</style>

</head>
<body>

<!-- 🔥 الهيدر -->
<div class="header">
  <div class="username" id="userName">👤 ...</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<!-- 🔥 العنوان -->
<h2 class="title">📚 الأفعال</h2>

<!-- القائمة -->
<div id="list"></div>

<script>

// 🔥 بيانات Supabase
const supabase = window.supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 🏠 الرجوع
function goHome(){
  window.location.href = "index.html";
}

// 🔊 الصوت
function speak(text){
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speechSynthesis.speak(speech);
}

// 👤 اسم المستخدم
document.getElementById("userName").innerText =
  "👤 " + (localStorage.getItem("name") || "مستخدم");

// 🔥 تحميل الأفعال
async function loadWords(){

  const { data, error } = await supabase
    .from("book_words")
    .select("*");

  const container = document.getElementById("list");

  if(error){
    container.innerHTML = "❌ خطأ في تحميل البيانات";
    return;
  }

  if(!data || data.length === 0){
    container.innerHTML = "⚠️ لا توجد أفعال";
    return;
  }

  data.forEach(word => {

    container.innerHTML += `
      <div class="card">

        <div class="row">
          <span>Present: ${word.base || '-'}</span>
          <button class="sound" onclick="speak('${word.base || ''}')">🔊</button>
        </div>

        <div class="row">
          <span>Past: ${word.past || '-'}</span>
          <button class="sound" onclick="speak('${word.past || ''}')">🔊</button>
        </div>

        <div class="row">
          <span>P.P: ${word.past_participle || '-'}</span>
          <button class="sound" onclick="speak('${word.past_participle || ''}')">🔊</button>
        </div>

        <div class="translation">
          ${word.translation || ''}
        </div>

      </div>
    `;
  });

}

loadWords();

</script>

</body>
</html>
