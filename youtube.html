<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning PRO</title>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

input {
  padding: 10px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;
  text-align: center;
}

button {
  background: #22c55e;
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

/* الفيديو */
#videoBox {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #0f172a;
}

#player {
  width: 100%;
  height: 260px;
  border-radius: 15px;
}

/* 🔥 الترجمة */
#subtitleBox{
  margin-top:10px;
  padding:10px;
}

.sub-en{
  font-size:18px;
  color:#38bdf8;
  font-weight:bold;
}

.sub-ar{
  font-size:24px;
  color:#facc15;
  font-weight:bold;
  margin-top:5px;
}

/* تمييز الكلمات */
.highlight{
  color:#22c55e;
  font-weight:bold;
}

/* زر CC */
.cc-btn{
  background:#334155;
  margin-top:10px;
}

.cc-on{
  background:#22c55e;
}

.line {
  text-align: left;
  margin: 10px 0;
}

.en { color: #38bdf8; font-weight: bold; }
.ar { color: #f87171; }

.icon{
  cursor:pointer;
  margin-left:5px;
}

</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<input type="text" id="url" placeholder="ضع رابط YouTube">

<button onclick="sendUrl()">🔗 تحليل</button>

<p id="loading" style="display:none;">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">

  <div id="player"></div>

  <button id="ccBtn" class="cc-btn" onclick="toggleCC()">CC</button>

  <div id="subtitleBox">
    <div class="sub-en" id="subEn"></div>
    <div class="sub-ar" id="subAr"></div>
  </div>

</div>

<div id="result"></div>

</div>

<!-- 🔥 YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let player;
let subtitles = [];
let ccEnabled = true;

/* استخراج ID */
function getVideoId(url){
  try{
    if(url.includes("youtu.be")){
      return url.split("/").pop().split("?")[0];
    }
    const u = new URL(url);
    return u.searchParams.get("v");
  }catch{
    return null;
  }
}

/* إنشاء الفيديو */
function createPlayer(videoId){

  player = new YT.Player('player', {
    height: '260',
    width: '100%',
    videoId: videoId,
    events: {
      'onReady': onPlayerReady
    }
  });

}

function onPlayerReady(){
  setInterval(syncSubtitle, 500);
}

/* 🔥 مزامنة حقيقية */
function syncSubtitle(){

  if(!player || !ccEnabled) return;

  const time = player.getCurrentTime();

  const current = subtitles.find(s =>
    time >= s.time && time < (s.time + 4)
  );

  if(!current) return;

  let text = current.en;

  current.words.forEach(w=>{
    const reg = new RegExp(`\\b${w}\\b`, "gi");
    text = text.replace(reg, `<span class="highlight">${w}</span>`);
  });

  document.getElementById("subEn").innerHTML = text;
  document.getElementById("subAr").innerText = current.ar;
}

/* CC toggle */
function toggleCC(){
  ccEnabled = !ccEnabled;

  const btn = document.getElementById("ccBtn");

  if(ccEnabled){
    btn.classList.add("cc-on");
  }else{
    btn.classList.remove("cc-on");
    document.getElementById("subEn").innerHTML="";
    document.getElementById("subAr").innerText="";
  }
}

/* عرض */
function show(data){

  subtitles = [];
  let html = "";

  for(let cat in data){

    if(!Array.isArray(data[cat])) continue;

    html += `<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      subtitles.push({
        time: w.time || 0,
        en: w.example || "",
        ar: w.example_ar || "",
        words: [w.en || w.word || ""]
      });

      html += `
        <div class="line">
          <span class="en">${w.en}</span>
          <span class="ar">${w.ar}</span>
          <span class="icon" onclick="speak('${w.en}')">🔊</span>
        </div>
      `;
    });

    html += `</div>`;
  }

  document.getElementById("result").innerHTML = html;
}

/* إرسال */
async function sendUrl(){

  const url = document.getElementById("url").value;
  if(!url) return alert("اكتب رابط");

  const id = getVideoId(url);
  if(!id) return alert("❌ رابط غير صحيح");

  document.getElementById("loading").style.display="block";
  document.getElementById("videoBox").style.display="block";

  createPlayer(id);

  const res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ url })
  });

  let data;

  try{
    const text = await res.text();
    data = JSON.parse(text);
  }catch{
    alert("❌ خطأ في البيانات");
    return;
  }

  document.getElementById("loading").style.display="none";

  show(data);
}

/* صوت */
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang="en-US";
  speechSynthesis.speak(msg);
}

</script>

</body>
</html>
