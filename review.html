<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.card{
  background:#e5e7eb;
  color:black;
  border-radius:20px;
  padding:20px;
}

button{
  border:none;
  padding:12px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  width:100%;
  margin-top:10px;
}

.open{background:#22c55e;}
.buy{background:#f59e0b;}
.download{background:#3b82f6;}

.viewer{
  width:100%;
  height:70vh;
  border:none;
  border-radius:15px;
  display:none;
}

/* 🔥 Alert */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.alert{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:320px;
}
</style>

</head>

<body oncontextmenu="return false">

<div class="container">

<h2>📘 كتابي</h2>

<div class="card">

  <!-- 💰 السعر -->
  <h2>💰 سعر الكتاب: 250 ريال</h2>

  <!-- زر فتح -->
  <button class="open" onclick="openBook()">📖 فتح الكتاب</button>

  <!-- زر تحميل -->
  <button class="download" onclick="downloadBook()">📥 تحميل</button>

  <!-- PDF -->
  <iframe id="pdf" class="viewer"></iframe>

</div>

</div>

<!-- 🔥 Alert -->
<div class="overlay" id="alertBox">
  <div class="alert">

    <h3>🔒 الكتاب للمشتركين فقط</h3>

    <button class="buy" onclick="buy()">📲 شراء عبر واتساب</button>
    <button onclick="closeAlert()">إغلاق</button>

  </div>
</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let userId = localStorage.getItem("user_id");
let isPaid = false;
let page = 1;

// 🔥 فتح
async function openBook(){

  await checkUser();

  if(!isPaid){
    showAlert();
    return;
  }

  document.getElementById("pdf").style.display="block";
  document.getElementById("pdf").src = PDF_URL + "#toolbar=0";

  trackRead();
}

// 📥 تحميل
async function downloadBook(){

  await checkUser();

  if(!isPaid){
    showAlert();
    return;
  }

  // تحميل محلي
  let a = document.createElement("a");
  a.href = PDF_URL;
  a.download = "book.pdf";
  a.click();
}

// 🔒 تحقق
async function checkUser(){

  if(!userId) return;

  const { data } = await client
    .from("users")
    .select("plan")
    .eq("id",userId)
    .single();

  isPaid = data?.plan === "paid";
}

// 📊 تتبع القراءة
async function trackRead(){

  if(!userId) return;

  await client.from("users").update({
    last_page: "book",
    last_active: new Date(),
    book_opened: true
  }).eq("id", userId);
}

// 🎯 تتبع الشراء
async function buy(){

  if(userId){
    await client.from("users").update({
      clicked_buy: true
    }).eq("id", userId);
  }

  let phone = "966XXXXXXXXX";
  let msg = "أبغى شراء الكتاب";

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
}

// alert
function showAlert(){
  document.getElementById("alertBox").style.display="flex";
}

function closeAlert(){
  document.getElementById("alertBox").style.display="none";
}

</script>

</body>
</html>
