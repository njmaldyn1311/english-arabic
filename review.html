<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

/* 🔥 إحصائيات */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.num{
  font-size:22px;
  font-weight:bold;
  color:#38bdf8;
}

/* 🔍 البحث */
.search{
  width:100%;
  max-width:300px;
  padding:8px;
  border-radius:8px;
  border:none;
  margin-bottom:15px;
}

/* 👤 المستخدم */
.card{
  background:#1e293b;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

.small{
  font-size:12px;
  color:#94a3b8;
}

button{
  margin:5px;
  padding:5px 8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.ban{background:#ef4444;color:white;}
.unban{background:#22c55e;color:white;}
.plan{background:#38bdf8;color:white;}
</style></head><body><div class="container"><h3>📊 Dashboard</h3><!-- 🔥 الإحصائيات --><div class="stats">
  <div class="stat">👥 المستخدمين <div id="total" class="num">0</div></div>
  <div class="stat">💰 المدفوع <div id="paid" class="num">0</div></div>
  <div class="stat">🆓 مجاني <div id="free" class="num">0</div></div>
  <div class="stat">🚫 محظور <div id="banned" class="num">0</div></div>
  <div class="stat">📈 نشط اليوم <div id="active" class="num">0</div></div>
  <div class="stat">⏱️ متوسط الوقت <div id="time" class="num">0</div></div>
</div><input id="search" class="search" placeholder="🔍 بحث"><div id="users"></div></div><script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let users=[];

// 🔥 تحميل البيانات
async function load(){

  const { data } = await client.from("users").select("*");

  users=data;

  renderStats(data);
  renderUsers(data);
}

// 📊 الإحصائيات
function renderStats(data){

  const today = new Date().toISOString().slice(0,10);

  document.getElementById("total").innerText = data.length;

  document.getElementById("paid").innerText =
    data.filter(u=>u.plan==="paid").length;

  document.getElementById("free").innerText =
    data.filter(u=>u.plan==="free").length;

  document.getElementById("banned").innerText =
    data.filter(u=>u.status==="banned").length;

  document.getElementById("active").innerText =
    data.filter(u=>u.last_active?.startsWith(today)).length;

  let avg=0;
  if(data.length){
    avg = data.reduce((a,b)=>a+(b.total_time||0),0)/data.length;
  }

  document.getElementById("time").innerText =
    Math.round(avg)+"s";
}

// 👤 عرض المستخدمين
function renderUsers(list){

  let html="";

  list.forEach(u=>{

    html+=`
    <div class="card">

      <div class="row">
        <div>
          <strong>${u.name||"بدون اسم"}</strong>
          <div class="small">${u.email}</div>
        </div>

        <div>
          ${u.plan}
          ${u.status==="banned"?"🚫":""}
        </div>
      </div>

      <div class="small">
        ⏱️ ${u.total_time||0}s | 📅 ${u.last_active||"-"}
      </div>

      <div>
        ${
          u.status==="banned"
          ? `<button class="unban" onclick="unban('${u.id}')">فك</button>`
          : `<button class="ban" onclick="ban('${u.id}')">حظر</button>`
        }

        <button class="plan" onclick="togglePlan('${u.id}','${u.plan}')">
          اشتراك
        </button>
      </div>

    </div>`;
  });

  document.getElementById("users").innerHTML=html;
}

// 🔍 البحث
document.getElementById("search").oninput=(e)=>{
  const v=e.target.value.toLowerCase();

  renderUsers(users.filter(u=>
    (u.name||"").toLowerCase().includes(v) ||
    (u.email||"").toLowerCase().includes(v)
  ));
};

// 🚫
async function ban(id){
  await client.from("users").update({status:"banned"}).eq("id",id);
  load();
}

// ✅
async function unban(id){
  await client.from("users").update({status:"active"}).eq("id",id);
  load();
}

// 💰
async function togglePlan(id,plan){
  const newPlan=plan==="paid"?"free":"paid";
  await client.from("users").update({plan:newPlan}).eq("id",id);
  load();
}

load();

</script></body>
</html>
