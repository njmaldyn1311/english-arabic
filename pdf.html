<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل PDF</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
  color:white;
}

.container {
  width: 100%;
  max-width: 500px;
}

.box {
  background:#1e293b;
  padding: 25px;
  border-radius: 20px;
  width: 98%;
  box-sizing: border-box;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  margin-bottom: 20px;
}

button {
  background:#22c55e;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

button:disabled{ opacity:0.6; }

#result { width:100%; }

.title {
  margin:15px 0 10px;
  text-align:center;
}

.word {
  padding:10px;
  border-bottom:1px solid #334155;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.en { flex:1; text-align:left; color:#38bdf8; }
.ar { flex:1; text-align:right; color:#f87171; }

.icon{
  cursor:pointer;
  background:#0f172a;
  padding:8px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

  <div class="box">
    <h2>📄 رفع PDF</h2>

    <input type="file" id="file" accept="application/pdf"><br><br>

    <button id="analyzeBtn" onclick="upload()">🚀 تحليل</button>

    <p id="status"></p>
  </div>

  <div id="result"></div>

</div>

<script>

// 🔥 Supabase
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 🔥 توحيد user_id */
let user_id = localStorage.getItem("user_id");

if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

console.log("USER:", user_id);

/* 🔥 تتبع */
async function track(action){
  await fetch(SUPABASE_URL + "/rest/v1/user_activity", {
    method: "POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id: user_id,
      page: "pdf_page",
      action: action
    })
  });
}

track("دخول صفحة PDF");

/* 🔄 إعادة الحالة */
document.getElementById("file").addEventListener("change", () => {
  status.innerHTML = "";
  analyzeBtn.disabled = false;
  analyzeBtn.innerText = "🚀 تحليل";
});

/* 🔊 صوت */
function speak(word){
  const u = new SpeechSynthesisUtterance(word);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* ⭐ حفظ */
async function saveWord(el,en,ar){

  await client.from("user_star_words").insert({
    user_id: user_id,
    word: en,
    translation: ar
  });

  track("حفظ كلمة من PDF");

  el.innerText="✅";
  el.style.background="#22c55e";
}

/* 🚀 رفع */
async function upload(){

  const file = fileInput.files[0];
  if(!file) return alert("اختر ملف");

  track("رفع PDF");

  const maxSize = 5 * 1024 * 1024;

  if(file.size > maxSize){
    status.innerHTML="⚠️ الملف كبير";
    status.style.color="#f87171";
    return;
  }

  analyzeBtn.disabled=true;
  analyzeBtn.innerText="⏳ جاري التحليل...";
  status.innerHTML="⏳ جاري التحليل...";
  status.style.color="#facc15";

  result.innerHTML="";

  const formData = new FormData();
  formData.append("file", file);

  try{

    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf",{
      method:"POST",
      body:formData
    });

    let data = await res.json();

    if(data.raw){
      try{ data = JSON.parse(data.raw); }catch{}
    }

    status.innerHTML="✅ تم التحليل";
    status.style.color="#22c55e";
    analyzeBtn.disabled=false;
    analyzeBtn.innerText="🚀 تحليل";

    function renderList(list){
      if(!list) return "";
      return list.map(item=>`
        <div class="word">
          <span class="en">${item.word || item.phrase || ""}</span>

          <div style="display:flex; gap:8px;">
            <div class="icon" onclick="speak('${item.word || item.phrase}')">🔊</div>
            <div class="icon" onclick="saveWord(this,'${item.word || item.phrase}','${item.arabic || ""}')">⭐</div>
          </div>

          <span class="ar">${item.arabic || ""}</span>
        </div>
      `).join("");
    }

    result.innerHTML = `
      ${data.verbs?.length ? `<div class="box"><h3 class="title">📌 الأفعال</h3>${renderList(data.verbs)}</div>` : ""}
      ${data.nouns?.length ? `<div class="box"><h3 class="title">📌 الأسماء</h3>${renderList(data.nouns)}</div>` : ""}
      ${data.adjectives?.length ? `<div class="box"><h3 class="title">📌 الصفات</h3>${renderList(data.adjectives)}</div>` : ""}
      ${data.idioms?.length ? `<div class="box"><h3 class="title">📌 العبارات</h3>${renderList(data.idioms)}</div>` : ""}
    `;

    fileInput.value = "";

  }catch(err){
    status.innerHTML="❌ خطأ";
    status.style.color="#ef4444";
    analyzeBtn.disabled=false;
    analyzeBtn.innerText="🚀 تحليل";
  }

}

</script>

</body>
</html>
