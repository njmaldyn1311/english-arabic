<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<style>

body{
  margin:0;
  font-family:"Cairo",sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.home{
  background:#38bdf8;
  padding:8px 15px;
  border-radius:10px;
}

.container{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:20px;
  border-radius:20px;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:18px;
  margin-top:10px;
  cursor:pointer;
}

.blue{background:#3b82f6;color:white;}
.orange{background:#f59e0b;color:white;}
.green{background:#22c55e;color:white;}
.red{background:#7f1d1d;color:white;}

canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

textarea{
  width:95%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:10px;
}

.bottom{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.bottom button{
  flex:1;
  background:#22c55e;
  border:none;
  padding:10px;
  border-radius:10px;
  color:white;
}

.analysis-card{
  background:#1e293b;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

</head>
<body>

<div class="header">
  <div>👤 <span id="userName">محمد أحمد</span></div>
  <div class="home">🏠 الرئيسية</div>
</div>

<h2>📘 كتابي</h2>

<div class="container">

  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <button class="btn blue" id="openBtn" onclick="openBook()">📥 تحميل وفتح</button>

  <canvas id="pdf"></canvas>

  <button class="btn orange" onclick="analyzePage()">🧠 تحليل الصفحة</button>

  <div id="analysisResult"></div>

  <textarea id="note" placeholder="✍️ ملاحظة..."></textarea>

  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

  <div class="bottom">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
    <button onclick="speak()">🔊 قراءة</button>
  </div>

</div>

<script>

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf 
"; // ضع رابطك هنا
const WEBHOOK_URL = "https://n8n.srv1495053.hstgr.cloud/webhook/headway";

let pdfDoc=null;
let currentPage=1;

async function openBook(){

  const btn=document.getElementById("openBtn");
  btn.innerText="⏳ جاري التحميل...";

  try{
    pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;

    currentPage = parseInt(localStorage.getItem("lastPage")) || 1;

    await renderPage(currentPage);

    btn.innerText="📖 تم فتح الكتاب";
    document.getElementById("priceBox").style.display="none";

  }catch(e){
    btn.innerText="❌ فشل التحميل";
    console.log(e);
  }
}

async function renderPage(num){

  const page = await pdfDoc.getPage(num);

  const canvas=document.getElementById("pdf");
  const ctx=canvas.getContext("2d");

  const viewport=page.getViewport({scale:1.5});

  canvas.height=viewport.height;
  canvas.width=viewport.width;

  await page.render({canvasContext:ctx,viewport}).promise;

  localStorage.setItem("lastPage", num);
}

function nextPage(){
  if(currentPage<pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);
  }
}

function prevPage(){
  if(currentPage>1){
    currentPage--;
    renderPage(currentPage);
  }
}

async function analyzePage(){

  const box=document.getElementById("analysisResult");
  box.innerHTML='<div class="analysis-card">⏳ جاري التحليل...</div>';

  try{

    const res = await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({page:currentPage})
    });

    const data = await res.json();

    box.innerHTML="";

    data.words.forEach(w=>{

      box.innerHTML+=`
      <div class="analysis-card">
        <b style="color:#22c55e">${w.word}</b>
        <span style="color:#facc15">(${w.type})</span>
        <div>${w.example}</div>
        <div style="color:#94a3b8">${w.translation}</div>

        <button onclick="saveWord('${w.word}','${w.translation}')">
          ⭐ حفظ
        </button>
      </div>
      `;
    });

  }catch(e){
    console.log(e);

    box.innerHTML=`
      <div class="analysis-card red">
        ❌ فشل التحليل
      </div>
    `;
  }
}

function saveWord(word,translation){

  let words = JSON.parse(localStorage.getItem("words")||"[]");

  words.push({word,translation});

  localStorage.setItem("words",JSON.stringify(words));

  alert("تم حفظ الكلمة ⭐");
}

function saveNote(){

  const note=document.getElementById("note").value;

  localStorage.setItem("note_page_"+currentPage,note);

  alert("تم حفظ الملاحظة");
}

function speak(){

  const msg=new SpeechSynthesisUtterance("Reading page");
  speechSynthesis.speak(msg);
}

</script>

</body>
</html>
