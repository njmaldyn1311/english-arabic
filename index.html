<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

.content {
  padding: 70px 20px 20px;
}

h1 { color: white; }
.subtitle { color: #cbd5e1; }

.students {
  color: #22c55e;
  font-weight: bold;
  margin: 10px 0;
}

.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}

button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
}

.logout { background: #ef4444; }

.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
}

.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  padding: 15px;
  border-radius: 50%;
}

/* 🔥 Alert */
#notifyBox{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:999;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students" id="students">
      👨‍🎓 أكثر من 120 طالب
    </div>

    <div class="card"><span>📚 الفصل الذكي</span><button onclick="goClass()">ابدأ</button></div>
    <div class="card"><span>📺 تحليل فيديو</span><button onclick="goYoutube()">ابدأ</button></div>
    <div class="card"><span>📄 تحليل PDF</span><button onclick="goPDF()">ابدأ</button></div>
    <div class="card"><span>🔍 البحث</span><button onclick="goSearch()">ابدأ</button></div>
    <div class="card"><span>📝 اختبار</span><button onclick="goTest()">ابدأ</button></div>
    <div class="card"><span>📊 مراجعة</span><button onclick="goReview()">فتح</button></div>
    <div class="card"><span>👤 حسابي</span><button onclick="goProfile()">فتح</button></div>

    <a id="whatsappLink" target="_blank" class="whatsapp">
      💬 تواصل معي على واتساب
    </a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<a id="whatsappFloat" target="_blank" class="whatsapp-float">💬</a>

<!-- 🔥 Alert -->
<div id="notifyBox">
  <div style="
    background:#111827;
    padding:20px;
    border-radius:20px;
    width:85%;
    max-width:300px;
    color:white;
    text-align:center;
  ">
    <h3 id="notifyTitle"></h3>
    <p id="notifyText"></p>

    <button onclick="closeNotify()" style="margin-top:10px;background:#22c55e;border:none;padding:10px;border-radius:10px;color:white;width:100%">
      تمام 👍
    </button>

    <a id="whatsappBtn" target="_blank" style="
      display:block;
      margin-top:10px;
      background:#25D366;
      padding:10px;
      border-radius:10px;
      color:white;
      text-decoration:none;
    ">
      💬 تواصل واتساب
    </a>
  </div>
</div>

<script>

// 🔥 Supabase
const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// تحقق تسجيل الدخول
const userId = localStorage.getItem("user_id");
if(!userId){
  window.location.href = "login.html";
}

// واتساب
let userName = localStorage.getItem("user_name") || "طالب";
let message = `السلام عليكم، أنا ${userName}`;
let whatsappURL = `https://wa.me/message/735SJORMFI74H1?text=${encodeURIComponent(message)}`;

document.getElementById("whatsappLink").href = whatsappURL;
document.getElementById("whatsappFloat").href = whatsappURL;
document.getElementById("whatsappBtn").href = whatsappURL;

// ⭐ عداد ثابت (تم إصلاحه)
let count = localStorage.getItem("studentsCount");
if (!count) count = 120;

let counted = localStorage.getItem("countedUser");

if (!counted) {
  count = parseInt(count) + 1;
  localStorage.setItem("studentsCount", count);
  localStorage.setItem("countedUser", "yes");
}

document.getElementById("students").innerText =
  "👨‍🎓 أكثر من " + count + " طالب";

// 🔔 عرض التنبيه
function showNotify(title, msg){
  document.getElementById("notifyTitle").innerText = title;
  document.getElementById("notifyText").innerText = msg;
  document.getElementById("notifyBox").style.display = "flex";
}
function closeNotify(){
  document.getElementById("notifyBox").style.display = "none";
}

// 🔥 جلب التنبيه العام
async function loadNotification(){
  const { data } = await client
    .from("notifications")
    .select("*")
    .eq("active", true)
    .order("created_at",{ascending:false})
    .limit(1);

  if(data && data.length){
    let seen = localStorage.getItem("seen_notify");
    if(seen !== data[0].id){
      showNotify(data[0].title, data[0].message);
      localStorage.setItem("seen_notify", data[0].id);
    }
  }
}
loadNotification();

// 🚫 تحقق الحظر
async function checkBan(){
  const { data } = await client
    .from("users")
    .select("status")
    .eq("id", userId)
    .single();

  if(data?.status === "banned"){
    showNotify("🚫 تم إيقاف حسابك", "للاشتراك أو فك الحظر تواصل واتساب");
  }
}
checkBan();

// التنقل
function goClass(){ location.href="myclass.html"; }
function goYoutube(){ location.href="youtube.html"; }
function goPDF(){ location.href="pdf.html"; }
function goSearch(){ location.href="search.html"; }
function goProfile(){ location.href="student.html"; }
function goTest(){ location.href="test.html"; }
function goReview(){ location.href="review.html"; }

// خروج
function logout(){
  const studentsCount = localStorage.getItem("studentsCount");
  localStorage.clear();
  localStorage.setItem("studentsCount", studentsCount);
  location.href="login.html";
}

</script>

</body>
</html>
