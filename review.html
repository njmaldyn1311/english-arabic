<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.username{
  font-size:14px;
  color:#94a3b8;
}

.home{
  background:#38bdf8;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.viewer{
  width:100%;
  height:75vh;
  border:none;
  border-radius:15px;
  background:white;
}

.controls{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.page{
  margin-top:10px;
  font-size:14px;
  color:#cbd5f5;
}
</style>

</head>

<body>

<div class="container">

  <!-- 🔥 الهيدر -->
  <div class="header">
    <div class="username" id="username">...</div>
    <div class="home" onclick="goHome()">🏠 الرئيسية</div>
  </div>

  <h2>📘 كتابي</h2>

  <!-- 📖 عرض الكتاب -->
  <iframe id="pdf" class="viewer"></iframe>

  <!-- 🔘 الأزرار (تحت 👇) -->
  <div class="controls">
    <button onclick="prev()">⬅️ السابق</button>
    <button onclick="next()">التالي ➡️</button>
  </div>

  <div class="page" id="page">صفحة 1</div>

</div>

<script>

// 🔗 Supabase
const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 📄 رابط الكتاب
const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let page = 1;
let userId = localStorage.getItem("user_id");

// تحميل الصفحة
function loadPage(){
  document.getElementById("pdf").src = PDF_URL + "#page=" + page;
  document.getElementById("page").innerText = "صفحة " + page;

  track(); // 🔥 تتبع
}

// التالي
function next(){
  page++;
  loadPage();
}

// السابق
function prev(){
  if(page > 1){
    page--;
    loadPage();
  }
}

// الرئيسية
function goHome(){
  window.location.href = "/";
}

// 🔥 جلب اسم المستخدم
async function loadUser(){

  if(!userId){
    document.getElementById("username").innerText = "زائر";
    return;
  }

  const { data } = await client
    .from("users")
    .select("name")
    .eq("id", userId)
    .single();

  document.getElementById("username").innerText =
    data?.name || "بدون اسم";
}

// 🔥 تتبع الاستخدام (يرتبط بالداتا بيز)
async function track(){

  if(!userId) return;

  await client.from("users").update({
    last_page: "book",
    last_active: new Date(),
    book_count: 1
  }).eq("id", userId);
}

// 🚀 تشغيل
loadUser();
loadPage();

</script>

</body>
</html>
