<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning</title>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
  box-sizing: border-box;
}

input {
  padding: 10px;
  width: 100%;
  border-radius: 10px;
  border: none;
  margin: 5px 0;
  box-sizing: border-box;
}

button {
  background: #22c55e;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  margin: 5px;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
  box-shadow: 0 0 10px #000;
}

/* الفيديو */
#videoBox {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #0f172a;
  padding-top: 10px;
}

iframe {
  width: 100%;
  height: 250px;
  border-radius: 15px;
}

h3 {
  color: #22c55e;
}

/* الجدول */
.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  table-layout: fixed;
}

.table th:nth-child(1),
.table td:nth-child(1) { width: 30%; }

.table th:nth-child(2),
.table td:nth-child(2) { width: 20%; }

.table th:nth-child(3),
.table td:nth-child(3) { width: 50%; }

.table th, .table td {
  border-bottom: 1px solid #334155;
  padding: 10px;
  text-align: left;
  vertical-align: top;
  word-break: break-word;
}

.en {
  color: #38bdf8;
  font-weight: bold;
  cursor: pointer;
}

.ar {
  color: #f87171;
}

.example {
  color: #e2e8f0;
}

.example-ar {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 5px;
}

#loading {
  display: none;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء </h2>

<input type="text" id="url" placeholder="ضع رابط YouTube">
<br>

<button onclick="sendUrl()">🔗 تحليل رابط</button>

<p id="loading">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <iframe id="videoFrame" frameborder="0" allowfullscreen></iframe>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let videoId = "";

/* استخراج ID */
function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

/* عرض الفيديو */
function showVideo(url) {
  videoId = getVideoId(url);
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}`;
  document.getElementById("videoBox").style.display = "block";
}

/* الانتقال للوقت */
function goToTime(sec) {
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}?start=${sec}&autoplay=1`;
}

/* 🔊 الصوت */
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
}

loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {
  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  msg.rate = 0.9;

  const voice = voices.find(v => v.lang.startsWith("en"));
  if (voice) msg.voice = voice;

  speechSynthesis.speak(msg);
}

/* إرسال الرابط */
async function sendUrl() {
  const url = document.getElementById("url").value;

  if (!url) {
    alert("اكتب رابط");
    return;
  }

  startLoading();
  showVideo(url);

  // ✅ مسح الحقل
  document.getElementById("url").value = "";

  const res = await fetch(WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });

  const data = await res.json();

  stopLoading();
  show(data);
}

/* عرض النتائج */
function show(data) {
  let html = "";

  for (let cat in data) {
    if (!data[cat] || data[cat].length === 0) continue;

    html += `
    <div class="card">
      <h3>${cat}</h3>

      <table class="table">
        <tr>
          <th>Word</th>
          <th>Arabic</th>
          <th>Example</th>
        </tr>
    `;

    data[cat].forEach(w => {

      const word = w.en || w.word || "";
      const arabic = w.ar || w.arabic || "";

      html += `
        <tr>
          <td class="en"
              onclick="speak('${word}'); event.stopPropagation();">
              ${word}
          </td>

          <td class="ar">${arabic}</td>

          <td onclick="goToTime(${w.time || 0})" style="cursor:pointer;">
            <div class="example">${w.example || ""}</div>
            <div class="example-ar">${w.example_ar || ""}</div>
          </td>
        </tr>
      `;
    });

    html += `</table></div>`;
  }

  document.getElementById("result").innerHTML = html;
}

/* تحميل */
function startLoading() {
  document.getElementById("loading").style.display = "block";
}

function stopLoading() {
  document.getElementById("loading").style.display = "none";
}

</script>

</body>
</html>
