<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  margin:0;
  font-family:"Cairo",sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
}
.home{
  background:#38bdf8;
  padding:8px 15px;
  border-radius:10px;
}
.container{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:20px;
  border-radius:20px;
}
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:18px;
  margin-top:10px;
  cursor:pointer;
}
.blue{background:#3b82f6;color:white;}
.orange{background:#f59e0b;color:white;}
.green{background:#22c55e;color:white;}
canvas{
  width:100%;
  border-radius:15px;
}
textarea{
  width:90%;
  padding:10px;
  border-radius:10px;
}
.bottom{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.bottom button{
  flex:1;
  background:#22c55e;
  border:none;
  padding:10px;
  border-radius:10px;
  color:white;
}
.analysis-card{
  background:#1e293b;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  color:white;
}
</style>
</head>

<body>

<div class="header">
  <div>👤 <span id="userName">...</span></div>
  <div class="home">🏠 الرئيسية</div>
</div>

<h2>📘 كتابي</h2>

<div class="container">

  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <button class="btn blue" onclick="openBook()">📥 تحميل وفتح</button>

  <canvas id="pdf"></canvas>

  <button class="btn orange" onclick="analyzePage()">🧠 تحليل الصفحة</button>

  <div id="analysisResult"></div>

  <textarea id="note" placeholder="✍️ ملاحظة..."></textarea>

  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

  <div class="bottom">
    <button onclick="prevPage()">⬅</button>
    <button onclick="nextPage()">➡</button>
    <button onclick="speak()">🔊</button>
  </div>

</div>

<script>

// 🔥 بياناتك
const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";
const WEBHOOK_URL = "https://n8n.srv1495053.hstgr.cloud/webhook/headway";

// 🔥 Supabase
const supabase = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "YOUR_ANON_KEY"
);

let pdfDoc=null;
let currentPage=1;
let user=null;

// 🧠 جلب المستخدم
async function loadUser(){
  const { data } = await supabase.auth.getUser();
  user = data.user;

  const { data:profile } = await supabase
    .from("users")
    .select("first_name,last_name")
    .eq("id", user.id)
    .single();

  document.getElementById("userName").innerText =
    profile.first_name + " " + profile.last_name;
}

// 📥 فتح الكتاب
async function openBook(){

  document.querySelector(".blue").innerText="⏳ جاري التحميل...";

  pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;

  // 🔥 جلب آخر صفحة
  const { data } = await supabase
    .from("book_user_progress")
    .select("page")
    .eq("user_id", user.id)
    .single();

  if(data) currentPage = data.page;

  renderPage(currentPage);

  document.getElementById("priceBox").style.display="none";
}

// عرض الصفحة
async function renderPage(num){

  const page = await pdfDoc.getPage(num);
  const canvas=document.getElementById("pdf");
  const ctx=canvas.getContext("2d");

  const viewport=page.getViewport({scale:1.5});

  canvas.height=viewport.height;
  canvas.width=viewport.width;

  await page.render({canvasContext:ctx,viewport}).promise;

  // 🔥 حفظ الصفحة
  await supabase.from("book_user_progress").upsert({
    user_id:user.id,
    page:num
  });
}

// التالي
function nextPage(){
  if(currentPage<pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);
  }
}

// السابق
function prevPage(){
  if(currentPage>1){
    currentPage--;
    renderPage(currentPage);
  }
}

// 🧠 تحليل
async function analyzePage(){

  const box=document.getElementById("analysisResult");
  box.innerHTML='<div class="analysis-card">⏳ جاري التحليل...</div>';

  const res = await fetch(WEBHOOK_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({page:currentPage})
  });

  const data = await res.json();

  box.innerHTML="";

  data.words.forEach(w=>{

    box.innerHTML+=`
    <div class="analysis-card">
      <b>${w.word}</b> (${w.type})
      <div>${w.translation}</div>

      <button onclick="saveWord('${w.word}','${w.translation}')">
        ⭐ حفظ
      </button>
    </div>
    `;
  });
}

// ⭐ حفظ كلمة
async function saveWord(word,translation){

  await supabase.from("book_user_words").insert({
    user_id:user.id,
    word,
    translation
  });

  alert("تم حفظ الكلمة ⭐");
}

// 📝 حفظ ملاحظة
async function saveNote(){

  const note=document.getElementById("note").value;

  await supabase.from("reviews").insert({
    user_id:user.id,
    page:currentPage,
    note
  });

  alert("تم حفظ الملاحظة");
}

// 🔊 قراءة
function speak(){
  const msg=new SpeechSynthesisUtterance("Reading");
  speechSynthesis.speak(msg);
}

loadUser();

</script>

</body>
</html>
