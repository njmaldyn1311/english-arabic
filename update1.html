<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 الأفعال</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔥 الهيدر */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user-name{
  color:#38bdf8;
  font-size:14px;
}

.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 14px;
  border-radius:12px;
  color:#38bdf8;
  cursor:pointer;
}

/* 📦 */
.container{
  padding:15px;
  max-width:600px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:24px;
  margin:15px 0;
}

/* 🧾 الكرت */
.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;
}

/* صف */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
  background:#334155;
  padding:10px;
  border-radius:10px;
}

button{
  border:none;
  background:#38bdf8;
  color:white;
  border-radius:8px;
  padding:5px 10px;
  cursor:pointer;
}

/* ترجمة */
.translation{
  text-align:center;
  margin-top:10px;
  color:#22c55e;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
  <div class="user-name" id="username">👤</div>
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">

  <div class="title">📚 الأفعال</div>

  <div id="list"></div>

</div>

<script>

/////////////////////////////
// 🔥 نفس ربطك بالضبط
/////////////////////////////

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/////////////////////////////
// 👤 اسم المستخدم
/////////////////////////////

let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");

document.getElementById("username").innerText =
  "👤 " + parts[0] + (parts[1] ? " " + parts[1] : "");

/////////////////////////////
// 🔊 صوت
/////////////////////////////

function speak(text){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/////////////////////////////
// 📥 تحميل الأفعال
/////////////////////////////

async function load(){

  let { data, error } = await client
    .from("book_words")
    .select("*");

  if(error){
    document.getElementById("list").innerText = "❌ " + error.message;
    return;
  }

  if(!data.length){
    document.getElementById("list").innerText = "⚠️ لا توجد أفعال";
    return;
  }

  let container = document.getElementById("list");
  container.innerHTML = "";

  data.forEach(w => {

    container.innerHTML += `
      <div class="card">

        <div class="row">
          <span>${w.base}</span>
          <button onclick="speak('${w.base}')">🔊</button>
        </div>

        <div class="row">
          <span>${w.past}</span>
          <button onclick="speak('${w.past}')">🔊</button>
        </div>

        <div class="row">
          <span>${w.past_participle}</span>
          <button onclick="speak('${w.past_participle}')">🔊</button>
        </div>

        <div class="translation">
          ${w.translation || ""}
        </div>

      </div>
    `;
  });

}

/////////////////////////////

function goHome(){
  window.location.href="index.html";
}

/////////////////////////////

load();

/////////////////////////////

</script>

</body>
</html>
