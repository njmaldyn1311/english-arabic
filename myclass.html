<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفصل الذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{display:flex;justify-content:space-between;padding:15px;}
.user{color:#38bdf8;}
.points{color:#FFD700;}
.review{
  background:#6366f1;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
}

.title{text-align:center;}
.subtitle{text-align:center;color:#94a3b8;}

.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.select{
  background:#e5e7eb;
  color:black;
  padding:15px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.options{display:none;background:white;border-radius:15px;margin-top:10px;}
.option{padding:15px;border-bottom:1px solid #ddd;color:black;}

.input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  margin-top:10px;
  box-sizing:border-box;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
  margin-top:10px;
}

.loading{text-align:center;margin-top:20px;}

.story{
  line-height:2;
  font-size:17px;
  margin-bottom:15px;
}

.story-en{direction:ltr;text-align:justify;}
.story-ar{direction:rtl;text-align:justify;}

.section-title{
  margin-top:20px;
  font-weight:bold;
  font-size:20px;
}

.word{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #334155;
}

.en{color:#38bdf8;}
.ar{color:#facc15;}

.actions{
  display:flex;
  gap:15px;
}

.icon{
  cursor:pointer;
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  font-size:18px;
}
</style>

</head>

<body>

<div class="top">
  <div class="user" id="username">👤</div>
  <div class="points">⭐ كلماتك: 0</div>
  <div class="review" onclick="goProfile()">👤 حسابي</div>
</div>

<h2 class="title">📚 الفصل الذكي</h2>
<p class="subtitle">📘 عنوان الدرس</p>

<div class="card">

  <div class="select" onclick="toggleOptions()">
    <span id="typeText">📝 نص</span>
    <span>▼</span>
  </div>

  <div class="options" id="options">
    <div class="option" onclick="selectType('text')">📝 نص</div>
    <div class="option" onclick="selectType('link')">🔗 رابط</div>
    <div class="option" onclick="selectType('pdf')">📄 PDF</div>
  </div>

  <input id="textInput" class="input" placeholder="... اكتب النص هنا">

  <button class="btn" onclick="generateLesson()">🚀 إنشاء الدرس</button>

</div>

<div id="lesson"></div>

<script>

/* 🔥 اربط Supabase */
const supabase = window.supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

/* 👤 اسم المستخدم */
const fullName = localStorage.getItem("user") || "";
const nameParts = fullName.split(" ");
const shortName = nameParts.slice(0,2).join(" ");
document.getElementById("username").innerText = "👤 " + shortName;

/* 🆔 user_id */
let user_id = localStorage.getItem("user_id");
if(!user_id){
  user_id = "user_" + Math.random().toString(36).substring(2,10);
  localStorage.setItem("user_id", user_id);
}

/* التنقل */
function goProfile(){
  window.location.href = "student.html";
}

/* اختيار النوع */
let selectedType="text";

function toggleOptions(){
  let o=document.getElementById("options");
  o.style.display=o.style.display==="block"?"none":"block";
}

function selectType(type){
  selectedType=type;
  document.getElementById("options").style.display="none";

  let text="📝 نص";
  if(type==="link") text="🔗 رابط";
  if(type==="pdf") text="📄 PDF";

  document.getElementById("typeText").innerText=text;
}

/* 🔊 صوت */
function speak(text){
  let utter = new SpeechSynthesisUtterance(text);
  utter.lang="en-US";
  speechSynthesis.speak(utter);
}

/* ⭐ حفظ في Supabase */
async function saveWord(el,en,ar){

  el.innerText = "⏳";

  try {

    let { error } = await supabase
      .from("user_words")  // ✅ استخدم جدولك الحالي
      .insert([
        {
          user_id: user_id,
          en: en,
          ar: ar
        }
      ]);

    if (error) throw error;

    el.innerText = "✅";
    el.style.background = "#22c55e";

  } catch (err) {
    console.error(err);
    el.innerText = "❌";
  }
}

/* عرض الكلمات */
function renderWords(words){
  let html="";
  for(let section in words){
    html+=`<div class="section-title">${section}</div>`;
    words[section].forEach(w=>{
      html+=`
        <div class="word">
          <div class="ar">${w.ar}</div>

          <div class="actions">
            <div class="icon" onclick="speak('${w.en}')">🔊</div>
            <div class="icon" onclick="saveWord(this,'${w.en}','${w.ar}')">⭐</div>
          </div>

          <div class="en">${w.en}</div>
        </div>
      `;
    });
  }
  return html;
}

/* 🚀 إنشاء الدرس */
async function generateLesson(){

  let input=document.getElementById("textInput").value;

  if(!input){
    alert("اكتب شي");
    return;
  }

  document.getElementById("lesson").innerHTML =
    `<div class="loading">⏳ جاري إنشاء الدرس...</div>`;

  try{

    let res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/lesson",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        inputPart: input,
        type: selectedType,
        user_id: user_id
      })
    });

    let data = await res.json();

    document.getElementById("textInput").value = "";

    document.getElementById("lesson").innerHTML=`
      <div class="card">

        <div class="section-title">📖 القصة</div>
        <div class="story story-en">
          ${(data.story || "").replace(/\n/g,"<br>")}
        </div>

        <hr>

        <div class="section-title">🌍 الترجمة</div>
        <div class="story story-ar">
          ${(data.translation || "⚠️ لا توجد ترجمة")}
        </div>

        ${data.words ? renderWords(data.words) : ""}

      </div>
    `;

  }catch(e){
    document.getElementById("lesson").innerHTML =
      `<div class="loading" style="color:red;">❌ خطأ</div>`;
  }

}

</script>

</body>
</html>
