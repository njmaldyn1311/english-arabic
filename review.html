<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض الدرس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  margin:0;
  text-align:center;
}

.container{
  max-width:750px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:18px;
  margin:15px 0;
  border-radius:15px;
}

/* العنوان */
.title{
  font-size:24px;
  font-weight:bold;
}

/* القاعدة */
.grammar{
  text-align:right;
}

/* الكلمات */
.word{
  border-bottom:1px solid #334155;
  padding:12px;
  text-align:left;
}

.top{
  display:flex;
  justify-content:space-between;
}

.en{
  color:#38bdf8;
  font-weight:bold;
  font-size:18px;
}

.ar{
  color:#f87171;
  margin-left:10px;
}

.example{
  margin-top:8px;
  color:#e2e8f0;
  cursor:pointer;
}

.example-ar{
  color:#facc15;
  font-size:18px;
  font-weight:bold;
}

.icon{
  cursor:pointer;
  margin-left:10px;
}

button {
  background:#22c55e;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<div id="lesson"></div>
<div id="nav"></div>
<div id="grammar"></div>
<div id="words"></div>

</div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "YOUR_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🧠 ناخذ lesson_id من الرابط
const params = new URLSearchParams(window.location.search);
const LESSON_ID = params.get("lesson");

if(!LESSON_ID){
  alert("❌ ضع lesson id في الرابط");
}

// 🔊 صوت
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ⭐ حفظ
async function saveWord(el, word, translation){
  await client.from("book_user_words").insert({
    word,
    translation
  });

  el.innerText="✅";
}

// 🔁 تنقل
function goLesson(id){
  window.location.href = `?lesson=${id}`;
}

async function loadLesson(){

  // 📘 الدرس + الوحدة
  const { data: lesson } = await client
    .from("book_lessons")
    .select(`
      id,
      title,
      lesson_number,
      unit_id,
      book_units (
        unit_number
      )
    `)
    .eq("id", LESSON_ID)
    .single();

  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <div class="title">
        Unit ${lesson.book_units?.unit_number}
        - Lesson ${lesson.lesson_number}
        <br>
        📘 ${lesson.title}
      </div>
    </div>
  `;

  // ⬅️➡️ السابق / التالي
  let { data: prev } = await client
    .from("book_lessons")
    .select("id")
    .eq("unit_id", lesson.unit_id)
    .lt("lesson_number", lesson.lesson_number)
    .order("lesson_number", { ascending: false })
    .limit(1);

  let { data: next } = await client
    .from("book_lessons")
    .select("id")
    .eq("unit_id", lesson.unit_id)
    .gt("lesson_number", lesson.lesson_number)
    .order("lesson_number", { ascending: true })
    .limit(1);

  document.getElementById("nav").innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;">

      ${
        prev.length
        ? `<button onclick="goLesson('${prev[0].id}')">⬅️ السابق</button>`
        : `<div></div>`
      }

      ${
        next.length
        ? `<button onclick="goLesson('${next[0].id}')">التالي ➡️</button>`
        : `<div></div>`
      }

    </div>
  `;

  // 📖 القواعد
  const { data: grammar } = await client
    .from("book_grammar")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let gHTML = "";

  grammar.forEach(g => {
    gHTML += `
      <div class="card grammar">
        <h3>📖 ${g.title}</h3>
        <p>${g.explanation}</p>
        <pre>${g.examples}</pre>
      </div>
    `;
  });

  document.getElementById("grammar").innerHTML = gHTML;

  // 📚 الكلمات
  const { data: words } = await client
    .from("book_words")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let wHTML = "";

  words.forEach(w => {
    wHTML += `
      <div class="card word">

        <div class="top">
          <div>
            <span class="en">${w.word}</span>
            <span class="ar">${w.translation}</span>
          </div>

          <div>
            <span class="icon" onclick="speak('${w.word}')">🔊</span>
            <span class="icon" onclick="saveWord(this,'${w.word}','${w.translation}')">⭐</span>
          </div>
        </div>

        <div class="example" onclick="speak('${w.example || ""}')">
          ${w.example || ""}
        </div>

        <div class="example-ar">
          ${w.example_ar || ""}
        </div>

      </div>
    `;
  });

  document.getElementById("words").innerHTML = wHTML;

}

loadLesson();

</script>

</body>
</html>
