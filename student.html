<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📖 مراجعة الكتاب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

h2{margin-bottom:10px}

.section{
  background:#334155;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  text-align:right;
}

.word{
  display:flex;
  justify-content:space-between;
  background:#0f172a;
  padding:8px;
  border-radius:8px;
  margin-top:6px;
}

.buttons{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

.next{background:#22c55e;color:white;}
.prev{background:#475569;color:white;}

</style>
</head>

<body>

<div class="container">

<h2>📖 مراجعة الكتاب</h2>

<div class="card">

  <h3 id="title">...</h3>

  <div class="section" id="content"></div>

  <div class="section" id="translation"></div>

  <div class="section" id="explanation"></div>

  <h3>📚 الكلمات</h3>
  <div id="words"></div>

  <div class="buttons">
    <button class="prev" onclick="prev()">⬅ السابق</button>
    <button class="next" onclick="next()">التالي ➡</button>
  </div>

</div>

</div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let page = 1;

// تحميل الصفحة
async function loadPage(){

  let { data } = await client
    .from("pages")
    .select("*")
    .eq("page_number", page)
    .single();

  if(!data){
    document.getElementById("title").innerText = "❌ لا توجد صفحة";
    return;
  }

  document.getElementById("title").innerText = "📘 الصفحة " + page;
  document.getElementById("content").innerText = data.content || "";
  document.getElementById("translation").innerText = "🇸🇦 " + (data.translation || "");
  document.getElementById("explanation").innerText = "🧠 " + (data.explanation || "");

  loadWords(data.id);
}

// تحميل الكلمات
async function loadWords(page_id){

  let { data } = await client
    .from("page_words")
    .select("*")
    .eq("page_id", page_id);

  let container = document.getElementById("words");
  container.innerHTML = "";

  data.forEach(w=>{
    let div = document.createElement("div");
    div.className = "word";
    div.innerHTML = `<span>${w.en}</span> <span>${w.ar}</span>`;
    container.appendChild(div);
  });
}

// التالي
function next(){
  page++;
  loadPage();
}

// السابق
function prev(){
  if(page > 1){
    page--;
    loadPage();
  }
}

loadPage();

</script>

</body>
</html>
