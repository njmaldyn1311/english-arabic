<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>AI Video Learning PRO+ | إنجلش بالعربي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;font-family:Arial,sans-serif}
.container{width:min(94%,760px);margin:auto;padding:16px 0 40px}
h2{text-align:center;margin:10px 0 18px}
.field-label{display:block;margin:14px 2px 7px;color:#cbd5e1;font-size:14px;font-weight:bold}
input,textarea{display:block;width:100%;padding:13px;border:1px solid #334155;border-radius:12px;background:#f8fafc;color:#0f172a;font:16px Arial;direction:auto}
textarea{min-height:125px;resize:vertical;line-height:1.7}
button{border:0;border-radius:12px;padding:13px 18px;background:#22c55e;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#analyzeBtn{width:100%;margin-top:12px}
.hint{font-size:12px;color:#94a3b8;line-height:1.8;margin:8px 2px}
.card{background:#1e293b;border:1px solid #334155;margin:16px 0;padding:14px;border-radius:16px;min-width:0}
#videoBox{display:none}
.player-wrap{width:100%;aspect-ratio:16/9;min-height:220px;background:#020617;border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#videoFrame{width:100%;height:100%;min-height:220px;border:0;background:#020617}
.player-wrap.tiktok{aspect-ratio:9/16;max-width:430px;margin:auto;min-height:560px}
.player-wrap.facebook{aspect-ratio:16/9;min-height:260px}
.platform-note{color:#cbd5e1;font-size:13px;line-height:1.8;margin-top:10px}
#loading{display:none;text-align:center;margin:16px 0;color:#facc15}
#status{display:none;padding:12px;border-radius:11px;background:#164e63;color:#cffafe;line-height:1.7;font-size:13px;margin-top:12px}
#status.error{background:#7f1d1d;color:#fee2e2}
.analysis-title{text-align:center;color:#7dd3fc;font-size:20px;margin:8px 0}
.analysis-category h3{color:#fff;text-align:center;direction:ltr;margin:23px 0 12px;font-size:22px}
.word-box{border-bottom:1px solid #334155;padding:15px 0;direction:ltr}
.word-top{display:grid;grid-template-columns:minmax(0,1fr) 108px minmax(0,1fr);gap:6px;align-items:center;width:100%}
.en{grid-column:1;color:#38bdf8;font-weight:bold;text-align:left;direction:ltr;overflow-wrap:anywhere;padding-left:7px;font-size:18px}
.actions{grid-column:2;display:flex;justify-content:center;align-items:center;gap:7px;width:108px}
.ar{grid-column:3;color:#facc15;text-align:right;direction:rtl;overflow-wrap:anywhere;padding-right:7px;font-size:18px}
.icon-btn{width:48px;height:48px;display:grid;place-items:center;padding:0;border-radius:13px;background:#0f172a;font-size:22px}
.empty-cat{color:#94a3b8;text-align:center;font-size:12px;padding:7px 5px 14px;border-bottom:1px solid #334155}
.empty-result{text-align:center;color:#cbd5e1;line-height:1.8;padding:15px}
@media(max-width:520px){.container{width:94%;padding-top:12px}.player-wrap{min-height:190px}.player-wrap.tiktok{max-width:100%;min-height:530px}.word-top{grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);gap:3px}.actions{width:96px;gap:4px}.icon-btn{width:44px;height:44px;font-size:20px}.en,.ar{font-size:16px}.card{padding:11px}}
</style>
</head>
<body>
<div class="container">
  <h2>🎥 تعلم من الفيديو بذكاء</h2>
  <label class="field-label" for="url">رابط الفيديو (YouTube أو TikTok أو Facebook)</label>
  <input id="url" type="url" placeholder="ألصق رابط الفيديو هنا" autocomplete="url">
  <label class="field-label" for="transcript">نص الفيديو للتحليل (اختياري)</label>
  <textarea id="transcript" placeholder="ألصق هنا نص التفريغ أو الكلام المنسوخ من الفيديو حتى يحلله النظام إلى أفعال وأسماء وصفات وأفعال مركبة وتعبيرات اصطلاحية وظروف..."></textarea>
  <div class="hint">يمكن تشغيل رابط الفيديو مباشرة. لتحليل الكلمات تلقائياً من هذا الرابط، يجب توفير نص التفريغ هنا، أو رفع ملف الفيديو/الصوت الأصلي إلى مسار تحليل الملفات. الرابط وحده لا يتيح دائماً الوصول إلى الصوت.</div>
  <button id="analyzeBtn" onclick="sendUrl()">🔗 تشغيل الفيديو وتحليل النص</button>
  <div id="loading">⏳ جارٍ تجهيز الفيديو وتحليل النص...</div>
  <div id="status"></div>
  <div id="videoBox" class="card">
    <div id="playerWrap" class="player-wrap"><iframe id="videoFrame" title="Video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div id="platformNote" class="platform-note"></div>
  </div>
  <div id="result"></div>
</div>
<script>
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WEBHOOK="https://steelblue-frog-379077.hostingersite.com/webhook/video-ai-multiplatform";
let user_id=localStorage.getItem("user_id");
if(!user_id){user_id=crypto.randomUUID();localStorage.setItem("user_id",user_id)}
async function track(action){try{await fetch(SUPABASE_URL+"/rest/v1/user_activity",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({user_id,page:"video_page",action})})}catch(e){console.debug("Tracking skipped",e)}}
track("دخول صفحة تحليل الفيديو");
function setStatus(message,error=false){const el=document.getElementById("status");el.textContent=message;el.className=error?"error":"";el.style.display="block"}
function setPlayer(data){
 const frame=document.getElementById("videoFrame");
 const wrap=document.getElementById("playerWrap");
 frame.src=data.embed_url;
 wrap.className="player-wrap"+(data.platform==="tiktok"?" tiktok":data.platform==="facebook"?" facebook":"");
 document.getElementById("videoBox").style.display="block";
 const names={youtube:"YouTube",tiktok:"TikTok",facebook:"Facebook"};
 document.getElementById("platformNote").textContent="المصدر: "+(names[data.platform]||data.platform)+". قد لا تعمل الفيديوهات الخاصة أو المحذوفة أو المقيدة جغرافياً داخل التضمين.";
}
function speak(text){if(!text||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}
async function saveWord(btn,en,ar){const old=btn.textContent;btn.disabled=true;btn.textContent="…";try{const {error}=await client.from("user_star_words").insert({user_id,word:en,translation:ar});if(error)throw error;btn.textContent="✅";track("حفظ كلمة: "+en)}catch(e){console.error(e);btn.textContent=old;setStatus("تعذر حفظ الكلمة. تحقق من صلاحيات جدول user_star_words.",true)}finally{btn.disabled=false}}
const labels={verbs:"verbs",nouns:"nouns",adjectives:"adjectives",phrasal_verbs:"phrasal verbs",idioms:"idioms",adverbs:"adverbs"};
function show(data){
 const root=document.getElementById("result");root.replaceChildren();
 if(!data.analysis_ready){const p=document.createElement("div");p.className="card empty-result";p.textContent=data.message||"تم تشغيل الفيديو. أضف نص التفريغ لتحليل الكلمات.";root.appendChild(p);return}
 let total=0;
 for(const key of Object.keys(labels)){
  const arr=Array.isArray(data[key])?data[key]:[];
  const section=document.createElement("section");section.className="card analysis-category";
  const heading=document.createElement("h3");heading.textContent=labels[key];section.appendChild(heading);
  if(!arr.length){const e=document.createElement("div");e.className="empty-cat";e.textContent="لا توجد عناصر في هذا القسم ضمن النص المرسل.";section.appendChild(e)}
  for(const item of arr){
   const en=String(item.en||"").trim();const ar=String(item.ar||"").trim();if(!en)continue;
   const row=document.createElement("div");row.className="word-box";
   const top=document.createElement("div");top.className="word-top";
   const enEl=document.createElement("span");enEl.className="en";enEl.textContent=en;
   const arEl=document.createElement("span");arEl.className="ar";arEl.textContent=ar;
   const actions=document.createElement("div");actions.className="actions";
   const save=document.createElement("button");save.className="icon-btn";save.type="button";save.textContent="⭐";save.title="حفظ الكلمة";save.onclick=()=>saveWord(save,en,ar);
   const sound=document.createElement("button");sound.className="icon-btn";sound.type="button";sound.textContent="📢";sound.title="نطق الكلمة";sound.onclick=()=>speak(en);
   actions.append(save,sound);top.append(enEl,actions,arEl);row.appendChild(top);section.appendChild(row);total++;
  }
  root.appendChild(section);
 }
 const footer=document.createElement("div");footer.className="hint";footer.style.textAlign="center";footer.textContent="إجمالي المفردات المستخرجة: "+total;root.appendChild(footer);
}
async function sendUrl(){
 const url=document.getElementById("url").value.trim();const transcript=document.getElementById("transcript").value.trim();
 if(!url){alert("أدخل رابط الفيديو أولاً");return}
 const btn=document.getElementById("analyzeBtn");btn.disabled=true;document.getElementById("loading").style.display="block";document.getElementById("result").replaceChildren();document.getElementById("status").style.display="none";
 try{
  const response=await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,transcript,user_id})});
  const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw new Error("استجابة غير مفهومة من n8n: "+raw.slice(0,300))}
  if(!response.ok||data.success===false)throw new Error(data.message||"تعذر معالجة الرابط");
  if(!data.embed_url)throw new Error("لم يصل رابط تشغيل الفيديو من n8n");
  setPlayer(data);show(data);
  if(data.analysis_ready)setStatus(data.message||"اكتمل تحليل النص.");else setStatus(data.message||"تم تجهيز الفيديو. أضف نص التفريغ لإكمال التحليل.");
  track("تشغيل وتحليل "+data.platform);
 }catch(e){console.error(e);setStatus(e.message||"حدث خطأ أثناء التحليل",true)}
 finally{btn.disabled=false;document.getElementById("loading").style.display="none"}
}
</script>
<script src="auth.js"></script>
</body>
</html>
