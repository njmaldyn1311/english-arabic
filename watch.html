<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
:root{--bg:#0f172a;--card:#1e293b;--main:#22c55e}
body{margin:0;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;font-family:Arial;text-align:center}
.container{max-width:1000px;margin:auto;padding:15px}
#player{width:100%;height:220px;border-radius:15px}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
button{background:linear-gradient(135deg,#22c55e,#16a34a);border:none;padding:10px 14px;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer}
.sub-en{color:#38bdf8;font-weight:bold;margin-top:18px}
.sub-ar{color:#facc15;font-size:18px;font-weight:bold;margin-bottom:22px}
.card{background:#1e293b;margin-top:15px;padding:15px;border-radius:15px}
.word-box{display:flex;justify-content:space-between;align-items:center;padding:12px;margin-bottom:8px;background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:12px}
.icon{cursor:pointer;background:#0f172a;padding:8px;border-radius:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s}
.toast.show{opacity:1}
.badge{font-size:12px;background:#020617;padding:6px 10px;border-radius:10px;margin-right:6px}
@media(min-width:768px){#player{height:380px}}
</style>
</head>

<body>
<div class="container">

<h2>🎥 فصل مباشر 
  <span id="roleBadge" class="badge"></span>
  <span id="micBadge" class="badge">🎙 ميكروفون: متوقف</span>
</h2>

<div id="player"></div>

<div class="controls">
  <button onclick="prev()">⏮ السابق</button>
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔄 إعادة</button>
  <button onclick="next()">⏭ التالي</button>
  <button id="micBtn" onclick="toggleMic()">🎙 تشغيل المايك</button>
</div>

<div id="subEn" class="sub-en"></div>
<div id="subAr" class="sub-ar"></div>

<div id="result"></div>

</div>

<div id="toast" class="toast"></div>

<script>
/* ================== إعدادات ================== */
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================== حالة ================== */
let player;
let channel;
let room = "room_main";
let isTeacher = new URLSearchParams(location.search).get("role")==="teacher";
let subtitles=[];
let offset=0;
let micOn=false;

/* WebRTC */
let localStream;
let peers = {}; // peerId -> RTCPeerConnection

/* ================== YouTube ================== */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:new URLSearchParams(location.search).get("list")
    },
    events:{
      onReady:init,
      onStateChange:onStateChange
    }
  });
}

function play(){ if(player) player.playVideo(); sendSync(); }
function pause(){ if(player) player.pauseVideo(); sendSync(); }
function restart(){ if(player) player.seekTo(0,true); sendSync(); }
function next(){ if(player){ player.nextVideo(); setTimeout(loadAI,1500); } sendSync(); }
function prev(){ if(player){ player.previousVideo(); setTimeout(loadAI,1500); } sendSync(); }

/* ================== Toast ================== */
function toast(msg){
  const t=document.getElementById("toast");
  t.innerText=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

/* ================== AI ================== */
async function loadAI(){
  if(!player) return;
  let vid = player.getVideoData().video_id;
  if(!vid) return;

  let res=await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url:"https://www.youtube.com/watch?v="+vid})
  });

  let data=await res.json();

  subtitles=[]; offset=0;
  let html="";

  for(let cat in data){
    html+=`<div class="card"><h3>${cat}</h3>`;
    data[cat].forEach(w=>{
      if(!w.example || w.example.length<5) return;

      subtitles.push({
        time:w.time||0,
        en:w.example,
        ar:w.example_ar||""
      });

      html+=`
      <div class="word-box">
        <div>
          <div class="sub-en">${w.en}</div>
          <div class="sub-ar">${w.ar}</div>
        </div>
        <div style="display:flex;gap:8px">
          <div class="icon" onclick="speak('${(w.en||'').replace(/'/g,"\\'")}')">🔊</div>
          <div class="icon" onclick="save(this,'${(w.en||'').replace(/'/g,"\\'")}','${(w.ar||'').replace(/'/g,"\\'")}')">⭐</div>
        </div>
      </div>`;
    });
    html+="</div>";
  }

  result.innerHTML=html;

  // 🔥 offset ذكي (أول جملة حقيقية)
  let first=subtitles.find(s=>s.en && s.en.length>8);
  if(first){
    offset = player.getCurrentTime() - first.time;
  }
}

/* ترجمة متزامنة + تجاهل الإعلانات */
setInterval(()=>{
  if(!player || !player.getCurrentTime) return;

  let state;
  try{ state=player.getPlayerState(); }catch{ return; }

  // 1 = تشغيل
  if(state !== 1) return;

  // تجاهل إعلان (غالباً مدة قصيرة أو بيانات ناقصة)
  try{
    if(player.getDuration() < 30) return;
  }catch{}

  let t = player.getCurrentTime() - offset;
  let c = subtitles.find(s=>t>=s.time && t<s.time+4);

  if(c){
    subEn.innerHTML=c.en;
    subAr.innerText=c.ar;
  }
},500);

/* ================== حفظ + صوت ================== */
function speak(t){
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; speechSynthesis.speak(u);
}

async function save(el,word,ar){
  await supa.from("user_star_words").insert({
    user_id: localStorage.getItem("user_id") || "user_"+Math.random().toString(36).slice(2),
    word, translation: ar
  });
  el.innerText="✅";
  toast("تم الحفظ");
}

/* ================== مزامنة المعلم ================== */
function onStateChange(){
  if(!isTeacher) return;
  sendSync();
}

function sendSync(){
  if(!isTeacher || !channel || !player) return;

  let payload = {};
  try{
    payload = {
      video: player.getVideoData().video_id,
      time: player.getCurrentTime(),
      state: player.getPlayerState()
    };
  }catch{ return; }

  channel.send({type:'broadcast', event:'sync', payload});
}

function applySync({video,time,state}){
  if(isTeacher || !player) return;

  try{
    if(player.getVideoData().video_id !== video){
      player.loadVideoById(video);
      setTimeout(loadAI,1200);
    }

    if(Math.abs(player.getCurrentTime()-time) > 1){
      player.seekTo(time,true);
    }

    if(state === 1) player.playVideo();
    else player.pauseVideo();
  }catch{}
}

/* ================== WebRTC صوت ================== */
async function toggleMic(){
  if(!micOn){
    // تشغيل
    localStream = await navigator.mediaDevices.getUserMedia({audio:true});
    micOn = true;
    document.getElementById("micBtn").innerText="🎙 إيقاف المايك";
    document.getElementById("micBadge").innerText="🎙 ميكروفون: يعمل";

    // إضافة الصوت لكل Peer موجود
    for(const id in peers){
      localStream.getTracks().forEach(t=>{
        peers[id].addTrack(t, localStream);
      });
    }

    // إعلان وجود stream
    channel.send({type:'broadcast', event:'webrtc-ready', payload:{}});
  }else{
    // إيقاف
    micOn = false;
    document.getElementById("micBtn").innerText="🎙 تشغيل المايك";
    document.getElementById("micBadge").innerText="🎙 ميكروفون: متوقف";

    if(localStream){
      localStream.getTracks().forEach(t=>t.stop());
      localStream = null;
    }
  }
}

/* إنشاء اتصال Peer */
function createPeer(id, initiator){
  const pc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });

  pc.onicecandidate = e=>{
    if(e.candidate){
      channel.send({
        type:'broadcast',
        event:'ice',
        payload:{to:id, candidate:e.candidate}
      });
    }
  };

  pc.ontrack = e=>{
    const audio = new Audio();
    audio.srcObject = e.streams[0];
    audio.play();
  };

  peers[id]=pc;

  if(localStream){
    localStream.getTracks().forEach(t=>{
      pc.addTrack(t, localStream);
    });
  }

  if(initiator){
    pc.createOffer().then(o=>{
      pc.setLocalDescription(o);
      channel.send({
        type:'broadcast',
        event:'offer',
        payload:{to:id, offer:o}
      });
    });
  }
}

/* ================== Realtime ================== */
function setupChannel(){
  channel = supa.channel(room, {config:{presence:{key:Math.random().toString(36)}}});

  channel
    .on('presence',{event:'sync'},()=>{
      const state = channel.presenceState();
      const ids = Object.keys(state);

      // أنشئ peers مع الآخرين
      ids.forEach(id=>{
        if(!peers[id]){
          createPeer(id, isTeacher); // المعلم initiator
        }
      });
    })
    .on('broadcast',{event:'sync'}, msg=>applySync(msg.payload))

    // WebRTC signaling
    .on('broadcast',{event:'webrtc-ready'}, ()=>{
      // المعلم يبدأ الاتصال
      if(isTeacher){
        const state = channel.presenceState();
        Object.keys(state).forEach(id=>{
          if(!peers[id]) createPeer(id,true);
        });
      }
    })
    .on('broadcast',{event:'offer'}, async (msg)=>{
      const {to,offer} = msg.payload;
      if(to === channel._config.presence.key){
        const id = msg.user_id || "peer";
        if(!peers[id]) createPeer(id,false);
        await peers[id].setRemoteDescription(offer);
        const ans = await peers[id].createAnswer();
        await peers[id].setLocalDescription(ans);
        channel.send({type:'broadcast',event:'answer',payload:{to:id,answer:ans}});
      }
    })
    .on('broadcast',{event:'answer'}, async (msg)=>{
      const {to,answer} = msg.payload;
      if(peers[to]){
        await peers[to].setRemoteDescription(answer);
      }
    })
    .on('broadcast',{event:'ice'}, async (msg)=>{
      const {to,candidate} = msg.payload;
      if(peers[to]){
        try{ await peers[to].addIceCandidate(candidate); }catch{}
      }
    })
    .subscribe();
}

/* ================== init ================== */
function init(){
  document.getElementById("roleBadge").innerText = isTeacher ? "👨‍🏫 معلم" : "🎓 طالب";

  setupChannel();

  // أول تحليل
  setTimeout(loadAI,1500);

  // إرسال sync دوري للمعلم
  if(isTeacher){
    setInterval(sendSync,1500);
  }
}
</script>
</body>
</html>
