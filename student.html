<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 رفع كتاب</title>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  text-align:center;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  margin-top:10px;
  font-size:16px;
  cursor:pointer;
}

.progress{
  height:10px;
  background:#334155;
  border-radius:10px;
  margin-top:15px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  background:#22c55e;
  transition:0.3s;
}

.status{
  margin-top:10px;
  font-size:14px;
  color:#cbd5f5;
}

</style>
</head>

<body>

<div class="card">

<h2>📚 رفع كتاب PDF</h2>

<input type="file" id="file" accept="application/pdf">

<button onclick="upload()">🚀 ابدأ التحليل</button>

<div class="progress">
  <div id="bar" class="bar"></div>
</div>

<div id="status" class="status"></div>

</div>

<script>

// 🔗 حط رابط webhook هنا
const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf";

async function upload(){

  const file = document.getElementById("file").files[0];

  if(!file){
    alert("اختر ملف PDF");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  updateStatus("⏳ جاري الرفع...");
  updateBar(20);

  try{

    const res = await fetch(WEBHOOK,{
      method:"POST",
      body: formData
    });

    updateBar(70);

    const data = await res.json();

    updateBar(100);
    updateStatus("✅ تم تحليل الكتاب بنجاح");

  }catch(e){
    updateStatus("❌ خطأ في الاتصال");
  }
}

function updateBar(value){
  document.getElementById("bar").style.width = value + "%";
}

function updateStatus(text){
  document.getElementById("status").innerText = text;
}

</script>

</body>
</html>
