<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning</title>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

/* توسيط */
.input-box {
  display: flex;
  justify-content: center;
}

input {
  padding: 10px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;
  text-align: center;
}

button {
  background: #22c55e;
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

#videoBox {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #0f172a;
}

iframe {
  width: 100%;
  height: 250px;
  border-radius: 15px;
}

.line {
  text-align: left;
  margin: 10px 0;
  line-height: 1.8;
}

.en { color: #38bdf8; font-weight: bold; cursor: pointer; }
.ar { color: #f87171; margin-left: 10px; }
.example { color: #e2e8f0; display: block; cursor: pointer; }
.example-ar { color: #94a3b8; font-size: 13px; }

.star {
  cursor: pointer;
  margin-left: 10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<div class="input-box">
  <input type="text" id="url" placeholder="ضع رابط YouTube">
</div>

<button onclick="sendUrl()">🔗 تحليل</button>

<p id="loading" style="display:none;">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <iframe id="videoFrame"></iframe>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

/* 🔥 Supabase */
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

let user_id = localStorage.getItem("user_id");

let videoId = "";

function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

function showVideo(url) {
  videoId = getVideoId(url);
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}`;
  document.getElementById("videoBox").style.display = "block";
}

function goToTime(sec) {
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}?start=${sec}&autoplay=1`;
}

/* ⭐ حفظ الكلمة */
async function saveWord(el, word, translation){

  const check = await fetch(
    `${SUPABASE_URL}/rest/v1/user_words?user_id=eq.${user_id}&word=eq.${encodeURIComponent(word)}`,
    {
      headers:{
        "apikey": SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      }
    }
  );

  const existing = await check.json();

  if(existing.length > 0){
    el.innerText = "✅";
    el.style.background = "#22c55e";
    return;
  }

  await fetch(SUPABASE_URL + "/rest/v1/user_words", {
    method:"POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id,
      word,
      translation
    })
  });

  el.innerText = "✅";
  el.style.background = "#22c55e";
}

/* عرض */
function show(data) {

  let html = "";

  for (let cat in data) {
    if (!data[cat] || data[cat].length === 0) continue;

    html += `<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w => {

      const word = w.en || w.word || "";
      const arabic = w.ar || w.arabic || "";

      html += `
        <div class="line">
          <span class="en" onclick="speak('${word}')">${word}</span>
          <span class="ar">${arabic}</span>
          <span class="star" onclick="saveWord(this,'${word}','${arabic}')">⭐</span>

          <span class="example" onclick="goToTime(${w.time || 0})">
            ${w.example || ""}
          </span>

          <span class="example-ar">
            ${w.example_ar || ""}
          </span>
        </div>
      `;
    });

    html += `</div>`;
  }

  document.getElementById("result").innerHTML = html;
}

/* 🚀 إرسال */
async function sendUrl() {
  const url = document.getElementById("url").value;
  if (!url) return alert("اكتب رابط");

  // 🔥 إخفاء النتائج القديمة
  document.getElementById("result").innerHTML = "";

  localStorage.setItem("last_video_url", url);

  startLoading();
  showVideo(url);

  const res = await fetch(WEBHOOK, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ url })
  });

  const data = await res.json();

  localStorage.setItem("last_video_data", JSON.stringify(data));

  stopLoading();
  show(data);
}

/* صوت */
function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  msg.rate = 0.85;
  speechSynthesis.speak(msg);
}

function startLoading() {
  document.getElementById("loading").style.display = "block";
}

function stopLoading() {
  document.getElementById("loading").style.display = "none";
}

/* 🔥 استرجاع */
window.onload = function(){

  const savedData = localStorage.getItem("last_video_data");
  const savedUrl = localStorage.getItem("last_video_url");

  if(savedData && savedUrl){
    const data = JSON.parse(savedData);
    document.getElementById("url").value = savedUrl;
    showVideo(savedUrl);
    show(data);
  }
};

</script>

</body>
</html>
