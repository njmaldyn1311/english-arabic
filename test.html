<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔥 الهيدر الجديد */
.header{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* 👤 الاسم */
.user-name{
  color:#38bdf8;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:5px;
}

/* 🏠 زر */
.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 14px;
  border-radius:12px;
  color:#38bdf8;
  cursor:pointer;
}

/* 📦 */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:420px;
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  text-align:center;
}

.title{font-size:22px;margin-bottom:10px;}

.question{
  font-size:18px;
  margin:15px 0;
}

.speaker{
  font-size:26px;
  cursor:pointer;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  text-align:center;
  margin-top:10px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
}

.option{
  width:100%;
  background:#334155;
  margin:6px 0;
  color:white;
}

.check{background:#22c55e;}

/* 🔥 alert أقوى */
.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:18px 30px;
  border-radius:15px;
  display:none;
  font-size:20px;
  font-weight:bold;
}

.success{background:#22c55e;}
.error{background:#ef4444;}

</style>
</head>

<body>

<!-- 🔥 الهيدر -->
<div class="header">

  <div class="user-name" id="username">👤</div>

  <button class="home" onclick="goHome()">🏠 الرئيسية</button>

</div>

<div class="container">

  <div class="card">

    <div class="title">🧠 اختبار ذكي</div>

    <div id="question" class="question">...</div>

    <div id="speaker" class="speaker" onclick="play()">🔊</div>

    <div id="answers"></div>

    <input id="input" placeholder="اكتب الإجابة">

    <button id="mainBtn" class="check" onclick="check()">تحقق</button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

/* 👤 الاسم */
let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");
document.getElementById("username").innerText =
  "👤 " + parts[0] + (parts[1] ? " " + parts[1] : "");

let words = [];
let current = 0;
let type = "";
let currentWord = null;

let correctCount = 0;
let total = 0;

// تحميل
async function load(){

  let { data } = await client
    .from("user_words")
    .select("*")
    .eq("user_id", user_id);

  words = data || [];

  if(words.length === 0){
    document.getElementById("question").innerText = "⚠️ ما عندك كلمات";
    return;
  }

  next();
}

// السؤال
function next(){

  if(current >= words.length){
    finish();
    return;
  }

  currentWord = words[current];

  let en = currentWord.word;
  let ar = currentWord.translation;

  let types = ["mcq","write","listen"];
  type = types[Math.floor(Math.random()*types.length)];

  document.getElementById("answers").innerHTML = "";
  document.getElementById("input").value = "";

  total++;

  // 🔥 اختيار بدون تكرار
  if(type === "mcq"){

    hideAll();
    document.getElementById("question").innerText = "ما معنى: " + en;

    let unique = [...new Map(words.map(item => [item.translation, item])).values()];

    let options = unique.sort(()=>0.5-Math.random()).slice(0,3);

    if(!options.find(o => o.translation === ar)){
      options[0] = currentWord;
    }

    options = options.sort(()=>0.5-Math.random());

    options.forEach(o=>{
      let btn = document.createElement("button");
      btn.className="option";
      btn.innerText = o.translation;

      btn.onclick=()=>{
        checkChoice(btn.innerText, ar);
      };

      document.getElementById("answers").appendChild(btn);
    });
  }

  if(type === "write"){
    showInput();
    document.getElementById("question").innerText = "اكتب المعنى بالعربي: " + en;
  }

  if(type === "listen"){
    showInput();
    document.getElementById("question").innerText = "🎧 استمع واكتب المعنى";
    speak(en);
  }
}

function hideAll(){
  document.getElementById("speaker").style.display="none";
  document.getElementById("input").style.display="none";
}

function showInput(){
  document.getElementById("speaker").style.display="block";
  document.getElementById("input").style.display="block";
}

// صوت
function speak(text){
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=0.9;
  speechSynthesis.speak(u);
}

function play(){
  speak(currentWord.word);
}

// اختيار
function checkChoice(selected, correct){
  let ok = selected === correct;
  if(ok) correctCount++;

  toast(ok ? "✅ صحيح" : "❌ خطأ\n" + correct, ok);

  nextStep();
}

// كتابة
function check(){

  if(type === "mcq") return;

  let val = document.getElementById("input").value.trim().toLowerCase();
  let correct = currentWord.translation.toLowerCase();

  let ok = val === correct;

  if(ok) correctCount++;

  toast(ok ? "✅ صحيح" : "❌ خطأ\n" + correct, ok);

  nextStep();
}

// التالي
function nextStep(){
  current++;
  setTimeout(next,800);
}

// النهاية
async function finish(){

  let percent = Math.round((correctCount / total) * 100);

  document.getElementById("question").innerHTML =
    `🎉 انتهى الاختبار<br><br>نتيجتك: ${percent}%`;

  document.getElementById("input").style.display="none";
  document.getElementById("answers").innerHTML="";

  await client.from("results").insert({
    user_id: user_id,
    score: percent
  });

  let btn = document.getElementById("mainBtn");
  btn.innerText = "🔄 إعادة الاختبار";
  btn.onclick = restart;
}

// إعادة
function restart(){
  current = 0;
  correctCount = 0;
  total = 0;

  document.getElementById("mainBtn").innerText = "تحقق";
  document.getElementById("mainBtn").onclick = check;

  document.getElementById("input").style.display="block";

  next();
}

// toast
function toast(msg, ok){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast " + (ok?"success":"error");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1200);
}

// رجوع
function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
