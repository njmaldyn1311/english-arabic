<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.card{
  background:#e5e7eb;
  color:black;
  border-radius:20px;
  padding:20px;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* 🔥 Alert */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.alert{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:300px;
  text-align:center;
}

.alert h3{
  margin-bottom:10px;
}

.alert button{
  width:100%;
  margin-top:10px;
}

.whatsapp{
  background:#25D366;
}

/* 📖 viewer */
.viewer{
  width:100%;
  height:70vh;
  border:none;
  border-radius:15px;
  display:none;
}
</style>

</head>

<body>

<div class="container">

  <h2>📘 كتابي</h2>

  <!-- الكارد -->
  <div class="card">

    <h3>newHEADWAYbeginnerstudentbook.pdf</h3>

    <button onclick="openBook()">فتح</button>

    <!-- PDF -->
    <iframe id="pdf" class="viewer"></iframe>

  </div>

</div>

<!-- 🔥 Alert -->
<div class="overlay" id="alertBox">
  <div class="alert">
    <h3>🔒 الكتاب للمشتركين فقط</h3>
    <p>اشترك للوصول الكامل</p>

    <button onclick="buy()">📲 شراء عبر واتساب</button>
    <button onclick="closeAlert()">إغلاق</button>
  </div>
</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let userId = localStorage.getItem("user_id");
let isPaid = false;

// 🔥 فتح الكتاب
async function openBook(){

  await checkUser();

  if(!isPaid){
    document.getElementById("alertBox").style.display="flex";
    return;
  }

  // ✅ فتح داخل الصفحة
  document.getElementById("pdf").style.display="block";
  document.getElementById("pdf").src = PDF_URL;

}

// 🔒 تحقق من الاشتراك
async function checkUser(){

  if(!userId) return;

  const { data } = await client
    .from("users")
    .select("plan")
    .eq("id",userId)
    .single();

  isPaid = data?.plan === "paid";
}

// ❌ اغلاق alert
function closeAlert(){
  document.getElementById("alertBox").style.display="none";
}

// 💰 شراء واتساب
function buy(){

  let phone = "966509079576"; // 🔥 حط رقمك
  let msg = "السلام عليكم، أبغى اشتراك في الكتاب";

  let url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;

  window.open(url, "_blank");
}

</script>

</body>
</html>
