<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اختبار Supabase</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:"Cairo", sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

.word{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #334155;
  padding:10px;
}

.en{color:#38bdf8;}
.ar{color:#facc15;}

</style>

</head>

<body>

<h2>🔌 اختبار الاتصال مع Supabase</h2>

<div id="status">⏳ جاري الاتصال...</div>

<div id="result" class="card"></div>

<script>

/* ✅ بيانات Supabase */
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";

const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"; // 👈 حط مفتاحك هنا

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* 🚀 تحميل البيانات */
async function load(){

  try{

    const { data, error } = await supabaseClient
      .from("words")
      .select("*")
      .limit(20);

    console.log("DATA:", data);
    console.log("ERROR:", error);

    if(error){
      document.getElementById("status").innerHTML =
        "❌ خطأ: " + error.message;
      return;
    }

    document.getElementById("status").innerHTML =
      "✅ تم الاتصال بنجاح";

    if(!data || data.length === 0){
      document.getElementById("result").innerHTML =
        "⚠️ لا توجد بيانات";
      return;
    }

    let html = "";

    data.forEach(w=>{
      html += `
        <div class="word">
          <div class="ar">${w.ar || "-"}</div>
          <div class="en">${w.en || "-"}</div>
        </div>
      `;
    });

    document.getElementById("result").innerHTML = html;

  }catch(e){
    document.getElementById("status").innerHTML =
      "❌ خطأ قوي: " + e.message;
  }

}

/* 🔥 تشغيل */
load();

</script>

</body>
</html>
