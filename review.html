<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>
body {
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h2{
  text-align:center;
}

.search{
  width:100%;
  padding:10px;
  margin-bottom:20px;
  border-radius:10px;
  border:none;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

.badge{
  padding:5px 10px;
  border-radius:8px;
}

.free{ background:#334155; }
.paid{ background:#22c55e; }
.banned{ background:#ef4444; }

button{
  margin:5px;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.ban{ background:#ef4444; color:white; }
.unban{ background:#22c55e; color:white; }
.plan{ background:#38bdf8; color:white; }

.small{
  font-size:13px;
  color:#94a3b8;
}
</style></head><body><div class="container"><h2>📊 لوحة التحكم</h2><input id="search" class="search" placeholder="🔍 ابحث عن مستخدم..."><div id="users"></div></div><script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allUsers = [];

// 📥 تحميل المستخدمين
async function loadUsers(){

  const { data } = await client
    .from("users")
    .select("*")
    .order("created_at", { ascending:false });

  allUsers = data;
  renderUsers(data);
}

// 🎨 عرض المستخدمين
function renderUsers(list){

  let html = "";

  list.forEach(u => {

    html += `
      <div class="card">

        <div class="row">
          <div>
            <strong>${u.name || "بدون اسم"}</strong>
            <div class="small">${u.email}</div>
          </div>

          <div>
            <span class="badge ${u.plan === 'paid' ? 'paid':'free'}">
              ${u.plan || "free"}
            </span>

            ${
              u.status === 'banned'
              ? '<span class="badge banned">محظور</span>'
              : ''
            }
          </div>
        </div>

        <div class="small">
          ⏱️ وقت الاستخدام: ${u.total_time || 0} ثانية
        </div>

        <div class="small">
          📅 آخر نشاط: ${u.last_active || "-"}
        </div>

        <div>
          ${
            u.status === 'banned'
            ? `<button class="unban" onclick="unban('${u.id}')">فك الحظر</button>`
            : `<button class="ban" onclick="ban('${u.id}')">حظر</button>`
          }

          <button class="plan" onclick="togglePlan('${u.id}','${u.plan}')">
            تغيير الاشتراك
          </button>
        </div>

      </div>
    `;
  });

  document.getElementById("users").innerHTML = html;
}

// 🔍 البحث
document.getElementById("search").addEventListener("input", e => {

  const val = e.target.value.toLowerCase();

  const filtered = allUsers.filter(u =>
    (u.name || "").toLowerCase().includes(val) ||
    (u.email || "").toLowerCase().includes(val)
  );

  renderUsers(filtered);
});

// 🚫 حظر
async function ban(id){
  await client
    .from("users")
    .update({ status:"banned" })
    .eq("id", id);

  loadUsers();
}

// ✅ فك الحظر
async function unban(id){
  await client
    .from("users")
    .update({ status:"active" })
    .eq("id", id);

  loadUsers();
}

// 💰 تغيير الاشتراك
async function togglePlan(id, current){

  const newPlan = current === "paid" ? "free" : "paid";

  await client
    .from("users")
    .update({ plan:newPlan })
    .eq("id", id);

  loadUsers();
}

// 🚀 تشغيل
loadUsers();

</script></body>
</html>
