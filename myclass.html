<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>الفصل الذكي</title>
<style>
body{margin:0;font-family:"Cairo",sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:white}
.top{display:flex;justify-content:space-between;padding:15px;gap:8px;flex-wrap:wrap}
.user{color:#38bdf8}.points{color:#FFD700}.review{background:#6366f1;padding:10px;border-radius:12px;cursor:pointer}
.title{text-align:center}.subtitle{text-align:center;color:#94a3b8}
.card{background:#1e293b;margin:20px;padding:20px;border-radius:20px}
.select{background:#e5e7eb;color:black;padding:15px;border-radius:15px;display:flex;justify-content:space-between;cursor:pointer}
.options{display:none;background:white;border-radius:15px;margin-top:10px}.option{padding:15px;border-bottom:1px solid #ddd;color:black}
.input{width:100%;padding:15px;border:none;border-radius:15px;margin-top:10px;box-sizing:border-box;font-size:16px}
input,textarea{font-size:16px!important}
.btn{width:100%;padding:15px;border:none;border-radius:15px;background:#22c55e;color:white;margin-top:10px;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}.loading{text-align:center;margin-top:20px;color:#facc15}
.story{line-height:2;font-size:17px;margin-bottom:15px;white-space:normal}.story-en{direction:ltr;text-align:justify}.story-ar{direction:rtl;text-align:justify}
.section-title{margin-top:20px;font-weight:bold;font-size:20px}
.word{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #334155}
.en{color:#38bdf8;direction:ltr;text-align:left}.ar{color:#facc15;direction:rtl;text-align:right}
.actions{display:flex;gap:15px;flex-shrink:0}.icon{cursor:pointer;background:#0f172a;padding:10px;border-radius:10px;font-size:18px}
.meta-note{color:#a7f3d0;font-size:13px;line-height:1.7}.error{color:#fecaca;background:#7f1d1d;padding:12px;border-radius:12px;line-height:1.8}
</style>
</head>
<body>
<div class="top"><div class="user" id="username">👤</div><div class="points">⭐ كلماتك: 0</div><div class="review" onclick="goProfile()">👤 حسابي</div></div>
<h2 class="title">📚 الفصل الذكي</h2><p class="subtitle">📘 درس مناسب لمستواك</p>
<div class="card">
  <div class="select"><span id="typeText">📝 نص</span></div>
  <input id="textInput" class="input" placeholder="اكتب موضوع الدرس هنا...">
  <button id="generateBtn" class="btn" onclick="generateLesson()">🚀 إنشاء الدرس</button>
</div>
<div id="lesson"></div>
<script>
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://steelblue-frog-379077.hostingersite.com/webhook/lesson";
let user_id=localStorage.getItem("user_id");
if(!user_id){user_id=crypto.randomUUID?crypto.randomUUID():"user_"+Math.random().toString(36).slice(2);localStorage.setItem("user_id",user_id)}
const phone=localStorage.getItem("phone")||"";
const storedLevel=localStorage.getItem("student_level")||localStorage.getItem("english_level")||localStorage.getItem("level")||"";
const fullName=localStorage.getItem("user")||"";
document.getElementById("username").textContent="👤 "+fullName.split(" ").slice(0,2).join(" ");
async function track(action){try{await fetch(SUPABASE_URL+"/rest/v1/user_activity",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({user_id,page:"class_page",action})})}catch(e){console.debug("tracking skipped",e)}}
track("دخول الفصل");
function goProfile(){location.href="student.html"}
function speak(text){if(!text||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";speechSynthesis.speak(u)}
async function saveWord(el,en,ar,category){el.textContent="…";el.style.pointerEvents="none";try{const res=await fetch(SUPABASE_URL+"/rest/v1/user_star_words",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({user_id,word:en,translation:ar,category})});if(!res.ok)throw new Error(await res.text());el.textContent="✅";track("حفظ كلمة: "+en)}catch(e){console.error(e);el.textContent="⭐";el.style.pointerEvents="auto";alert("تعذر حفظ المفردة. تحقق من صلاحيات جدول user_star_words وعمود category.")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderWords(words){let html="";const keys=["verbs","nouns","adjectives","phrasal_verbs","idioms","adverbs"];for(const section of keys){const arr=Array.isArray(words?.[section])?words[section]:[];html+=`<div class="section-title">${section.replace("_"," ")}</div>`;for(const w of arr){const en=esc(w.en),ar=esc(w.ar);html+=`<div class="word"><div class="ar">${ar}</div><div class="actions"><button class="icon" type="button" onclick="speak('${en.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}')">🔊</button><button class="icon" type="button" onclick="saveWord(this,'${en.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}','${ar.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}','${section}')">⭐</button></div><div class="en">${en}</div></div>`}}return html}
async function generateLesson(){const input=document.getElementById("textInput").value.trim();if(!input){alert("اكتب موضوع الدرس أولاً");return}const btn=document.getElementById("generateBtn");const root=document.getElementById("lesson");btn.disabled=true;root.innerHTML='<div class="loading">⏳ جاري إعداد درس مناسب لمستواك...</div>';track("إنشاء درس بمستوى الطالب");try{const res=await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({inputPart:input,type:"text",user_id,phone,student_level:storedLevel})});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{throw new Error("استجابة غير مفهومة من n8n: "+raw.slice(0,250))}if(!res.ok||data.success===false)throw new Error(data.message||data.error||"تعذر إنشاء الدرس");document.getElementById("textInput").value="";const words=data.words||{};root.innerHTML=`<div class="card"><div class="section-title">📖 القصة (${esc(data.student_level||storedLevel||"A1")})</div><div class="story story-en">${esc(data.story).replace(/\n/g,"<br>")}</div><hr><div class="section-title">🌍 الترجمة</div><div class="story story-ar">${esc(data.translation||"⚠️ لا توجد ترجمة").replace(/\n/g,"<br>")}</div>${renderWords(words)}${data.profile_notice?`<p class="meta-note">${esc(data.profile_notice)}</p>`:""}</div>`;track("اكتمال إنشاء الدرس")}catch(e){console.error(e);root.innerHTML=`<div class="card error">❌ ${esc(e.message||"حدث خطأ أثناء إنشاء الدرس")}</div>`}finally{btn.disabled=false}}
</script>
</body>
</html>
