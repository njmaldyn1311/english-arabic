<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📖 قراءة الكتاب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 📱 حاوية */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

/* 📦 كرت */
.card{
  width:100%;
  max-width:500px;
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* 📖 عنوان */
.title{
  text-align:center;
  font-size:22px;
  margin-bottom:10px;
}

/* 📝 النص */
.content{
  line-height:1.8;
  margin:15px 0;
}

/* 📦 صناديق */
.box{
  padding:12px;
  border-radius:12px;
  margin:10px 0;
  font-size:15px;
}

.green{background:#065f46}
.yellow{background:#78350f}

/* 📚 كلمات */
.word{
  background:#334155;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
}

/* 🔘 أزرار */
.nav{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.next{background:#22c55e;color:white}
.prev{background:#475569;color:white}

</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div id="title" class="title">📖 الصفحة 1</div>

    <div id="content" class="content">...</div>

    <div id="translation" class="box green"></div>

    <div id="explanation" class="box yellow"></div>

    <div id="words"></div>

    <div class="nav">
      <button class="prev" onclick="prev()">⬅️ السابق</button>
      <button class="next" onclick="next()">التالي ➡️</button>
    </div>

  </div>
</div>

<script>

// 🔗 Supabase
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 📖 رقم الصفحة
let pageNumber = 1;

// 🚀 تحميل الصفحة
async function loadPage(){

  let { data, error } = await client
    .from("pages")
    .select("*")
    .eq("page_number", pageNumber)
    .single();

  if(error || !data){
    document.getElementById("content").innerText = "❌ لا توجد صفحة";
    return;
  }

  document.getElementById("title").innerText = "📖 الصفحة " + data.page_number;
  document.getElementById("content").innerText = data.content || "";
  document.getElementById("translation").innerText = "📘 ترجمة:\n" + (data.translation || "");
  document.getElementById("explanation").innerText = "💡 شرح:\n" + (data.explanation || "");

  loadWords(data.id);
}

// 📚 كلمات الصفحة
async function loadWords(page_id){

  let { data } = await client
    .from("page_words")
    .select("*")
    .eq("page_id", page_id);

  let container = document.getElementById("words");
  container.innerHTML = "<h4>📚 كلمات مهمة</h4>";

  data.forEach(w=>{
    let div = document.createElement("div");
    div.className = "word";
    div.innerText = w.en + " = " + w.ar;
    container.appendChild(div);
  });
}

// التالي
function next(){
  pageNumber++;
  loadPage();
}

// السابق
function prev(){
  if(pageNumber > 1){
    pageNumber--;
    loadPage();
  }
}

loadPage();

</script>

</body>
</html>
