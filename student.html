<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي</title>

<style>

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  flex-wrap:wrap;
  gap:10px;
}

.user{color:#38bdf8;font-size:14px;}
.points{color:#FFD700;font-size:14px;}

.review{
  background:#6366f1;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
}

.card{
  background:#1e293b;
  margin:15px;
  padding:18px;
  border-radius:18px;
}

@media (max-width:480px){
  .card{margin:12px;}
  .top{padding:10px;}
}

.word{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #334155;
}

.en{color:#38bdf8;}
.ar{color:#f87171;}

textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  resize:none;
  height:80px;
  font-family:"Cairo";
}

button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

.quiz button{
  display:block;
  width:100%;
  margin-top:6px;
  background:#334155;
}

</style>
</head>

<body>

<div class="top">
  <div class="user" id="username">👤</div>
  <div class="points">⭐ كلماتك: <span id="count">0</span></div>
  <div class="review" onclick="goHome()">🏠 الرئيسية</div>
</div>

<div class="card">
  <h3>⭐ الكلمات المحفوظة</h3>
  <div id="words">⏳ جاري التحميل...</div>
</div>

<div class="card">
  <h3>📝 ملاحظاتي</h3>
  <div id="oldNotes" style="color:#cbd5f5;margin-bottom:10px;"></div>
  <textarea id="noteInput" placeholder="اكتب ملاحظة جديدة..."></textarea>
  <button onclick="addNote()">➕ إضافة</button>
</div>

<div class="card">
  <h3>🧠 اختبار سريع</h3>
  <div id="quiz"></div>
</div>

<script>

// 🔥 Supabase
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

let user_id = localStorage.getItem("user_id");

/* 👤 الاسم */
let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");
let shortName = parts[0] + (parts[1] ? " " + parts[1] : "");
document.getElementById("username").innerText = "👤 " + shortName;

/* ⭐ جلب الكلمات من Supabase */
let words = [];

async function loadWords(){

  try{

    let res = await fetch(
      SUPABASE_URL + "/rest/v1/user_words?user_id=eq." + user_id,
      {
        headers:{
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    words = await res.json();

    document.getElementById("count").innerText = words.length;

    renderWords();
    generateQuiz();

  }catch(err){
    document.getElementById("words").innerText = "❌ خطأ في التحميل";
  }

}

function renderWords(){

  let html="";

  words.forEach(w=>{
    html+=`
      <div class="word">
        <div class="ar">${w.translation}</div>
        <div class="en">${w.word}</div>
      </div>
    `;
  });

  document.getElementById("words").innerHTML =
    html || "لا توجد كلمات";

}

/* 📝 الملاحظات (كما هي) */
function loadNotes(){
  let notes = JSON.parse(localStorage.getItem("notes") || "[]");

  let html="";
  notes.forEach(n=>{
    html+=`<div>• ${n}</div>`;
  });

  document.getElementById("oldNotes").innerHTML =
    html || "لا توجد ملاحظات";
}

function addNote(){
  let input = document.getElementById("noteInput").value.trim();
  if(!input) return;

  let notes = JSON.parse(localStorage.getItem("notes") || "[]");
  notes.push(input);

  localStorage.setItem("notes", JSON.stringify(notes));

  document.getElementById("noteInput").value = "";

  loadNotes();
}

loadNotes();

/* 🧠 اختبار من Supabase */
function generateQuiz(){

  if(words.length < 3){
    document.getElementById("quiz").innerHTML = "أضف كلمات أولاً ⭐";
    return;
  }

  let random = [...words].sort(()=>0.5-Math.random()).slice(0,3);

  let html="";

  random.forEach(q=>{

    let options = [...words].sort(()=>0.5-Math.random()).slice(0,3);
    options.push(q);
    options = options.sort(()=>0.5-Math.random());

    html+=`<div class="quiz">
      <p>ما معنى: <strong>${q.word}</strong>؟</p>
    `;

    options.forEach(opt=>{
      html+=`
        <button onclick="checkAnswer('${q.translation}','${opt.translation}')">
          ${opt.translation}
        </button>
      `;
    });

    html+=`</div><hr>`;
  });

  document.getElementById("quiz").innerHTML = html;
}

function checkAnswer(correct, answer){
  if(correct === answer){
    alert("✅ صحيح");
  }else{
    alert("❌ خطأ");
  }
}

/* 🔙 */
function goHome(){
  window.location.href="index.html";
}

/* 🚀 تحميل */
loadWords();

</script>

</body>
</html>
