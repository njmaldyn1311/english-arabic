<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كلاسي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{margin:0;background:#0f172a;font-family:Arial;color:white;text-align:center;}
.header{display:flex;justify-content:space-between;padding:10px;}
button{padding:10px;border:none;border-radius:10px;color:white;}
.teacher{background:#f59e0b;}
.student{background:#22c55e;}
canvas{width:100%;margin-top:10px;border-radius:10px;}
textarea{width:100%;height:70px;margin-top:10px;border-radius:10px;padding:10px;}
</style>

</head>

<body>

<div class="header">
  <button class="teacher" onclick="setTeacher()">👨‍🏫 معلم</button>
  <button class="student" onclick="setStudent()">👨‍🎓 طالب</button>
</div>

<h2>📘 الكلاس المباشر</h2>

<canvas id="pdf"></canvas>

<div>
  <button onclick="prevPage()">⬅</button>
  <button onclick="nextPage()">➡</button>
</div>

<textarea id="noteInput" placeholder="✍️ ملاحظتك..."></textarea>
<button onclick="saveNote()">💾 حفظ</button>

<script>

// 🔥 Supabase
const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 🔥 إعدادات
let role = "student";
let userId = localStorage.getItem("user_id") || "user_" + Math.random();
localStorage.setItem("user_id", userId);

let pdfDoc = null;
let currentPage = 1;

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

// 👨‍🏫 وضع المعلم
function setTeacher(){ role="teacher"; alert("وضع المعلم 👨‍🏫"); }

// 👨‍🎓 وضع الطالب
function setStudent(){ role="student"; alert("وضع الطالب 👨‍🎓"); }

// 📥 تحميل الكتاب
async function loadPDF(){
  const loadingTask = pdfjsLib.getDocument(PDF_URL);
  pdfDoc = await loadingTask.promise;
  renderPage(currentPage);
}
loadPDF();

// 📄 عرض الصفحة
async function renderPage(num){
  const page = await pdfDoc.getPage(num);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");
  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext:ctx, viewport }).promise;

  loadNote();
}

// ➡ التالي
async function nextPage(){
  if(pdfDoc && currentPage < pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);

    if(role==="teacher"){
      await client.from("room_state").update({ page: currentPage }).eq("id",1);
    }
  }
}

// ⬅ السابق
async function prevPage(){
  if(pdfDoc && currentPage > 1){
    currentPage--;
    renderPage(currentPage);

    if(role==="teacher"){
      await client.from("room_state").update({ page: currentPage }).eq("id",1);
    }
  }
}

// 🔄 استقبال التحديث (للطلاب)
client
.channel('room')
.on('postgres_changes',{
  event:'UPDATE',
  schema:'public',
  table:'room_state'
},payload=>{

  if(role==="student"){
    currentPage = payload.new.page;
    renderPage(currentPage);
  }

})
.subscribe();

// 💾 حفظ ملاحظة
async function saveNote(){

  const note = document.getElementById("noteInput").value;

  await client.from("user_notes").upsert({
    user_id: userId,
    page: currentPage,
    note: note
  });

  alert("تم الحفظ ✅");
}

// 📥 تحميل ملاحظة
async function loadNote(){

  const { data } = await client
  .from("user_notes")
  .select("*")
  .eq("user_id", userId)
  .eq("page", currentPage)
  .single();

  if(data){
    document.getElementById("noteInput").value = data.note;
  }else{
    document.getElementById("noteInput").value = "";
  }

}

</script>

</body>
</html>
