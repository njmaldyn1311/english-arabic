<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #eee;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.header {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid white;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

.content {
  padding: 70px 20px 20px;
}

h1 {
  margin: 10px 0;
}

.subtitle {
  color: #555;
}

.students {
  color: #0072ff;
  font-weight: bold;
  margin: 10px 0;
  font-size: 18px;
}

.card {
  background: #ddd;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
}

.logout {
  background: #ef4444;
  margin-top: 10px;
}

/* زر واتساب */
.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
  font-weight: bold;
}

/* زر عائم */
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  font-size: 20px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students" id="students">
      👨‍🎓 أكثر من 120 طالب
    </div>

    <div class="card">
      <span>📚 الفصل الذكي</span>
      <button onclick="goClass()">ابدأ</button>
    </div>

    <div class="card">
      <span>📺 تحليل فيديو</span>
      <button onclick="goYoutube()">ابدأ</button>
    </div>

    <div class="card">
      <span>📄 تحليل PDF</span>
      <button onclick="goPDF()">ابدأ</button>
    </div>

    <div class="card">
      <span>🔍 البحث</span>
      <button onclick="goSearch()">ابدأ</button>
    </div>

    <!-- 🆕 اختبار -->
    <div class="card">
      <span>📝 اختبار</span>
      <button onclick="goTest()">ابدأ</button>
    </div>

    <!-- 🆕 مراجعة -->
    <div class="card">
      <span>📊 مراجعة</span>
      <button onclick="goReview()">فتح</button>
    </div>

    <div class="card">
      <span>👤 حسابي</span>
      <button onclick="goProfile()">فتح</button>
    </div>

    <!-- 💬 واتساب -->
    <a href="https://wa.me/message/735SJORMFI74H1" target="_blank" class="whatsapp">
      💬 تواصل معي على واتساب
    </a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<!-- زر واتساب عائم -->
<a href="https://wa.me/message/735SJORMFI74H1" target="_blank" class="whatsapp-float">
  💬
</a>

<script>

const userId = localStorage.getItem("user_id");
if(!userId){
  window.location.href = "login.html";
}

let count = localStorage.getItem("studentsCount");
if (!count) count = 120;

function updateStudents() {
  count = parseInt(count) + Math.floor(Math.random() * 2);
  document.getElementById("students").innerText =
    "👨‍🎓 أكثر من " + count + " طالب";
  localStorage.setItem("studentsCount", count);
}

updateStudents();
setInterval(updateStudents, 8000);

function goClass(){ window.location.href = "myclass.html"; }
function goYoutube(){ window.location.href = "youtube.html"; }
function goPDF(){ window.location.href = "pdf.html"; }
function goSearch(){ window.location.href = "search.html"; }
function goProfile(){ window.location.href = "student.html"; }

//// 🆕
function goTest(){
  window.location.href = "test.html";
}

function goReview(){
  window.location.href = "review.html";
}

function logout(){
  const studentsCount = localStorage.getItem("studentsCount");
  localStorage.clear();
  localStorage.setItem("studentsCount", studentsCount);
  window.location.href = "login.html";
}

</script>

</body>
</html>
