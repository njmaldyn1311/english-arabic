<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  text-align:center;
}

.card{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:20px;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

.bottom-buttons{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.bottom-buttons button{
  padding:10px;
  border:none;
  border-radius:12px;
  color:white;
  font-size:13px;
  background:#22c55e;
}

textarea{
  width:100%;
  height:45px;
  padding:10px;
  border-radius:10px;
  border:none;
}

/* 🔥 لودينج */
.loading{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#1e40af;
  border-radius:10px;
}

/* 🔥 النتائج */
.result-box{
  display:none;
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
  text-align:right;
}

.result-box h3{
  margin:10px 0 5px;
  color:#38bdf8;
}
</style>
</head>

<body>

<h2>📘 كتابي</h2>

<div class="card">

<button class="btn download" onclick="openBook()">📥 تحميل</button>

<canvas id="pdf"></canvas>

<div class="bottom-buttons">
  <button onclick="prevPage()">⬅</button>
  <button onclick="nextPage()">➡</button>
  <button onclick="savePage()">⭐</button>
  <button onclick="readPage()">🔊</button>
</div>

<textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>

<button class="btn green" onclick="saveNote()">💾 حفظ</button>

<button class="btn orange" onclick="analyzePage()">🧠 تحليل الصفحة</button>

<div id="loading" class="loading">⏳ جاري التحليل...</div>

<div id="resultBox" class="result-box">
  <h3>🧠 الشرح</h3>
  <p id="summary"></p>

  <h3>🌍 الترجمة</h3>
  <p id="translation"></p>

  <h3>📌 كلمات مهمة</h3>
  <p id="keywords"></p>
</div>

</div>

<script>

const AI_WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/headway";

let pdfDoc=null;
let currentPage=1;
let rendering=false;

const PDF_URL="https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

/* تحميل */
async function openBook(){
  const loadingTask = pdfjsLib.getDocument(PDF_URL);
  pdfDoc = await loadingTask.promise;
  renderPage(currentPage);
}

/* عرض */
async function renderPage(num){

  if(rendering) return;
  rendering=true;

  try{
    const page = await pdfDoc.getPage(num);
    const canvas = document.getElementById("pdf");
    const ctx = canvas.getContext("2d");

    const viewport = page.getViewport({ scale:1.5 });

    canvas.height = viewport.height;
    canvas.width = viewport.width;

    await page.render({ canvasContext:ctx, viewport }).promise;

  }catch(e){
    console.log("render error", e);
  }

  rendering=false;
}

function nextPage(){ if(currentPage<pdfDoc.numPages){currentPage++;renderPage(currentPage);} }
function prevPage(){ if(currentPage>1){currentPage--;renderPage(currentPage);} }

function savePage(){ alert("تم الحفظ ⭐"); }
function saveNote(){ alert("تم حفظ الملاحظة ✅"); }

/* قراءة */
async function readPage(){
  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();
  let text = content.items.map(i=>i.str).join(" ");
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

/* 🔥 تحليل */
async function analyzePage(){

  if(!pdfDoc){
    alert("افتح الكتاب أولاً");
    return;
  }

  document.getElementById("loading").style.display="block";
  document.getElementById("resultBox").style.display="none";

  try{

    const page = await pdfDoc.getPage(currentPage);
    const content = await page.getTextContent();
    let text = content.items.map(i=>i.str).join(" ");

    const res = await fetch(AI_WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ text })
    });

    let resData = await res.json();

    console.log("RAW:", resData);

    let data = resData;

    // 🧠 لو جاي من n8n
    if(resData.content){
      data = resData.content[0].text;
    }

    // 🧠 لو string
    if(typeof data === "string"){
      data = data.replace(/```json/g,"").replace(/```/g,"");
      data = JSON.parse(data);
    }

    document.getElementById("summary").innerText = data.summary || "لا يوجد شرح";
    document.getElementById("translation").innerText = data.translation || "لا يوجد ترجمة";

    let keywords = data.keywords || [];
    if(typeof keywords === "string"){
      try{ keywords = JSON.parse(keywords); }catch{}
    }

    document.getElementById("keywords").innerText = keywords.join(" - ");

    document.getElementById("resultBox").style.display="block";

  }catch(e){
    console.log(e);
    alert("❌ فشل التحليل");
  }

  document.getElementById("loading").style.display="none";
}

</script>

</body>
</html>
