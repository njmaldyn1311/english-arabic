<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📚 الفصل الذكي</title><style>

body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  margin: 0;
}

* { box-sizing: border-box; }

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

/* 🔥 الهيدر */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e293b;
  padding: 12px;
  border-radius: 12px;
}

.username { color: #38bdf8; }
.count { color: #fbbf24; }

.review-btn {
  background: #6366f1;
  padding: 10px;
  border-radius: 10px;
}

/* 🔥 العنوان */
.main-title {
  text-align: center;
  font-size: 22px;
  margin-top: 15px;
}

.lesson-title {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 15px;
}

/* 🔥 الكارد */
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 15px;
}

/* 🔥 INPUT */
input, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin: 8px 0;
  text-align: center;
}

/* 🔥 زر */
button {
  background: #22c55e;
  border: none;
  padding: 14px;
  border-radius: 12px;
  color: white;
  width: 100%;
  cursor: pointer;
}

/* 🔥 DROPDOWN احترافي */
.dropdown {
  position: relative;
}

.dropdown-btn {
  background: #fff;
  color: #000;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
}

.dropdown-menu {
  position: absolute;
  top: 55px;
  width: 100%;
  background: white;
  color: black;
  border-radius: 12px;
  display: none;
  overflow: hidden;
}

.dropdown-menu div {
  padding: 12px;
  cursor: pointer;
}

.dropdown-menu div:hover {
  background: #eee;
}

/* 🔥 القصة */
.story {
  white-space: pre-line;
  line-height: 1.8;
}

.translation {
  direction: rtl;
  text-align: right;
}

.hidden { display:none; }

</style></head><body><div class="container"><div class="header">
  <div class="username" id="username">👤</div>
  <div class="count">⭐ كلماتك: 0</div>
  <div class="review-btn">📖 مراجعة</div>
</div><div class="main-title">📚 الفصل الذكي</div>
<div class="lesson-title">📘 عنوان الدرس</div><div class="card"><!-- 🔥 dropdown جديد --><div class="dropdown">
  <div class="dropdown-btn" onclick="toggleMenu()" id="selectedType">📝 نص</div>
  <div class="dropdown-menu" id="menu">
    <div onclick="selectType('text','📝 نص')">📝 نص</div>
    <div onclick="selectType('link','🔗 رابط')">🔗 رابط</div>
  </div>
</div><textarea id="textInput" placeholder="اكتب النص هنا..."></textarea><input type="text" id="linkInput" class="hidden" placeholder="ضع الرابط هنا"><button onclick="generateLesson()">🚀 إنشاء الدرس</button>

</div><div id="lesson"></div></div><script>

/* 🔥 الاسم الأول فقط */
const fullName = localStorage.getItem("user") || "طالب";
const firstName = fullName.split(" ")[0];
document.getElementById("username").innerText = "👤 " + firstName;

/* 🔥 dropdown */
let currentType = "text";

function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function selectType(type, label){
  currentType = type;
  document.getElementById("selectedType").innerText = label;
  document.getElementById("menu").style.display = "none";

  document.getElementById("textInput").classList.add("hidden");
  document.getElementById("linkInput").classList.add("hidden");

  if(type === "text") document.getElementById("textInput").classList.remove("hidden");
  if(type === "link") document.getElementById("linkInput").classList.remove("hidden");
}

/* 🔥 إنشاء درس */
function generateLesson(){
  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <p class="story">This is a demo story...</p>
      <hr>
      <p class="translation">هذه ترجمة...</p>
    </div>
  `;
}

</script></body>
</html>
