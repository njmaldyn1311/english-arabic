<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<!-- 🔥 منع الزوم -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>تسجيل طالب</title>

<style>
*{ box-sizing:border-box; }

body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e3a8a);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px;
}

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.08;
  z-index:-1;
}

.box {
  width:100%;
  max-width:420px;
  padding:25px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  text-align:center;
  color:white;
}

/* 🔥 inputs بدون زوم */
input {
  width:100%;
  height:50px;
  padding:0 14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  text-align:center;
  font-size:16px; /* 🔥 مهم */
  -webkit-appearance:none;
}

input:focus {
  outline:none;
  box-shadow:0 0 0 2px #38bdf8;
}

input, textarea, select {
  font-size:16px !important;
}

/* dropdown */
.custom-select {
  position: relative;
  background: white;
  color: black;
  height: 50px;
  border-radius: 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin:8px 0;
}

.options {
  position:absolute;
  top:55px;
  right:0;
  left:0;
  background:white;
  border-radius:12px;
  display:none;
  z-index:10;
}

.options div {
  padding:12px;
}

/* زر */
button {
  width:100%;
  height:50px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* Toast */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  display:none;
  z-index:9999;
}
.toast.error{background:#ef4444;}

</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="box">

<h2>🚀 تسجيل طالب جديد</h2>

<input id="name" placeholder="اسم الطالب">
<input id="phone" placeholder="رقم الجوال">
<input id="city" placeholder="المدينة">
<input id="district" placeholder="الحي">

<!-- الجنس -->
<div class="custom-select" onclick="toggleDropdown()">
  <div id="selected">اختر الجنس</div>
  <div class="options" id="dropdown">
    <div onclick="selectGender(event,'ذكر')">ذكر</div>
    <div onclick="selectGender(event,'أنثى')">أنثى</div>
  </div>
</div>

<!-- المستوى -->
<div class="custom-select" onclick="toggleLevel()">
  <div id="selectedLevel">المستوى</div>
  <div class="options" id="levelDropdown">
    <div onclick="selectLevel(event,'مبتدئ')">مبتدئ</div>
    <div onclick="selectLevel(event,'متوسط')">متوسط</div>
    <div onclick="selectLevel(event,'متقدم')">متقدم</div>
  </div>
</div>

<input id="job1" placeholder="اهتمام 1">
<input id="job2" placeholder="اهتمام 2">
<input id="job3" placeholder="اهتمام 3">

<button id="signupBtn" onclick="signup()">تسجيل</button>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/signup";

/* 🔥 user_id موحد */
let user_id = localStorage.getItem("user_id");

if(!user_id){
  user_id = crypto.randomUUID();
  localStorage.setItem("user_id", user_id);
}

/* Toast */
function showToast(msg,type="success"){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast "+(type==="error"?"error":"");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",3000);
}

/* loading */
function setLoading(state){
  let btn=document.getElementById("signupBtn");
  btn.disabled=state;
  btn.innerText=state ? "⏳ جاري التسجيل..." : "تسجيل";
}

/* dropdown */
let gender="", level="";

function toggleDropdown(){
  dropdown.style.display = dropdown.style.display==="block"?"none":"block";
}

function selectGender(e,val){
  e.stopPropagation();
  gender=val;
  selected.innerText=val;
  dropdown.style.display="none";
}

function toggleLevel(){
  levelDropdown.style.display = levelDropdown.style.display==="block"?"none":"block";
}

function selectLevel(e,val){
  e.stopPropagation();
  level=val;
  selectedLevel.innerText=val;
  levelDropdown.style.display="none";
}

/* signup */
async function signup(){

  let data = {
    user_id: user_id,
    name: name.value,
    phone: phone.value,
    city: city.value,
    district: district.value,
    gender: gender,
    level: level,
    job1: job1.value,
    job2: job2.value,
    job3: job3.value
  };

  if(!data.name || !data.phone){
    showToast("اكتب الاسم والجوال","error");
    return;
  }

  setLoading(true);

  try{
    await fetch(WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(data)
    });

    showToast("✅ تم التسجيل");

    setTimeout(()=>{
      location.href="index.html";
    },800);

  }catch{
    showToast("❌ خطأ","error");
    setLoading(false);
  }
}

</script>

</body>
</html>
