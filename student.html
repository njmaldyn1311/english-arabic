<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل PDF</title>

<style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 500px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 20px;
  width: 98%;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  margin-bottom: 20px;
}

button {
  background: #00c6ff;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  width: 100%;
}

button:hover {
  background: #009edb;
}

.word {
  padding: 10px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
}

.en { text-align: left; }
.ar { text-align: right; }

.progress {
  height: 8px;
  background: #eee;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #00c6ff;
  transition: 0.3s;
}
</style>

</head>

<body>

<div class="container">

  <div class="box">
    <h2>📄 تحليل PDF</h2>

    <input type="file" id="file" accept="application/pdf"><br><br>

    <button onclick="upload()">🚀 تحليل</button>

    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>

    <p id="status"></p>
  </div>

  <div id="result"></div>

</div>

<script>

function setProgress(v){
  document.getElementById("bar").style.width = v + "%";
}

async function upload() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!file) {
    alert("اختر ملف PDF");
    return;
  }

  // 🔥 تحقق النوع
  if (file.type !== "application/pdf") {
    status.innerText = "❌ فقط PDF مسموح";
    return;
  }

  // 🔥 تحقق الحجم (5MB)
  const maxSize = 5 * 1024 * 1024;

  if (file.size > maxSize) {
    status.innerHTML = `
      ❌ الملف كبير جدًا<br>
      الحد: 5MB<br>
      حجمك: ${(file.size / 1024 / 1024).toFixed(2)} MB
    `;
    return;
  }

  result.innerHTML = "";
  setProgress(10);

  const formData = new FormData();
  formData.append("file", file);

  try {
    status.innerText = "⏳ جاري الإرسال...";
    setProgress(30);

    const controller = new AbortController();

    // ⏱️ تايم أوت
    const timeout = setTimeout(() => {
      controller.abort();
    }, 20000);

    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
      method: "POST",
      body: formData,
      signal: controller.signal
    });

    clearTimeout(timeout);

    setProgress(70);

    if (!res.ok) throw new Error("Server");

    let data = await res.json();

    if (data.raw) {
      try { data = JSON.parse(data.raw); } catch {}
    }

    status.innerText = "✅ تم التحليل";
    setProgress(100);

    function render(list){
      if (!list) return "";
      return list.map(i => `
        <div class="word">
          <span class="en">${i.word || i.phrase}</span>
          <button onclick="speak('${i.word || i.phrase}')">🔊</button>
          <span class="ar">${i.arabic || ""}</span>
        </div>
      `).join("");
    }

    result.innerHTML = `
      ${data.verbs ? `<div class="box"><h3>📌 الأفعال</h3>${render(data.verbs)}</div>` : ""}
      ${data.nouns ? `<div class="box"><h3>📌 الأسماء</h3>${render(data.nouns)}</div>` : ""}
      ${data.adjectives ? `<div class="box"><h3>📌 الصفات</h3>${render(data.adjectives)}</div>` : ""}
      ${data.idioms ? `<div class="box"><h3>📌 العبارات</h3>${render(data.idioms)}</div>` : ""}
      ${data.phrasal_verbs || data.phrasalVerbs
        ? `<div class="box"><h3>📌 الأفعال المركبة</h3>${render(data.phrasal_verbs || data.phrasalVerbs)}</div>`
        : ""
      }
    `;

  } catch (err) {
    console.error(err);

    if (err.name === "AbortError") {
      status.innerText = "⏱️ انتهى الوقت (الملف ثقيل)";
    } else {
      status.innerText = "❌ فشل الاتصال";
    }

    setProgress(0);
  }
}

function speak(word){
  let u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

</script>

</body>
</html>
