<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  text-align:center;
}

/* 🔥 الهيدر */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 15px;
}

.home-btn{
  background:#38bdf8;
  padding:8px 15px;
  border-radius:10px;
  border:none;
  color:white;
}

.username{
  font-size:14px;
}

/* الكارد */
.card{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:20px;
}

/* زر */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

/* PDF */
canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

/* أزرار تحت */
.bottom-buttons{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.bottom-buttons button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:13px;
  background:#22c55e;
}

/* 🔥 ملاحظات (تم إصلاح المشكلة) */
.note-box{
  width:100%;
  margin-top:10px;
}

textarea{
  width:100%;
  height:60px;
  padding:10px;
  border-radius:10px;
  border:none;
  box-sizing:border-box; /* 🔥 هذا حل المشكلة */
}
</style>

</head>
<body>

<!-- 🔥 الهيدر -->
<div class="header">
  <div class="username" id="userName">👤 أحمد</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <!-- السعر -->
  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <!-- زر -->
  <button id="openBtn" class="btn download" onclick="openBook()">
    📥 تحميل وفتح
  </button>

  <canvas id="pdf"></canvas>

  <!-- تحليل -->
  <button class="btn orange" onclick="analyzePage()">
    🧠 تحليل الصفحة
  </button>

  <!-- ملاحظات -->
  <div class="note-box">
    <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>
  </div>

  <button class="btn green" onclick="saveNote()">
    💾 حفظ
  </button>

  <!-- الأزرار -->
  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
    <button onclick="savePage()">⭐ حفظ</button>
    <button onclick="readPage()">🔊 قراءة</button>
  </div>

</div>

<script>

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc = null;
let currentPage = 1;


// 🏠 الرئيسية
function goHome(){
  window.location.href = "index.html";
}


// 📥 فتح الكتاب
async function openBook(){

  const btn = document.getElementById("openBtn");
  btn.innerText = "⏳ جاري التحميل...";

  try{

    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    await renderPage(currentPage);

    btn.innerText = "📖 تم فتح الكتاب";

    // 🔥 إخفاء السعر بعد الفتح
    document.getElementById("priceBox").style.display = "none";

  }catch(e){
    btn.innerText="❌ فشل التحميل";
  }
}


// عرض الصفحة
async function renderPage(num){

  const page = await pdfDoc.getPage(num);

  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");

  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({
    canvasContext:ctx,
    viewport
  }).promise;
}


// التالي
function nextPage(){
  if(currentPage < pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);
  }
}

// السابق
function prevPage(){
  if(currentPage > 1){
    currentPage--;
    renderPage(currentPage);
  }
}


// حفظ الصفحة
function savePage(){
  localStorage.setItem("savedPage", currentPage);
  alert("تم حفظ الصفحة ⭐");
}


// قراءة
async function readPage(){

  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();

  let text = content.items.map(i=>i.str).join(" ");

  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";

  speechSynthesis.speak(speech);
}


// تحليل
function analyzePage(){
  alert("تحليل الصفحة 🔥 (اربطه مع OpenAI)");
}


// حفظ ملاحظة
function saveNote(){

  let note = document.getElementById("noteInput").value;

  if(!note) return;

  alert("تم حفظ الملاحظة ✅");
}


// 🔥 اسم المستخدم (تقدر تربطه بسوبابيز)
document.getElementById("userName").innerText =
  "👤 " + (localStorage.getItem("name") || "محمد");

</script>

</body>
</html>
