<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>
body {
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  margin:10px;
  border-radius:15px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.big{
  font-size:28px;
  font-weight:bold;
  color:#38bdf8;
}
</style></head><body><div class="container"><h2>📊 Dashboard</h2><div class="grid"><div class="card">
  👥 عدد المستخدمين
  <div id="totalUsers" class="big">0</div>
</div><div class="card">
  💰 المشتركون (Paid)
  <div id="paidUsers" class="big">0</div>
</div><div class="card">
  🆓 المستخدمين المجانيين
  <div id="freeUsers" class="big">0</div>
</div><div class="card">
  ⏱️ متوسط وقت الاستخدام
  <div id="avgTime" class="big">0</div>
</div><div class="card">
  📈 النشطين اليوم
  <div id="activeToday" class="big">0</div>
</div><div class="card">
  🎯 المستخدمين المستهدفين
  <div id="targetUsers" class="big">0</div>
</div></div></div><script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadDashboard(){

  // 👥 كل المستخدمين
  const { data: users } = await client.from("users").select("*");

  document.getElementById("totalUsers").innerText = users.length;

  // 💰 المدفوع
  const paid = users.filter(u => u.plan === "paid");
  document.getElementById("paidUsers").innerText = paid.length;

  // 🆓 المجاني
  const free = users.filter(u => u.plan === "free");
  document.getElementById("freeUsers").innerText = free.length;

  // 📈 النشطين اليوم
  const today = new Date().toISOString().slice(0,10);

  const active = users.filter(u =>
    u.last_active?.startsWith(today)
  );

  document.getElementById("activeToday").innerText = active.length;

  // ⏱️ متوسط الوقت
  const { data: sessions } = await client
    .from("sessions")
    .select("duration");

  let avg = 0;
  if(sessions.length){
    avg = sessions.reduce((a,b)=>a+b.duration,0)/sessions.length;
  }

  document.getElementById("avgTime").innerText = Math.round(avg) + "s";

  // 🎯 المستهدفين (مثال: مستخدمين مجانيين)
  document.getElementById("targetUsers").innerText = free.length;

}

loadDashboard();

</script></body>
</html>
