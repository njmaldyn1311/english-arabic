<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
}
.header { height:140px; }
.profile-img {
  width:110px;height:110px;border-radius:50%;
  position:absolute;left:50%;transform:translateX(-50%);
}
.content { padding:70px 20px 20px; }
h1 { color:white; }
.subtitle { color:#cbd5e1; }

.card {
  background:#1e293b;
  border-radius:20px;
  padding:15px;
  margin:10px 0;
  display:flex;
  justify-content:space-between;
  color:white;
}

button {
  background:#22c55e;
  border:none;
  color:white;
  padding:10px 15px;
  border-radius:20px;
}

.logout { background:#ef4444; }

.whatsapp {
  display:block;
  margin-top:15px;
  background:#25D366;
  color:white;
  padding:12px;
  border-radius:15px;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="container">
<div class="header"></div>

<div class="content">

<h1>إنجلش بالعربي</h1>
<div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

<div class="card"><span>📚 الفصل الذكي</span><button onclick="goClass()">ابدأ</button></div>
<div class="card"><span>📺 تحليل فيديو</span><button onclick="goYoutube()">ابدأ</button></div>
<div class="card"><span>📄 تحليل PDF</span><button onclick="goPDF()">ابدأ</button></div>

<a id="whatsappLink" class="whatsapp">💬 تواصل معي</a>

<button class="logout" onclick="logout()">تسجيل خروج</button>

</div>
</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 🔐 تحقق تسجيل الدخول
const userId = localStorage.getItem("user_id");

if(!userId || userId === "undefined"){
  window.location.href = "login.html";
}

// 📊 بيانات المستخدم
let isSubscribed = false;

// 🔥 تحقق الاشتراك
async function checkSubscription(){

  const { data } = await client
    .from("users")
    .select("subscription_status, subscription_end, name")
    .eq("id", parseInt(userId))
    .single();

  if(!data) return;

  const now = new Date();
  const end = new Date(data.subscription_end);

  if(data.subscription_status === "active" && end > now){
    isSubscribed = true;
  }

  // واتساب
  let msg = `السلام عليكم، أنا ${data.name}`;
  let url = `https://wa.me/message/735SJORMFI74H1?text=${encodeURIComponent(msg)}`;
  document.getElementById("whatsappLink").href = url;
}

checkSubscription();

// 🔒 حماية
function goClass(){
  if(!isSubscribed){
    showSubscribeAlert();
    return;
  }
  location.href = "myclass.html";
}

function goYoutube(){
  if(!isSubscribed){
    showSubscribeAlert();
    return;
  }
  location.href = "youtube.html";
}

function goPDF(){
  if(!isSubscribed){
    showSubscribeAlert();
    return;
  }
  location.href = "pdf.html";
}

// 🔥 Alert احترافي
function showSubscribeAlert(){
  document.body.innerHTML += `
  <div style="
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;justify-content:center;align-items:center;
    z-index:999;
  ">
    <div style="
      background:#111827;padding:20px;border-radius:20px;
      width:85%;max-width:300px;text-align:center;color:white;
    ">
      <h3>🚫 الاشتراك مطلوب</h3>
      <p>يجب الاشتراك لاستخدام هذه الميزة</p>

      <a href="https://wa.me/message/735SJORMFI74H1"
         style="display:block;margin-top:10px;background:#25D366;padding:10px;border-radius:10px;color:white;text-decoration:none;">
         💬 اشترك الآن
      </a>

      <button onclick="location.reload()"
        style="margin-top:10px;background:#22c55e;padding:10px;border-radius:10px;color:white;width:100%">
        حسناً
      </button>
    </div>
  </div>
  `;
}

// 🚪 خروج
function logout(){
  localStorage.clear();
  location.href = "login.html";
}

</script>

</body>
</html>
