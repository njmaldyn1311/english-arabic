<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 مراجعة الدرس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔥 الهيدر */
.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#0f172a;
}

.user-name{color:#38bdf8;}
.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 14px;
  border-radius:12px;
  color:#38bdf8;
  cursor:pointer;
}

.container{
  padding:80px 15px 20px;
  max-width:600px;
  margin:auto;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

.title{
  font-size:20px;
  margin-bottom:10px;
}

.word{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #334155;
}

.en{color:#38bdf8;}
.ar{color:#facc15;}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  text-align:center;
  margin-top:10px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  background:#22c55e;
  color:white;
}

.toast{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:20px;
  border-radius:12px;
  display:none;
}

.success{background:#22c55e;}
.error{background:#ef4444;}

</style>
</head>

<body>

<div class="header">
  <div id="username" class="user-name">👤</div>
  <button class="home" onclick="goHome()">🏠</button>
</div>

<div class="container">

  <div id="lesson"></div>

  <!-- 🧠 اختبار -->
  <div class="card">
    <div class="title">🧠 اختبار الدرس</div>

    <div id="question"></div>

    <input id="input" placeholder="اكتب المعنى">

    <button onclick="check()">تحقق</button>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

// 👤 الاسم
let name = localStorage.getItem("user") || "طالب";
let p = name.split(" ");
username.innerText = "👤 " + p[0] + (p[1] ? " " + p[1] : "");

let words = [];
let current = 0;

// 🚀 تحميل آخر درس كامل
async function load(){

  let { data } = await client
    .from("lessons")
    .select("*")
    .eq("user_id", user_id)
    .order("created_at", { ascending:false })
    .limit(1);

  let lesson = data?.[0];

  if(!lesson){
    lessonDiv.innerHTML = "⚠️ لا يوجد درس";
    return;
  }

  renderLesson(lesson);

  words = lesson.words || [];

  next();
}

// 🎨 عرض الدرس
function renderLesson(l){

  let html = "";

  html += `
  <div class="card">
    <div class="title">📖 القصة</div>
    ${l.story || ""}
  </div>`;

  html += `
  <div class="card">
    <div class="title">🌍 الترجمة</div>
    ${l.translation || ""}
  </div>`;

  if(l.words){
    html += `<div class="card"><div class="title">⭐ الكلمات</div>`;
    l.words.forEach(w=>{
      html += `
        <div class="word">
          <div class="ar">${w.ar}</div>
          <div class="en">${w.en}</div>
        </div>`;
    });
    html += `</div>`;
  }

  if(l.grammar){
    html += `
    <div class="card">
      <div class="title">📘 القواعد</div>
      ${l.grammar}
    </div>`;
  }

  if(l.notes){
    html += `
    <div class="card">
      <div class="title">📝 ملاحظات</div>
      ${l.notes}
    </div>`;
  }

  document.getElementById("lesson").innerHTML = html;
}

// 🧠 السؤال
function next(){

  if(current >= words.length){
    question.innerText = "🎉 انتهت مراجعة الدرس";
    input.style.display="none";
    return;
  }

  let w = words[current];

  question.innerText = "ما معنى: " + w.en;
  input.value="";
}

// ✅ تحقق
function check(){

  let w = words[current];

  let val = normalize(input.value);
  let correct = normalize(w.ar);

  let ok = val.includes(correct) || correct.includes(val);

  toast(ok ? "✅ صح" : "❌ " + w.ar, ok);

  current++;
  setTimeout(next,800);
}

// 🔤
function normalize(t){
  return t.replace(/[أإآ]/g,"ا").trim();
}

// 🔔
function toast(msg, ok){
  let t=toastDiv;
  t.innerText=msg;
  t.className="toast "+(ok?"success":"error");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1000);
}

// رجوع
function goHome(){
  location.href="index.html";
}

let lessonDiv = document.getElementById("lesson");
let toastDiv = document.getElementById("toast");

load();

</script>

</body>
</html>
