<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
/* نفس تصميمك بدون تغيير */
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 140px;
  position: relative;
}
.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}
.content { padding: 70px 20px 20px; }
h1 { margin: 10px 0; color: white; }
.subtitle { color: #cbd5e1; }
.students {
  color: #22c55e;
  font-weight: bold;
  margin: 10px 0;
}
.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}
button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}
.logout { background: #ef4444; margin-top: 10px; }
.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
  font-weight: bold;
}
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  font-size: 20px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students" id="students">
      👨‍🎓 أكثر من 120 طالب
    </div>

    <div class="card"><span>📚 الفصل الذكي</span><button onclick="goClass()">ابدأ</button></div>
    <div class="card"><span>📺 تحليل فيديو</span><button onclick="goYoutube()">ابدأ</button></div>
    <div class="card"><span>📄 تحليل PDF</span><button onclick="goPDF()">ابدأ</button></div>
    <div class="card"><span>🔍 البحث</span><button onclick="goSearch()">ابدأ</button></div>
    <div class="card"><span>📝 اختبار</span><button onclick="goTest()">ابدأ</button></div>
    <div class="card"><span>📊 مراجعة</span><button onclick="goReview()">فتح</button></div>
    <div class="card"><span>👤 حسابي</span><button onclick="goProfile()">فتح</button></div>

    <div class="card"><span>📘 كتابي</span><button onclick="goBook()">فتح</button></div>
    <div class="card"><span>📊 لوحة التحكم</span><button onclick="goDashboard()">فتح</button></div>
    <div class="card"><span>🚧 ميزة جديدة</span><button onclick="goUpdate1()">قريباً</button></div>
    <div class="card"><span>🔄 تحديثات</span><button onclick="goUpdate2()">عرض</button></div>

    <a id="whatsappLink" target="_blank" class="whatsapp">
      💬 تواصل معي على واتساب
    </a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<a id="whatsappFloat" target="_blank" class="whatsapp-float">💬</a>

<script>

// 🔥 Supabase
const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 🔐 حماية حقيقية
async function checkAuth(){

  const { data } = await client.auth.getUser();

  if(!data.user){
    window.location.href = "login.html";
    return;
  }

  // حفظ بيانات المستخدم
  localStorage.setItem("user_id", data.user.id);
}

checkAuth();

// ⭐ عداد الطلاب
let count = localStorage.getItem("studentsCount");
if (!count) count = 120;

let counted = localStorage.getItem("countedUser");

if (!counted) {
  count = parseInt(count) + 1;
  localStorage.setItem("studentsCount", count);
  localStorage.setItem("countedUser", "yes");
}

document.getElementById("students").innerText =
  "👨‍🎓 أكثر من " + count + " طالب";

// واتساب
let userName = localStorage.getItem("user_name") || "طالب";
let message = `السلام عليكم، أنا ${userName}`;
let whatsappURL = `https://wa.me/message/735SJORMFI74H1?text=${encodeURIComponent(message)}`;

document.getElementById("whatsappLink").href = whatsappURL;
document.getElementById("whatsappFloat").href = whatsappURL;

// التنقل
function goClass(){ location.href="myclass.html"; }
function goYoutube(){ location.href="youtube.html"; }
function goPDF(){ location.href="pdf.html"; }
function goSearch(){ location.href="search.html"; }
function goProfile(){ location.href="student.html"; }
function goTest(){ location.href="test.html"; }
function goReview(){ location.href="review.html"; }
function goBook(){ location.href="headwaybook.html"; }

// 🔐 حماية الأدمن
function isAdmin(){
  let phone = localStorage.getItem("user_phone") || "";
  phone = phone.replace(/\D/g,'');
  if(phone.startsWith("0")) phone = phone.substring(1);
  return phone === "544507401";
}

function goDashboard(){
  if(!isAdmin()){
    alert("🚫 هذه الصفحة للمسؤول فقط");
    return;
  }
  location.href="mydashboard.html";
}

function goUpdate1(){
  if(!isAdmin()){
    alert("🚧 الصفحة تحت الإنشاء");
    return;
  }
  location.href="update1.html";
}

function goUpdate2(){
  if(!isAdmin()){
    alert("🔄 الصفحة تحت التحديث");
    return;
  }
  location.href="update2.html";
}

// خروج
function logout(){
  localStorage.clear();
  location.href="login.html";
}

</script>

</body>
</html>
