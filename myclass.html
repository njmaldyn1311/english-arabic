// عدد المفردات المحفوظة للطالب في Supabase
async function refreshSavedWordCount() {
  const countEl = document.getElementById("savedWordCount");
  if (!countEl) return;
  try {
    const url = SUPABASE_URL + "/rest/v1/user_star_words?select=user_id&user_id=eq." + encodeURIComponent(user_id);
    const response = await fetch(url, {
      method: "GET",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        Prefer: "count=exact",
        Range: "0-0"
      },
      cache: "no-store"
    });
    if (!response.ok) throw new Error(await response.text());
    const range = response.headers.get("Content-Range") || "";
    const match = range.match(/\/(\d+|\*)$/);
    if (match && match[1] !== "*") {
      countEl.textContent = match[1];
    } else {
      const rows = await response.json();
      countEl.textContent = Array.isArray(rows) ? String(rows.length) : "0";
    }
  } catch (error) {
    console.debug("Could not load saved word count", error);
    countEl.textContent = "—";
  }
}

    saveButton.textContent = "⭐ حفظ في مفرداتي";
  }
  const card = document.getElementById("wordMeaningCard");
  const wordEl = document.getElementById("meaningWord");
  const arEl = document.getElementById("meaningArabic");
  const definitionEl = document.getElementById("meaningDefinition");
  const metaEl = document.getElementById("meaningMeta");
  if (!card) return;
  wordEl.textContent = word;
  arEl.textContent = arabicMeaning || "جارٍ البحث عن المعنى...";
  arEl.classList.toggle("meaning-toast-loading", !arabicMeaning);
  if (definitionEl) {
    definitionEl.textContent = definition || "";
    definitionEl.style.display = definition ? "block" : "none";
  }
  metaEl.textContent = metaText || (arabicMeaning ? "المعنى بالعربية" : "يتم جلب المعنى للكلمة...");
  card.classList.add("show");
  clearTimeout(meaningCardTimer);
  if (arabicMeaning) meaningCardTimer = setTimeout(() => card.classList.remove("show"), 7000);
}
function lookupLocalMeaning(word) {
  const key = normalizeWord(word);
  let found = currentWordMeanings.get(key);
  if (found) return found;
  const candidates = [
    key.replace(/'s$/i, ""), key.replace(/'re$/i, ""),
    key.replace(/'ve$/i, ""), key.replace(/'ll$/i, ""),
    key.replace(/ies$/i, "y"), key.replace(/(ing|ed|es|s)$/i, "")
  ].filter(Boolean);
  for (const candidate of candidates) {
    found = currentWordMeanings.get(candidate);
    if (found) return found;
  }
  return null;
}

async function fetchJsonWithTimeout(url, timeoutMs = 7000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { method: "GET", mode: "cors", cache: "no-store", signal: controller.signal });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

async function fetchArabicMeaning(word) {
  const key = normalizeWord(word);
  if (onlineMeaningCache.has(key)) return onlineMeaningCache.get(key);

  // مصدر ترجمة عام أول، ثم بديل في حال عدم توفره.
  const services = [
    async () => {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=" + encodeURIComponent(word);
      const data = await fetchJsonWithTimeout(url);
      const translated = Array.isArray(data?.[0])
        ? data[0].map(part => Array.isArray(part) ? part[0] : "").join("").trim()
        : "";
      if (!translated || normalizeWord(translated) === key) throw new Error("No translation returned");
      return translated;
    },
    async () => {
      const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(word) + "&langpair=en|ar";
      const data = await fetchJsonWithTimeout(url);
      const translated = String(data?.responseData?.translatedText || "").trim();
      if (!translated || data?.responseStatus === 429 || /MYMEMORY WARNING/i.test(translated)) throw new Error("No translation returned");
      return translated.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, "&");
    }
  ];

  for (const service of services) {
    try {
      const meaning = await service();
      onlineMeaningCache.set(key, meaning);
      return meaning;
    } catch (error) {
      console.debug("Meaning provider unavailable", error);
    }
  }
  throw new Error("تعذر جلب الترجمة من خدمات الترجمة حالياً.");
}

async function handleStoryWordClick(word) {
  // انطق الكلمة فور الضغط، مع تفضيل صوت إنجليزي رجالي إذا كان متاحاً في الجهاز.
  speakWord(word);
  const local = lookupLocalMeaning(word);
  if (local?.ar) {
    showWordMeaning(word, local.ar, local.category ? "القسم: " + (categoryLabels[local.category] || local.category) : "من مفردات الدرس", local.category || "story", local.definition_ar || "");
    return;
  }

  const cached = onlineMeaningCache.get(normalizeWord(word));
  if (cached) {
    showWordMeaning(word, cached, "ترجمة عربية تلقائية؛ قد يختلف المعنى بحسب السياق.", "story");
    return;
  }

  showWordMeaning(word, "", "جارٍ جلب المعنى العربي للكلمة...");
  try {
    const meaning = await fetchArabicMeaning(word);
    if (normalizeWord(document.getElementById("meaningWord")?.textContent) !== normalizeWord(word)) return;
    showWordMeaning(word, meaning, "ترجمة عربية تلقائية؛ اختر المعنى الأنسب لسياق الجملة.", "story");
    currentWordMeanings.set(normalizeWord(word), { en: word, ar: meaning, category: "story", definition_ar: "" });
  } catch (error) {
    console.warn("Could not resolve word meaning", error);
    if (normalizeWord(document.getElementById("meaningWord")?.textContent) !== normalizeWord(word)) return;
    showWordMeaning(word, "لم نتمكن من جلب المعنى الآن. اضغط على الكلمة مرة أخرى للمحاولة.", "تعذر الاتصال بخدمة الترجمة مؤقتاً.");
  }
}
function normalizeWord(value) {
  return String(value || "").toLowerCase().replace(/[’‘]/g, "'").replace(/^[^a-z]+|[^a-z']+$/gi, "").trim();
}

function chooseMaleEnglishVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
  const english = voices.filter(v => /^en([_-]|$)/i.test(v.lang || ''));
  if (!english.length) {
    maleVoiceAvailable = false;
    maleEnglishVoice = null;
    return null;
  }

  // Prefer voices explicitly labelled male, including common Android/Google/Microsoft names.
  const maleHints = /\b(male|man|masculine|david|daniel|alex|fred|guy|mark|james|oliver|aaron|eric|brian|thomas|matthew|christopher|andrew|arthur|tom|rishi|ryan|george|liam|lee|gordon|jordan|michael|google uk english male|microsoft guy)\b/i;
  const femaleHints = /\b(female|woman|feminine|samantha|victoria|karen|moira|tessa|susan|zira|jenny|aria|ava|emma|olivia|salli|sarah|fiona|kate|lucy|allison|joanna|veena|serena|natasha|hazel)\b/i;
  const ranked = english.map(v => {
    const label = `${v.name || ''} ${v.voiceURI || ''} ${v.gender || ''}`;
    let score = 0;
    if (/male/i.test(v.gender || '') || maleHints.test(label)) score += 100;
    if (/female/i.test(v.gender || '') || femaleHints.test(label)) score -= 150;
    if (/en-US/i.test(v.lang || '')) score += 8;
    if (/en-GB/i.test(v.lang || '')) score += 5;
    if (v.default) score += 1;
    return { voice: v, score };
  }).sort((a, b) => b.score - a.score);

  const explicitMale = ranked.find(x => x.score >= 100);
  maleVoiceAvailable = !!explicitMale;
  maleEnglishVoice = explicitMale?.voice || ranked[0]?.voice || null;
  return maleEnglishVoice;
}

function updateVoiceNotice() {
  const note = document.getElementById('readNoteText');
  if (!note) return;
  if (maleVoiceAvailable && maleEnglishVoice) {
    note.textContent = 'الصوت الرجالي المتاح: ' + maleEnglishVoice.name;
  } else {
    note.textContent = 'لا يوفر هذا الجهاز صوتاً رجالياً محدداً؛ استُخدم صوت إنجليزي بطبقة أخفض';
  }
}

function speakWord(text) {
  if (!text || !('speechSynthesis' in window)) return;
  storyPlaybackGeneration++;
  speechSynthesis.cancel();
  clearReadingFallback();
  if (paragraphAdvanceTimer) clearTimeout(paragraphAdvanceTimer);
  paragraphAdvanceTimer = null;
  storyUtterance = null;
  storyReadingState = 'idle';
  resetStoryControls();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = Math.max(0.8, storyRate);
  const voice = chooseMaleEnglishVoice();
  if (voice) utterance.voice = voice;
  utterance.pitch = maleVoiceAvailable ? 1 : 0.62;
  speechSynthesis.speak(utterance);
}

function splitStoryParagraphs(text) {
  return String(text || '').replace(/\r/g, '').split(/\n\s*\n|\n/).map(x => x.trim()).filter(Boolean);
}

function renderClickableStory(text, element, paragraphIndex) {
  const source = String(text || '');
  element.replaceChildren();
  const paragraphData = storyParagraphsData[paragraphIndex];
  const regex = /[A-Za-z]+(?:[’'][A-Za-z]+)*(?:-[A-Za-z]+)*/g;
  let cursor = 0;
  let match;
  while ((match = regex.exec(source)) !== null) {
    if (match.index > cursor) element.appendChild(document.createTextNode(source.slice(cursor, match.index)));
    const wordText = match[0];
    const span = document.createElement('span');
    span.className = 'story-word';
    span.textContent = wordText;
    span.dataset.start = String(match.index);
    span.dataset.end = String(match.index + wordText.length);
    span.dataset.paragraph = String(paragraphIndex);
    span.title = 'اضغط لسماع الكلمة ومعرفة معناها';
    span.addEventListener('click', () => handleStoryWordClick(wordText));
    element.appendChild(span);
    storyWordSpans.push(span);
    paragraphData.wordSpans.push(span);
    cursor = match.index + wordText.length;
  }
  if (cursor < source.length) element.appendChild(document.createTextNode(source.slice(cursor)));
}

function clearStoryHighlight() {
  storyWordSpans.forEach(span => span.classList.remove('is-speaking'));
  activeHighlightSpan = null;
}

function clearReadingFallback() {
  if (readingFallbackTimer) clearInterval(readingFallbackTimer);
  readingFallbackTimer = null;
  fallbackStartedAt = 0;
  fallbackPausedAt = 0;
  fallbackAnchorAt = 0;
  fallbackAnchorIndex = 0;
  lastBoundaryAt = 0;
  nativeBoundarySeen = false;
}

function showParagraphTranslation(index) {
  const fullArabicPanel = document.getElementById('fullArabicTranslationPanel');
  if (fullArabicPanel) fullArabicPanel.style.display = 'none';
  storyParagraphsData.forEach((item, i) => {
    item.block.classList.toggle('active-reading', i === index);
    item.translationCard.classList.toggle('active', i === index);
  });
  const current = storyParagraphsData[index];
  if (current?.block) {
    const rect = current.block.getBoundingClientRect();
    const dockHeight = document.getElementById('readingDock')?.offsetHeight || 0;
    if (rect.top < 78 || rect.top > window.innerHeight - dockHeight - 100) {
      current.block.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
    }
  }
}

function hideParagraphTranslations() {
  storyParagraphsData.forEach(item => {
    item.block.classList.remove('active-reading');
    item.translationCard.classList.remove('active');
  });
  const fullArabicPanel = document.getElementById('fullArabicTranslationPanel');
  if (fullArabicPanel) fullArabicPanel.style.display = 'block';
}

function findWordSpanAt(paragraphIndex, charIndex) {
  const para = storyParagraphsData[paragraphIndex];
  if (!para) return null;
  return para.wordSpans.find(span => charIndex >= Number(span.dataset.start) && charIndex < Number(span.dataset.end))
    || para.wordSpans.find(span => Number(span.dataset.end) > charIndex)
    || null;
}

function highlightStoryAt(paragraphIndex, charIndex) {
  if (!Number.isFinite(charIndex)) return;
  const active = findWordSpanAt(paragraphIndex, charIndex);
  storyWordSpans.forEach(span => span.classList.toggle('is-speaking', span === active));
  if (active) {
    storyCurrentParagraphIndex = paragraphIndex;
    storyCurrentCharIndex = Number(active.dataset.start);
    storyResumeOffset = storyCurrentCharIndex;
  }
  if (active && active !== activeHighlightSpan) {
    activeHighlightSpan = active;
    const rect = active.getBoundingClientRect();
    const dockHeight = document.getElementById('readingDock')?.offsetHeight || 0;
    const safeBottom = window.innerHeight - dockHeight - 18;
    if (rect.top < 78 || rect.bottom > safeBottom) {
      active.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
    }
  }
}

function estimatedWordDuration(span) {
  const word = (span?.textContent || '').toLowerCase();
  const syllables = Math.max(1, Math.min(5, (word.match(/[aeiouy]+/g) || []).length));
  let seconds = (0.14 + syllables * 0.115) / Math.max(0.65, storyRate);
  if (/[,:;]$/.test(word)) seconds += 0.12;
  if (/[.!?]$/.test(word)) seconds += 0.22;
  return Math.max(0.18, seconds);
}

function startFallbackWordTracking(paragraphIndex, initialOffset) {
  clearReadingFallback();
  const para = storyParagraphsData[paragraphIndex];
  if (!para) return;
  const words = para.wordSpans;
  const initialIndex = Math.max(0, words.findIndex(span => Number(span.dataset.end) > initialOffset));
  if (!words.length || initialIndex < 0) return;

  // Highlight the first word immediately, so the audio never starts visibly ahead of the tracker.
  fallbackAnchorIndex = initialIndex;
  fallbackAnchorAt = Date.now();
  fallbackStartedAt = fallbackAnchorAt;
  highlightStoryAt(paragraphIndex, Number(words[initialIndex].dataset.start));

  readingFallbackTimer = setInterval(() => {
    if (storyReadingState !== 'speaking' || !fallbackAnchorAt) return;
    // Native word-boundary callbacks are more accurate; only estimate during a callback gap.
    if (nativeBoundarySeen && lastBoundaryAt && Date.now() - lastBoundaryAt < 1100) return;

    let index = fallbackAnchorIndex;
    let elapsed = (Date.now() - fallbackAnchorAt) / 1000;
    while (index < words.length - 1) {
      const duration = estimatedWordDuration(words[index]);
      if (elapsed < duration) break;
      elapsed -= duration;
      index++;
    }
    if (index !== fallbackAnchorIndex || !activeHighlightSpan) {
      fallbackAnchorIndex = index;
      fallbackAnchorAt = Date.now() - Math.max(0, elapsed * 1000);
      const selected = words[index];
      if (selected) highlightStoryAt(paragraphIndex, Number(selected.dataset.start));
    }
  }, 100);
}

function resetStoryControls() {
  const read = document.getElementById('readStoryBtn');
  const pause = document.getElementById('pauseStoryBtn');
  if (read) read.textContent = '🔊 قراءة القصة';
  if (pause) {
    pause.textContent = '⏸ إيقاف مؤقت';
    pause.disabled = true;
  }
  storyReadingState = 'idle';
  storyResumeOffset = 0;
  pendingNextParagraphIndex = null;
  if (paragraphAdvanceTimer) clearTimeout(paragraphAdvanceTimer);
  paragraphAdvanceTimer = null;
  clearReadingFallback();
  clearStoryHighlight();
  hideParagraphTranslations();
}

function finishStoryReading(generation) {
  if (generation !== storyPlaybackGeneration) return;
  storyUtterance = null;
  storyCurrentCharIndex = 0;
  storyResumeOffset = 0;
  pendingNextParagraphIndex = null;
  clearReadingFallback();
  resetStoryControls();
}

function updatePauseButton(label, disabled = false) {
  const pause = document.getElementById('pauseStoryBtn');
  if (pause) {
    pause.textContent = label;
    pause.disabled = disabled;
  }
}

function speakStoryParagraph(paragraphIndex, offset, generation) {
  if (generation !== storyPlaybackGeneration) return;
  const para = storyParagraphsData[paragraphIndex];
  if (!para) return finishStoryReading(generation);
  const text = para.text;
  const safeOffset = Math.max(0, Math.min(Number(offset) || 0, text.length));
  const remaining = text.slice(safeOffset).trimStart();
  const trimGap = text.slice(safeOffset).length - remaining.length;
  const actualOffset = safeOffset + trimGap;
  if (!remaining) {
    if (paragraphIndex + 1 < storyParagraphsData.length) return speakStoryParagraph(paragraphIndex + 1, 0, generation);
    return finishStoryReading(generation);
  }

  storyCurrentParagraphIndex = paragraphIndex;
  storyCurrentCharIndex = actualOffset;
  storyResumeOffset = actualOffset;
  pendingNextParagraphIndex = null;
  clearStoryHighlight();
  showParagraphTranslation(paragraphIndex);

  const utterance = new SpeechSynthesisUtterance(remaining);
  storyUtterance = utterance;
  utterance.lang = 'en-US';
  utterance.rate = storyRate;
  const voice = chooseMaleEnglishVoice();
  if (voice) utterance.voice = voice;
  // A lower pitch is only a fallback when this device has no explicitly male English voice.
  utterance.pitch = maleVoiceAvailable ? 1 : 0.62;

  storyReadingState = 'speaking';
  const readButton = document.getElementById('readStoryBtn');
  if (readButton) readButton.textContent = '🔄 إعادة من البداية';
  updatePauseButton('⏸ إيقاف مؤقت', false);
  updateVoiceNotice();

  startFallbackWordTracking(paragraphIndex, actualOffset);
  let lastNativeCharIndex = -1;
  utterance.onboundary = event => {
    if (storyUtterance !== utterance || generation !== storyPlaybackGeneration) return;
    if (!Number.isFinite(event.charIndex)) return;
    const relative = Math.max(0, Number(event.charIndex));
    if (relative < lastNativeCharIndex) return;
    lastNativeCharIndex = relative;
    const absolute = Math.min(text.length, actualOffset + relative);
    const span = findWordSpanAt(paragraphIndex, absolute);
    if (span) {
      nativeBoundarySeen = true;
      lastBoundaryAt = Date.now();
      const idx = para.wordSpans.indexOf(span);
      if (idx >= 0) {
        fallbackAnchorIndex = idx;
        fallbackAnchorAt = Date.now();
      }
      highlightStoryAt(paragraphIndex, Number(span.dataset.start));
    }
  };

  utterance.onend = () => {
    if (storyUtterance !== utterance || generation !== storyPlaybackGeneration) return;
    clearReadingFallback();
    storyUtterance = null;
    const nextIndex = paragraphIndex + 1;
    if (nextIndex < storyParagraphsData.length) {
      // Keep the just-read paragraph translation visible briefly before advancing.
      storyReadingState = 'between';
      pendingNextParagraphIndex = nextIndex;
      updatePauseButton('⏸ إيقاف مؤقت', false);
      const translationCard = para.translationCard;
      if (translationCard) translationCard.classList.add('active');
      paragraphAdvanceTimer = setTimeout(() => {
        if (generation === storyPlaybackGeneration && storyReadingState === 'between') {
          paragraphAdvanceTimer = null;
          speakStoryParagraph(nextIndex, 0, generation);
        }
      }, 950);
    } else {
      finishStoryReading(generation);
    }
  };

  utterance.onerror = event => {
    if (generation !== storyPlaybackGeneration || storyUtterance !== utterance) return;
    if (event.error === 'canceled' || event.error === 'interrupted') return;
    console.warn('Speech synthesis error', event.error);
    finishStoryReading(generation);
  };

  // Give mobile browsers a fresh synthesis queue for each paragraph.
  speechSynthesis.speak(utterance);
}

function startStoryReading(fromBeginning = false, paragraphIndex = null, startAt = 0) {
  if (!storyParagraphsData.length) return;
  if (!('speechSynthesis' in window)) {
    alert('ميزة القراءة الصوتية غير مدعومة في هذا المتصفح.');
    return;
  }
  const startParagraph = fromBeginning ? 0 : (Number.isInteger(paragraphIndex) ? paragraphIndex : (storyReadingState === 'idle' ? 0 : storyCurrentParagraphIndex));
  const startOffset = fromBeginning ? 0 : (Number.isInteger(paragraphIndex) ? startAt : 0);
  storyPlaybackGeneration++;
  const generation = storyPlaybackGeneration;
  if (paragraphAdvanceTimer) clearTimeout(paragraphAdvanceTimer);
  paragraphAdvanceTimer = null;
  speechSynthesis.cancel();
  storyUtterance = null;
  clearReadingFallback();
  clearStoryHighlight();
  speakStoryParagraph(startParagraph, startOffset, generation);
}

function currentWordStartForResume() {
  const active = storyWordSpans.find(span => span.classList.contains('is-speaking') && Number(span.dataset.paragraph) === storyCurrentParagraphIndex);
  return active ? Number(active.dataset.start) : storyResumeOffset || storyCurrentCharIndex;
}

function updateStoryRate(value, applyImmediately = false) {
  const parsed = Math.min(1.25, Math.max(0.65, Number(value) || 0.8));
  storyRate = parsed;
  localStorage.setItem(savedStoryRateKey, String(storyRate));
  const output = document.getElementById('storyRateValue');
  if (output) output.textContent = storyRate.toFixed(2) + '×';
  if (!applyImmediately) return;
  if (storyReadingState === 'speaking' && storyUtterance) {
    const resumeAt = currentWordStartForResume();
    startStoryReading(false, storyCurrentParagraphIndex, resumeAt);
  }
  // If paused, keep the saved position and apply the new speed when the student resumes.
}

function toggleStoryPause() {
  if (!('speechSynthesis' in window)) return;
  const pause = document.getElementById('pauseStoryBtn');

  if (storyReadingState === 'speaking' && storyUtterance) {
    // Do not rely on speechSynthesis.pause() on mobile browsers: cancel and remember the active word.
    storyResumeOffset = currentWordStartForResume();
    storyCurrentCharIndex = storyResumeOffset;
    storyPlaybackGeneration++;
    speechSynthesis.cancel();
    storyUtterance = null;
    clearReadingFallback();
    storyReadingState = 'paused';
    if (pause) {
      pause.textContent = '▶ استكمال القراءة';
      pause.disabled = false;
    }
    return;
  }

  if (storyReadingState === 'between' && pendingNextParagraphIndex !== null) {
    if (paragraphAdvanceTimer) clearTimeout(paragraphAdvanceTimer);
    paragraphAdvanceTimer = null;
    storyReadingState = 'paused-between';
    if (pause) {
      pause.textContent = '▶ استكمال القراءة';
      pause.disabled = false;
    }
    return;
  }

  if (storyReadingState === 'paused') {
    startStoryReading(false, storyCurrentParagraphIndex, storyResumeOffset);
    return;
  }

  if (storyReadingState === 'paused-between' && pendingNextParagraphIndex !== null) {
    startStoryReading(false, pendingNextParagraphIndex, 0);
  }
}

function stopStoryReading() {
  storyPlaybackGeneration++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  storyUtterance = null;
  resetStoryControls();
}

async function saveWord(button, en, ar, category) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = "…";
  try {
    const query = SUPABASE_URL + "/rest/v1/user_star_words?select=word&user_id=eq." + encodeURIComponent(user_id) + "&word=eq." + encodeURIComponent(en);
    const check = await fetch(query, {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
      cache: "no-store"
    });
    if (!check.ok) throw new Error(await check.text());
    const existing = await check.json();
    if (Array.isArray(existing) && existing.length) {
      button.textContent = "✅";
      button.title = "المفردة محفوظة مسبقاً";
      return;
    }

    const response = await fetch(SUPABASE_URL + "/rest/v1/user_star_words", {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({ user_id, word: en, translation: ar, category: category || "story" })
    });
    if (!response.ok) throw new Error(await response.text());
    button.textContent = "✅";
    button.title = "تم حفظ المفردة";
    track("حفظ كلمة: " + en);
    await refreshSavedWordCount();
  } catch (error) {
    console.error(error);
    button.textContent = original;
    alert("تعذر حفظ المفردة. تحقق من صلاحيات جدول user_star_words ووجود عمود category.");
  } finally {
    button.disabled = false;
  }
}

async function saveMeaningCardWord() {
  if (!currentMeaningWord || !currentMeaningArabic) return;
  const button = document.getElementById("meaningSaveBtn");
  await saveWord(button, currentMeaningWord, currentMeaningArabic, currentMeaningCategory || "story");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

const categoryLabels = {
  verbs: "verbs",
  nouns: "nouns",
  adjectives: "adjectives",
  phrasal_verbs: "phrasal verbs",
  idioms: "idioms",
  adverbs: "adverbs"
};

function buildWordMeanings(words) {
  currentWordMeanings = new Map();
  for (const key of Object.keys(categoryLabels)) {
    const entries = Array.isArray(words?.[key]) ? words[key] : [];
    for (const entry of entries) {
      const en = String(entry?.en || "").trim();
      const ar = String(entry?.ar || "").trim();
      if (!en || !ar) continue;
      const normalized = normalizeWord(en);
      if (normalized && !currentWordMeanings.has(normalized)) {
        currentWordMeanings.set(normalized, { en, ar, category: key, definition_ar: String(entry?.definition_ar || entry?.description_ar || "").trim() });
      }
    }
  }
}

function renderWords(words) {
  buildWordMeanings(words);
  const fragment = document.createElement("div");
  for (const key of Object.keys(categoryLabels)) {
    const entries = Array.isArray(words?.[key]) ? words[key] : [];
    const category = document.createElement("section");
    category.className = "category-card";
    const heading = document.createElement("h3");
    heading.className = "category-title";
    heading.textContent = categoryLabels[key];
    category.appendChild(heading);

    if (!entries.length) {
      const empty = document.createElement("div");
      empty.className = "empty-cat";
      empty.textContent = "لا توجد مفردات في هذا القسم.";
      category.appendChild(empty);
    }

    for (const entry of entries) {
      const en = String(entry?.en || "").trim();
      const ar = String(entry?.ar || "").trim();
      if (!en) continue;
      const row = document.createElement("div");
      row.className = "word-row";

      const english = document.createElement("span");
      english.className = "word-en clickable-word";
      english.textContent = en;
      english.title = "اضغط لسماع الكلمة ومعرفة معناها";
      english.addEventListener("click", () => handleStoryWordClick(en));

      const actions = document.createElement("div");
      actions.className = "word-actions";

      const save = document.createElement("button");
      save.className = "icon-btn";
      save.type = "button";
      save.textContent = "⭐";
      save.title = "حفظ المفردة";
      save.setAttribute("aria-label", "حفظ " + en);
      save.addEventListener("click", () => saveWord(save, en, ar, key));

      const sound = document.createElement("button");
      sound.className = "icon-btn";
      sound.type = "button";
      sound.textContent = "🔊";
      sound.title = "استمع إلى النطق";
      sound.setAttribute("aria-label", "نطق " + en);
      sound.addEventListener("click", () => speakWord(en));

      actions.append(save, sound);

      const arabicWrap = document.createElement("div");
      arabicWrap.className = "word-ar-wrap";
      const arabic = document.createElement("span");
      arabic.className = "word-ar";
      arabic.textContent = ar;
      arabicWrap.appendChild(arabic);
      const definition = String(entry?.definition_ar || entry?.description_ar || "").trim();
      if (definition) {
        const definitionEl = document.createElement("span");
        definitionEl.className = "word-ar-description";
        definitionEl.textContent = definition;
        arabicWrap.appendChild(definitionEl);
      }

      row.append(english, actions, arabicWrap);
      category.appendChild(row);
    }
    fragment.appendChild(category);
  }
  return fragment;
}

async function refreshSavedLessonCount() {
  const countEl = document.getElementById("savedLessonCount");
  const dockCountEl = document.getElementById("dockSavedLessonCount");
  if (!countEl && !dockCountEl) return;
  try {
    const url = SUPABASE_URL + "/rest/v1/user_saved_lessons?select=id&user_id=eq." + encodeURIComponent(user_id);
    const response = await fetch(url, {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, Prefer: "count=exact" },
      cache: "no-store"
    });
    if (!response.ok) throw new Error(await response.text());
    const rows = await response.json();
    const count = String(Array.isArray(rows) ? rows.length : 0);
    if (countEl) countEl.textContent = count;
    if (dockCountEl) dockCountEl.textContent = count;
  } catch (error) {
    console.debug("Saved lesson count unavailable", error);
    if (countEl) countEl.textContent = "—";
    if (dockCountEl) dockCountEl.textContent = "—";
  }
}

async function toggleSavedLessonsPanel() {
  const panel = document.getElementById("savedLessonsPanel");
  const opening = panel.style.display !== "block";
  panel.style.display = opening ? "block" : "none";
  if (opening) {
    await loadSavedLessons();
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

async function loadSavedLessons() {
  const list = document.getElementById("savedLessonsList");
  list.textContent = "جارٍ تحميل دروسك...";
  try {
    const url = SUPABASE_URL + "/rest/v1/user_saved_lessons?select=id,lesson_title,student_level,story,translation,words,created_at&user_id=eq." + encodeURIComponent(user_id) + "&order=created_at.desc&limit=100";
    const response = await fetch(url, {
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
      cache: "no-store"
    });
    if (!response.ok) throw new Error(await response.text());
    const rows = await response.json();
    list.replaceChildren();
    if (!Array.isArray(rows) || !rows.length) {
      list.textContent = "لا توجد دروس في قائمتك حتى الآن. سيتم حفظ الدروس الجديدة تلقائياً هنا.";
      return;
    }

    for (const row of rows) {
      const item = document.createElement("div");
      item.className = "saved-lesson-item";
      const info = document.createElement("div");
      const title = document.createElement("div");
      title.className = "saved-lesson-title";
      title.textContent = row.lesson_title || "درس بدون عنوان";
      const meta = document.createElement("div");
      meta.className = "saved-lesson-meta";
      const date = row.created_at ? new Date(row.created_at).toLocaleDateString("ar-SA") : "";
      meta.textContent = "المستوى: " + (row.student_level || "—") + (date ? " · " + date : "");
      info.append(title, meta);

      const actions = document.createElement("div");
      actions.className = "saved-lesson-actions";
      const open = document.createElement("button");
      open.className = "small-action open";
      open.type = "button";
      open.textContent = "📖 فتح الدرس";
      open.addEventListener("click", () => {
        currentLessonTitle = row.lesson_title || "درس محفوظ";
        currentSavedLessonId = row.id;
        renderLesson({
          story: row.story,
          translation: row.translation,
          words: row.words || {},
          student_level: row.student_level || storedLevel || "A1"
        }, { savedId: row.id, title: currentLessonTitle });
        document.getElementById("lesson").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      const remove = document.createElement("button");
      remove.className = "small-action delete";
      remove.type = "button";
      remove.textContent = "حذف";
      remove.addEventListener("click", () => deleteSavedLesson(row.id));
      actions.append(open, remove);
      item.append(info, actions);
      list.appendChild(item);
    }
  } catch (error) {
    console.error(error);
    list.textContent = "تعذر تحميل دروسك. تحقق من الاتصال بقاعدة البيانات وصلاحيات جدول الدروس.";
  }
}

async function deleteSavedLesson(id) {
  if (!confirm("هل تريد حذف هذا الدرس من دروسك؟")) return;
  try {
    const url = SUPABASE_URL + "/rest/v1/user_saved_lessons?id=eq." + encodeURIComponent(id) + "&user_id=eq." + encodeURIComponent(user_id);
    const response = await fetch(url, {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, Prefer: "return=minimal" }
    });
    if (!response.ok) throw new Error(await response.text());
    if (currentSavedLessonId === id) currentSavedLessonId = null;
    await loadSavedLessons();
    await refreshSavedLessonCount();
  } catch (error) {
    console.error(error);
    alert("تعذر حذف الدرس. تحقق من صلاحيات جدول user_saved_lessons.");
  }
}

async function saveCurrentLessonAutomatically() {
  if (!currentLessonData?.story) return null;
  if (currentSavedLessonId) return currentSavedLessonId;

  const lessonSnapshot = {
    user_id,
    lesson_title: currentLessonTitle || "درس جديد",
    student_level: currentLessonData.student_level || storedLevel || "A1",
    story: currentLessonData.story,
    translation: currentLessonData.translation || "",
    words: currentLessonData.words || {}
  };
  const saveKey = lessonSnapshot.lesson_title + "::" + lessonSnapshot.story;
  if (pendingLessonSaveKeys.has(saveKey)) return null;
  pendingLessonSaveKeys.add(saveKey);

  const status = document.getElementById("lessonSaveStatus");
  if (status && currentLessonData?.story === lessonSnapshot.story) {
    status.textContent = "💾 يتم حفظ الدرس تلقائياً في دروسك...";
  }

  const saveOperation = async () => {
    const response = await fetch(SUPABASE_URL + "/rest/v1/user_saved_lessons", {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify(lessonSnapshot)
    });
    if (!response.ok) throw new Error(await response.text());
    const saved = await response.json();
    const newId = Array.isArray(saved) ? saved[0]?.id || null : null;

    if (currentLessonData?.story === lessonSnapshot.story && currentLessonTitle === lessonSnapshot.lesson_title) {
      currentSavedLessonId = newId;
      const currentStatus = document.getElementById("lessonSaveStatus");
      if (currentStatus) currentStatus.textContent = "✅ تم حفظ الدرس تلقائياً في «دروسي».";
    }
    track("حفظ تلقائي لدرس: " + lessonSnapshot.lesson_title);
    await refreshSavedLessonCount();
    return newId;
  };

  const queuedOperation = lessonSaveQueue.then(saveOperation, saveOperation);
  lessonSaveQueue = queuedOperation.catch(() => null);

  try {
    return await queuedOperation;
  } catch (error) {
    console.error("Automatic lesson save failed", error);
    if (currentLessonData?.story === lessonSnapshot.story && currentLessonTitle === lessonSnapshot.lesson_title) {
      const currentStatus = document.getElementById("lessonSaveStatus");
      if (currentStatus) currentStatus.textContent = "⚠️ تعذر الحفظ التلقائي. تحقق من الاتصال بقاعدة البيانات.";
    }
    return null;
  } finally {
    pendingLessonSaveKeys.delete(saveKey);
  }
}

function splitParagraphsForLesson(value) {
  return String(value || "").replace(/\r/g, "").split(/\n\s*\n|\n/).map(part => part.trim()).filter(Boolean);
}

function renderLesson(data, options = {}) {
  const root = document.getElementById("lesson");
  root.replaceChildren();
  stopStoryReading();
  storyWordSpans = [];
  storyParagraphsData = [];
  currentWordMeanings = new Map();
  activeHighlightSpan = null;
  currentLessonData = {
    story: String(data.story || ""),
    translation: String(data.translation || ""),
    words: data.words && typeof data.words === "object" ? data.words : {},
    student_level: data.student_level || storedLevel || "A1"
  };
  if (options.title) currentLessonTitle = options.title;
  currentSavedLessonId = options.savedId || null;
  storyParagraphsData = [];

  const lessonCard = document.createElement("section");
  lessonCard.className = "card lesson-card";

  const storyHead = document.createElement("div");
  storyHead.className = "section-head";
  const storyTitle = document.createElement("h2");
  storyTitle.className = "section-title";
  storyTitle.textContent = "📖 القصة";
  const level = document.createElement("span");
  level.className = "level-pill";
  level.textContent = "المستوى: " + (data.student_level || storedLevel || "A1");

  const readControls = document.createElement("div");
  readControls.className = "read-controls";
  const readButton = document.createElement("button");
  readButton.type = "button";
  readButton.id = "readStoryBtn";
  readButton.className = "read-btn";
  readButton.textContent = "🔊 قراءة القصة";
  readButton.addEventListener("click", () => startStoryReading(storyReadingState !== "idle"));

  const pauseButton = document.createElement("button");
  pauseButton.type = "button";
  pauseButton.id = "pauseStoryBtn";
  pauseButton.className = "read-btn pause";
  pauseButton.textContent = "⏸ إيقاف مؤقت";
  pauseButton.disabled = true;
  pauseButton.addEventListener("click", toggleStoryPause);

  const restartButton = document.createElement("button");
  restartButton.type = "button";
  restartButton.id = "restartStoryBtn";
  restartButton.className = "read-btn";
  restartButton.textContent = "↻ من البداية";
  restartButton.addEventListener("click", () => startStoryReading(true));

  const stopButton = document.createElement("button");
  stopButton.type = "button";
  stopButton.className = "read-btn stop";
  stopButton.textContent = "⏹ إيقاف";
  stopButton.addEventListener("click", stopStoryReading);

  const speedWrap = document.createElement("label");
  speedWrap.className = "read-speed";
  speedWrap.htmlFor = "storySpeedRange";
  const speedLabel = document.createElement("span");
  speedLabel.textContent = "سرعة القراءة";
  const speedRange = document.createElement("input");
  speedRange.type = "range";
  speedRange.id = "storySpeedRange";
  speedRange.min = "0.65";
  speedRange.max = "1.25";
  speedRange.step = "0.05";
  speedRange.value = String(storyRate);
  speedRange.setAttribute("aria-label", "سرعة قراءة القصة");
  const speedValue = document.createElement("output");
  speedValue.id = "storyRateValue";
  speedValue.textContent = storyRate.toFixed(2) + "×";
  speedRange.addEventListener("input", () => { speedValue.textContent = Number(speedRange.value).toFixed(2) + "×"; });
  speedRange.addEventListener("change", () => updateStoryRate(speedRange.value, true));
  speedWrap.append(speedLabel, speedRange, speedValue);

  const readNote = document.createElement("span");
  readNote.className = "read-note";
  readNote.id = "readNoteText";
  readNote.textContent = "اضغط على أي كلمة لسماعها ومعرفة معناها";
  readControls.append(readButton, pauseButton, restartButton, stopButton, speedWrap, readNote);
  storyHead.append(storyTitle, level);
  const dockControls = document.getElementById("readingDockControls");
  dockControls.replaceChildren(readControls);
  document.getElementById("readingDock").style.display = "flex";
  document.body.classList.add("has-reading-dock");
  lessonCard.appendChild(storyHead);

  const saveStatus = document.createElement("div");
  saveStatus.id = "lessonSaveStatus";
  saveStatus.className = "lesson-save-status";
  saveStatus.textContent = currentSavedLessonId ? "✅ هذا الدرس محفوظ في دروسك." : "💾 سيتم حفظ هذا الدرس تلقائياً في دروسك.";
  lessonCard.appendChild(saveStatus);

  const storyParts = splitParagraphsForLesson(data.story || "لم تصل القصة.");
  const translationParts = splitParagraphsForLesson(data.translation || "");
  const englishPanel = document.createElement("div");
  englishPanel.className = "story-panel";
  englishPanel.dir = "ltr";
  englishPanel.lang = "en";
  const englishLabel = document.createElement("div");
  englishLabel.className = "story-label";
  englishLabel.textContent = "English Story";
  englishPanel.appendChild(englishLabel);

  storyParts.forEach((paragraphText, index) => {
    const block = document.createElement("div");
    block.className = "story-paragraph-block";
    const englishText = document.createElement("p");
    englishText.className = "story story-en story-paragraph";
    englishText.setAttribute("dir", "ltr");
    englishText.setAttribute("lang", "en");

    const translationCard = document.createElement("div");
    translationCard.className = "paragraph-translation-follow";
    const translationLabel = document.createElement("span");
    translationLabel.className = "paragraph-translation-label";
    translationLabel.textContent = "ترجمة هذه الفقرة";
    const translationText = document.createElement("span");
    translationText.className = "paragraph-translation-text";
    translationText.textContent = translationParts[index] || (storyParts.length === 1 && translationParts.length === 1 ? translationParts[0] : "لم تصل ترجمة مستقلة لهذه الفقرة؛ راجع الترجمة الكاملة أسفل القصة.");
    translationCard.append(translationLabel, translationText);

    const paragraphData = {
      text: paragraphText,
      translation: translationText.textContent,
      block,
      element: englishText,
      translationCard,
      wordSpans: []
    };
    storyParagraphsData.push(paragraphData);
    renderClickableStory(paragraphText, englishText, index);
    block.append(englishText, translationCard);
    englishPanel.appendChild(block);
  });
  lessonCard.appendChild(englishPanel);

  const arabicPanel = document.createElement("div");
  arabicPanel.className = "story-panel";
  arabicPanel.id = "fullArabicTranslationPanel";
  arabicPanel.dir = "rtl";
  arabicPanel.lang = "ar";
  const arabicLabel = document.createElement("div");
  arabicLabel.className = "story-label";
  arabicLabel.textContent = "الترجمة العربية";
  const arabicText = document.createElement("p");
  arabicText.className = "story story-ar";
  arabicText.setAttribute("dir", "rtl");
  arabicText.setAttribute("lang", "ar");
  arabicText.textContent = data.translation || "⚠️ لا توجد ترجمة";
  arabicPanel.append(arabicLabel, arabicText);
  lessonCard.appendChild(arabicPanel);

  if (data.words && typeof data.words === "object") lessonCard.appendChild(renderWords(data.words));

  if (data.profile_notice) {
    const notice = document.createElement("p");
    notice.className = "profile-note";
    notice.textContent = data.profile_notice;
    lessonCard.appendChild(notice);
  }

  root.appendChild(lessonCard);
  track("اكتمال إنشاء الدرس");
  if (!options.savedId && options.autoSave !== false) saveCurrentLessonAutomatically();
}
async function generateLesson() {
  const input = document.getElementById("textInput").value.trim();
  if (!input) {
    alert("اكتب موضوع الدرس أولاً");
    return;
  }

  const button = document.getElementById("generateBtn");
  const root = document.getElementById("lesson");
  currentLessonTitle = input;
  currentSavedLessonId = null;
  button.disabled = true;
  button.textContent = "⏳ جارٍ الإنشاء...";
  root.innerHTML = '<div class="card loading">⏳ جاري إعداد القصة والترجمة والمفردات بما يناسب مستواك...</div>';
  track("إنشاء درس بمستوى الطالب");

  try {
    const response = await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ inputPart: input, type: "text", user_id, phone, student_level: storedLevel })
    });
    const raw = await response.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error("استجابة غير مفهومة من n8n: " + raw.slice(0, 250)); }
    if (!response.ok || data.success === false) {
      throw new Error(data.message || data.error || "تعذر إنشاء الدرس.");
    }
    document.getElementById("textInput").value = "";
    renderLesson(data);
  } catch (error) {
    console.error(error);
    root.innerHTML = '<div class="card error">❌ ' + escapeHTML(error.message || "حدث خطأ أثناء إنشاء الدرس") + '</div>';
  } finally {
    button.disabled = false;
    button.textContent = "🚀 إنشاء الدرس";
  }
}

document.getElementById("closeMeaningCard").addEventListener("click", () => {
  clearTimeout(meaningCardTimer);
  document.getElementById("wordMeaningCard").classList.remove("show");
});
document.getElementById("meaningSaveBtn").addEventListener("click", saveMeaningCardWord);
document.getElementById("generateBtn").addEventListener("click", generateLesson);
document.getElementById("textInput").addEventListener("keydown", event => {
  if (event.key === "Enter") generateLesson();
});
window.addEventListener("beforeunload", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
});
