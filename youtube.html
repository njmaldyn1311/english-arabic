<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning</title>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.input-box {
  display: flex;
  justify-content: center;
}

input {
  padding: 10px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;
  text-align: center;
}

button {
  background: #22c55e;
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

/* الفيديو */
#videoBox {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #0f172a;
  position: relative;
}

iframe {
  width: 100%;
  height: 250px;
  border-radius: 15px;
}

/* 🔥 Netflix subtitle */
.subtitle-box {
  position: absolute;
  bottom: 15px;
  width: 100%;
  text-align: center;
}

.subtitle-en {
  font-size: 16px;
  font-weight: bold;
  text-shadow: 0 0 6px black;
}

.subtitle-ar {
  font-size: 14px;
  color: #facc15;
  text-shadow: 0 0 6px black;
}

/* النص */
.line {
  text-align: left;
  margin: 10px 0;
  line-height: 1.8;
}

.en { color: #38bdf8; font-weight: bold; }
.ar { color: #f87171; margin-left: 10px; }
.star { cursor: pointer; margin-left: 10px; }
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<div class="input-box">
  <input type="text" id="url" placeholder="ضع رابط YouTube">
</div>

<button onclick="sendUrl()">🔗 تحليل</button>

<p id="loading" style="display:none;">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <iframe id="videoFrame"></iframe>

  <div class="subtitle-box">
    <div id="subEn" class="subtitle-en"></div>
    <div id="subAr" class="subtitle-ar"></div>
  </div>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

let user_id = localStorage.getItem("user_id");
let videoId = "";

let subtitles = [];
let subtitleInterval = null;

/* استخراج ID */
function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

/* عرض الفيديو */
function showVideo(url) {
  videoId = getVideoId(url);

  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}?autoplay=1`;

  document.getElementById("videoBox").style.display = "block";
}

/* حفظ */
async function saveWord(el, word, translation){
  await fetch(SUPABASE_URL + "/rest/v1/user_words", {
    method:"POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id,
      word,
      translation
    })
  });

  el.innerText = "✅";
}

/* عرض البيانات */
function show(data) {

  let html = "";
  subtitles = [];

  for (let cat in data) {

    if (!Array.isArray(data[cat])) continue;

    data[cat].forEach(w => {

      // 🔥 جمع الترجمة
      subtitles.push({
        time: w.time || 0,
        en: w.example || "",
        ar: w.example_ar || ""
      });

      const word = w.en || w.word || "";
      const arabic = w.ar || w.arabic || "";

      html += `
        <div class="line">
          <span class="en">${word}</span>
          <span class="ar">${arabic}</span>
          <span class="star" onclick="saveWord(this,'${word}','${arabic}')">⭐</span>
        </div>
      `;
    });
  }

  subtitles.sort((a,b)=>a.time - b.time);

  document.getElementById("result").innerHTML = html;

  startAutoSubtitle();
}

/* 🔥 ترجمة تلقائية */
function startAutoSubtitle(){

  let startTime = Date.now();
  let i = 0;

  if(subtitleInterval) clearInterval(subtitleInterval);

  subtitleInterval = setInterval(()=>{

    let current = (Date.now() - startTime) / 1000;

    if(i >= subtitles.length) return;

    if(current >= subtitles[i].time){

      document.getElementById("subEn").innerText = subtitles[i].en;
      document.getElementById("subAr").innerText = subtitles[i].ar;

      i++;
    }

  }, 300);
}

/* إرسال */
async function sendUrl() {

  const url = document.getElementById("url").value;
  if (!url) return alert("اكتب رابط");

  document.getElementById("result").innerHTML = "";

  startLoading();
  showVideo(url);

  try{

    const res = await fetch(WEBHOOK, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ url })
    });

    let data = await res.json();

    if(data.raw){
      try{ data = JSON.parse(data.raw); }catch{}
    }

    stopLoading();
    show(data);

  }catch(e){
    stopLoading();
    alert("❌ خطأ في الاتصال");
  }
}

/* تحميل */
function startLoading() {
  document.getElementById("loading").style.display = "block";
}

function stopLoading() {
  document.getElementById("loading").style.display = "none";
}

</script>

</body>
</html>
