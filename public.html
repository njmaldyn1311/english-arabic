<script>

const AI_WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/headway";

const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userId = localStorage.getItem("user_id");
let isPaid = false;

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc = null;
let currentPage = 1;

/* 🔥 جديد: تحديد المعلم */
let isTeacher = localStorage.getItem("role") === "teacher";

window.onload = ()=>{
  if(localStorage.getItem("bookOpened")==="yes"){
    document.getElementById("priceBox").style.display="none";
  }
}

function showToast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

async function checkUser(){
  const { data } = await client.from("users").select("name,plan").eq("id", userId).single();
  if(data){
    isPaid = data.plan === "paid";
    document.getElementById("userName").innerText = "👤 " + data.name;
  }
}

function goHome(){ location.href="index.html"; }

async function openBook(){

  await checkUser();

  if(!isPaid){
    document.getElementById("alert").style.display="flex";
    return;
  }

  const loadingTask = pdfjsLib.getDocument(PDF_URL);
  pdfDoc = await loadingTask.promise;
  renderPage(currentPage);

  document.getElementById("priceBox").style.display="none";
  localStorage.setItem("bookOpened","yes");

  showToast("📖 تم فتح الكتاب");

  listenLive(); // 🔥 تشغيل البث
}

/* 🔥 جديد: بث الصفحة */
async function broadcastPage(){
  await client.from("live_class")
    .update({ current_page: currentPage })
    .eq("id",1);
}

/* 🔥 جديد: استقبال الصفحة */
function listenLive(){

  client.channel('live_class_room')
  .on('postgres_changes',{
    event:'UPDATE',
    schema:'public',
    table:'live_class'
  },payload=>{

    if(!isTeacher && pdfDoc){
      currentPage = payload.new.current_page;
      renderPage(currentPage);
    }

  })
  .subscribe();
}

async function renderPage(num){
  const page = await pdfDoc.getPage(num);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");
  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext:ctx, viewport }).promise;
}

/* 🔥 تعديل بسيط (بدون تغيير الشكل) */
function nextPage(){ 
  if(currentPage < pdfDoc.numPages){ 
    currentPage++; 
    renderPage(currentPage);

    if(isTeacher) broadcastPage(); // 🔥
  }
}

function prevPage(){ 
  if(currentPage > 1){ 
    currentPage--; 
    renderPage(currentPage);

    if(isTeacher) broadcastPage(); // 🔥
  }
}

function savePage(){
  localStorage.setItem("savedPage", currentPage);
  showToast("⭐ تم حفظ الصفحة");
}

async function readPage(){
  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();
  let text = content.items.map(i=>i.str).join(" ");
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speechSynthesis.speak(speech);
}

function speakWord(word){
  let speech=new SpeechSynthesisUtterance(word);
  speech.lang="en-US";
  speechSynthesis.speak(speech);
}

async function saveWord(word,translation,btn){
  btn.innerText="⏳";

  await client.from("user_star_words").insert({
    user_id:userId,
    word,
    translation,
    page:currentPage
  });

  btn.innerText="✅";
  showToast("⭐ تم حفظ الكلمة");
}

function renderWords(arr){
  if(!arr) return "";
  return arr.map(i=>`
    <div class="word-row">
      <div>
        <div>${i.word || i.text}</div>
        <div>${i.translation}</div>
      </div>
      <div class="word-actions">
        <button onclick="speakWord('${i.word || i.text}')">🔊</button>
        <button onclick="saveWord('${i.word || i.text}','${i.translation}',this)">⭐</button>
      </div>
    </div>
  `).join("");
}

function formatGrammar(text){
  if(!text) return "";
  let lines = text.split("\n");
  return lines.map((l,i)=> l.trim()? `<div>${i+1}- ${l}</div>`:"").join("");
}

async function analyzePage(){

  if(!pdfDoc){ showToast("افتح الكتاب أولاً"); return; }

  document.getElementById("loader").style.display="block";

  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();
  let text = content.items.map(i=>i.str).join(" ");

  const res = await fetch(AI_WEBHOOK,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  document.getElementById("verbs").innerHTML = renderWords(data.verbs);
  document.getElementById("nouns").innerHTML = renderWords(data.nouns);
  document.getElementById("adverbs").innerHTML = renderWords(data.adverbs);
  document.getElementById("prepositions").innerHTML = renderWords(data.prepositions);
  document.getElementById("adjectives").innerHTML = renderWords(data.adjectives);
  document.getElementById("phrases").innerHTML = renderWords(data.phrases);

  document.getElementById("grammar").innerHTML = `
    <div style="background:#0f172a;padding:12px;border-radius:12px;line-height:2">
      ${formatGrammar(data.grammar)}
    </div>
  `;

  document.getElementById("loader").style.display="none";
  document.getElementById("analysisBox").style.display="block";
}

async function saveNote(){
  let note=document.getElementById("noteInput");
  if(!note.value) return;

  await client.from("user_notes").insert({
    user_id:userId,
    page:currentPage,
    note:note.value
  });

  note.value="";
  showToast("تم حفظ الملاحظة ✅");
}

function buy(){
  window.open("https://wa.me/966509079576","_blank");
}

function closeAlert(){
  document.getElementById("alert").style.display="none";
}

</script>
