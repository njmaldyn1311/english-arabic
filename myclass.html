<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفصل الذكي</title>

<style>
body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.top{display:flex;justify-content:space-between;padding:15px;}
.user{color:#38bdf8;}
.points{color:#FFD700;}
.review{
  background:#6366f1;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
}

.title{text-align:center;}
.subtitle{text-align:center;color:#94a3b8;}

.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.select{
  background:#e5e7eb;
  color:black;
  padding:15px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.options{display:none;background:white;border-radius:15px;margin-top:10px;}
.option{padding:15px;border-bottom:1px solid #ddd;color:black;}

.input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  margin-top:10px;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
  margin-top:10px;
}

.story{line-height:2;font-size:17px;margin-bottom:15px;}
.story-en{direction:ltr;text-align:justify;}
.story-ar{text-align:justify;}

.section-title{margin-top:20px;font-weight:bold;font-size:20px;}

.word{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #334155;
}

.en{color:#38bdf8;}
.ar{color:#facc15;}

.actions{display:flex;gap:15px;}

.icon{
  cursor:pointer;
  background:#0f172a;
  padding:10px;
  border-radius:10px;
}

.note{
  background:#0f172a;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  color:#cbd5f5;
}
</style>
</head>

<body>

<div class="top">
  <div class="user" id="username">👤</div>
  <div class="points">⭐ كلماتك: 0</div>
  <div class="review" onclick="goProfile()">👤 حسابي</div>
</div>

<h2 class="title">📚 الفصل الذكي</h2>
<p class="subtitle">📘 عنوان الدرس</p>

<div class="card">

  <div class="select" onclick="toggleOptions()">
    <span id="typeText">📝 نص</span>
    <span>▼</span>
  </div>

  <div class="options" id="options">
    <div class="option" onclick="selectType('text')">📝 نص</div>
    <div class="option" onclick="selectType('link')">🔗 رابط</div>
    <div class="option" onclick="selectType('pdf')">📄 PDF</div>
  </div>

  <input id="textInput" class="input" placeholder="... اكتب النص هنا">

  <button class="btn" onclick="generateLesson()">🚀 إنشاء الدرس</button>

</div>

<!-- 📝 ملاحظات -->
<div id="notesCard" class="card" style="display:none;">
  <div class="section-title">📝 ملاحظاتي</div>
  <div id="notesBox"></div>

  <div style="display:flex;gap:10px;margin-top:10px;">
    <input id="noteInput" class="input" placeholder="اكتب ملاحظة...">
    <button class="btn" style="width:auto;padding:12px 18px;" onclick="addNote()">➕</button>
  </div>
</div>

<div id="lesson"></div>

<script>

// 👤 الاسم
const fullName = localStorage.getItem("user") || "";
document.getElementById("username").innerText = "👤 " + fullName.split(" ").slice(0,2).join(" ");

let user_id = localStorage.getItem("user_id") || "user_" + Math.random();

// 🔥 الملاحظات
let lesson_id = null;
let NOTES_KEY = null;

function loadNotes(){
  let notes = JSON.parse(localStorage.getItem(NOTES_KEY) || "[]");
  let html="";
  notes.forEach(n=> html += `<div class="note">• ${n}</div>`);
  document.getElementById("notesBox").innerHTML = html || "لا توجد ملاحظات";
}

function addNote(){
  let input = noteInput.value.trim();
  if(!input) return;

  let notes = JSON.parse(localStorage.getItem(NOTES_KEY) || "[]");
  notes.push(input);
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));

  noteInput.value="";
  loadNotes();
}

// 🎯 إنشاء الدرس
async function generateLesson(){

  let input=document.getElementById("textInput").value;
  if(!input) return alert("اكتب شي");

  lesson.innerHTML = "⏳ جاري التحليل...";

  let res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/lesson",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({inputPart:input})
  });

  let data = await res.json();

  // 🔥 ربط الملاحظات بالدرس
  lesson_id = input.slice(0,30); // نفس النص = نفس الدرس
  NOTES_KEY = "notes_" + lesson_id;

  document.getElementById("notesCard").style.display="block";
  loadNotes();

  lesson.innerHTML=`
    <div class="card">

      <div class="section-title">📖 القصة</div>
      <div class="story story-en">${(data.story||"").replace(/\n/g,"<br>")}</div>

      <div class="section-title">🌍 الترجمة</div>
      <div class="story story-ar">${data.translation||""}</div>

    </div>
  `;

}

function goProfile(){
  location.href="student.html";
}

</script>

</body>
</html>
