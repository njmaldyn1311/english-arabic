<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 500px;
  background: #fff;
  border-radius: 25px;
  padding: 20px;
  text-align: center;
}

/* Profile */
.cover {
  height: 150px;
  background: linear-gradient(135deg, #4facfe, #00c6ff);
  border-radius: 20px;
}

.profile-img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  margin-top: -50px;
  border: 4px solid #fff;
  object-fit: cover;
}

h2 {
  margin: 10px 0;
}

.students {
  color: #0099cc;
  font-weight: bold;
}

/* Buttons */
.card {
  background: #f1f1f1;
  border-radius: 15px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: #00c6ff;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  color: white;
  cursor: pointer;
}

/* Input */
input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* Result */
#result {
  margin-top: 20px;
  text-align: left;
  font-size: 14px;
  background: #f9f9f9;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="cover"></div>
  <img src="me.jpeg" class="profile-img">

  <h2>إنجلش بالعربي</h2>
  <p>تعلم الإنجليزية بطريقة ذكية 🚀</p>

  <p class="students">👨‍🎓 أكثر من 129 طالب</p>

  <!-- YouTube -->
  <div class="card">
    <span>📺 تحليل فيديو يوتيوب</span>
    <button onclick="goYoutube()">ابدأ</button>
  </div>

  <!-- PDF -->
  <div class="card">
    <span>📄 تحليل كتاب PDF</span>
    <button onclick="goPDF()">ابدأ</button>
  </div>

  <!-- Search -->
  <div class="card">
    <span>🔍 البحث عن كلمة</span>
    <button onclick="goSearch()">ابدأ</button>
  </div>

  <!-- Inputs -->
  <input id="youtubeUrl" placeholder="ضع رابط يوتيوب هنا">
  <input id="searchWord" placeholder="اكتب كلمة للبحث">

  <!-- Result -->
  <div id="result"></div>

</div>

<script>

// 🔹 YouTube
async function goYoutube() {
  const url = document.getElementById("youtubeUrl").value;

  if (!url) return alert("حط رابط الفيديو");

  const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/video-ai", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ url })
  });

  const data = await res.json();
  document.getElementById("result").innerText = JSON.stringify(data, null, 2);
}

// 🔹 PDF
async function goPDF() {

  const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
    method: "POST"
  });

  const data = await res.json();
  document.getElementById("result").innerText = JSON.stringify(data, null, 2);
}

// 🔹 Search
async function goSearch() {
  const word = document.getElementById("searchWord").value;

  if (!word) return alert("اكتب كلمة");

  const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/69c0fd9b-1072-4c11-93f0-aa96f41ed012", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ word })
  });

  const data = await res.json();
  document.getElementById("result").innerText = JSON.stringify(data, null, 2);
}

</script>

</body>
</html>
