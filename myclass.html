<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>الفصل الذكي | إنجلش بالعربي</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;max-width:100%;overflow-x:hidden}
body{max-width:100%;overflow-x:hidden;margin:0;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;font-family:Arial,"Cairo",sans-serif;min-height:100vh}
.container{width:min(94%,760px);max-width:100%;min-width:0;margin:0 auto;padding:14px 0 42px;overflow-x:clip}
.top{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.user{color:#38bdf8;font-size:14px;font-weight:bold}
.points{color:#facc15;font-size:14px;font-weight:bold}
.review{display:inline-flex;align-items:center;justify-content:center;background:#6366f1;color:#fff;padding:10px 14px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:bold;cursor:pointer;border:0}
h1.page-title{text-align:center;font-size:25px;margin:12px 0 6px}
.subtitle{text-align:center;color:#94a3b8;font-size:14px;margin:0 0 18px}
.card{background:#1e293b;border:1px solid #334155;margin:16px 0;padding:16px;border-radius:16px;min-width:0;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.field-label{display:block;color:#cbd5e1;font-size:14px;font-weight:bold;margin:4px 2px 8px}
.input{display:block;width:100%;padding:14px;border:1px solid #334155;border-radius:12px;background:#f8fafc;color:#0f172a;font:16px Arial,sans-serif;direction:auto;text-align:right;outline:none}
.input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.16)}
.hint{font-size:12px;color:#94a3b8;line-height:1.8;margin:8px 2px}
.btn{border:0;border-radius:12px;padding:13px 18px;background:#22c55e;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
#generateBtn{width:100%;margin-top:12px}
.loading{text-align:center;margin:18px 0;color:#facc15;line-height:1.8}
.error{color:#fee2e2;background:#7f1d1d;padding:13px;border-radius:12px;line-height:1.8}
.lesson-card{padding:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.section-title{font-size:20px;font-weight:bold;color:#fff;margin:0}
.level-pill{background:#0f172a;color:#7dd3fc;border:1px solid #334155;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:bold}
.story-panel{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;overflow:hidden;border:1px solid #334155;border-radius:13px;padding:14px;margin:10px 0 16px;background:#0f172a}
.story-label{font-size:13px;color:#7dd3fc;font-weight:bold;margin-bottom:9px}
.story{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;font-size:17px;line-height:2;white-space:normal;overflow-wrap:break-word;word-break:normal;margin:0}
.story-en{display:block;width:100%;max-width:100%;min-width:0;direction:ltr!important;text-align:left!important;unicode-bidi:plaintext;line-height:1.95;white-space:normal;word-spacing:normal;letter-spacing:normal;word-break:normal;overflow-wrap:break-word;hyphens:auto;}
.story-ar{display:block;width:100%;max-width:100%;min-width:0;direction:rtl!important;text-align:right!important;unicode-bidi:plaintext;color:#e2e8f0;line-height:2.05;white-space:normal;overflow-wrap:break-word;word-break:normal;}
.story-word{direction:ltr;unicode-bidi:isolate;display:inline;white-space:normal;border-radius:4px;cursor:pointer;padding:1px 0;transition:background .12s,color .12s,box-shadow .12s;}
.story-word:hover{background:rgba(56,189,248,.13);}
.story-word.is-speaking{background:#facc15!important;color:#0f172a!important;border-radius:5px;padding:1px 3px;box-shadow:0 0 0 2px rgba(250,204,21,.18);font-weight:bold;}
.read-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.read-btn{display:inline-flex;align-items:center;gap:7px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;padding:9px 13px;border-radius:11px;font-size:13px;font-weight:bold;cursor:pointer}
.read-btn:hover{border-color:#38bdf8}
.read-btn:disabled{opacity:.5;cursor:not-allowed}
.read-btn.stop{background:#7f1d1d;border-color:#991b1b;color:#fee2e2}
.read-btn.pause{background:#164e63;border-color:#0e7490;color:#cffafe}
.read-note{font-size:11px;color:#94a3b8}
.meaning-toast{position:fixed;z-index:9999;left:50%;bottom:18px;transform:translateX(-50%);width:min(92%,430px);display:none;background:#1e293b;border:1px solid #38bdf8;border-radius:15px;padding:13px 15px;box-shadow:0 12px 36px rgba(0,0,0,.38);direction:rtl;text-align:right;}
.meaning-toast.show{display:block;animation:meaningIn .18s ease-out;}
.meaning-toast-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;}
.meaning-toast-word{direction:ltr;text-align:left;color:#38bdf8;font-weight:bold;font-size:16px;}
.meaning-toast-close{background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:9px;padding:4px 9px;cursor:pointer;font-size:16px;}
.meaning-toast-ar{color:#facc15;font-size:17px;line-height:1.8;}
.meaning-toast-meta{color:#94a3b8;font-size:11px;margin-top:4px;}
.meaning-toast-loading{color:#cbd5e1;font-size:14px;animation:meaningPulse 1s ease-in-out infinite alternate;}
@keyframes meaningPulse{from{opacity:.55}to{opacity:1}}
.points{color:#facc15;font-size:14px;font-weight:bold;background:transparent;border:0;padding:4px;cursor:pointer}
.word-en.clickable-word{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;}
.word-en.clickable-word:hover{text-decoration-color:#38bdf8;}
@keyframes meaningIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.divider{border:0;border-top:1px solid #334155;margin:17px 0}
.category-card{background:#1e293b;border:1px solid #334155;border-radius:15px;padding:13px;margin:13px 0}
.category-title{color:#fff;text-align:center;direction:ltr;font-size:21px;margin:4px 0 12px;font-weight:bold}
.word-row{display:grid;grid-template-columns:minmax(0,1fr) 108px minmax(0,1fr);gap:6px;align-items:center;padding:13px 0;border-bottom:1px solid #334155;direction:ltr;min-width:0}
.word-row:last-child{border-bottom:0}
.word-en{grid-column:1;color:#38bdf8;font-size:17px;font-weight:bold;text-align:left;direction:ltr;overflow-wrap:anywhere;padding-left:6px}
.word-actions{grid-column:2;display:flex;justify-content:center;align-items:center;gap:8px;width:108px}
.word-ar{grid-column:3;color:#facc15;font-size:17px;text-align:right;direction:rtl;overflow-wrap:anywhere;padding-right:6px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;padding:0;border:1px solid #334155;border-radius:12px;background:#0f172a;color:#fff;font-size:19px;cursor:pointer}
.icon-btn:hover{border-color:#38bdf8}
.icon-btn:disabled{opacity:.65;cursor:wait}
.empty-cat{text-align:center;color:#94a3b8;font-size:12px;padding:9px 5px 13px}
.profile-note{color:#a7f3d0;background:#064e3b55;border:1px solid #065f46;padding:10px;border-radius:10px;font-size:13px;line-height:1.8}
.footer-note{text-align:center;color:#94a3b8;font-size:12px;padding:6px}
@media(max-width:520px){.container{width:94%;max-width:100%;padding-top:10px}.top{gap:7px}.user,.points{font-size:12px}.review{font-size:12px;padding:9px 11px}h1.page-title{font-size:22px}.card{padding:12px}.story{font-size:16px}.story-en{width:100%;max-width:100%;direction:ltr!important;text-align:left!important;overflow-wrap:break-word}.story-ar{width:100%;max-width:100%;direction:rtl!important;text-align:right!important;overflow-wrap:break-word}.word-row{grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr);gap:3px}.word-actions{width:94px;gap:7px}.icon-btn{width:40px;height:40px;font-size:18px}.word-en,.word-ar{font-size:15px}.category-title{font-size:20px}.read-controls{gap:6px}.read-btn{font-size:12px;padding:8px 10px}.meaning-toast{bottom:12px}}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div class="user" id="username">👤</div>
    <button class="points" id="wordCountBtn" type="button" title="فتح مفرداتي">⭐ كلماتك: <span id="savedWordCount">0</span></button>
    <button class="review" id="profileBtn" type="button">👤 حسابي</button>
  </div>

  <h1 class="page-title">📚 الفصل الذكي</h1>
  <p class="subtitle">📘 أنشئ درساً وقصة مناسبة لمستواك في الإنجليزية</p>

  <section class="card">
    <label class="field-label" for="textInput">📝 موضوع الدرس</label>
    <input id="textInput" class="input" type="text" placeholder="اكتب موضوع الدرس هنا..." autocomplete="off">
    <div class="hint">اكتب موضوعاً أو فكرة، وسيُنشأ درس مناسب لمستواك المسجل.</div>
    <button id="generateBtn" class="btn" type="button">🚀 إنشاء الدرس</button>
  </section>

  <div id="lesson" aria-live="polite"></div>
</div>

<div id="wordMeaningCard" class="meaning-toast" role="status" aria-live="polite">
  <div class="meaning-toast-head">
    <span id="meaningWord" class="meaning-toast-word"></span>
    <button id="closeMeaningCard" class="meaning-toast-close" type="button" aria-label="إغلاق">×</button>
  </div>
  <div id="meaningArabic" class="meaning-toast-ar"></div>
  <div id="meaningMeta" class="meaning-toast-meta">اضغط على أي كلمة في القصة لسماع نطقها ومعرفة معناها</div>
</div>

<script>
'use strict';

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK = "https://steelblue-frog-379077.hostingersite.com/webhook/lesson";

let user_id = localStorage.getItem("user_id");
if (!user_id) {
  user_id = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "user_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("user_id", user_id);
}

const phone = localStorage.getItem("phone") || "";
const storedLevel = localStorage.getItem("student_level") || localStorage.getItem("english_level") || localStorage.getItem("level") || "";
const fullName = localStorage.getItem("user") || "";
document.getElementById("username").textContent = "👤 " + (fullName.split(" ").slice(0, 2).join(" ") || "الطالب");
document.getElementById("profileBtn").addEventListener("click", () => { window.location.href = "student.html"; });

let currentWordMeanings = new Map();
const onlineMeaningCache = new Map();
let meaningCardTimer = null;
let storyUtterance = null;
let storyWordSpans = [];
let storyReadingState = "idle";

// عدد المفردات المحفوظة للطالب في Supabase
async function refreshSavedWordCount() {
  const countEl = document.getElementById("savedWordCount");
  if (!countEl) return;
  try {
    const url = SUPABASE_URL + "/rest/v1/user_star_words?select=user_id&user_id=eq." + encodeURIComponent(user_id);
    const response = await fetch(url, {
      method: "GET",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        Prefer: "count=exact",
        Range: "0-0"
      },
      cache: "no-store"
    });
    if (!response.ok) throw new Error(await response.text());
    const range = response.headers.get("Content-Range") || "";
    const match = range.match(/\/(\d+|\*)$/);
    if (match && match[1] !== "*") {
      countEl.textContent = match[1];
    } else {
      const rows = await response.json();
      countEl.textContent = Array.isArray(rows) ? String(rows.length) : "0";
    }
  } catch (error) {
    console.debug("Could not load saved word count", error);
    countEl.textContent = "—";
  }
}

document.getElementById("wordCountBtn").addEventListener("click", () => {
  window.location.href = "review.html";
});
refreshSavedWordCount();

async function track(action) {
  try {
    await fetch(SUPABASE_URL + "/rest/v1/user_activity", {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({ user_id, page: "class_page", action })
    });
  } catch (error) {
    console.debug("Tracking skipped", error);
  }
}
track("دخول الفصل");

function clearStoryHighlight() {
  storyWordSpans.forEach(span => span.classList.remove("is-speaking"));
}

function resetStoryControls() {
  const read = document.getElementById("readStoryBtn");
  const pause = document.getElementById("pauseStoryBtn");
  if (read) read.textContent = "🔊 قراءة القصة";
  if (pause) {
    pause.textContent = "⏸ إيقاف مؤقت";
    pause.disabled = true;
  }
  storyReadingState = "idle";
  clearStoryHighlight();
}

function showWordMeaning(word, arabicMeaning, metaText = "") {
  const card = document.getElementById("wordMeaningCard");
  const wordEl = document.getElementById("meaningWord");
  const arEl = document.getElementById("meaningArabic");
  const metaEl = document.getElementById("meaningMeta");
  if (!card) return;
  wordEl.textContent = word;
  arEl.textContent = arabicMeaning || "جارٍ البحث عن المعنى...";
  arEl.classList.toggle("meaning-toast-loading", !arabicMeaning);
  metaEl.textContent = metaText || (arabicMeaning ? "المعنى بالعربية" : "يتم جلب المعنى للكلمة...");
  card.classList.add("show");
  clearTimeout(meaningCardTimer);
  if (arabicMeaning) {
    meaningCardTimer = setTimeout(() => card.classList.remove("show"), 6500);
  }
}

function lookupLocalMeaning(word) {
  const key = normalizeWord(word);
  let found = currentWordMeanings.get(key);
  if (found) return found;
  const candidates = [
    key.replace(/'s$/i, ""), key.replace(/'re$/i, ""),
    key.replace(/'ve$/i, ""), key.replace(/'ll$/i, ""),
    key.replace(/ies$/i, "y"), key.replace(/(ing|ed|es|s)$/i, "")
  ].filter(Boolean);
  for (const candidate of candidates) {
    found = currentWordMeanings.get(candidate);
    if (found) return found;
  }
  return null;
}

async function fetchJsonWithTimeout(url, timeoutMs = 7000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { method: "GET", mode: "cors", cache: "no-store", signal: controller.signal });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

async function fetchArabicMeaning(word) {
  const key = normalizeWord(word);
  if (onlineMeaningCache.has(key)) return onlineMeaningCache.get(key);

  // مصدر ترجمة عام أول، ثم بديل في حال عدم توفره.
  const services = [
    async () => {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=" + encodeURIComponent(word);
      const data = await fetchJsonWithTimeout(url);
      const translated = Array.isArray(data?.[0])
        ? data[0].map(part => Array.isArray(part) ? part[0] : "").join("").trim()
        : "";
      if (!translated || normalizeWord(translated) === key) throw new Error("No translation returned");
      return translated;
    },
    async () => {
      const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(word) + "&langpair=en|ar";
      const data = await fetchJsonWithTimeout(url);
      const translated = String(data?.responseData?.translatedText || "").trim();
      if (!translated || data?.responseStatus === 429 || /MYMEMORY WARNING/i.test(translated)) throw new Error("No translation returned");
      return translated.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, "&");
    }
  ];

  for (const service of services) {
    try {
      const meaning = await service();
      onlineMeaningCache.set(key, meaning);
      return meaning;
    } catch (error) {
      console.debug("Meaning provider unavailable", error);
    }
  }
  throw new Error("تعذر جلب الترجمة من خدمات الترجمة حالياً.");
}

async function handleStoryWordClick(word) {
  // انطق الكلمة فور الضغط، ولا تنتظر استجابة خدمة الترجمة.
  speakWord(word);
  const local = lookupLocalMeaning(word);
  if (local?.ar) {
    showWordMeaning(word, local.ar, local.category ? "القسم: " + (categoryLabels[local.category] || local.category) : "من مفردات الدرس");
    return;
  }

  const cached = onlineMeaningCache.get(normalizeWord(word));
  if (cached) {
    showWordMeaning(word, cached, "ترجمة عربية تلقائية؛ قد يختلف المعنى بحسب سياق الجملة.");
    return;
  }

  showWordMeaning(word, "", "جارٍ جلب المعنى العربي للكلمة...");
  try {
    const meaning = await fetchArabicMeaning(word);
    // لا نحدّث البطاقة إذا كان الطالب قد انتقل إلى كلمة أخرى.
    if (normalizeWord(document.getElementById("meaningWord")?.textContent) !== normalizeWord(word)) return;
    showWordMeaning(word, meaning, "ترجمة عربية تلقائية؛ اختر المعنى الأنسب لسياق الجملة.");
    currentWordMeanings.set(normalizeWord(word), { en: word, ar: meaning, category: "" });
  } catch (error) {
    console.warn("Could not resolve word meaning", error);
    if (normalizeWord(document.getElementById("meaningWord")?.textContent) !== normalizeWord(word)) return;
    showWordMeaning(word, "لم نتمكن من جلب المعنى الآن. اضغط على الكلمة مرة أخرى للمحاولة.", "تعذر الاتصال بخدمة الترجمة مؤقتاً.");
  }
}

function normalizeWord(value) {
  return String(value || "").toLowerCase().replace(/[’‘]/g, "'").replace(/^[^a-z]+|[^a-z']+$/gi, "").trim();
}

function speakWord(text) {
  if (!text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  storyUtterance = null;
  resetStoryControls();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.88;
  const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
  const englishVoice = voices.find(voice => /^en(-|_)/i.test(voice.lang) && /US|UK|English/i.test(voice.name + " " + voice.lang))
    || voices.find(voice => /^en/i.test(voice.lang));
  if (englishVoice) utterance.voice = englishVoice;
  speechSynthesis.speak(utterance);
}

function renderClickableStory(text, element) {
  const source = String(text || "");
  element.replaceChildren();
  storyWordSpans = [];
  const regex = /[A-Za-z]+(?:[’'][A-Za-z]+)*(?:-[A-Za-z]+)*/g;
  let cursor = 0;
  let match;
  while ((match = regex.exec(source)) !== null) {
    if (match.index > cursor) {
      element.appendChild(document.createTextNode(source.slice(cursor, match.index)));
    }
    const wordText = match[0];
    const wordStart = match.index;
    const span = document.createElement("span");
    span.className = "story-word";
    span.textContent = wordText;
    span.dataset.start = String(wordStart);
    span.dataset.end = String(wordStart + wordText.length);
    span.title = "اضغط لسماع الكلمة ومعرفة معناها";
    span.addEventListener("click", () => handleStoryWordClick(wordText));
    element.appendChild(span);
    storyWordSpans.push(span);
    cursor = wordStart + wordText.length;
  }
  if (cursor < source.length) element.appendChild(document.createTextNode(source.slice(cursor)));
}

function highlightStoryAt(charIndex) {
  if (!Number.isFinite(charIndex)) return;
  let active = null;
  for (const span of storyWordSpans) {
    const start = Number(span.dataset.start);
    const end = Number(span.dataset.end);
    if (charIndex >= start && charIndex < end) {
      active = span;
      break;
    }
  }
  // بعض المتصفحات ترسل موضعاً قبل أول حرف من الكلمة؛ نختار أقرب كلمة تالية.
  if (!active) {
    active = storyWordSpans.find(span => Number(span.dataset.end) > charIndex) || null;
  }
  storyWordSpans.forEach(span => span.classList.toggle("is-speaking", span === active));
  // لا نحرك الصفحة أفقياً أثناء القراءة؛ نكتفي بتمييز الكلمة حتى تبقى أسطر القصة ثابتة.
}

function startStoryReading(fromBeginning = false) {
  const storyEl = document.getElementById("storyEnglishText");
  const readButton = document.getElementById("readStoryBtn");
  const pauseButton = document.getElementById("pauseStoryBtn");
  const storyText = storyEl?.dataset.rawText || storyEl?.textContent?.trim();
  if (!storyText) return;
  if (!("speechSynthesis" in window)) {
    alert("ميزة القراءة الصوتية غير مدعومة في هذا المتصفح.");
    return;
  }

  speechSynthesis.cancel();
  clearStoryHighlight();
  const utterance = new SpeechSynthesisUtterance(storyText);
  storyUtterance = utterance;
  utterance.lang = "en-US";
  utterance.rate = 0.88;
  utterance.pitch = 1;
  storyReadingState = "speaking";
  if (readButton) readButton.textContent = "🔄 إعادة من البداية";
  if (pauseButton) {
    pauseButton.disabled = false;
    pauseButton.textContent = "⏸ إيقاف مؤقت";
  }

  utterance.onboundary = event => {
    if (storyUtterance !== utterance) return;
    if (event.name === "word" || Number.isFinite(event.charIndex)) highlightStoryAt(event.charIndex);
  };
  utterance.onend = () => {
    if (storyUtterance !== utterance) return;
    storyUtterance = null;
    resetStoryControls();
  };
  utterance.onerror = event => {
    if (storyUtterance !== utterance || event.error === "canceled" || event.error === "interrupted") return;
    storyUtterance = null;
    resetStoryControls();
  };
  speechSynthesis.speak(utterance);
}

function toggleStoryPause() {
  if (!("speechSynthesis" in window) || !storyUtterance) return;
  if (speechSynthesis.paused || storyReadingState === "paused") {
    speechSynthesis.resume();
    storyReadingState = "speaking";
    const pause = document.getElementById("pauseStoryBtn");
    if (pause) pause.textContent = "⏸ إيقاف مؤقت";
  } else if (speechSynthesis.speaking) {
    speechSynthesis.pause();
    storyReadingState = "paused";
    const pause = document.getElementById("pauseStoryBtn");
    if (pause) pause.textContent = "▶ استكمال القراءة";
  }
}

function stopStoryReading() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  storyUtterance = null;
  resetStoryControls();
}

async function saveWord(button, en, ar, category) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = "…";
  try {
    const response = await fetch(SUPABASE_URL + "/rest/v1/user_star_words", {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({ user_id, word: en, translation: ar, category })
    });
    if (!response.ok) throw new Error(await response.text());
    button.textContent = "✅";
    track("حفظ كلمة: " + en);
    await refreshSavedWordCount();
  } catch (error) {
    console.error(error);
    button.textContent = original;
    alert("تعذر حفظ المفردة. تحقق من صلاحيات جدول user_star_words وعمود category.");
  } finally {
    button.disabled = false;
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

const categoryLabels = {
  verbs: "verbs",
  nouns: "nouns",
  adjectives: "adjectives",
  phrasal_verbs: "phrasal verbs",
  idioms: "idioms",
  adverbs: "adverbs"
};

function buildWordMeanings(words) {
  currentWordMeanings = new Map();
  for (const key of Object.keys(categoryLabels)) {
    const entries = Array.isArray(words?.[key]) ? words[key] : [];
    for (const entry of entries) {
      const en = String(entry?.en || "").trim();
      const ar = String(entry?.ar || "").trim();
      if (!en || !ar) continue;
      const normalized = normalizeWord(en);
      if (normalized && !currentWordMeanings.has(normalized)) {
        currentWordMeanings.set(normalized, { en, ar, category: key });
      }
    }
  }
}

function renderWords(words) {
  buildWordMeanings(words);
  const fragment = document.createElement("div");
  for (const key of Object.keys(categoryLabels)) {
    const entries = Array.isArray(words?.[key]) ? words[key] : [];
    const category = document.createElement("section");
    category.className = "category-card";
    const heading = document.createElement("h3");
    heading.className = "category-title";
    heading.textContent = categoryLabels[key];
    category.appendChild(heading);

    if (!entries.length) {
      const empty = document.createElement("div");
      empty.className = "empty-cat";
      empty.textContent = "لا توجد مفردات في هذا القسم.";
      category.appendChild(empty);
    }

    for (const entry of entries) {
      const en = String(entry?.en || "").trim();
      const ar = String(entry?.ar || "").trim();
      if (!en) continue;
      const row = document.createElement("div");
      row.className = "word-row";

      const english = document.createElement("span");
      english.className = "word-en clickable-word";
      english.textContent = en;
      english.title = "اضغط لسماع الكلمة ومعرفة معناها";
      english.addEventListener("click", () => handleStoryWordClick(en));

      const actions = document.createElement("div");
      actions.className = "word-actions";

      const save = document.createElement("button");
      save.className = "icon-btn";
      save.type = "button";
      save.textContent = "⭐";
      save.title = "حفظ المفردة";
      save.setAttribute("aria-label", "حفظ " + en);
      save.addEventListener("click", () => saveWord(save, en, ar, key));

      const sound = document.createElement("button");
      sound.className = "icon-btn";
      sound.type = "button";
      sound.textContent = "🔊";
      sound.title = "استمع إلى النطق";
      sound.setAttribute("aria-label", "نطق " + en);
      sound.addEventListener("click", () => speakWord(en));

      actions.append(save, sound);

      const arabic = document.createElement("span");
      arabic.className = "word-ar";
      arabic.textContent = ar;

      row.append(english, actions, arabic);
      category.appendChild(row);
    }
    fragment.appendChild(category);
  }
  return fragment;
}

function renderLesson(data) {
  const root = document.getElementById("lesson");
  root.replaceChildren();
  stopStoryReading();

  const lessonCard = document.createElement("section");
  lessonCard.className = "card lesson-card";

  const storyHead = document.createElement("div");
  storyHead.className = "section-head";
  const storyTitle = document.createElement("h2");
  storyTitle.className = "section-title";
  storyTitle.textContent = "📖 القصة";
  const level = document.createElement("span");
  level.className = "level-pill";
  level.textContent = "المستوى: " + (data.student_level || storedLevel || "A1");

  const readControls = document.createElement("div");
  readControls.className = "read-controls";
  const readButton = document.createElement("button");
  readButton.type = "button";
  readButton.id = "readStoryBtn";
  readButton.className = "read-btn";
  readButton.textContent = "🔊 قراءة القصة";
  readButton.addEventListener("click", () => startStoryReading(false));

  const pauseButton = document.createElement("button");
  pauseButton.type = "button";
  pauseButton.id = "pauseStoryBtn";
  pauseButton.className = "read-btn pause";
  pauseButton.textContent = "⏸ إيقاف مؤقت";
  pauseButton.disabled = true;
  pauseButton.addEventListener("click", toggleStoryPause);

  const restartButton = document.createElement("button");
  restartButton.type = "button";
  restartButton.id = "restartStoryBtn";
  restartButton.className = "read-btn";
  restartButton.textContent = "↻ من البداية";
  restartButton.addEventListener("click", () => startStoryReading(true));

  const stopButton = document.createElement("button");
  stopButton.type = "button";
  stopButton.className = "read-btn stop";
  stopButton.textContent = "⏹ إيقاف";
  stopButton.addEventListener("click", stopStoryReading);

  const readNote = document.createElement("span");
  readNote.className = "read-note";
  readNote.textContent = "اضغط على أي كلمة لسماعها ومعرفة معناها";
  readControls.append(readButton, pauseButton, restartButton, stopButton, readNote);
  storyHead.append(storyTitle, level, readControls);
  lessonCard.appendChild(storyHead);

  const englishPanel = document.createElement("div");
  englishPanel.className = "story-panel";
  const englishLabel = document.createElement("div");
  englishLabel.className = "story-label";
  englishLabel.textContent = "English Story";
  const englishText = document.createElement("p");
  englishPanel.dir = "ltr";
  englishPanel.lang = "en";
  englishText.className = "story story-en";
  englishText.id = "storyEnglishText";
  englishText.setAttribute("dir", "ltr");
  englishText.setAttribute("lang", "en");
  englishText.dataset.rawText = String(data.story || "لم تصل القصة.");
  renderClickableStory(data.story || "لم تصل القصة.", englishText);
  englishPanel.append(englishLabel, englishText);
  lessonCard.appendChild(englishPanel);

  const arabicPanel = document.createElement("div");
  arabicPanel.className = "story-panel";
  const arabicLabel = document.createElement("div");
  arabicLabel.className = "story-label";
  arabicLabel.textContent = "الترجمة العربية";
  const arabicText = document.createElement("p");
  arabicPanel.dir = "rtl";
  arabicPanel.lang = "ar";
  arabicText.className = "story story-ar";
  arabicText.setAttribute("dir", "rtl");
  arabicText.setAttribute("lang", "ar");
  arabicText.textContent = data.translation || "⚠️ لا توجد ترجمة";
  arabicPanel.append(arabicLabel, arabicText);
  lessonCard.appendChild(arabicPanel);

  if (data.words && typeof data.words === "object") {
    lessonCard.appendChild(renderWords(data.words));
  }

  if (data.profile_notice) {
    const notice = document.createElement("p");
    notice.className = "profile-note";
    notice.textContent = data.profile_notice;
    lessonCard.appendChild(notice);
  }

  root.appendChild(lessonCard);
  track("اكتمال إنشاء الدرس");
}

async function generateLesson() {
  const input = document.getElementById("textInput").value.trim();
  if (!input) {
    alert("اكتب موضوع الدرس أولاً");
    return;
  }

  const button = document.getElementById("generateBtn");
  const root = document.getElementById("lesson");
  button.disabled = true;
  button.textContent = "⏳ جارٍ الإنشاء...";
  root.innerHTML = '<div class="card loading">⏳ جاري إعداد القصة والترجمة والمفردات بما يناسب مستواك...</div>';
  track("إنشاء درس بمستوى الطالب");

  try {
    const response = await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ inputPart: input, type: "text", user_id, phone, student_level: storedLevel })
    });
    const raw = await response.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error("استجابة غير مفهومة من n8n: " + raw.slice(0, 250)); }
    if (!response.ok || data.success === false) {
      throw new Error(data.message || data.error || "تعذر إنشاء الدرس.");
    }
    document.getElementById("textInput").value = "";
    renderLesson(data);
  } catch (error) {
    console.error(error);
    root.innerHTML = '<div class="card error">❌ ' + escapeHTML(error.message || "حدث خطأ أثناء إنشاء الدرس") + '</div>';
  } finally {
    button.disabled = false;
    button.textContent = "🚀 إنشاء الدرس";
  }
}

document.getElementById("closeMeaningCard").addEventListener("click", () => {
  clearTimeout(meaningCardTimer);
  document.getElementById("wordMeaningCard").classList.remove("show");
});
document.getElementById("generateBtn").addEventListener("click", generateLesson);
document.getElementById("textInput").addEventListener("keydown", event => {
  if (event.key === "Enter") generateLesson();
});
window.addEventListener("beforeunload", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
});
</script>
