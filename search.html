<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Smart Bot</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 40px;
}

h1 {
  color: #38bdf8;
  margin-bottom: 30px;
}

input {
  padding: 12px;
  width: 250px;
  max-width: 90%;
  border-radius: 10px;
  border: none;
  outline: none;
  margin-bottom: 15px;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover { background: #16a34a; }

.card {
  background: #0f172a;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
  text-align: right;
  max-width: 400px;
  width: 90%;
  margin: 30px auto;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  background: rgba(255,255,255,0.05);
  padding: 10px;
  border-radius: 10px;
}

.title { color: #38bdf8; font-weight: bold; }
.value { color: white; }

.example {
  margin-top: 15px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
  color: #fbbf24;
  line-height: 1.6;
}

.loading {
  margin-top: 20px;
  font-size: 16px;
  color: #38bdf8;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% {opacity: 0.3;}
  50% {opacity: 1;}
  100% {opacity: 0.3;}
}
</style>

</head>
<body>

<h1>🚀 English Smart Bot</h1>

<input id="wordInput" placeholder="اكتب كلمة..." />
<br>
<button onclick="sendWord()">ابدأ</button>

<div id="result"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

/* 🔥 توحيد user_id */
let user_id = localStorage.getItem("user_id");

if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

console.log("USER:", user_id);

/* 🔥 تتبع */
async function track(action){
  await fetch(SUPABASE_URL + "/rest/v1/user_activity", {
    method: "POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id: user_id,
      page: "bot_page",
      action: action
    })
  });
}

track("دخول صفحة البوت");

/* 🔥 حفظ الكلمة */
async function saveWord(word, translation){
  await fetch(SUPABASE_URL + "/rest/v1/user_star_words", {
    method: "POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id: user_id,
      word: word,
      translation: translation
    })
  });
}

async function sendWord() {

  const input = document.getElementById("wordInput");
  const word = input.value;

  if (!word) return;

  track("بحث كلمة: " + word);

  document.getElementById("result").innerHTML = `
    <div class="loading">⏳ جاري البحث...</div>
  `;

  const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/69c0fd9b-1072-4c11-93f0-aa96f41ed012", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: word })
  });

  const data = await res.json();
  const item = Array.isArray(data) ? data[0] : data;

  input.value = "";

  /* 🔥 حفظ تلقائي */
  if(item.word && item.translation){
    saveWord(item.word, item.translation);
    track("حفظ كلمة من البوت");
  }

  document.getElementById("result").innerHTML = `
    <div class="card">

      <div class="row">
        <span class="title">📘 الكلمة</span>
        <span class="value">${item.word || item.reply || "❌"}</span>
      </div>

      <div class="row">
        <span class="title">🌍 الترجمة</span>
        <span class="value">${item.translation || item.clean || "❌"}</span>
      </div>

      <div class="row">
        <span class="title">🧠 النوع</span>
        <span class="value">${item.type || "-"}</span>
      </div>

      <div class="example">
        ✏️ ${item.example || "-"}
        <br><br>
        🇸🇦 ${item.example_ar || item.translation || "-"}
      </div>

      <div style="margin-top:15px;">
        🔊
        <audio controls style="width:100%;">
          <source src="data:audio/mp3;base64,${item.audio}" type="audio/mp3">
        </audio>
      </div>

    </div>
  `;
}
</script>

</body>
</html>
