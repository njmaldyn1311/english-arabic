<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  text-align:center;
}

/* الهيدر */
.header{
  display:flex;
  justify-content:space-between;
  padding:10px;
}

.home{
  background:#38bdf8;
  padding:8px 12px;
  border-radius:10px;
}

/* الكارد */
.card{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:20px;
}

/* زر */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

/* PDF */
canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

/* تحليل */
#analysisBox{
  background:#0f172a;
  color:white;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  text-align:right;
}

.word{
  background:#1e293b;
  padding:5px;
  margin:3px;
  border-radius:6px;
  display:inline-block;
}

/* textarea */
textarea{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>

</head>
<body>

<div class="header">
  <div id="username"></div>
  <div class="home" onclick="location.href='index.html'">🏠 الرئيسية</div>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <h2>💰 سعر الكتاب: 250 ريال</h2>

  <button id="openBtn" class="btn download" onclick="openBook()">
    📥 تحميل وفتح
  </button>

  <canvas id="pdf"></canvas>

  <!-- زر التحليل -->
  <button class="btn orange" onclick="analyzePage()">
    🧠 تحليل الصفحة
  </button>

  <!-- التحليل -->
  <div id="analysisBox" style="display:none"></div>

  <!-- ملاحظات -->
  <textarea id="noteInput" placeholder="✍️ اكتب ملاحظتك..."></textarea>

  <button class="btn green" onclick="saveNote()">
    💾 حفظ الملاحظة
  </button>

</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "YOUR_KEY"
);

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc = null;
let currentPage = 1;
let userId = localStorage.getItem("user_id");

// الاسم
let name = localStorage.getItem("name") || "مستخدم";
document.getElementById("username").innerText =
  name.split(" ").slice(0,2).join(" ");


// 📥 فتح الكتاب
async function openBook(){

  const btn = document.getElementById("openBtn");
  btn.innerText = "⏳ جاري التحميل...";

  try{

    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    await renderPage(currentPage);

    // 🔥 مهم: حذف النص بعد التحميل
    btn.style.display = "none";

    trackPage();

  }catch(e){
    btn.innerText="❌ فشل التحميل";
  }
}


// 📖 عرض الصفحة
async function renderPage(num){

  const page = await pdfDoc.getPage(num);

  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");

  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({
    canvasContext:ctx,
    viewport
  }).promise;
}


// 📊 تتبع القراءة
async function trackPage(){

  await client.from("page_progress").upsert({
    user_id:userId,
    last_page:currentPage,
    total_pages_read:currentPage
  });
}


// 🧠 تحليل الصفحة
async function analyzePage(){

  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();

  let text = content.items.map(i=>i.str).join(" ");

  let res = await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{
      "Authorization":"Bearer YOUR_OPENAI_KEY",
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{
        role:"user",
        content:`حلل النص:

${text}

ارجع JSON:
{verbs:[],nouns:[],adjectives:[],translation:""}`
      }]
    })
  });

  let json = await res.json();
  let result = JSON.parse(json.choices[0].message.content);

  renderAnalysis(result);
}


// 🎯 عرض التحليل
function renderAnalysis(data){

  function draw(list){
    return list.map(w=>`
      <span class="word">${w}</span>
    `).join("");
  }

  document.getElementById("analysisBox").innerHTML = `
    <div>📘 ${data.translation}</div><hr>
    <div>🟢 Verbs:<br>${draw(data.verbs)}</div>
    <div>🔵 Nouns:<br>${draw(data.nouns)}</div>
    <div>🟣 Adjectives:<br>${draw(data.adjectives)}</div>
  `;

  document.getElementById("analysisBox").style.display="block";
}


// ✍️ حفظ ملاحظة
async function saveNote(){

  let note = document.getElementById("noteInput").value;

  if(!note) return;

  await client.from("user_notes").insert({
    user_id:userId,
    page:currentPage,
    note:note
  });

  alert("تم حفظ الملاحظة ✅");
}


// 🔒 منع نسخ
document.addEventListener("contextmenu",e=>e.preventDefault());

</script>

</body>
</html>
