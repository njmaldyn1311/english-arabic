<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 مراجعة ذكية</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  text-align:center;
}

.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.word{
  font-size:28px;
  margin:20px 0;
}

.answer{
  font-size:22px;
  color:#facc15;
  display:none;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
  font-size:16px;
}

.show{background:#38bdf8;}
.correct{background:#22c55e;}
.wrong{background:#ef4444;}

.status{
  margin-top:20px;
  font-size:18px;
}

</style>
</head>

<body>

<h2>📚 مراجعة ذكية</h2>

<div class="card">

  <div id="word" class="word">...</div>
  <div id="answer" class="answer">...</div>

  <button class="show" onclick="showAnswer()">👀 إظهار</button>
  <br>

  <button class="correct" onclick="answer(true)">✅ صح</button>
  <button class="wrong" onclick="answer(false)">❌ غلط</button>

  <div id="status" class="status"></div>

</div>

<script>

// 🔗 بياناتك
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"; // 🔴 حط المفتاح هنا

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id") || "user_test";

let words = [];
let current = 0;

// 🧠 تحميل الكلمات
async function load(){

  document.getElementById("status").innerText = "⏳ جاري التحميل...";

  let { data, error } = await supabase
    .from("words")
    .select("*")
    .eq("user_id", user_id)
    .lte("next_review", new Date().toISOString());

  if(error){
    document.getElementById("status").innerText = "❌ خطأ في الاتصال";
    console.log(error);
    return;
  }

  if(!data || data.length === 0){
    document.getElementById("status").innerText = "🎉 خلصت المراجعة اليوم!";
    return;
  }

  words = data.sort(()=>0.5 - Math.random());
  current = 0;

  showWord();
}

// 🎯 عرض كلمة
function showWord(){

  let w = words[current];

  let en = w.en || w.word || "-";
  let ar = w.ar || w.arabic || "-";

  document.getElementById("word").innerText = en;
  document.getElementById("answer").innerText = ar;
  document.getElementById("answer").style.display = "none";

}

// 👀 إظهار
function showAnswer(){
  document.getElementById("answer").style.display = "block";
}

// ✅❌ الإجابة
async function answer(correct){

  let w = words[current];

  let review_count = w.review_count || 0;
  let wrong_count = w.wrong_count || 0;

  let next_review;

  if(correct){
    review_count++;
    next_review = new Date(Date.now() + 86400000 * review_count); // يتباعد
  }else{
    wrong_count++;
    next_review = new Date(Date.now() + 60000); // بعد دقيقة
  }

  await supabase
    .from("words")
    .update({
      review_count,
      wrong_count,
      next_review
    })
    .eq("id", w.id);

  current++;

  if(current >= words.length){
    document.getElementById("status").innerText = "🎉 انتهت المراجعة!";
    document.getElementById("word").innerText = "";
    document.getElementById("answer").innerText = "";
    return;
  }

  showWord();
}

// 🚀 تشغيل
load();

</script>

</body>
</html>
