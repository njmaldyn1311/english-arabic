<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title><style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #eee;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.header {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid white;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

.content {
  padding: 70px 20px 20px;
}

.students {
  color: #0072ff;
  font-weight: bold;
  margin: 10px 0;
}

.card {
  background: #ddd;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
}

button {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

/* زر واتساب */
.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
}

/* زر عائم */
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  font-size: 20px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
}
</style></head><body><div class="container">  <div class="header">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-img">
  </div>  <div class="content"><h2>إنجلش بالعربي 🚀</h2>

<div class="students" id="students">
  👨‍🎓 أكثر من 120 طالب
</div>

<div class="card">
  <span>📚 الفصل</span>
  <button onclick="goClass()">ابدأ</button>
</div>

<div class="card">
  <span>📄 PDF</span>
  <button onclick="goPDF()">ابدأ</button>
</div>

<div class="card">
  <span>📝 اختبار</span>
  <button onclick="goTest()">ابدأ</button>
</div>

<div class="card">
  <span>📊 مراجعة</span>
  <button onclick="goReview()">فتح</button>
</div>

<!-- واتساب -->
<a id="whatsappLink" target="_blank" class="whatsapp">
  💬 تواصل معي على واتساب
</a>

  </div>
</div><!-- زر واتساب عائم --><a id="whatsappFloat" target="_blank" class="whatsapp-float">
  💬
</a><script>

// 👤 اسم الطالب (تأكد أنك تخزنه في login)
let userName = localStorage.getItem("user_name");

if (!userName) {
  userName = "طالب";
}

// ✨ الرسالة
const message = `السلام عليكم، أنا ${userName} وأحتاج مساعدة 🙏`;

// 🔗 تحويل النص لرابط
const encoded = encodeURIComponent(message);

// 📲 رابط واتساب
const link = `https://wa.me/message/735SJORMFI74H1?text=${encoded}`;

// ربط الأزرار
document.getElementById("whatsappLink").href = link;
document.getElementById("whatsappFloat").href = link;

// التنقل
function goClass(){ window.location.href = "myclass.html"; }
function goPDF(){ window.location.href = "pdf.html"; }
function goTest(){ window.location.href = "test.html"; }
function goReview(){ window.location.href = "review.html"; }

</script></body>
</html>
