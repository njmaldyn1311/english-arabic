<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.header {
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

.content {
  padding: 70px 20px 20px;
}

h1 { color: white; margin:10px 0; }
.subtitle { color: #cbd5e1; }

.students {
  color: #22c55e;
  font-weight: bold;
  margin: 10px 0;
}

.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}

button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

.logout { background: #ef4444; }

.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
}

/* إشعار */
.notification {
  position: fixed;
  top: 20px;
  right: 50%;
  transform: translateX(50%);
  background: #1e293b;
  color: white;
  padding: 15px;
  border-radius: 15px;
  display: none;
  z-index: 999;
}

/* شاشة حظر */
.block-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(15,23,42,0.97);
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  z-index: 9999;
}
</style>
</head>

<body>

<div id="notification" class="notification"></div>

<div id="blockOverlay" class="block-overlay">
  <div>
    <h2>🚫 تم حظر حسابك</h2>
    <p>تم إيقاف الوصول</p>
    <button onclick="contactSupport()">تواصل معنا</button>
  </div>
</div>

<div class="container">

  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">🚀 تعلم بطريقة ذكية</div>

    <div class="students" id="students">
      👨‍🎓 أكثر من 120 طالب
    </div>

    <div class="card">
      <span>📚 الفصل الذكي</span>
      <button onclick="goClass()">ابدأ</button>
    </div>

    <div class="card">
      <span>📺 تحليل فيديو</span>
      <button onclick="goYoutube()">ابدأ</button>
    </div>

    <div class="card">
      <span>📄 تحليل PDF</span>
      <button onclick="goPDF()">ابدأ</button>
    </div>

    <div class="card">
      <span>🔍 البحث</span>
      <button onclick="goSearch()">ابدأ</button>
    </div>

    <div class="card">
      <span>📝 اختبار</span>
      <button onclick="goTest()">ابدأ</button>
    </div>

    <div class="card">
      <span>📊 مراجعة</span>
      <button onclick="goReview()">فتح</button>
    </div>

    <div class="card">
      <span>📘 كتاب Headway</span>
      <button onclick="goHeadway()">فتح</button>
    </div>

    <div class="card">
      <span>✨ ميزة جديدة</span>
      <button onclick="goUpdate1()">عرض</button>
    </div>

    <div class="card">
      <span>🆕 التحديثات</span>
      <button onclick="goUpdate2()">عرض</button>
    </div>

    <div class="card">
      <span>👤 حسابي</span>
      <button onclick="goProfile()">فتح</button>
    </div>

    <a id="whatsappLink" class="whatsapp">
      💬 تواصل واتساب
    </a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<script>

// 🔥 اربط بياناتك هنا
const supabase = window.supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 🔔 إشعار
function showNotification(text){
  const n = document.getElementById("notification");
  n.innerText = text;
  n.style.display = "block";
  setTimeout(()=> n.style.display="none",3000);
}

// 🚫 قفل
function blockUI(){
  document.getElementById("blockOverlay").style.display = "flex";
}

// 🔍 تحقق من المستخدم
async function checkUser(){

  const { data: { user } } = await supabase.auth.getUser();

  if(!user) return;

  const { data } = await supabase
    .from("students")
    .select("is_blocked")
    .eq("id", user.id)
    .single();

  if(data?.is_blocked){
    blockUI();
    showNotification("🚫 تم حظر حسابك");
  }

  // realtime حظر
  supabase.channel("block")
    .on("postgres_changes", {
      event: "UPDATE",
      schema: "public",
      table: "students",
      filter: `id=eq.${user.id}`
    }, payload => {
      if(payload.new.is_blocked){
        blockUI();
        showNotification("🚫 تم حظرك الآن");
      }
    }).subscribe();

  // إشعارات
  supabase.channel("notif")
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "notifications"
    }, payload => {
      showNotification(payload.new.message);
    }).subscribe();
}

checkUser();

// 👨‍🎓 عداد طبيعي
let count = parseInt(localStorage.getItem("studentsCount")) || 120;

function updateStudents(){
  if(Math.random() > 0.6) return;
  count++;
  document.getElementById("students").innerText =
    "👨‍🎓 أكثر من " + count + " طالب";
  localStorage.setItem("studentsCount", count);
}
setInterval(updateStudents, 40000);

// تنقل
function goClass(){ location.href="myclass.html"; }
function goYoutube(){ location.href="youtube.html"; }
function goPDF(){ location.href="pdf.html"; }
function goSearch(){ location.href="search.html"; }
function goProfile(){ location.href="student.html"; }
function goTest(){ location.href="test.html"; }
function goReview(){ location.href="review.html"; }
function goHeadway(){ location.href="headwaybook.html"; }
function goUpdate1(){ location.href="update1.html"; }
function goUpdate2(){ location.href="update2.html"; }

// واتساب
let name = localStorage.getItem("user_name") || "طالب";
let msg = encodeURIComponent(`السلام عليكم أنا ${name}`);
document.getElementById("whatsappLink").href =
`https://wa.me/message/735SJORMFI74H1?text=${msg}`;

// تواصل
function contactSupport(){
  window.open(document.getElementById("whatsappLink").href);
}

// خروج
function logout(){
  localStorage.clear();
  location.href="login.html";
}

</script>

</body>
</html>
