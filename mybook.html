<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{margin:0;background:#0f172a;font-family:Arial;color:white;text-align:center;}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;}
.home-btn{background:#38bdf8;padding:8px 15px;border-radius:10px;border:none;color:white;}
.username{font-size:14px;}

.card{background:#e5e7eb;color:black;margin:15px;padding:15px;border-radius:20px;}

.btn{width:100%;padding:12px;border:none;border-radius:12px;margin-top:10px;color:white;font-size:16px;}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

canvas{width:100%;border-radius:15px;margin-top:10px;}

.bottom-buttons{display:flex;gap:5px;margin-top:10px;}
.bottom-buttons button{flex:1;padding:10px;border:none;border-radius:10px;color:white;font-size:13px;background:#22c55e;}

.note-box{width:100%;margin-top:10px;}
textarea{width:100%;height:70px;padding:10px;border-radius:10px;border:none;box-sizing:border-box;}

.analysis-box{
  background:#1e293b;
  color:white;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
  text-align:right;
  display:none;
}

.analysis-box h3{
  margin:10px 0 5px;
  color:#38bdf8;
}

.word-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0f172a;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
}

.en{color:#38bdf8;font-weight:bold;}
.ar{color:#facc15;}

.loader{
  display:none;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#334155;
}

.spinner{
  border:4px solid #ccc;
  border-top:4px solid #38bdf8;
  border-radius:50%;
  width:25px;
  height:25px;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  0%{transform:rotate(0)}
  100%{transform:rotate(360deg)}
}

/* 📱 موبايل */
@media(max-width:600px){
  .word-box{flex-direction:column;gap:5px;text-align:center;}
}
</style>

</head>
<body>

<div class="header">
  <div class="username" id="userName">👤</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <button id="openBtn" class="btn download" onclick="openBook()">📥 تحميل وفتح</button>

  <canvas id="pdf"></canvas>

  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
    <button onclick="savePage()">⭐ حفظ</button>
    <button onclick="readPage()">🔊 قراءة</button>
  </div>

  <div class="note-box">
    <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>
  </div>

  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

  <button class="btn orange" onclick="analyzePage()">🧠 تحليل الصفحة</button>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div>جاري التحليل...</div>
  </div>

  <!-- ✅ التحليل الجديد -->
  <div class="analysis-box" id="analysisBox">

    <h3>🧠 الأفعال</h3>
    <div id="verbs"></div>

    <h3>📦 الأسماء</h3>
    <div id="nouns"></div>

    <h3>⭐ الظروف</h3>
    <div id="adverbs"></div>

    <h3>🔗 حروف الجر</h3>
    <div id="prepositions"></div>

    <h3>🎨 الصفات</h3>
    <div id="adjectives"></div>

    <h3>💬 العبارات</h3>
    <div id="expressions"></div>

    <h3>📘 القاعدة</h3>
    <div id="grammar"></div>

    <button class="btn green" onclick="speakAnalysis()">🔊 قراءة التحليل</button>
    <button class="btn download" onclick="saveAnalysis()">💾 حفظ التحليل</button>

  </div>

</div>

<script>

const AI_WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/headway";

const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userId = localStorage.getItem("user_id");
let isPaid = false;

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc = null;
let currentPage = 1;

async function checkUser(){
  const { data } = await client.from("users").select("name,plan").eq("id", userId).single();
  if(data){
    isPaid = data.plan === "paid";
    document.getElementById("userName").innerText = "👤 " + data.name;
  }
}

function goHome(){ location.href="index.html"; }

async function openBook(){
  const btn = document.getElementById("openBtn");
  btn.innerText="⏳ جاري التحميل...";
  btn.disabled=true;

  await checkUser();

  const loadingTask = pdfjsLib.getDocument(PDF_URL);
  pdfDoc = await loadingTask.promise;
  renderPage(currentPage);

  btn.innerText="📖 تم فتح الكتاب";
  btn.disabled=false;
}

async function renderPage(num){
  const page = await pdfDoc.getPage(num);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");
  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext:ctx, viewport }).promise;
}

function nextPage(){ if(currentPage < pdfDoc.numPages){ currentPage++; renderPage(currentPage);} }
function prevPage(){ if(currentPage > 1){ currentPage--; renderPage(currentPage);} }

function savePage(){
  localStorage.setItem("savedPage", currentPage);
  alert("تم حفظ الصفحة ⭐");
}

async function readPage(){
  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();
  let text = content.items.map(i=>i.str).join(" ");
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

/* 🔥 عرض الكلمات */
function renderWords(arr){
  if(!arr) return "";

  return arr.map(i=>`
    <div class="word-box">
      <span class="en">${i.word || i.text}</span>
      <span class="ar">${i.translation}</span>
      <button onclick="speakWord('${i.word || i.text}')">🔊</button>
    </div>
  `).join("");
}

/* 🔥 التحليل */
async function analyzePage(){

  if(!pdfDoc){
    alert("افتح الكتاب أولاً 📘");
    return;
  }

  const loader = document.getElementById("loader");
  const box = document.getElementById("analysisBox");

  loader.style.display="block";
  box.style.display="none";

  try{

    const page = await pdfDoc.getPage(currentPage);
    const content = await page.getTextContent();
    let text = content.items.map(i=>i.str).join(" ");

    const res = await fetch(AI_WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ text })
    });

    const data = await res.json();

    document.getElementById("verbs").innerHTML = renderWords(data.verbs);
    document.getElementById("nouns").innerHTML = renderWords(data.nouns);
    document.getElementById("adverbs").innerHTML = renderWords(data.adverbs);
    document.getElementById("prepositions").innerHTML = renderWords(data.prepositions);
    document.getElementById("adjectives").innerHTML = renderWords(data.adjectives);

    document.getElementById("expressions").innerHTML =
      (data.expressions || []).map(e=>`
        <div class="word-box">
          <span class="en">${e.text}</span>
          <span class="ar">${e.translation}</span>
          <button onclick="speakWord('${e.text}')">🔊</button>
        </div>
      `).join("");

    document.getElementById("grammar").innerText = data.grammar || "";

    loader.style.display="none";
    box.style.display="block";

  }catch(e){
    loader.style.display="none";
    alert("❌ فشل التحليل");
  }
}

/* 🔊 صوت */
function speakWord(text){
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 0.9;
  speechSynthesis.speak(speech);
}

/* 🔊 صوت التحليل */
function speakAnalysis(){
  let text = document.getElementById("analysisBox").innerText;
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "ar-SA";
  speechSynthesis.speak(speech);
}

/* 💾 حفظ الملاحظات */
async function saveNote(){
  let note = document.getElementById("noteInput").value;
  if(!note) return;

  await client.from("notes").insert({
    user_id:userId,
    page:currentPage,
    note:note
  });

  alert("تم حفظ الملاحظة ✅");
}

/* 💾 حفظ التحليل */
async function saveAnalysis(){
  let content = document.getElementById("analysisBox").innerText;

  await client.from("analysis").insert({
    user_id:userId,
    page:currentPage,
    content:content
  });

  alert("تم حفظ التحليل ✅");
}

</script>

</body>
</html>
