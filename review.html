<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض الدرس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  margin:0;
  text-align:center;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:15px 0;
  border-radius:15px;
}

/* العنوان */
.title{
  font-size:22px;
  font-weight:bold;
}

/* القاعدة */
.grammar{
  text-align:right;
  line-height:1.8;
}

/* الكلمات */
.word{
  border-bottom:1px solid #334155;
  padding:10px;
  text-align:left;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.en{color:#38bdf8;font-weight:bold;}
.ar{color:#f87171;}

.example{
  margin-top:5px;
  color:#e2e8f0;
}

.example-ar{
  color:#facc15;
  font-size:16px;
}

.icon{
  cursor:pointer;
  margin-left:8px;
}
</style>

</head>

<body>

<div class="container">

<div id="lesson"></div>
<div id="grammar"></div>
<div id="words"></div>

</div>

<script>

// 🔥 بياناتك
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ⚠️ حط هنا lesson_id
const LESSON_ID = 2;

// 🔊 صوت
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

// ⭐ حفظ
async function saveWord(el, word, translation){
  await client.from("book_user_words").insert({
    word,
    translation
  });

  el.innerText="✅";
}

// 🚀 تحميل البيانات
async function loadLesson(){

  // 1️⃣ الدرس
  const { data: lesson } = await client
    .from("book_lessons")
    .select("*")
    .eq("id", LESSON_ID)
    .single();

  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <div class="title">📘 ${lesson.title}</div>
    </div>
  `;

  // 2️⃣ القاعدة
  const { data: grammar } = await client
    .from("book_grammar")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let gHTML = "";

  grammar.forEach(g => {
    gHTML += `
      <div class="card grammar">
        <h3>📖 ${g.title}</h3>
        <p>${g.explanation}</p>
        <pre>${g.examples}</pre>
      </div>
    `;
  });

  document.getElementById("grammar").innerHTML = gHTML;

  // 3️⃣ الكلمات
  const { data: words } = await client
    .from("book_words")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let wHTML = "";

  words.forEach(w => {
    wHTML += `
      <div class="card word">

        <div class="top">
          <div>
            <span class="en">${w.word}</span>
            <span class="ar">${w.translation}</span>
          </div>

          <div>
            <span class="icon" onclick="speak('${w.word}')">🔊</span>
            <span class="icon" onclick="saveWord(this,'${w.word}','${w.translation}')">⭐</span>
          </div>
        </div>

        <div class="example">${w.example || ""}</div>
        <div class="example-ar">${w.example_ar || ""}</div>

      </div>
    `;
  });

  document.getElementById("words").innerHTML = wHTML;

}

loadLesson();

</script>

</body>
</html>
