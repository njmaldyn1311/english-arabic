<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الطالب</title>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box {
  background:#1e293b;
  padding:25px;
  border-radius:15px;
  width:90%;
  max-width:400px;
  text-align:center;
}

h2 {
  margin-bottom:20px;
}

input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin:10px 0;
  text-align:center;
  font-size:16px;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.link {
  margin-top:15px;
  display:block;
  color:#38bdf8;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 دخول الطالب</h2>

<input id="phone" placeholder="📱 رقم الجوال">

<button onclick="login()">دخول</button>

<span class="link" onclick="goSignup()">ليس لديك حساب؟ سجل الآن</span>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/login";

async function login(){

  const phone = document.getElementById("phone").value;

  if(!phone) return alert("اكتب رقم الجوال");

  const res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ phone })
  });

  const data = await res.json();

  if(data.user){

    localStorage.setItem("user", data.user.name);
    localStorage.setItem("user_id", data.user.id);
    localStorage.setItem("phone", data.user.phone);

    alert("تم تسجيل الدخول ✅");

    window.location.href = "index.html";

  } else {
    alert("❌ الرقم غير مسجل");
  }
}

function goSignup(){
  window.location.href = "signup.html";
}

</script>

</body>
</html>
