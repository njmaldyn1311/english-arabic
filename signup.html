<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل طالب</title>

<style>

/* 🌍 عام */
*{ box-sizing:border-box; }

body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e3a8a);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px;
}

/* خلفية */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.08;
  z-index:-1;
}

/* 📦 الكرت */
.box {
  width:100%;
  max-width:420px;
  padding:25px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  text-align:center;
  color:white;
}

.stats{
  background: rgba(34,197,94,0.15);
  border:1px solid rgba(34,197,94,0.3);
  padding:10px;
  border-radius:12px;
  margin-bottom:15px;
  font-size:14px;
}

h2 { margin-bottom:15px; }

input {
  width:100%;
  height:50px;
  padding:0 14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  text-align:center;
  font-size:15px;
}

input::placeholder { color:#9ca3af; }

input:focus {
  outline:none;
  box-shadow:0 0 0 2px #38bdf8;
}

/* dropdown */
.custom-select {
  position: relative;
  background: white;
  color: black;
  height: 50px;
  border-radius: 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin:8px 0;
}

/* السهم */
.custom-select::after {
  content: "▼";
  position: absolute;
  left: 12px;
  font-size: 12px;
  color: #555;
  transition:0.3s;
}

.custom-select.active {
  box-shadow:0 0 0 2px #22c55e;
  background:#f0fdf4;
}

.custom-select.active::after {
  transform: rotate(180deg);
}

/* القائمة */
.options {
  position:absolute;
  top:55px;
  right:0;
  left:0;
  background:white;
  border-radius:12px;
  display:none;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  z-index:10;
}

.options.show {
  display:block;
}

.options div {
  padding:12px;
  cursor:pointer;
}

.options div:hover {
  background:#f1f5f9;
}

.options div.selected {
  background:#22c55e;
  color:white;
}

.label {
  margin-top:15px;
  margin-bottom:5px;
  font-size:14px;
  color:#cbd5f5;
}

.skills {
  background:white;
  border-radius:12px;
  padding:12px;
  color:black;
  text-align:right;
}

.check {
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
  cursor:pointer;
}

.check input { display:none; }

.check span {
  width:20px;
  height:20px;
  border:2px solid #3b82f6;
  border-radius:6px;
  position:relative;
}

.check input:checked + span {
  background:#3b82f6;
}

.check input:checked + span::after {
  content:"✓";
  color:white;
  position:absolute;
  top:-2px;
  right:3px;
}

button {
  width:100%;
  height:50px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover { background:#16a34a; }

</style>
</head>

<body>

<div class="box">

<div class="stats">🔥 أكثر من 1200 طالب بدأوا التعلم معنا</div>

<h2>🚀 تسجيل طالب جديد</h2>

<input id="name" placeholder="اسم الطالب">
<input id="phone" placeholder="رقم الجوال">
<input id="city" placeholder="المدينة">
<input id="district" placeholder="الحي">

<!-- الجنس -->
<div class="custom-select" onclick="toggleDropdown(event)">
  <div id="selected">اختر الجنس</div>
  <div class="options" id="dropdown">
    <div onclick="selectOption(event,'ذكر')">ذكر</div>
    <div onclick="selectOption(event,'أنثى')">أنثى</div>
  </div>
</div>

<!-- المستوى -->
<div class="custom-select" onclick="toggleLevelDropdown(event)">
  <div id="selectedLevel">المستوى</div>
  <div class="options" id="levelDropdown">
    <div onclick="selectLevel(event,'مبتدئ')">مبتدئ</div>
    <div onclick="selectLevel(event,'متوسط')">متوسط</div>
    <div onclick="selectLevel(event,'متقدم')">متقدم</div>
  </div>
</div>

<script>

const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

let selectedGender = "";
let selectedLevel = "";

function closeAll(){
  document.querySelectorAll(".options").forEach(el=>{
    el.classList.remove("show");
  });
  document.querySelectorAll(".custom-select").forEach(el=>{
    el.classList.remove("active");
  });
}

/* الجنس */
function toggleDropdown(e){
  if(e) e.stopPropagation();

  const box = document.querySelectorAll(".custom-select")[0];
  const drop = document.getElementById("dropdown");

  const isOpen = drop.classList.contains("show");

  if(isIOS){
    closeAll();
    if(!isOpen){
      drop.classList.add("show");
      box.classList.add("active");
    }
  } else {
    drop.classList.toggle("show");
    box.classList.toggle("active");
  }
}

function selectOption(e, value){
  e.stopPropagation();
  selectedGender = value;
  document.getElementById("selected").innerText = value;

  document.querySelectorAll("#dropdown div").forEach(el=>{
    el.classList.remove("selected");
    if(el.innerText === value){
      el.classList.add("selected");
    }
  });

  closeAll();
}

/* المستوى */
function toggleLevelDropdown(e){
  if(e) e.stopPropagation();

  const box = document.querySelectorAll(".custom-select")[1];
  const drop = document.getElementById("levelDropdown");

  const isOpen = drop.classList.contains("show");

  if(isIOS){
    closeAll();
    if(!isOpen){
      drop.classList.add("show");
      box.classList.add("active");
    }
  } else {
    drop.classList.toggle("show");
    box.classList.toggle("active");
  }
}

function selectLevel(e, value){
  e.stopPropagation();
  selectedLevel = value;
  document.getElementById("selectedLevel").innerText = value;

  document.querySelectorAll("#levelDropdown div").forEach(el=>{
    el.classList.remove("selected");
    if(el.innerText === value){
      el.classList.add("selected");
    }
  });

  closeAll();
}

/* إغلاق */
document.addEventListener("click", function(){
  if(isIOS){
    setTimeout(closeAll, 150);
  } else {
    closeAll();
  }
});

</script>

</body>
</html>
