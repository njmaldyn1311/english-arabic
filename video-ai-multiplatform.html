<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>AI Video Learning PRO+ | إنجلش بالعربي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;font-family:Arial,sans-serif}
.container{width:min(94%,760px);margin:auto;padding:16px 0 40px}
h2{text-align:center;margin:10px 0 18px}
.field-label{display:block;margin:14px 2px 7px;color:#cbd5e1;font-size:14px;font-weight:bold;text-align:right}
input{display:block;width:100%;padding:14px;border:1px solid #334155;border-radius:12px;background:#f8fafc;color:#0f172a;font:16px Arial;direction:ltr;text-align:left}
button{border:0;border-radius:12px;padding:13px 18px;background:#22c55e;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#analyzeBtn{width:100%;margin-top:12px}
.hint{font-size:12px;color:#94a3b8;line-height:1.8;margin:8px 2px;text-align:right}
.card{background:#1e293b;border:1px solid #334155;margin:16px 0;padding:14px;border-radius:16px;min-width:0}
#videoBox{display:none}
.player-wrap{width:100%;aspect-ratio:16/9;min-height:220px;background:#020617;border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#videoFrame{width:100%;height:100%;min-height:220px;border:0;background:#020617}
.player-wrap.tiktok{aspect-ratio:9/16;max-width:430px;margin:auto;min-height:560px}
.player-wrap.facebook{aspect-ratio:16/9;min-height:260px}
.platform-note{color:#cbd5e1;font-size:13px;line-height:1.8;margin-top:10px;text-align:right}
#loading{display:none;text-align:center;margin:16px 0;color:#facc15;line-height:1.8}
#status{display:none;padding:12px;border-radius:11px;background:#164e63;color:#cffafe;line-height:1.7;font-size:13px;margin-top:12px;text-align:right;overflow-wrap:anywhere}
#status.error{background:#7f1d1d;color:#fee2e2}
.analysis-category h3{color:#fff;text-align:center;direction:ltr;margin:12px 0 12px;font-size:22px}
.word-box{border-bottom:1px solid #334155;padding:15px 0;direction:ltr}
.word-top{display:grid;grid-template-columns:minmax(0,1fr) 108px minmax(0,1fr);gap:6px;align-items:center;width:100%}
.en{grid-column:1;color:#38bdf8;font-weight:bold;text-align:left;direction:ltr;overflow-wrap:anywhere;padding-left:7px;font-size:18px}
.actions{grid-column:2;display:flex;justify-content:center;align-items:center;gap:7px;width:108px}
.ar{grid-column:3;color:#facc15;text-align:right;direction:rtl;overflow-wrap:anywhere;padding-right:7px;font-size:18px}
.icon-btn{width:48px;height:48px;display:grid;place-items:center;padding:0;border-radius:13px;background:#0f172a;font-size:22px}
.empty-cat{color:#94a3b8;text-align:center;font-size:12px;padding:7px 5px 14px;border-bottom:1px solid #334155}
.empty-result{text-align:center;color:#cbd5e1;line-height:1.8;padding:15px}
.transcript-box{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;color:#cbd5e1;font-size:14px;line-height:1.8;max-height:260px;overflow:auto}
@media(max-width:520px){.container{width:94%;padding-top:12px}.player-wrap{min-height:190px}.player-wrap.tiktok{max-width:100%;min-height:530px}.word-top{grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);gap:3px}.actions{width:96px;gap:4px}.icon-btn{width:44px;height:44px;font-size:20px}.en,.ar{font-size:16px}.card{padding:11px}}
</style>
</head>
<body>
<div class="container">
  <h2>🎥 تعلم من الفيديو بذكاء</h2>

  <label class="field-label" for="url">رابط الفيديو (TikTok أو YouTube أو Facebook)</label>
  <input id="url" type="url" placeholder="الصق رابط الفيديو هنا" autocomplete="url" inputmode="url">
  <div class="hint">الصق رابط الفيديو فقط. لا تحتاج إلى تحميل الفيديو على جوالك    </div>

  <button id="analyzeBtn" type="button">🔗 تشغيل الفيديو وتحليل الكلام</button>
  <div id="loading">⏳ جارٍ استخراج الكلام وتحليل المفردات في الخلفية...</div>
  <div id="status" role="status" aria-live="polite"></div>

  <div id="videoBox" class="card">
    <div id="playerWrap" class="player-wrap">
      <iframe id="videoFrame" title="Video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <div id="platformNote" class="platform-note"></div>
  </div>

  <div id="result"></div>
</div>

<script>
'use strict';

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// هذا هو Webhook متعدد المنصات الموجود في ملف n8n الذي أرسلته.
// يجب أن يكون n8n هو الذي يستدعي RapidAPI؛ لا تضع مفتاح RapidAPI في هذه الصفحة.
const WEBHOOK = "https://steelblue-frog-379077.hostingersite.com/webhook/video-ai-multiplatform";
const STATUS_WEBHOOK = "https://steelblue-frog-379077.hostingersite.com/webhook/video-ai-status";

let user_id = localStorage.getItem("user_id");
if (!user_id) {
  user_id = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "user_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("user_id", user_id);
}

const labels = {
  verbs: "verbs",
  nouns: "nouns",
  adjectives: "adjectives",
  phrasal_verbs: "phrasal verbs",
  idioms: "idioms",
  adverbs: "adverbs"
};

async function track(action) {
  try {
    await fetch(SUPABASE_URL + "/rest/v1/user_activity", {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({ user_id, page: "video_page", action })
    });
  } catch (error) {
    console.debug("Tracking skipped", error);
  }
}
track("دخول صفحة تحليل الفيديو");

function setStatus(message, isError = false) {
  const el = document.getElementById("status");
  el.textContent = message || "";
  el.className = isError ? "error" : "";
  el.style.display = message ? "block" : "none";
}

function identifyPlatform(rawUrl) {
  let parsed;
  try {
    parsed = new URL(rawUrl);
  } catch {
    throw new Error("الرابط غير صحيح. الصق رابطاً كاملاً يبدأ بـ https://");
  }
  const host = parsed.hostname.toLowerCase().replace(/^www\./, "").replace(/^m\./, "");
  if (host === "tiktok.com" || host.endsWith(".tiktok.com")) return { platform: "tiktok", parsed };
  if (host === "youtube.com" || host.endsWith(".youtube.com") || host === "youtu.be" || host === "youtube-nocookie.com") return { platform: "youtube", parsed };
  if (host === "facebook.com" || host.endsWith(".facebook.com") || host === "fb.watch") return { platform: "facebook", parsed };
  throw new Error("المنصة غير مدعومة. استخدم TikTok أو YouTube أو Facebook.");
}

function fallbackEmbed(rawUrl) {
  const info = identifyPlatform(rawUrl);
  const p = info.parsed;
  if (info.platform === "youtube") {
    let id = p.searchParams.get("v") || "";
    if (!id && p.hostname.toLowerCase().includes("youtu.be")) id = p.pathname.split("/").filter(Boolean)[0] || "";
    if (!id) {
      const match = p.pathname.match(/^\/(?:embed|shorts|live|v)\/([A-Za-z0-9_-]{11})/i);
      id = match ? match[1] : "";
    }
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) throw new Error("لم أستطع تحديد معرف فيديو YouTube من الرابط.");
    return { platform: "youtube", embed_url: "https://www.youtube.com/embed/" + id + "?playsinline=1&rel=0" };
  }
  if (info.platform === "tiktok") {
    const match = p.pathname.match(/\/video\/(\d+)/i);
    if (!match) throw new Error("استخدم رابط TikTok الكامل الذي يحتوي على /video/ ورقم الفيديو.");
    return { platform: "tiktok", embed_url: "https://www.tiktok.com/player/v1/" + match[1] + "?music_info=1&description=1" };
  }
  return {
    platform: "facebook",
    embed_url: "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(rawUrl) + "&show_text=0&width=560"
  };
}

function setPlayer(data, originalUrl) {
  let playerData = data || {};
  let fallback = null;
  try { fallback = fallbackEmbed(originalUrl); } catch (error) { /* The backend may resolve short links. */ }
  const platform = playerData.platform || (fallback && fallback.platform) || "";
  const embedUrl = playerData.embed_url || (fallback && fallback.embed_url) || "";
  if (!embedUrl) return;

  const frame = document.getElementById("videoFrame");
  const wrap = document.getElementById("playerWrap");
  if (frame.src !== embedUrl) frame.src = embedUrl;
  wrap.className = "player-wrap" + (platform === "tiktok" ? " tiktok" : platform === "facebook" ? " facebook" : "");
  document.getElementById("videoBox").style.display = "block";

  const names = { youtube: "YouTube", tiktok: "TikTok", facebook: "Facebook" };
  document.getElementById("platformNote").textContent = "المصدر: " + (names[platform] || platform) + ". قد لا تعمل الفيديوهات الخاصة أو المحذوفة أو المقيدة جغرافياً داخل التضمين.";
}

function speak(text) {
  if (!text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}

async function saveWord(button, en, ar) {
  const old = button.textContent;
  button.disabled = true;
  button.textContent = "…";
  try {
    const { error } = await client.from("user_star_words").insert({ user_id, word: en, translation: ar });
    if (error) throw error;
    button.textContent = "✅";
    track("حفظ كلمة: " + en);
  } catch (error) {
    console.error(error);
    button.textContent = old;
    setStatus("تعذر حفظ الكلمة. تحقق من صلاحيات جدول user_star_words.", true);
  } finally {
    button.disabled = false;
  }
}

function showTranscriptOnly(transcript) {
  const root = document.getElementById("result");
  const card = document.createElement("div");
  card.className = "card empty-result";
  const title = document.createElement("h3");
  title.textContent = "تم استخراج الكلام من الفيديو";
  const note = document.createElement("p");
  note.textContent = "وصل نص التفريغ، لكن لم تصل نتائج تحليل المفردات من n8n. تأكد من توصيل ناتج RapidAPI بعقدة تحليل النص.";
  const text = document.createElement("div");
  text.className = "transcript-box";
  text.textContent = transcript;
  card.append(title, note, text);
  root.appendChild(card);
}

function show(data) {
  const root = document.getElementById("result");
  root.replaceChildren();

  const transcript = typeof data.transcript === "string"
    ? data.transcript
    : (data.transcript && typeof data.transcript.text === "string" ? data.transcript.text : "");

  const hasCategories = Object.keys(labels).some(key => Array.isArray(data[key]));
  if (!data.analysis_ready && !hasCategories) {
    if (transcript) showTranscriptOnly(transcript);
    else {
      const p = document.createElement("div");
      p.className = "card empty-result";
      p.textContent = data.message || "تم تجهيز الفيديو، لكن لم يصل نص التفريغ أو تحليل المفردات من الخادم.";
      root.appendChild(p);
    }
    return;
  }

  let total = 0;
  for (const key of Object.keys(labels)) {
    const arr = Array.isArray(data[key]) ? data[key] : [];
    const section = document.createElement("section");
    section.className = "card analysis-category";
    const heading = document.createElement("h3");
    heading.textContent = labels[key];
    section.appendChild(heading);

    if (!arr.length) {
      const empty = document.createElement("div");
      empty.className = "empty-cat";
      empty.textContent = "لا توجد عناصر في هذا القسم ضمن النص المستخرج.";
      section.appendChild(empty);
    }

    for (const item of arr) {
      const en = String((item && (item.en || item.word)) || "").trim();
      const ar = String((item && (item.ar || item.translation)) || "").trim();
      if (!en) continue;

      const row = document.createElement("div");
      row.className = "word-box";
      const top = document.createElement("div");
      top.className = "word-top";

      const enEl = document.createElement("span");
      enEl.className = "en";
      enEl.textContent = en;
      const arEl = document.createElement("span");
      arEl.className = "ar";
      arEl.textContent = ar;

      const actions = document.createElement("div");
      actions.className = "actions";
      const save = document.createElement("button");
      save.className = "icon-btn";
      save.type = "button";
      save.textContent = "⭐";
      save.title = "حفظ الكلمة";
      save.addEventListener("click", () => saveWord(save, en, ar));
      const sound = document.createElement("button");
      sound.className = "icon-btn";
      sound.type = "button";
      sound.textContent = "🔊";
      sound.title = "نطق الكلمة";
      sound.addEventListener("click", () => speak(en));

      actions.append(save, sound);
      top.append(enEl, actions, arEl);
      row.appendChild(top);
      section.appendChild(row);
      total++;
    }
    root.appendChild(section);
  }

  const footer = document.createElement("div");
  footer.className = "hint";
  footer.style.textAlign = "center";
  footer.textContent = "إجمالي المفردات المستخرجة: " + total;
  root.appendChild(footer);
}

function createJobId() {
  if (window.crypto && typeof crypto.randomUUID === "function") {
    return crypto.randomUUID();
  }
  return "job_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function pollJobResult(jobId, timeoutMs = 20 * 60 * 1000) {
  const startedAt = Date.now();
  let attempt = 0;

  while (Date.now() - startedAt < timeoutMs) {
    await wait(2500);
    attempt++;

    const statusUrl = STATUS_WEBHOOK + "?job_id=" + encodeURIComponent(jobId) + "&_=" + Date.now();
    const response = await fetch(statusUrl, {
      method: "GET",
      cache: "no-store"
    });

    const raw = await response.text();
    let payload;
    try {
      payload = JSON.parse(raw);
    } catch {
      throw new Error("استجابة حالة المهمة غير مفهومة من n8n: " + raw.slice(0, 220));
    }

    if (!response.ok || payload.success === false) {
      throw new Error(payload.error || payload.message || "تعذر جلب حالة التحليل.");
    }

    if (payload.status === "completed") {
      if (!payload.result || typeof payload.result !== "object") {
        throw new Error("اكتمل التحليل، لكن لم تصل نتيجة المفردات المحفوظة.");
      }
      return payload.result;
    }

    if (payload.status === "failed") {
      throw new Error(payload.error || "تعذر تحليل الفيديو. راجع سجل التنفيذ في n8n.");
    }

    if (payload.status === "not_found") {
      setStatus("تم استلام الطلب. جارٍ تسجيل المهمة وتجهيز التحليل...");
    } else {
      setStatus("جارٍ تحليل الفيديو واستخراج المفردات... (" + attempt + ")");
    }
  }

  throw new Error("استغرق تحليل الفيديو وقتاً أطول من المتوقع. أعد المحاولة لاحقاً أو تحقق من تنفيذ n8n.");
}

async function sendUrl() {
  const url = document.getElementById("url").value.trim();
  if (!url) {
    alert("الصق رابط الفيديو أولاً.");
    return;
  }

  let platformInfo;
  try {
    platformInfo = identifyPlatform(url);
  } catch (error) {
    setStatus(error.message, true);
    return;
  }

  const button = document.getElementById("analyzeBtn");
  const loading = document.getElementById("loading");
  const jobId = createJobId();

  button.disabled = true;
  loading.style.display = "block";
  document.getElementById("result").replaceChildren();
  setStatus("");

  // Validate the platform-specific video ID before starting a background job.
  let immediatePlayer;
  try {
    immediatePlayer = fallbackEmbed(url);
  } catch (error) {
    button.disabled = false;
    loading.style.display = "none";
    setStatus(error.message || "رابط الفيديو غير مكتمل.", true);
    return;
  }

  // Show the player immediately; do not wait for transcription/analysis.
  setPlayer(immediatePlayer, url);

  try {
    // text/plain avoids the browser's JSON preflight request.
    // Resolve Platform Link parses this JSON string from incoming.body.
    const startResponse = await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ url, user_id, job_id: jobId })
    });

    if (!startResponse.ok) {
      const errorText = await startResponse.text();
      throw new Error("تعذر بدء مهمة التحليل في n8n: " + errorText.slice(0, 220));
    }

    setStatus("تم استلام رابط الفيديو. يجري التفريغ والتحليل في الخلفية...");
    const data = await pollJobResult(jobId);

    setPlayer(data, url);
    show(data);

    if (data.analysis_ready) {
      setStatus(data.message || "اكتمل تفريغ الفيديو وتحليل المفردات.");
    } else {
      setStatus("وصلت نتيجة المهمة، لكن لم يتم تأكيد اكتمال تحليل المفردات.");
    }

    track("تشغيل وتحليل " + (data.platform || platformInfo.platform));
  } catch (error) {
    console.error(error);
    setStatus(error.message || "حدث خطأ أثناء تحليل الفيديو.", true);
  } finally {
    button.disabled = false;
    loading.style.display = "none";
  }
}

document.getElementById("analyzeBtn").addEventListener("click", sendUrl);
document.getElementById("url").addEventListener("keydown", event => {
  if (event.key === "Enter") sendUrl();
});
</script>
<script src="auth.js"></script>
</body>
</html>
