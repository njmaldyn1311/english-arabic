<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 كتابي</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  text-align:center;
  font-family:Arial;
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

canvas{
  width:100%;
  border-radius:12px;
  margin-top:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.controls{
  margin-top:10px;
}

button{
  padding:10px 14px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  background:#16a34a;
}
</style></head><body><div class="container"><h3>📘 كتابي</h3><div class="controls">
  <button onclick="prev()">⬅️ السابق</button>
  <span id="page">...</span>
  <button onclick="next()">التالي ➡️</button>
</div><canvas id="pdf"></canvas>

</div><script>

// 🔗 رابط كتابك
const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc = null;
let pageNum = 1;

// 🔥 يرجع لآخر صفحة
let saved = localStorage.getItem("bookPage");
if(saved){
  pageNum = parseInt(saved);
}

// 🚀 تحميل PDF
pdfjsLib.getDocument(PDF_URL).promise.then(pdf=>{
  pdfDoc = pdf;
  renderPage(pageNum);
});

// 📄 عرض الصفحة
function renderPage(num){

  pdfDoc.getPage(num).then(page=>{

    let canvas = document.getElementById("pdf");
    let ctx = canvas.getContext("2d");

    let viewport = page.getViewport({scale:1.4});
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    page.render({canvasContext:ctx, viewport:viewport});

    document.getElementById("page").innerText =
      `صفحة ${num} / ${pdfDoc.numPages}`;

    // 💾 حفظ الصفحة
    localStorage.setItem("bookPage", num);
  });
}

// ➡️
function next(){
  if(pageNum < pdfDoc.numPages){
    pageNum++;
    renderPage(pageNum);
  }
}

// ⬅️
function prev(){
  if(pageNum > 1){
    pageNum--;
    renderPage(pageNum);
  }
}

</script></body>
</html>
