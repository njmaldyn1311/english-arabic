<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

/* 🔥 كارد الفيديو الجديد */
.video-box{
  width:100%;
  max-width:1000px;
  margin:auto;
  aspect-ratio:16/9;
  border-radius:20px;
  overflow:hidden;
  background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* الفيديو ياخذ كامل المساحة */
#player{
  width:100%;
  height:100%;
}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:12px;
  color:white;
  cursor:pointer;
}

.sub-en{
  color:#38bdf8;
  font-weight:bold;
  margin-top:25px;
  font-size:20px;
}

.sub-ar{
  color:#facc15;
  font-size:22px;
  font-weight:bold;
  margin-bottom:30px;
}

.card{
  background:#1e293b;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
}

.word-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin-bottom:8px;
  background:#0f172a;
  border-radius:12px;
}

.icon{
  cursor:pointer;
  background:#1e293b;
  padding:8px;
  border-radius:10px;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 20px;
  border-radius:12px;
  opacity:0;
  transition:0.3s;
}
.toast.show{opacity:1;}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو</h2>

<!-- ✅ كارد الفيديو -->
<div class="video-box">
  <div id="player"></div>
</div>

<div class="controls">
  <button onclick="prev()">⏮ السابق</button>
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔄 إعادة</button>
  <button onclick="next()">⏭ التالي</button>
</div>

<div id="subEn" class="sub-en"></div>
<div id="subAr" class="sub-ar"></div>

<div id="result"></div>

</div>

<div id="toast" class="toast"></div>

<script>

const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let player;
let subtitles=[];
let offset=0;
let lastVideoId="";

/* إنشاء الفيديو */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:new URLSearchParams(location.search).get("list")
    },
    events:{ onReady:init }
  });
}

/* التحكم */
function play(){ player.playVideo(); }
function pause(){ player.pauseVideo(); }
function restart(){ player.seekTo(0,true); }

function next(){
  player.nextVideo();
}

function prev(){
  player.previousVideo();
}

/* toast */
function toast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

/* صوت */
function speak(t){
  let u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* حفظ */
function save(el,word,ar){
  el.innerText="✅";
  toast("تم الحفظ");
}

/* AI */
async function loadAI(){

  let vid = player.getVideoData().video_id;

  let res=await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      url:"https://www.youtube.com/watch?v="+vid
    })
  });

  let data=await res.json();

  subtitles=[];
  offset=0;

  let html="";

  for(let cat in data){

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      if(!w.example) return;

      subtitles.push({
        time:w.time||0,
        en:w.example,
        ar:w.example_ar
      });

      html+=`
      <div class="word-box">
        <div>
          <div class="sub-en">${w.en}</div>
          <div class="sub-ar">${w.ar}</div>
        </div>

        <div style="display:flex;gap:5px">
          <div class="icon" onclick="speak('${w.en}')">🔊</div>
          <div class="icon" onclick="save(this,'${w.en}','${w.ar}')">⭐</div>
        </div>
      </div>`;
    });

    html+="</div>";
  }

  result.innerHTML=html;

  // 🔥 offset ذكي
  let first=subtitles.find(s=>s.en && s.en.length>8);
  if(first){
    offset = player.getCurrentTime() - first.time;
  }
}

/* 🔥 مراقبة تغيير الفيديو */
setInterval(()=>{

  if(!player || !player.getVideoData) return;

  let current = player.getVideoData().video_id;

  if(!current) return;

  if(current !== lastVideoId){

    lastVideoId = current;

    console.log("🎬 فيديو جديد:", current);

    loadAI();

  }

},1000);

/* ترجمة */
setInterval(()=>{

  if(!player || !player.getCurrentTime) return;

  let state;
  try{ state=player.getPlayerState(); }catch{ return; }

  if(state !== 1) return;

  let t = player.getCurrentTime() - offset;

  let c=subtitles.find(s=>t>=s.time && t<s.time+4);

  if(c){
    subEn.innerHTML=c.en;
    subAr.innerText=c.ar;
  }

},500);

/* init */
function init(){
  setTimeout(loadAI,2000);
}

</script>

</body>
</html>
