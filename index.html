<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الرئيسية</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
}

/* 👤 زر صغير */
#miniAccount{
  position:fixed;
  bottom:15px;
  right:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  border-radius:50px;
  padding:8px 12px;
  font-size:12px;
  color:white;
  display:flex;
  align-items:center;
  gap:6px;
  z-index:9999;
  cursor:pointer;
}

/* ⚙️ قائمة */
#miniMenu{
  position:fixed;
  bottom:55px;
  right:15px;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);
  border-radius:12px;
  padding:10px;
  display:none;
  z-index:9999;
  min-width:120px;
  text-align:center;
}
</style>
</head>

<body>

<!-- 👤 زر حساب -->
<div id="miniAccount">
  👤 <span id="miniName">...</span>
</div>

<!-- ⚙️ القائمة -->
<div id="miniMenu">
  <button onclick="logout()" style="
    width:100%;
    background:#ef4444;
    border:none;
    padding:6px;
    border-radius:8px;
    color:white;
    font-size:12px;
    cursor:pointer;
  ">
    تسجيل خروج
  </button>
</div>

<script>

// 🔥 user_id موحد
let user_id = localStorage.getItem("user_id");
if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

// 🔐 session_id (منع تعدد الأجهزة)
if(!localStorage.getItem("session_id")){
  localStorage.setItem("session_id", Date.now());
}

// 🔥 Supabase
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔥 تحقق من الوصول
async function checkAccess(){

  const localSession = localStorage.getItem("session_id");

  const { data } = await client
    .from("users")
    .select("*")
    .eq("id", user_id)
    .single();

  // 🔥 مستخدم جديد → تسجيل
  if(!data){
    alert("👋 حساب جديد\nيرجى التسجيل");
    location.href="signup.html";
    return;
  }

  if(data.status === "banned"){
    logout("🚫 تم حظرك");
    return;
  }

  // 🔐 جهاز ثاني
  if(data.session_id !== localSession){
    logout("🚫 تم تسجيل الدخول من جهاز آخر");
    return;
  }

  // ⏳ تجربة 3 أيام
  if(data.plan === "free"){
    let created = new Date(data.created_at);
    let now = new Date();
    let days = Math.floor((now - created)/(1000*60*60*24));

    if(days >= 3){
      logout("⏳ انتهت الفترة التجريبية");
    }
  }
}

// 🔁 كل 5 ثواني
setInterval(checkAccess, 5000);

// 🔥 طرد من كل التبويبات
window.addEventListener("storage",(e)=>{
  if(e.key === "force_logout"){
    localStorage.clear();
    location="login.html";
  }
});

// 🔥 تشغيل أول ما يدخل
window.onload = ()=>{
  checkAccess();

  // عرض الاسم
  let name=localStorage.getItem("user")||"طالب";
  document.getElementById("miniName").innerText=name;
}

// 🔥 تتبع
async function track(action){
  fetch(SUPABASE_URL+"/rest/v1/user_activity",{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id:user_id,
      page:"home",
      action:action
    })
  });
}

track("دخول الرئيسية");

// واتساب
let name=localStorage.getItem("user_name")||"طالب";
let msg=encodeURIComponent("السلام عليكم أنا "+name);
let link=`https://wa.me/message/735SJORMFI74H1?text=${msg}`;

if(typeof whatsappLink !== "undefined") whatsappLink.href=link;
if(typeof whatsappFloat !== "undefined") whatsappFloat.href=link;

// تنقل + تتبع
function goClass(){track("الفصل");location="myclass.html";}
function goYoutube(){track("فيديو");location="youtube.html";}
function goPDF(){track("PDF");location="pdf.html";}
function goSearch(){track("بحث");location="search.html";}
function goProfile(){track("حساب");location="student.html";}
function goTest(){track("اختبار");location="test.html";}
function goReview(){track("مراجعة");location="review.html";}
function goHeadway(){track("كتاب");location="headwaybook.html";}
function goUpdate1(){track("ميزة");location="update1.html";}
function goUpdate2(){track("تحديثات");location="update2.html";}

// خروج
function logout(msg){

  if(typeof track === "function"){
    track("خروج");
  }

  localStorage.setItem("force_logout", Date.now());

  localStorage.clear();

  if(msg){
    alert(msg);
  }

  setTimeout(()=>{
    location="login.html";
  },800);
}

/* 👇 فتح القائمة */
document.getElementById("miniAccount").onclick = ()=>{
  let menu = document.getElementById("miniMenu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
};

/* 👇 إغلاق عند الضغط خارج */
document.addEventListener("click",(e)=>{
  let box = document.getElementById("miniAccount");
  let menu = document.getElementById("miniMenu");

  if(!box.contains(e.target) && !menu.contains(e.target)){
    menu.style.display="none";
  }
});

</script>

</body>
</html>
