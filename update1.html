<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الأفعال</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  padding:15px;
}

/* الكارد */
.card{
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
}

/* صف */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:5px 0;
}

/* زر صوت */
.sound{
  background:#22c55e;
  border:none;
  border-radius:8px;
  padding:5px 10px;
  color:white;
  cursor:pointer;
  font-size:12px;
}

/* ترجمة */
.translation{
  margin-top:10px;
  color:#38bdf8;
  font-weight:bold;
  text-align:center;
}
</style>

</head>
<body>

<h2>📚 الأفعال</h2>

<div id="list"></div>

<script>

// 🔥 بياناتك
const supabase = window.supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);


// 🔊 تشغيل الصوت
function speak(text){
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speechSynthesis.speak(speech);
}


// تحميل الأفعال
async function loadWords(){

  const { data, error } = await supabase
    .from("book_words")
    .select("*")
    .eq("type", "verb");

  if(error){
    alert("خطأ: " + error.message);
    return;
  }

  const container = document.getElementById("list");

  data.forEach(word => {

    container.innerHTML += `
      <div class="card">

        <div class="row">
          <span>Present: ${word.base}</span>
          <button class="sound" onclick="speak('${word.base}')">🔊</button>
        </div>

        <div class="row">
          <span>Past: ${word.past}</span>
          <button class="sound" onclick="speak('${word.past}')">🔊</button>
        </div>

        <div class="row">
          <span>P.P: ${word.past_participle}</span>
          <button class="sound" onclick="speak('${word.past_participle}')">🔊</button>
        </div>

        <div class="translation">
          ${word.translation}
        </div>

      </div>
    `;
  });

}

loadWords();

</script>

</body>
</html>
