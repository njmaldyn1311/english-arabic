<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل PDF</title><style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  background-attachment: fixed;
  min-height: 100vh;
  margin: 0;
}

/* 🔥 الحاوية الخارجية (المهم) */
.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 20px; /* 👈 هنا المسافة من الجوانب */
  box-sizing: border-box;
}

/* الصندوق الأبيض */
.box {
  background: white;
  padding: 25px;
  border-radius: 20px;
  width: 100%;
  margin-bottom: 15px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* النتائج */
#result {
  margin-top: 15px;
  width: 100%;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* الزر */
button {
  background: #00c6ff;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  background: #009edb;
}

/* الصف */
.word {
  padding: 10px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

/* الإنجليزي */
.en {
  color: #333;
  flex: 1;
  text-align: left;
}

/* العربي */
.ar {
  color: #333;
  flex: 1;
  text-align: right;
}

/* العناوين */
.title {
  text-align: center;
  margin: 20px 0 10px;
}

/* تحميل */
.loading {
  margin-top: 15px;
  color: #00c6ff;
  font-weight: bold;
}

/* تحسين للجوال */
@media (max-width: 600px) {
  .container {
    padding: 15px; /* 🔥 مسافة مناسبة للجوال */
  }

  .word {
    font-size: 14px;
  }

  button {
    padding: 8px;
  }
}
</style></head><body><div class="container">  <div class="box">
    <h2>📄 رفع PDF</h2><input type="file" id="file" accept="application/pdf"><br><br>

<button onclick="upload()">🚀 تحليل</button>

<p id="status"></p>

  </div>  <div id="result"></div></div><script>
async function upload() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!file) {
    alert("اختر ملف");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  status.innerText = "⏳ جاري التحليل...";
  result.innerHTML = `<div class="loading">⏳ جاري استخراج الكلمات...</div>`;

  try {
    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
      method: "POST",
      body: formData
    });

    let data = await res.json();

    if (data.raw) {
      try {
        data = JSON.parse(data.raw);
      } catch {}
    }

    status.innerText = "✅ تم التحليل";

    function renderList(list) {
      return (list || []).map(item => `
        <div class="word">
          <span class="en">${item.word || item.phrase || ""}</span>

          <button onclick="speak('${item.word || item.phrase}')">🔊</button>

          <span class="ar">${item.arabic || ""}</span>
        </div>
      `).join("");
    }

    result.innerHTML = `
      <h3 class="title">📌 الأفعال (Verbs)</h3>
      ${renderList(data.verbs)}

      <h3 class="title">📌 الأسماء (Nouns)</h3>
      ${renderList(data.nouns)}

      <h3 class="title">📌 الصفات (Adjectives)</h3>
      ${renderList(data.adjectives)}

      <h3 class="title">📌 العبارات (Idioms)</h3>
      ${renderList(data.idioms)}

      <h3 class="title">📌 الأفعال المركبة (Phrasal Verbs)</h3>
      ${renderList(data.phrasal_verbs || data.phrasalVerbs)}
    `;

  } catch (err) {
    console.error(err);
    status.innerText = "❌ خطأ في الاتصال";
  }
}

function speak(word) {
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  speechSynthesis.speak(utterance);
}
</script></body>
</html>
