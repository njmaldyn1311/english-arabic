<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 الدرس الجماعي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:"Cairo",sans-serif;
  background:#0f172a;
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.title{
  text-align:center;
  margin-bottom:15px;
}

.card{
  background:#1e293b;
  border-radius:15px;
  padding:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.word{color:#38bdf8;}
.translation{color:#facc15;}

.actions{
  display:flex;
  gap:5px;
}

button{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.speak{background:#22c55e;color:white;}
.star{background:#f59e0b;color:white;}
.saved{background:#22c55e;}
</style>

</head>
<body>

<div class="header">
  <div id="username">👤</div>
  <div>📚 الدرس الجماعي</div>
</div>

<div class="container">

  <div class="title">
    📖 Unit 7
  </div>

  <div id="list"></div>

</div>

<script>

// 🔥 Supabase
const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 👤 المستخدم
let user_id = localStorage.getItem("user_id");

// 🧠 اسم الدرس (ثابت للجميع)
const LESSON = "unit7";

// 👤 الاسم
document.getElementById("username").innerText =
  "👤 " + (localStorage.getItem("user") || "طالب");

// 🔊 صوت
function speak(word){
  let s = new SpeechSynthesisUtterance(word);
  s.lang = "en-US";
  speechSynthesis.speak(s);
}

// ⭐ حفظ (شخصي)
async function saveWord(word,translation,btn){

  // 🔥 منع التكرار
  const { data } = await client
    .from("user_star_words")
    .select("*")
    .eq("user_id", user_id)
    .eq("word", word);

  if(data.length > 0){
    btn.classList.add("saved");
    btn.innerText="✔";
    return;
  }

  await client.from("user_star_words").insert({
    user_id:user_id,
    word:word,
    translation:translation,
    lesson:LESSON
  });

  btn.classList.add("saved");
  btn.innerText="✔";
}

// 📥 تحميل الكلمات (مشترك)
async function load(){

  // 1️⃣ الدرس (مشترك)
  const { data: words } = await client
    .from("headway_nouns")
    .select("*")
    .eq("unit", LESSON);

  // 2️⃣ الكلمات المحفوظة (شخصي)
  const { data: saved } = await client
    .from("user_star_words")
    .select("word")
    .eq("user_id", user_id);

  const savedWords = saved.map(s=>s.word);

  list.innerHTML="";

  words.forEach(w=>{

    let isSaved = savedWords.includes(w.word);

    list.innerHTML+=`
      <div class="card">

        <div>
          <div class="word">${w.word}</div>
          <div class="translation">${w.translation}</div>
        </div>

        <div class="actions">
          <button class="speak" onclick="speak('${w.word}')">🔊</button>

          <button 
            class="star ${isSaved ? "saved" : ""}"
            onclick="saveWord('${w.word}','${w.translation}',this)">
            ${isSaved ? "✔" : "⭐"}
          </button>

        </div>

      </div>
    `;
  });
}

load();

</script>

</body>
</html>
