<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #eee;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.header {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid white;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
  object-fit: cover;
}

.content {
  padding: 70px 20px 20px;
}

h1 {
  margin: 10px 0;
}

.subtitle {
  color: #555;
}

.students {
  color: #0072ff;
  font-weight: bold;
  margin: 15px 0;
  font-size: 18px;
}

.card {
  background: #ddd;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">
    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students" id="students">
      👨‍🎓 أكثر من 120 طالب
    </div>

    <div class="card">
      <span>📺 تحليل فيديو يوتيوب</span>
      <button onclick="goYoutube()">ابدأ</button>
    </div>

    <div class="card">
      <span>📄 تحليل كتاب PDF</span>
      <button onclick="goPDF()">ابدأ</button>
    </div>

    <div class="card">
      <span>🔍 البحث عن كلمة</span>
      <button onclick="goSearch()">ابدأ</button>
    </div>

  </div>
</div>

<script>

// ✅ عداد الطلاب (محفوظ)
let count = localStorage.getItem("studentsCount");

if (!count) {
  count = 120;
}

function updateStudents() {
  count = parseInt(count) + Math.floor(Math.random() * 2); // زيادة بسيطة واقعية
  document.getElementById("students").innerText =
    "👨‍🎓 أكثر من " + count + " طالب";
  localStorage.setItem("studentsCount", count);
}

updateStudents();
setInterval(updateStudents, 8000);


// ✅ التنقل بين الصفحات
function goYoutube() {
  window.location.href = "youtube.html";
}

function goPDF() {
  window.location.href = "pdf.html";
}

function goSearch() {
  window.location.href = "search.html";
}

</script>

</body>
</html>
