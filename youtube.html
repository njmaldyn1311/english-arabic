<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Video Learning</title>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

input {
  padding: 10px;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;
  text-align: center;
}

button {
  background: #22c55e;
  padding: 10px 20px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
}

/* 🎬 الفيديو */
#videoBox {
  position: relative;
}

iframe {
  width: 100%;
  height: 250px;
  border-radius: 15px;
}

/* 🎯 زر CC */
#ccBtn{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,0.6);
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

#ccBtn.active{
  background:#22c55e;
}

/* 🔥 الترجمة */
#subtitleBox{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
}

.subtitle-en{
  font-size:16px;
  font-weight:bold;
  color:white;
}

.subtitle-ar{
  font-size:14px;
  color:#f87171;
}

/* ⭐ تمييز الكلمات */
.highlight{
  color:#38bdf8;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو</h2>

<input type="text" id="url" placeholder="ضع رابط YouTube">
<br>
<button onclick="sendUrl()">تحليل</button>

<div id="videoBox" class="card" style="display:none;">
  <button id="ccBtn" onclick="toggleSubtitle()">CC</button>

  <iframe id="videoFrame"></iframe>

  <div id="subtitleBox">
    <div id="subEn" class="subtitle-en"></div>
    <div id="subAr" class="subtitle-ar"></div>
  </div>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let videoId = "";
let subtitles = [];
let subtitleOn = true;

function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

function showVideo(url) {
  videoId = getVideoId(url);

  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;

  document.getElementById("videoBox").style.display = "block";

  document.getElementById("ccBtn").classList.add("active");

  startSubtitle();
}

/* 🔥 تشغيل الترجمة */
function startSubtitle(){

  setInterval(()=>{

    if(!subtitleOn) return;

    const iframe = document.getElementById("videoFrame");

    iframe.contentWindow.postMessage(
      '{"event":"command","func":"getCurrentTime","args":""}',
      '*'
    );

  },1000);

}

/* استقبال الوقت */
window.addEventListener("message", function(e){

  if(typeof e.data === "string" && e.data.includes("infoDelivery")){
    try{
      const data = JSON.parse(e.data);
      const time = data.info.currentTime;

      if(!time) return;

      updateSubtitle(time);

    }catch{}
  }

});

/* تحديث الترجمة */
function updateSubtitle(time){

  for(let i=0;i<subtitles.length;i++){

    if(time >= subtitles[i].start && time <= subtitles[i].end){

      document.getElementById("subEn").innerHTML = highlightWords(subtitles[i].en);
      document.getElementById("subAr").innerText = subtitles[i].ar;

      break;
    }

  }

}

/* 🎯 تمييز الكلمات */
function highlightWords(text){

  return text.replace(/\\b(\\w+)\\b/g, `<span class="highlight">$1</span>`);

}

/* زر CC */
function toggleSubtitle(){

  subtitleOn = !subtitleOn;

  const btn = document.getElementById("ccBtn");

  if(subtitleOn){
    btn.classList.add("active");
  }else{
    btn.classList.remove("active");
    document.getElementById("subEn").innerText = "";
    document.getElementById("subAr").innerText = "";
  }
}

/* 🚀 إرسال */
async function sendUrl(){

  const url = document.getElementById("url").value;
  if(!url) return alert("اكتب رابط");

  showVideo(url);

  const res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ url })
  });

  const data = await res.json();

  subtitles = [];

  for(let cat in data){

    if(!Array.isArray(data[cat])) continue;

    data[cat].forEach(w=>{

      if(w.time !== undefined){

        subtitles.push({
          start: w.time,
          end: w.time + 3,
          en: w.example || w.en || "",
          ar: w.example_ar || w.ar || ""
        });

      }

    });

  }

}

</script>

</body>
</html>
