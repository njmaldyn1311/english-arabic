<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>AI Video Learning PRO+</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
html { -webkit-text-size-adjust: 100%; }

body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

input {
  padding: 10px 10px;
  width: 80%;
  max-width: 320px;
  border-radius: 12px;
  border: none;
  margin: 10px 0;
  font-size: 16px;
  direction: rtl;
  text-align: right;
}

input::placeholder { text-align: right; }

button {
  background: #22c55e;
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
  font-size: 15px;
}

.card {
  background: #1e293b;
  margin: 10px 0;
  padding: 15px;
  border-radius: 15px;
}

#player { width: 100%; height: 220px; border-radius: 15px; }

.sub-en { color: #38bdf8; font-weight: bold; }
.sub-ar { color: #facc15; font-size: 20px; font-weight: bold; }

.word-box{
  border-bottom:1px solid #334155;
  padding:10px;
  text-align:left;
}

.word-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.en{color:#38bdf8;font-weight:bold;}
.ar{color:#f87171;}

.icon{ cursor:pointer; margin-left:5px; font-size:18px; }

.example{ margin-top:5px; color:#e2e8f0; cursor:pointer; font-size:14px; }
.example-ar{ color:#facc15; font-size:14px; }

.highlight{ color:#22c55e; font-weight:bold; }

#loading {
  display: none;
  margin-top: 10px;
  font-size: 16px;
  color: #facc15;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 0.3; }
  50% { opacity: 1; }
  100% { opacity: 0.3; }
}

@media (max-width: 500px){
  #player{ height:180px; }
  .sub-ar{ font-size:18px; }
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء</h2>

<input id="url" placeholder="ضع رابط YouTube">
<br>
<button onclick="sendUrl()">🔗 تحليل</button>

<p id="loading">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <div id="player"></div>
  <div id="subEn" class="sub-en"></div>
  <div id="subAr" class="sub-ar"></div>
</div>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

/* 🔥 توحيد user_id */
let user_id = localStorage.getItem("user_id");

if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

console.log("USER:", user_id);

/* 🔥 تتبع */
async function track(action){
  await fetch(SUPABASE_URL + "/rest/v1/user_activity", {
    method: "POST",
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      user_id: user_id,
      page: "video_page",
      action: action
    })
  });
}

track("دخول الصفحة");

let player;
let subtitles=[];

function getVideoId(url){
  try{
    if(url.includes("youtu.be")){
      return url.split("/").pop().split("?")[0];
    }
    if(url.includes("youtube.com")){
      const u = new URL(url);
      return u.searchParams.get("v");
    }
    if(url.length===11) return url;
    return null;
  }catch{
    return null;
  }
}

function createPlayer(id){
  if(player) player.destroy();

  player = new YT.Player('player',{
    videoId:id,
    events:{ onReady:syncLoop }
  });
}

function syncLoop(){
  setInterval(()=>{
    if(!player) return;

    let t = player.getCurrentTime();

    let current = subtitles.find(s=>t>=s.time && t<s.time+4);
    if(!current) return;

    document.getElementById("subEn").innerHTML=current.en;
    document.getElementById("subAr").innerText=current.ar;

  },500);
}

function speak(t){
  let u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* ⭐ حفظ */
async function saveWord(el,en,ar){

  await client.from("user_star_words").insert({
    user_id: user_id, // 🔥 تم التعديل
    word: en,
    translation: ar
  });

  track("حفظ كلمة: " + en);

  el.innerText="✅";
}

function goTo(sec){
  if(player) player.seekTo(sec,true);
}

function show(data){
  subtitles=[];
  let html="";

  for(let cat in data){
    if(!Array.isArray(data[cat])) continue;

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      const word=w.en||"";
      const ar=w.ar||"";
      const ex=w.example||"";
      const ex_ar=w.example_ar||"";

      subtitles.push({
        time:w.time||0,
        en:ex,
        ar:ex_ar
      });

      let highlighted = ex.replace(
        new RegExp(word,"gi"),
        `<span class="highlight">${word}</span>`
      );

      html+=`
        <div class="word-box">
          <div class="word-top">
            <div>
              <span class="en">${word}</span>
              <span class="ar">${ar}</span>
            </div>

            <div>
              <span class="icon" onclick="speak('${word}')">🔊</span>
              <span class="icon" onclick="saveWord(this,'${word}','${ar}')">⭐</span>
            </div>
          </div>

          <div class="example" onclick="goTo(${w.time||0})">
            ${highlighted}
          </div>

          <div class="example-ar">${ex_ar}</div>
        </div>
      `;
    });

    html+="</div>";
  }

  document.getElementById("result").innerHTML=html;
}

async function sendUrl(){

  let url=document.getElementById("url").value;
  if(!url) return alert("اكتب رابط");

  track("تحليل فيديو");

  let id = getVideoId(url);
  if(!id){
    alert("❌ رابط غير صحيح");
    return;
  }

  document.getElementById("loading").style.display="block";
  document.getElementById("videoBox").style.display="block";

  createPlayer(id);

  let res=await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  let text=await res.text();
  let data=JSON.parse(text);

  document.getElementById("loading").style.display="none";

  show(data);
}

</script>
<script src="auth.js"></script>
</body>
</html>
