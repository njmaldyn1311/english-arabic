<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

.content {
  padding: 70px 20px 20px;
}

h1 {
  margin: 10px 0;
  color: white;
}

.subtitle {
  color: #cbd5e1;
}

.students {
  color: #22c55e;
  font-weight: bold;
  margin: 10px 0;
}

.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}

button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

.logout {
  background: #ef4444;
  margin-top: 10px;
}

.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
  font-weight: bold;
}

.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  font-size: 20px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
}

/* Alert */
#alertBox{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:999;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students" id="students">
      👨‍🎓 أكثر من 120 طالب
    </div>

    <div class="card"><span>📚 الفصل الذكي</span><button onclick="goClass()">ابدأ</button></div>
    <div class="card"><span>📺 تحليل فيديو</span><button onclick="goYoutube()">ابدأ</button></div>
    <div class="card"><span>📄 تحليل PDF</span><button onclick="goPDF()">ابدأ</button></div>
    <div class="card"><span>🔍 البحث</span><button onclick="goSearch()">ابدأ</button></div>
    <div class="card"><span>📝 اختبار</span><button onclick="goTest()">ابدأ</button></div>
    <div class="card"><span>📊 مراجعة</span><button onclick="goReview()">فتح</button></div>
    <div class="card"><span>👤 حسابي</span><button onclick="goProfile()">فتح</button></div>

    <!-- ✅ الجديد -->
    <div class="card"><span>📘 كتابي</span><button onclick="goBook()">فتح</button></div>
    <div class="card"><span>📊 لوحة التحكم</span><button onclick="goDashboard()">فتح</button></div>
    <div class="card"><span>🚧 ميزة جديدة</span><button onclick="goUpdate1()">قريباً</button></div>
    <div class="card"><span>🔄 تحديثات</span><button onclick="goUpdate2()">عرض</button></div>

    <a id="whatsappLink" target="_blank" class="whatsapp">
      💬 تواصل معي على واتساب
    </a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<a id="whatsappFloat" target="_blank" class="whatsapp-float">💬</a>

<!-- Alert -->
<div id="alertBox">
  <div style="
    background:#111827;
    padding:15px;
    border-radius:15px;
    width:80%;
    max-width:250px;
    color:white;
    text-align:center;
  ">
    <div id="alertText"></div>
    <button onclick="closeAlert()" style="margin-top:10px;padding:8px 15px;border-radius:10px;background:#22c55e;color:white;border:none;">
      حسناً
    </button>
  </div>
</div>

<script>

// تحقق تسجيل الدخول
const userId = localStorage.getItem("user_id");
if(!userId){
  window.location.href = "login.html";
}

// اسم الطالب
let userName = localStorage.getItem("user_name") || "طالب";

// واتساب
let message = `السلام عليكم، أنا ${userName} وأحتاج مساعدة 🙏`;
let encoded = encodeURIComponent(message);
let whatsappURL = `https://wa.me/message/735SJORMFI74H1?text=${encoded}`;
document.getElementById("whatsappLink").href = whatsappURL;
document.getElementById("whatsappFloat").href = whatsappURL;

// عداد الطلاب
let count = localStorage.getItem("studentsCount");
if (!count) count = 120;

function updateStudents() {
  count = parseInt(count) + Math.floor(Math.random() * 2);
  document.getElementById("students").innerText =
    "👨‍🎓 أكثر من " + count + " طالب";
  localStorage.setItem("studentsCount", count);
}

updateStudents();
setInterval(updateStudents, 8000);

// 🔐 تحقق الأدمن
function isAdmin(){
  let phone = localStorage.getItem("user_phone") || "";
  phone = phone.replace(/\D/g,'');
  if(phone.startsWith("0")) phone = phone.substring(1);
  return phone === "544507401";
}

// Alert
function showAlert(msg){
  document.getElementById("alertText").innerText = msg;
  document.getElementById("alertBox").style.display = "flex";
}
function closeAlert(){
  document.getElementById("alertBox").style.display = "none";
}

// التنقل (بدون تغيير)
function goClass(){ window.location.href = "myclass.html"; }
function goYoutube(){ window.location.href = "youtube.html"; }
function goPDF(){ window.location.href = "pdf.html"; }
function goSearch(){ window.location.href = "search.html"; }
function goProfile(){ window.location.href = "student.html"; }
function goTest(){ window.location.href = "test.html"; }
function goReview(){ window.location.href = "review.html"; }

// الجديد
function goBook(){ window.location.href = "headwaybook.html"; }

function goDashboard(){
  if(!isAdmin()){
    showAlert("🚫 هذه الصفحة للمسؤول فقط");
    return;
  }
  window.location.href = "mydashboard.html";
}

function goUpdate1(){
  if(!isAdmin()){
    showAlert("🚧 الصفحة تحت الإنشاء");
    return;
  }
  window.location.href = "update1.html";
}

function goUpdate2(){
  if(!isAdmin()){
    showAlert("🔄 الصفحة تحت التحديث");
    return;
  }
  window.location.href = "update2.html";
}

// خروج
function logout(){
  const studentsCount = localStorage.getItem("studentsCount");
  localStorage.clear();
  localStorage.setItem("studentsCount", studentsCount);
  window.location.href = "login.html";
}

</script>

</body>
</html>
