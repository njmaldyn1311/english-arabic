<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 الأفعال</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user-name{ color:#38bdf8; }

.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 14px;
  border-radius:12px;
  color:#38bdf8;
  cursor:pointer;
}

.container{
  padding:10px;
  max-width:1000px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:22px;
  margin:10px 0 15px;
}

.card{
  display:grid;
  grid-template-columns: 40px 1fr 1fr 1fr 110px 50px;
  align-items:center;
  gap:8px;
  background:#1e293b;
  border-radius:14px;
  padding:10px;
  margin-bottom:8px;
}

.index{ color:#38bdf8; text-align:center; }

.item{
  background:#334155;
  padding:5px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
}

.translation{
  background:#0ea5e9;
  padding:6px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

button{
  border:none;
  border-radius:6px;
  padding:3px 6px;
  cursor:pointer;
  font-size:11px;
}

.speak{ background:#22c55e; color:white; }
.save{ background:#22c55e; color:#000; font-weight:bold; }
.saved{ background:#22c55e; color:white; }

@media (max-width:768px){
  .card{ grid-template-columns: 30px 1fr 1fr; }
}
</style>

</head>
<body>

<div class="header">
  <div class="user-name" id="username">👤</div>
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">

  <div class="title">
    📚 الأفعال (<span id="totalVerbs">0</span>)
  </div>

  <div id="list"></div>

</div>

<script>

// 🔥 Supabase
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* 🔥 user_id موحد */
let user_id=localStorage.getItem("user_id");
if(!user_id){
  user_id="user_"+Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id",user_id);
}

/* 🔥 تتبع */
function track(action){
  fetch(SUPABASE_URL+"/rest/v1/user_activity",{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id:user_id,
      page:"verbs",
      action:action
    })
  });
}

track("دخول صفحة الأفعال");

/* 👤 الاسم */
let name=localStorage.getItem("user")||"طالب";
let parts=name.split(" ");
username.innerText="👤 "+parts[0];

/* 🔊 صوت */
function speak(text){
  let u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* ⭐ حفظ */
async function saveWord(word,translation,btn){

  await client.from("user_star_words").insert({
    user_id:user_id,
    word:word,
    translation:translation
  });

  track("حفظ فعل");

  btn.classList.add("saved");
  btn.innerText="✔";
}

/* تحميل */
async function load(){

  let {data,count}=await client
    .from("headway_verbs")
    .select("*",{count:"exact"});

  totalVerbs.innerText=count||0;

  list.innerHTML="";

  data.forEach((w,i)=>{

    let word=w.base||w.word;
    let translation=w.translation||"";

    list.innerHTML+=`
    <div class="card">

      <div class="index">${i+1}</div>

      <div class="item">
        ${word}
        <button class="speak" onclick="speak('${word}')">🔊</button>
      </div>

      <div class="item">
        ${w.past||'-'}
        <button class="speak" onclick="speak('${w.past}')">🔊</button>
      </div>

      <div class="item">
        ${w.past_participle||'-'}
        <button class="speak" onclick="speak('${w.past_participle}')">🔊</button>
      </div>

      <div class="translation">${translation}</div>

      <button class="save" onclick="saveWord('${word}','${translation}',this)">⭐</button>

    </div>`;
  });
}

function goHome(){
  location.href="index.html";
}

load();

</script>

</body>
</html>
