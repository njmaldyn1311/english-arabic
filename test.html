<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 اختبار ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.card{
  width:100%;
  max-width:420px;
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  text-align:center;
}

.title{font-size:22px;margin-bottom:10px;}

.question{
  font-size:20px;
  margin:15px 0;
}

.speaker{
  font-size:26px;
  cursor:pointer;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  text-align:center;
  margin-top:10px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
}

.option{
  width:100%;
  background:#334155;
  margin:6px 0;
  color:white;
}

.check{background:#22c55e;}

.home{
  background:#6366f1;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:12px 20px;
  border-radius:12px;
  display:none;
}

.success{background:#22c55e;}
.error{background:#ef4444;}

</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="title">🧠 اختبار ذكي</div>

    <button class="home" onclick="goHome()">🏠 الرئيسية</button>

    <div id="question" class="question">...</div>

    <div id="speaker" class="speaker" onclick="play()">🔊</div>

    <div id="answers"></div>

    <input id="input" placeholder="اكتب الإجابة">

    <button class="check" onclick="check()">تحقق</button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user_id = localStorage.getItem("user_id");

let words = [];
let current = 0;
let type = "";
let currentWord = null;

// 🔥 تحميل كلمات الطالب فقط
async function load(){

  let { data } = await client
    .from("user_words")
    .select("*")
    .eq("user_id", user_id);

  words = data || [];

  if(words.length === 0){
    document.getElementById("question").innerText = "⚠️ ما عندك كلمات محفوظة";
    return;
  }

  next();
}

// 🎯 السؤال
function next(){

  if(current >= words.length){
    document.getElementById("question").innerText = "🎉 انتهى الاختبار";
    return;
  }

  currentWord = words[current];

  let en = currentWord.word;
  let ar = currentWord.translation;

  let types = ["mcq","write","listen","reverse"];
  type = types[Math.floor(Math.random()*types.length)];

  document.getElementById("answers").innerHTML = "";
  document.getElementById("input").value = "";

  // اختيار
  if(type === "mcq"){

    hideAll();
    document.getElementById("question").innerText = "ما معنى: " + en;

    let options = [...words].sort(()=>0.5-Math.random()).slice(0,3);
    options.push(currentWord);
    options = options.sort(()=>0.5-Math.random());

    options.forEach(o=>{
      let btn = document.createElement("button");
      btn.className="option";
      btn.innerText = o.translation;

      btn.onclick=()=>{
        checkChoice(btn.innerText, ar);
      };

      document.getElementById("answers").appendChild(btn);
    });
  }

  // كتابة
  if(type === "write"){

    showInput();
    document.getElementById("question").innerText = "اكتب معنى: " + en;
  }

  // استماع
  if(type === "listen"){

    showInput();
    document.getElementById("question").innerText = "🎧 اسمع واكتب المعنى";
    speak(en);
  }

  // 🔥 ترجمة عكسية
  if(type === "reverse"){

    showInput();
    document.getElementById("question").innerText = "اكتب بالإنجليزي: " + ar;
  }
}

function hideAll(){
  document.getElementById("speaker").style.display="none";
  document.getElementById("input").style.display="none";
}

function showInput(){
  document.getElementById("speaker").style.display="block";
  document.getElementById("input").style.display="block";
}

// 🔊 صوت محسّن
function speak(text){
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=0.9;
  speechSynthesis.speak(u);
}

function play(){
  speak(currentWord.word);
}

// اختيار
function checkChoice(selected, correct){
  let ok = selected === correct;
  toast(ok ? "✅ صح" : "❌ " + correct, ok);
  saveResult(ok);
  nextStep();
}

// كتابة
function check(){

  if(type === "mcq") return;

  let val = document.getElementById("input").value.trim();
  let correct = (type === "reverse") ? currentWord.word : currentWord.translation;

  let ok = val.toLowerCase() === correct.toLowerCase();

  toast(ok ? "✅ صح" : "❌ " + correct, ok);
  saveResult(ok);
  nextStep();
}

// 🔥 حفظ المستوى
async function saveResult(ok){

  await client.from("progress").insert([{
    user_id: user_id,
    word: currentWord.word,
    correct: ok
  }]);
}

function nextStep(){
  current++;
  setTimeout(next,800);
}

// toast
function toast(msg, ok){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast " + (ok?"success":"error");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1200);
}

// 🏠 رجوع
function goHome(){
  window.location.href="index.html";
}

load();

</script>

</body>
</html>
