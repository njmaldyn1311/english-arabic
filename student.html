<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل PDF</title><style>
body {
  font-family: "Cairo", sans-serif;
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  padding: 15px;
  box-sizing: border-box;
}

.box {
  background: #fff;
  padding: 20px;
  border-radius: 20px;
  max-width: 420px;
  margin: auto;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h2 {
  margin-bottom: 20px;
}

input[type="file"] {
  width: 100%;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #2a5298;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #1e3c72;
}

#status {
  margin-top: 10px;
  font-size: 14px;
}

.progress {
  height: 6px;
  background: #eee;
  border-radius: 10px;
  margin-top: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #2a5298;
  transition: 0.3s;
}

#result {
  margin-top: 20px;
}

.word {
  padding: 10px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.en { text-align: left; }
.ar { text-align: right; }

/* موبايل */
@media (max-width: 480px) {
  .word {
    flex-direction: column;
    align-items: flex-start;
  }

  .en, .ar {
    width: 100%;
    text-align: right;
  }
}
</style></head><body><div class="container">  <div class="box">
    <h2>📄 تحليل PDF</h2><input type="file" id="file" accept="application/pdf">

<button onclick="upload()">🚀 تحليل</button>

<div class="progress">
  <div id="bar" class="bar"></div>
</div>

<p id="status"></p>

  </div>  <div id="result"></div></div><script>

function setProgress(v){
  document.getElementById("bar").style.width = v + "%";
}

async function upload() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!file) {
    alert("اختر ملف PDF");
    return;
  }

  // تحقق النوع
  if (file.type !== "application/pdf") {
    status.innerText = "❌ فقط PDF مسموح";
    return;
  }

  // حد الحجم 5MB
  const maxSize = 5 * 1024 * 1024;

  if (file.size > maxSize) {
    status.innerHTML = `
      ❌ الملف كبير جدًا<br>
      الحد: 5MB<br>
      حجمك: ${(file.size / 1024 / 1024).toFixed(2)} MB
    `;
    return;
  }

  result.innerHTML = "";
  setProgress(20);

  const formData = new FormData();
  formData.append("file", file);

  try {
    status.innerText = "⏳ جاري التحليل...";
    setProgress(40);

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);

    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
      method: "POST",
      body: formData,
      signal: controller.signal
    });

    clearTimeout(timeout);
    setProgress(70);

    if (!res.ok) throw new Error("Server");

    let data = await res.json();

    if (data.raw) {
      try { data = JSON.parse(data.raw); } catch {}
    }

    status.innerText = "✅ تم التحليل";
    setProgress(100);

    function render(list){
      if (!list) return "";
      return list.map(i => `
        <div class="word">
          <span class="en">${i.word || i.phrase}</span>
          <button onclick="speak('${i.word || i.phrase}')">🔊</button>
          <span class="ar">${i.arabic || ""}</span>
        </div>
      `).join("");
    }

    result.innerHTML = `
      ${data.verbs ? `<div class="box"><h3>📌 الأفعال</h3>${render(data.verbs)}</div>` : ""}
      ${data.nouns ? `<div class="box"><h3>📌 الأسماء</h3>${render(data.nouns)}</div>` : ""}
      ${data.adjectives ? `<div class="box"><h3>📌 الصفات</h3>${render(data.adjectives)}</div>` : ""}
      ${data.idioms ? `<div class="box"><h3>📌 العبارات</h3>${render(data.idioms)}</div>` : ""}
      ${(data.phrasal_verbs || data.phrasalVerbs)
        ? `<div class="box"><h3>📌 الأفعال المركبة</h3>${render(data.phrasal_verbs || data.phrasalVerbs)}</div>`
        : ""
      }
    `;

  } catch (err) {
    console.error(err);

    if (err.name === "AbortError") {
      status.innerText = "⏱️ انتهى الوقت (الملف كبير)";
    } else {
      status.innerText = "❌ فشل الاتصال";
    }

    setProgress(0);
  }
}

function speak(word){
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

</script></body>
</html>
