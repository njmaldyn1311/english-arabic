<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تدريب الأفعال</title>

<style>
body{
  margin:0;
  font-family:"Cairo",sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}

.container{
  margin:20px;
  padding:20px;
  background:#1e293b;
  border-radius:20px;
}

.word{
  font-size:26px;
  margin:10px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#111827;
  padding:12px;
  border-radius:12px;
  margin:8px 0;
}

button{
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

.listen{background:#3b82f6;color:white;}
.record{background:#f59e0b;color:white;}
.next{background:#22c55e;color:white;margin-top:10px;}

.correct{color:#22c55e;}
.wrong{color:#ef4444;}
</style>
</head>

<body>

<h2>🎤 تدريب الأفعال</h2>

<div class="container">

  <!-- base -->
  <div class="row">
    <span id="base">go</span>
    <button class="listen" onclick="speak(base.innerText)">🔊</button>
  </div>

  <!-- past -->
  <div class="row">
    <span id="past">went</span>
    <button class="listen" onclick="speak(past.innerText)">🔊</button>
    <button class="record" onclick="record(past.innerText)">🎤</button>
  </div>

  <!-- pp -->
  <div class="row">
    <span id="pp">gone</span>
    <button class="listen" onclick="speak(pp.innerText)">🔊</button>
  </div>

  <!-- translation -->
  <div class="row">
    <span id="ar">يذهب</span>
  </div>

  <hr>

  <!-- ing training -->
  <div class="row">
    <span id="ing">going</span>
    <button class="listen" onclick="speak(ing.innerText)">🔊</button>
    <button class="record" onclick="record(ing.innerText)">🎤 تدريب ING</button>
  </div>

  <div id="result"></div>

  <button class="next" onclick="next()">➡️ التالي</button>

</div>

<script>

// الأفعال
const verbs = [
  {base:"go",past:"went",pp:"gone",ing:"going",ar:"يذهب"},
  {base:"play",past:"played",pp:"played",ing:"playing",ar:"يلعب"},
  {base:"walk",past:"walked",pp:"walked",ing:"walking",ar:"يمشي"},
  {base:"study",past:"studied",pp:"studied",ing:"studying",ar:"يدرس"},
  {base:"stop",past:"stopped",pp:"stopped",ing:"stopping",ar:"يتوقف"}
];

let index = 0;

function load(){
  const v = verbs[index];
  base.innerText = v.base;
  past.innerText = v.past;
  pp.innerText = v.pp;
  ing.innerText = v.ing;
  ar.innerText = v.ar;
}
load();

// 🔊 صوت
function speak(text){
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  speechSynthesis.speak(msg);
}

// 🎤 تسجيل
function record(correct){

  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";

  recognition.start();

  recognition.onresult = function(e){

    const spoken = e.results[0][0].transcript.toLowerCase();

    if(spoken.includes(correct.toLowerCase())){
      result.innerHTML = `<div class="correct">✅ ممتاز</div>`;
    }else{
      result.innerHTML = `<div class="wrong">❌ قلت: ${spoken}</div>`;
    }

  };
}

// التالي
function next(){
  index = (index + 1) % verbs.length;
  load();
  result.innerHTML="";
}

</script>

</body>
</html>
