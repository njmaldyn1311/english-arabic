<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع PDF</title>

<style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: #1e293b;
  padding: 30px;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

input {
  width: 100%;
  padding: 12px;
  margin: 15px 0;
  border-radius: 10px;
}

button {
  background: #22c55e;
  border: none;
  padding: 12px;
  width: 100%;
  border-radius: 10px;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="card">
  <h2>📄 رفع الكتاب</h2>

  <input type="file" id="file" accept="application/pdf">

  <button onclick="upload()">رفع</button>

  <p id="status"></p>
</div>

<script>
async function upload() {
  const fileInput = document.getElementById("file");
  const status = document.getElementById("status");

  if (!fileInput.files.length) {
    status.innerText = "❌ اختر ملف";
    return;
  }

  const formData = new FormData();

  // 🔥 أهم سطر
  formData.append("file", fileInput.files[0]);

  try {
    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
      method: "POST",
      body: formData
    });

    status.innerText = "✅ تم الإرسال";
  } catch (err) {
    status.innerText = "❌ فشل الإرسال";
    console.error(err);
  }
}
</script>

</body>
</html>
