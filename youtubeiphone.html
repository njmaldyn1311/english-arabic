<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live AI Classroom</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{max-width:900px;margin:auto;padding:20px;}

input,button{
  padding:10px;
  border-radius:10px;
  border:none;
  margin:5px;
}

button{background:#22c55e;color:white;cursor:pointer;}

.card{
  background:#1e293b;
  padding:15px;
  margin-top:15px;
  border-radius:15px;
}

#player{width:100%;height:350px;border-radius:15px;}

.word{padding:10px;border-bottom:1px solid #334155;}
.highlight{color:#22c55e;font-weight:bold;}
</style>
</head>

<body>

<div class="container">

<h2>🎥 Live Classroom</h2>

<input id="email" placeholder="Email">
<input id="password" placeholder="Password">
<br>
<button onclick="signup()">إنشاء حساب</button>
<button onclick="login()">دخول</button>

<hr>

<input id="room" placeholder="Room ID">
<input id="url" placeholder="YouTube URL">

<br>
<button onclick="createRoom()">إنشاء غرفة (معلم)</button>
<button onclick="joinRoom()">دخول غرفة (طالب)</button>

<div id="videoBox" class="card" style="display:none;">
  <div id="player"></div>
</div>

<div id="words"></div>

</div>

<script>

const SUPABASE_URL="YOUR_URL";
const SUPABASE_KEY="YOUR_KEY";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let player;
let roomId;
let isTeacher=false;
let channel;

/* Auth */

async function signup(){
  await supa.auth.signUp({
    email:email.value,
    password:password.value
  });
  alert("تم إنشاء الحساب");
}

async function login(){
  await supa.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  alert("تم الدخول");
}

/* YouTube */

function getVideoId(url){
  try{
    return new URL(url).searchParams.get("v");
  }catch{return null;}
}

function createPlayer(id){

  if(player) player.destroy();

  player=new YT.Player('player',{
    videoId:id,
    events:{
      onReady:()=>{
        if(isTeacher){
          setInterval(syncSend,1500);
        }
      }
    }
  });

}

/* إنشاء غرفة */

async function createRoom(){

  let id=getVideoId(url.value);
  if(!id) return alert("رابط خطأ");

  roomId=room.value;
  isTeacher=true;

  let user=(await supa.auth.getUser()).data.user;

  await supa.from("rooms").insert({
    id:roomId,
    video_id:id,
    teacher_id:user.id
  });

  startRoom(id);
}

/* دخول غرفة */

async function joinRoom(){

  roomId=room.value;
  isTeacher=false;

  let {data}=await supa.from("rooms")
    .select("*")
    .eq("id",roomId)
    .single();

  if(!data) return alert("الغرفة غير موجودة");

  startRoom(data.video_id);
}

/* تشغيل */

function startRoom(videoId){

  videoBox.style.display="block";

  createPlayer(videoId);

  channel=supa.channel(roomId);

  channel.on('broadcast',{event:'sync'},(msg)=>{

    if(isTeacher) return;

    let {time,state}=msg.payload;

    if(Math.abs(player.getCurrentTime()-time)>1){
      player.seekTo(time,true);
    }

    if(state==="play") player.playVideo();
    else player.pauseVideo();

  }).subscribe();

}

/* إرسال */

function syncSend(){

  if(!player) return;

  channel.send({
    type:'broadcast',
    event:'sync',
    payload:{
      time:player.getCurrentTime(),
      state:player.getPlayerState()==1?"play":"pause"
    }
  });

}

/* كلمات */

async function saveWord(word,ar){

  let user=(await supa.auth.getUser()).data.user;

  await supa.from("words").insert({
    user_id:user.id,
    word,
    translation:ar
  });

  alert("تم الحفظ");
}

</script>

</body>
</html>
