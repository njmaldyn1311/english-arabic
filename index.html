<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
}

.header { height: 140px; position: relative; }
.profile-img {
  width:110px;height:110px;border-radius:50%;
  position:absolute;bottom:-55px;left:50%;
  transform:translateX(-50%);
}

.content { padding:70px 20px; }
h1 { color:white }
.subtitle { color:#cbd5e1 }

.card {
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:20px;
  display:flex;
  justify-content:space-between;
  color:white;
}

button {
  background:#22c55e;
  border:none;
  color:white;
  padding:10px;
  border-radius:15px;
}

.notification {
  position:fixed;
  top:20px;
  right:50%;
  transform:translateX(50%);
  background:#1e293b;
  color:white;
  padding:15px;
  border-radius:15px;
  display:none;
  z-index:999;
}

.block {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#0f172a;
  display:none;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:9999;
}
</style>
</head>

<body>

<div id="notification" class="notification"></div>

<div id="blocked" class="block">
  <div>
    <h2>🚫 تم حظر حسابك</h2>
    <p>تم إيقاف الوصول</p>
  </div>
</div>

<div class="container" id="app">
  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">
    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم بطريقة ذكية 🚀</div>

    <div class="card">
      <span>📚 الفصل</span>
      <button>ابدأ</button>
    </div>
  </div>
</div>

<script>

// 🔥 بيانات Supabase
const supabase = window.supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// 🔔 إشعار
function notify(text){
  const n = document.getElementById("notification");
  n.innerText = text;
  n.style.display = "block";
  setTimeout(()=> n.style.display="none",4000);
}

// 🚫 قفل الحساب
function blockUser(){
  document.getElementById("app").style.display="none";
  document.getElementById("blocked").style.display="flex";
  notify("🚫 تم حظر حسابك");
}

// 👤 جلب المستخدم
async function init(){

  const { data: { user } } = await supabase.auth.getUser();

  if(!user){
    location.href="login.html";
    return;
  }

  const userId = user.id;

  // 🔍 فحص الحظر
  const { data } = await supabase
    .from("students")
    .select("is_blocked")
    .eq("id", userId)
    .single();

  if(data?.is_blocked){
    blockUser();
  }

  // ⚡ استماع فوري للحظر
  supabase
    .channel('realtime-users')
    .on(
      'postgres_changes',
      {
        event: 'UPDATE',
        schema: 'public',
        table: 'students',
        filter: `id=eq.${userId}`
      },
      (payload) => {
        if(payload.new.is_blocked){
          blockUser();
        }
      }
    )
    .subscribe();

  // 🔔 إشعارات عامة
  supabase
    .channel('notifications')
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'notifications'
      },
      (payload) => {
        notify(payload.new.message);
      }
    )
    .subscribe();

}

init();

</script>

</body>
</html>
