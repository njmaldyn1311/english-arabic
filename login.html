<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الطالب</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background: linear-gradient(135deg,#0f172a,#1e3a8a);
}

/* خلفية خفيفة */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.1;
}

/* الكرت */
.box {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
  text-align:center;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h2 {
  margin-bottom:20px;
}

/* صورة */
.logo{
  width:80px;
  margin-bottom:10px;
}

input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin:10px 0;
  text-align:center;
  font-size:16px;
  outline:none;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#16a34a;
}

.link {
  margin-top:15px;
  display:block;
  color:#38bdf8;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<img class="logo" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h2>🔐 دخول الطالب</h2>

<input id="phone" placeholder="📱 رقم الجوال">

<button onclick="login()">دخول</button>

<span class="link" onclick="goSignup()">ليس لديك حساب؟ سجل الآن</span>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/login";

async function login(){

  const phone = document.getElementById("phone").value;

  if(!phone) return alert("اكتب رقم الجوال");

  const res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ phone })
  });

  const data = await res.json();

  if(data.status === "ok"){

    localStorage.setItem("user", data.user.name);
    localStorage.setItem("user_id", data.user.id);
    localStorage.setItem("phone", data.user.phone);

    alert("تم تسجيل الدخول ✅");
    window.location.href = "index.html";

  } else {
    alert("❌ الرقم غير مسجل");
  }
}

function goSignup(){
  window.location.href = "signup.html";
}

</script>

</body>
</html>
