<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>تسجيل طالب</title>

<style>
*{ box-sizing:border-box; }

body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e3a8a);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px;
}

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.08;
  z-index:-1;
}

.box {
  width:100%;
  max-width:420px;
  padding:25px;
  border-radius:20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
  text-align:center;
  color:white;
}

.stats{
  background: rgba(34,197,94,0.15);
  border:1px solid rgba(34,197,94,0.3);
  padding:10px;
  border-radius:12px;
  margin-bottom:15px;
  font-size:14px;
}

h2 { margin-bottom:15px; }

input {
  width:100%;
  height:50px;
  padding:0 14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  text-align:center;
  font-size:16px;
}

input::placeholder { color:#9ca3af; }

input:focus {
  outline:none;
  box-shadow:0 0 0 2px #38bdf8;
}

/* 🔥 إصلاح الدروب داون */
.custom-select {
  position: relative;
  background: white;
  color: black;
  height: 50px;
  border-radius: 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 15px;
  cursor:pointer;
  margin:8px 0;
  z-index:1;
}

.options {
  position:absolute;
  top:100%;
  right:0;
  left:0;
  background:white;
  border-radius:12px;
  display:none;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  z-index:999;
}

.options div {
  padding:12px;
  cursor:pointer;
}

.options div:hover {
  background:#f1f5f9;
}

.label {
  margin-top:15px;
  margin-bottom:5px;
  font-size:14px;
  color:#cbd5f5;
}

.skills {
  background:white;
  border-radius:12px;
  padding:12px;
  color:black;
  text-align:right;
}

.check {
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
  cursor:pointer;
}

.check input { display:none; }

.check span {
  width:20px;
  height:20px;
  border:2px solid #3b82f6;
  border-radius:6px;
  position:relative;
}

.check input:checked + span {
  background:#3b82f6;
}

.check input:checked + span::after {
  content:"✓";
  color:white;
  position:absolute;
  top:-2px;
  right:3px;
}

button {
  width:100%;
  height:50px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

</style>
</head>

<body>

<div class="box">

<div class="stats">🔥 أكثر من 1200 طالب بدأوا التعلم معنا</div>

<h2>🚀 تسجيل طالب جديد</h2>

<input id="name" placeholder="اسم الطالب">
<input id="phone" placeholder="رقم الجوال">
<input id="city" placeholder="المدينة">
<input id="district" placeholder="الحي">

<!-- الجنس -->
<div class="custom-select" onclick="toggleDropdown()">
  <span id="selectedGenderText">اختر الجنس ▼</span>
</div>
<div class="options" id="dropdown">
  <div onclick="selectOption(event,'ذكر')">ذكر</div>
  <div onclick="selectOption(event,'أنثى')">أنثى</div>
</div>

<!-- المستوى -->
<div class="custom-select" onclick="toggleLevelDropdown()">
  <span id="selectedLevelText">المستوى ▼</span>
</div>
<div class="options" id="levelDropdown">
  <div onclick="selectLevel(event,'مبتدئ')">مبتدئ</div>
  <div onclick="selectLevel(event,'متوسط')">متوسط</div>
  <div onclick="selectLevel(event,'متقدم')">متقدم</div>
</div>

<div class="label">❗ لا أستطيع</div>

<div class="skills">
  <label class="check"><input type="checkbox" value="القراءة"><span></span> القراءة</label>
  <label class="check"><input type="checkbox" value="الكتابة"><span></span> الكتابة</label>
  <label class="check"><input type="checkbox" value="التحدث"><span></span> التحدث</label>
  <label class="check"><input type="checkbox" value="كل ما ذكر صحيح"><span></span> كل ما ذكر صحيح</label>
</div>

<div class="label">🎯 اهتماماتك المهنية</div>

<input id="job1" placeholder="مثال: طبيب - مهندس">
<input id="job2" placeholder="مثال: برمجة - تجارة">
<input id="job3" placeholder="مثال: سفر - مقابلات">

<button id="signupBtn" onclick="signup()">تسجيل</button>

</div>

<script>

const dropdown = document.getElementById("dropdown");
const levelDropdown = document.getElementById("levelDropdown");

let selectedGender = "";
let selectedLevelValue = "";

/* 🔽 الجنس */
function toggleDropdown(){
  levelDropdown.style.display="none";
  dropdown.style.display = dropdown.style.display==="block"?"none":"block";
}

function selectOption(e,value){
  e.stopPropagation();
  selectedGender=value;
  document.getElementById("selectedGenderText").innerText=value+" ▼";
  dropdown.style.display="none";
}

/* 🔽 المستوى */
function toggleLevelDropdown(){
  dropdown.style.display="none";
  levelDropdown.style.display = levelDropdown.style.display==="block"?"none":"block";
}

function selectLevel(e,value){
  e.stopPropagation();
  selectedLevelValue=value;
  document.getElementById("selectedLevelText").innerText=value+" ▼";
  levelDropdown.style.display="none";
}

/* إغلاق */
document.addEventListener("click",()=>{
  dropdown.style.display="none";
  levelDropdown.style.display="none";
});

/* 🔄 لودينج */
function setLoading(state){
  let btn=document.getElementById("signupBtn");
  btn.disabled=state;
  btn.innerText=state ? "⏳ جاري التسجيل..." : "تسجيل";
}

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/signup";

/* 🚀 تسجيل */
async function signup(){

  const skills=[...document.querySelectorAll(".skills input:checked")].map(el=>el.value);

  const data={
    name:document.getElementById("name").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    city:document.getElementById("city").value.trim(),
    district:document.getElementById("district").value.trim(),
    gender:selectedGender,
    level:selectedLevelValue,
    skills:skills,
    job1:document.getElementById("job1").value.trim(),
    job2:document.getElementById("job2").value.trim(),
    job3:document.getElementById("job3").value.trim()
  };

  if(!data.name||!data.phone){
    alert("يرجى إدخال الاسم ورقم الجوال ⚠️");
    return;
  }

  if(!selectedGender||!selectedLevelValue){
    alert("اختر الجنس والمستوى ⚠️");
    return;
  }

  setLoading(true);

  try{
    await fetch(WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(data)
    });

    setTimeout(()=>{
      alert("✅ تم التسجيل");
      setLoading(false);
    },500);

  }catch{
    alert("❌ خطأ");
    setLoading(false);
  }
}

</script>

</body>
</html>
