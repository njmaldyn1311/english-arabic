<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل طالب</title>

<style>

/* 🌍 إعداد عام */
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding: 15px;
}

/* 📦 الصندوق */
.box {
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  width:100%;
  max-width:420px;
  text-align:center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

/* 🧠 العنوان */
h2 {
  margin-bottom:15px;
}

/* 📝 الحقول */
input, select {
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  text-align:center;
  font-size:15px;
}

/* ✨ تحسين الشكل */
input:focus, select:focus {
  outline: none;
  box-shadow: 0 0 0 2px #38bdf8;
}

/* 🎯 زر */
button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  background:#16a34a;
}

/* 🏷️ النصوص */
label {
  display:block;
  margin-top:10px;
  font-size:14px;
  color:#cbd5f5;
}

/* 📱 موبايل */
@media (max-width: 480px) {
  .box {
    padding:20px;
  }

  input, select {
    padding:12px;
    font-size:14px;
  }

  button {
    font-size:14px;
  }
}

/* 💻 شاشات كبيرة */
@media (min-width: 768px) {
  .box {
    max-width:450px;
  }
}

</style>
</head>

<body>

<div class="box">

<h2>🚀 تسجيل طالب جديد</h2>

<input id="name" placeholder="اسم الطالب">
<input id="phone" placeholder="رقم الجوال">
<input id="city" placeholder="المدينة">
<input id="district" placeholder="الحي">

<select id="gender">
  <option value="">اختر الجنس</option>
  <option value="ذكر">ذكر</option>
  <option value="أنثى">أنثى</option>
</select>

<select id="level">
  <option value="">المستوى</option>
  <option value="مبتدئ">مبتدئ</option>
  <option value="متوسط">متوسط</option>
  <option value="متقدم">متقدم</option>
</select>

<label>ما الذي تريد تحسينه؟</label>

<select id="skills" multiple>
  <option value="القراءة">القراءة</option>
  <option value="الكتابة">الكتابة</option>
  <option value="التحدث">التحدث</option>
  <option value="كل ما ذكر صحيح">كل ما ذكر صحيح</option>
</select>

<h4>🎯 اهتماماتك المهنية</h4>

<input id="job1" placeholder="مثال: طبيب - مهندس">
<input id="job2" placeholder="مثال: برمجة - تجارة">
<input id="job3" placeholder="مثال: سفر - مقابلات">

<button onclick="signup()">تسجيل</button>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/signup";

async function signup(){

  const skillsSelect = document.getElementById("skills");
  const skills = [...skillsSelect.selectedOptions].map(o => o.value);

  const data = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    city: document.getElementById("city").value.trim(),
    district: document.getElementById("district").value.trim(),
    gender: document.getElementById("gender").value,
    level: document.getElementById("level").value,
    skills: skills,
    job1: document.getElementById("job1").value.trim(),
    job2: document.getElementById("job2").value.trim(),
    job3: document.getElementById("job3").value.trim()
  };

  if(!data.name || !data.phone){
    alert("يرجى إدخال الاسم ورقم الجوال ⚠️");
    return;
  }

  console.log("📤 البيانات:", data);

  try {

    const res = await fetch(WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(data)
    });

    const result = await res.json();

    localStorage.setItem("user", data.name);
    localStorage.setItem("phone", data.phone);

    alert(result.message || "تم التسجيل بنجاح ✅");

    window.location.href = "index.html";

  } catch (error) {
    console.error(error);
    alert("خطأ في الاتصال ❌");
  }
}

</script>

</body>
</html>
