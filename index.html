<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 400px;
  background: #f3f3f3;
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.header {
  height: 150px;
  background: linear-gradient(135deg, #0072ff, #00c6ff);
}

.profile {
  text-align: center;
  margin-top: -60px;
}

.profile img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 5px solid #f3f3f3;
  object-fit: cover;
}

h1 {
  margin: 10px 0 5px;
}

.subtitle {
  color: #00aaff;
  font-size: 14px;
}

.students {
  margin: 10px 0;
  font-weight: bold;
  color: #00aaff;
}

.card {
  background: #eaeaea;
  margin: 15px;
  padding: 15px;
  border-radius: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: #00aaff;
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 20px;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<div class="container">

  <div class="header"></div>

  <div class="profile">
    <!-- غير الصورة هنا -->
    <img src="me.jpeg">

    <h1>إنجلش بالعربي</h1>
    <p class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</p>

    <p class="students" id="students">👨‍🎓 أكثر من 129 طالب</p>
  </div>

  <div class="card">
    <span>📺 تحليل فيديو يوتيوب</span>
    <button onclick="location.href='youtube.html'">ابدأ</button>
  </div>

  <div class="card">
    <span>📄 تحليل كتاب PDF</span>
    <button onclick="location.href='pdf.html'">ابدأ</button>
  </div>

  <div class="card">
    <span>🔍 البحث عن كلمة</span>
    <button onclick="location.href='search.html'">ابدأ</button>
  </div>

</div>

<script>
// جلب العدد أو بدء من 129
let count = localStorage.getItem("studentsCount");

if (!count) {
  count = 129;
} else {
  count = parseInt(count);
}

// عرض
document.getElementById("students").innerText = "👨‍🎓 أكثر من " + count + " طالب";

// زيادة واقعية
setInterval(() => {
  const increase = Math.random() > 0.8 ? 1 : 0;
  count += increase;

  document.getElementById("students").innerText = "👨‍🎓 أكثر من " + count + " طالب";

  localStorage.setItem("studentsCount", count);

}, 5000);
</script>

</body>
</html>
