<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<!-- 🔥 منع الزوم -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>دخول الطالب</title>

<style>
*{box-sizing:border-box}

body {
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background: linear-gradient(135deg,#0f172a,#1e3a8a);
  padding:15px;
}

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.1;
  z-index:-1;
}

.box {
  width:100%;
  max-width:400px;
  padding:25px;
  border-radius:20px;
  text-align:center;
  color:white;
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
}

.logo{
  width:70px;
  margin-bottom:10px;
}

h2 { margin-bottom:15px; }

.stats{
  margin-bottom:15px;
  font-size:14px;
  color:#d1d5db;
}

.stats strong{
  color:#22c55e;
}

input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin:10px 0;
  text-align:center;
  font-size:16px;
  -webkit-appearance:none;
}

input, textarea, select {
  font-size:16px !important;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.link {
  margin-top:15px;
  display:block;
  color:#38bdf8;
  cursor:pointer;
}

/* 🔔 Toast */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-size:14px;
  z-index:9999;
  display:none;
  max-width:90%;
  text-align:center;
}

.toast.error{background:#ef4444;}

</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="box">

<img class="logo" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h2>🔐 دخول الطالب</h2>

<div class="stats">
  أكثر من <strong>+1,200 طالب</strong> يتعلم معنا 🚀
</div>

<input id="phone" placeholder="📱 رقم الجوال">

<button id="loginBtn" onclick="login()">دخول</button>

<span class="link" onclick="goSignup()">ليس لديك حساب؟ سجل الآن</span>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/login";

/* 🔔 Toast */
function showToast(msg,type="success",withBtn=false){
  let t=document.getElementById("toast");

  let button = "";

  if(withBtn){
    button = `
      <div style="margin-top:10px;">
        <button onclick="goWhatsApp()" style="
          background:#25D366;
          border:none;
          padding:8px 12px;
          border-radius:8px;
          color:white;
          font-size:13px;
          cursor:pointer;
        ">
          اشترك الآن
        </button>
      </div>
    `;
  }

  t.innerHTML = msg.replace(/\n/g,"<br>") + button;
  t.className="toast "+(type==="error"?"error":"");
  t.style.display="block";

  setTimeout(()=>t.style.display="none",4000);
}

/* واتساب */
function goWhatsApp(){
  let phone = localStorage.getItem("phone") || "";
  let msg = `السلام عليكم، أريد الاشتراك 🙏\nرقمي: ${phone}`;
  let url = "https://wa.me/message/735SJORMFI74H1?text=" + encodeURIComponent(msg);
  window.open(url,"_blank");
}

/* ⏳ Loading */
function setLoading(state){
  let btn=document.getElementById("loginBtn");
  if(state){
    btn.disabled=true;
    btn.innerText="⏳ جاري تسجيل الدخول...";
    btn.style.opacity="0.7";
  }else{
    btn.disabled=false;
    btn.innerText="دخول";
    btn.style.opacity="1";
  }
}

/* 🔐 login */
async function login(){

  let phone=document.getElementById("phone").value.trim();

  if(!phone){
    showToast("اكتب رقم الجوال","error");
    return;
  }

  setLoading(true);
  showToast("🔄 جاري تسجيل الدخول...");

  try{

    let res=await fetch(WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ phone })
    });

    let data=await res.json();

    if(!data || !data.user_id){
      showToast("🚫 حسابك غير مشترك\n📱 تواصل معنا للاشتراك","error",true);
      setLoading(false);
      return;
    }

    if(data.blocked===true){
      showToast("🚫 حسابك محظور","error");
      setLoading(false);
      return;
    }

    localStorage.setItem("user_id",data.user_id);
    localStorage.setItem("user",data.name);
    localStorage.setItem("phone",data.phone);

    // ✅ إنشاء session (تم نقلها هنا)
    const sessionId = Date.now() + "_" + Math.random();
    localStorage.setItem("session_id", sessionId);

    showToast("✅ تم تسجيل الدخول");

    setTimeout(()=>{
      location.href="index.html";
    },800);

  }catch(e){
    showToast("❌ خطأ في الاتصال","error");
    setLoading(false);
  }
}

function goSignup(){
  location.href="signup.html";
}

</script>

</body>
</html>
