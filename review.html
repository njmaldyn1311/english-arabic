<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض الدرس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  margin:0;
  text-align:center;
}

.container{
  max-width:750px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:18px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

/* العنوان */
.title{
  font-size:24px;
  font-weight:bold;
}

/* القاعدة */
.grammar{
  text-align:right;
  line-height:1.9;
}

/* الكلمات */
.word{
  border-bottom:1px solid #334155;
  padding:12px;
  text-align:left;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.en{
  color:#38bdf8;
  font-weight:bold;
  font-size:18px;
}

.ar{
  color:#f87171;
  margin-left:10px;
}

/* المثال */
.example{
  margin-top:8px;
  color:#e2e8f0;
  cursor:pointer;
}

.example-ar{
  color:#facc15;
  font-size:18px;
  font-weight:bold;
}

/* أيقونات */
.icon{
  cursor:pointer;
  margin-left:10px;
  font-size:18px;
}

.icon:hover{
  transform:scale(1.2);
}
</style>

</head>

<body>

<div class="container">

<div id="lesson"></div>
<div id="grammar"></div>
<div id="words"></div>

</div>

<script>

// 🔥 بياناتك
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "YOUR_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ ناخذ lesson_id من الرابط
const params = new URLSearchParams(window.location.search);
const LESSON_ID = params.get("lesson");

if(!LESSON_ID){
  alert("❌ لازم تضيف ?lesson=ID في الرابط");
}

// 🔊 صوت
function speak(text){
  if(!text) return;
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ⭐ حفظ
async function saveWord(el, word, translation){
  await client.from("book_user_words").insert({
    word,
    translation
  });

  el.innerText="✅";
}

// 🚀 تحميل البيانات
async function loadLesson(){

  // 1️⃣ الدرس + الوحدة
  const { data: lesson } = await client
    .from("book_lessons")
    .select(`
      id,
      title,
      lesson_number,
      book_units (
        unit_number,
        title
      )
    `)
    .eq("id", LESSON_ID)
    .single();

  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <div class="title">
        Unit ${lesson.book_units?.unit_number || ""}
        - Lesson ${lesson.lesson_number || ""}
        <br>
        📘 ${lesson.title}
      </div>
    </div>
  `;

  // 2️⃣ القاعدة
  const { data: grammar } = await client
    .from("book_grammar")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let gHTML = "";

  if(grammar && grammar.length){
    grammar.forEach(g => {
      gHTML += `
        <div class="card grammar">
          <h3>📖 ${g.title || ""}</h3>
          <p>${g.explanation || ""}</p>
          <pre>${g.examples || ""}</pre>
        </div>
      `;
    });
  }

  document.getElementById("grammar").innerHTML = gHTML;

  // 3️⃣ الكلمات
  const { data: words } = await client
    .from("book_words")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let wHTML = "";

  words.forEach(w => {

    wHTML += `
      <div class="card word">

        <div class="top">
          <div>
            <span class="en">${w.word || ""}</span>
            <span class="ar">${w.translation || ""}</span>
          </div>

          <div>
            <span class="icon" onclick="speak('${w.word}')">🔊</span>
            <span class="icon" onclick="saveWord(this,'${w.word}','${w.translation}')">⭐</span>
          </div>
        </div>

        <div class="example" onclick="speak('${w.example || ""}')">
          ${w.example || ""}
        </div>

        <div class="example-ar">
          ${w.example_ar || ""}
        </div>

      </div>
    `;
  });

  document.getElementById("words").innerHTML = wHTML;

}

loadLesson();

</script>

</body>
</html>
