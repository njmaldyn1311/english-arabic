<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل طالب</title>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color: white;
  font-family: Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box {
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  width:95%;
  max-width:450px;
  text-align:center;
}

input, select {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  text-align:center;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

label {
  display:block;
  margin-top:10px;
  font-size:14px;
  color:#cbd5f5;
}
</style>
</head>

<body>

<div class="box">

<h2>🚀 تسجيل طالب جديد</h2>

<input id="name" placeholder="اسم الطالب">
<input id="phone" placeholder="رقم الجوال">
<input id="city" placeholder="المدينة">
<input id="district" placeholder="الحي">

<select id="gender">
  <option value="">اختر الجنس</option>
  <option value="ذكر">ذكر</option>
  <option value="أنثى">أنثى</option>
</select>

<select id="level">
  <option value="">المستوى</option>
  <option value="مبتدئ">مبتدئ</option>
  <option value="متوسط">متوسط</option>
  <option value="متقدم">متقدم</option>
</select>

<label>لا أستطيع</label>

<select id="skills" multiple>
  <option value="القراءة">القراءة</option>
  <option value="الكتابة">الكتابة</option>
  <option value="التحدث">التحدث</option>
  <option value="كل ما ذكر صحيح">كل ما ذكر صحيح</option>
</select>

<h4>🎯 اكتب أسماء الوظائف المهتم بها</h4>

<input id="job1" placeholder="مثال: طبيب - مهندس - مدرس">
<input id="job2" placeholder="مثال: برمجة - تجارة - تسويق">
<input id="job3" placeholder="مثال: سفر - مقابلات - أعمال">

<button onclick="signup()">تسجيل</button>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/signup";

async function signup(){

  // 🟢 skills (array)
  const skillsSelect = document.getElementById("skills");
  const skills = [...skillsSelect.selectedOptions].map(o => o.value);

  // 🟢 البيانات
  const data = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    city: document.getElementById("city").value.trim(),
    district: document.getElementById("district").value.trim(),
    gender: document.getElementById("gender").value,
    level: document.getElementById("level").value,
    skills: skills,
    job1: document.getElementById("job1").value.trim(),
    job2: document.getElementById("job2").value.trim(),
    job3: document.getElementById("job3").value.trim()
  };

  // 🛑 تحقق بسيط
  if(!data.name || !data.phone){
    alert("يرجى إدخال الاسم ورقم الجوال ⚠️");
    return;
  }

  console.log("📤 البيانات:", data);

  try {

    const res = await fetch(WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(data)
    });

    const result = await res.json();

    // ✅ تخزين المستخدم
    localStorage.setItem("user", data.name);
    localStorage.setItem("phone", data.phone);

    alert(result.message || "تم التسجيل بنجاح ✅");

    window.location.href = "index.html";

  } catch (error) {
    console.error(error);
    alert("خطأ في الاتصال ❌");
  }
}

</script>

</body>
</html>
