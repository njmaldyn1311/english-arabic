<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبار</title>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔝 */
.top{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.title{
  text-align:center;
  margin-top:10px;
}

/* 📦 */
.card{
  background:#1e293b;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

/* ❓ السؤال */
.question{
  font-size:20px;
  margin-bottom:15px;
}

/* 🔘 الخيارات */
.option{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#475569;
}

/* ✅ */
.correct{ background:#22c55e !important; }

/* ❌ */
.wrong{ background:#ef4444 !important; }

/* 🎯 النتيجة */
.result{
  text-align:center;
  font-size:20px;
  margin-top:15px;
}

/* 🔁 زر */
.btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="top">
  <div>🧠 اختبار</div>
  <div onclick="goHome()" style="cursor:pointer;">🏠 الرئيسية</div>
</div>

<h2 class="title">🎯 اختبر نفسك</h2>

<div class="card">

  <div id="quizBox"></div>

  <div class="result" id="result"></div>

  <button class="btn" onclick="startQuiz()">🔁 إعادة الاختبار</button>

</div>

<script>

let words = JSON.parse(localStorage.getItem("words") || "[]");

let questions = [];
let current = 0;
let score = 0;

/* 🚀 بدء */
function startQuiz(){

  if(words.length < 4){
    document.getElementById("quizBox").innerHTML =
      "❌ تحتاج على الأقل 4 كلمات";
    return;
  }

  current = 0;
  score = 0;

  // خذ 5 أسئلة
  questions = words.sort(()=>0.5-Math.random()).slice(0,5);

  showQuestion();
}

/* عرض السؤال */
function showQuestion(){

  if(current >= questions.length){
    showResult();
    return;
  }

  let q = questions[current];

  let options = words.sort(()=>0.5-Math.random()).slice(0,3);
  options.push(q);
  options = options.sort(()=>0.5-Math.random());

  let html = `
    <div class="question">ما معنى: <strong>${q.en}</strong> ؟</div>
  `;

  options.forEach(opt=>{
    html += `
      <button class="option"
        onclick="checkAnswer(this,'${q.ar}','${opt.ar}')">
        ${opt.ar}
      </button>
    `;
  });

  document.getElementById("quizBox").innerHTML = html;
}

/* تحقق */
function checkAnswer(btn, correct, answer){

  let buttons = document.querySelectorAll(".option");

  buttons.forEach(b=>b.disabled=true);

  if(correct === answer){
    btn.classList.add("correct");
    score++;
  }else{
    btn.classList.add("wrong");

    buttons.forEach(b=>{
      if(b.innerText === correct){
        b.classList.add("correct");
      }
    });
  }

  setTimeout(()=>{
    current++;
    showQuestion();
  },1000);
}

/* 🎯 النتيجة */
function showResult(){
  document.getElementById("quizBox").innerHTML = "";
  document.getElementById("result").innerHTML =
    `🎉 نتيجتك: ${score} / ${questions.length}`;
}

/* 🔙 */
function goHome(){
  window.location.href="index.html";
}

startQuiz();

</script>

</body>
</html>
