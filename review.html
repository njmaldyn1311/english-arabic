<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فهرس الكتاب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.title{
  text-align:center;
  font-size:28px;
  margin-bottom:20px;
}

.unit{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.unit-title{
  font-size:20px;
  margin-bottom:10px;
  color:#38bdf8;
}

.lesson{
  background:#334155;
  padding:10px;
  border-radius:10px;
  margin:5px 0;
  cursor:pointer;
  transition:0.3s;
}

.lesson:hover{
  background:#475569;
}
</style>

</head>

<body>

<div class="container">

<div class="title">📚 فهرس الكتاب</div>

<div id="units"></div>

</div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔁 فتح درس
function openLesson(num){
  window.location.href = `review.html?lesson=${num}`;
}

// 🚀 تحميل الفهرس
async function loadIndex(){

  // 📦 نجيب الوحدات مع الدروس
  const { data: units } = await client
    .from("book_units")
    .select(`
      id,
      unit_number,
      book_lessons (
        id,
        title,
        lesson_number
      )
    `)
    .order("unit_number");

  let html = "";

  units.forEach(u => {

    html += `
      <div class="unit">

        <div class="unit-title">
          📘 Unit ${u.unit_number}
        </div>
    `;

    // 📚 الدروس داخل الوحدة
    u.book_lessons
      .sort((a,b)=>a.lesson_number - b.lesson_number)
      .forEach(l => {

        html += `
          <div class="lesson" onclick="openLesson(${l.lesson_number})">
            Lesson ${l.lesson_number} - ${l.title}
          </div>
        `;

      });

    html += `</div>`;
  });

  document.getElementById("units").innerHTML = html;

}

loadIndex();

</script>

</body>
</html>
