function speak(text){
  if(!text) return;
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speechSynthesis.speak(speech);
}

/////////////////////////////
// 📥 تحميل الأفعال
/////////////////////////////

async function loadWords(){

  const container = document.getElementById("list");
  container.innerHTML = "⏳ جاري التحميل...";

  const { data, error } = await client
    .from("book_words")
    .select("*");

  if(error){
    container.innerHTML = "❌ " + error.message;
    return;
  }

  if(!data.length){
    container.innerHTML = "⚠️ لا توجد بيانات";
    return;
  }

  container.innerHTML = "";

  data.forEach(word => {

    container.innerHTML += `
      <div class="card">

        <div class="row">
          <span>${word.base}</span>
          <button onclick="speak('${word.base}')">🔊</button>
        </div>

        <div class="row">
          <span>${word.past}</span>
          <button onclick="speak('${word.past}')">🔊</button>
        </div>

        <div class="row">
          <span>${word.past_participle}</span>
          <button onclick="speak('${word.past_participle}')">🔊</button>
        </div>

        <div class="translation">
          ${word.translation || ''}
        </div>

      </div>
    `;
  });

}
