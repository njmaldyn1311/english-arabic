<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتاب</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  margin:0;
  text-align:center;
}

.container{
  max-width:750px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:18px;
  margin:15px 0;
  border-radius:15px;
}

.title{
  font-size:24px;
  font-weight:bold;
}

.grammar{
  text-align:right;
}

.word{
  border-bottom:1px solid #334155;
  padding:12px;
  text-align:left;
  cursor:pointer;
}

.top{
  display:flex;
  justify-content:space-between;
}

.en{
  color:#38bdf8;
  font-weight:bold;
  font-size:18px;
}

.ar{
  color:#f87171;
  margin-left:10px;
}

.example{
  margin-top:8px;
  color:#e2e8f0;
  cursor:pointer;
}

.example-ar{
  color:#facc15;
  font-size:18px;
  font-weight:bold;
}

.icon{
  cursor:pointer;
  margin-left:10px;
}

button {
  background:#22c55e;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <div id="index"></div>
  <div id="lesson"></div>
  <div id="nav"></div>
  <div id="grammar"></div>
  <div id="words"></div>
</div>

<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ✅ نخزن الفهرس (حل البطء)
let cachedUnits = null;

// ✅ نستخدم ID بدل الرقم
let LESSON_ID = null;

// 🔊 صوت
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ⭐ حفظ
async function saveWord(el, word, translation){
  await client.from("book_user_words").insert({ word, translation });
  el.innerText="✅";
}

// 🔁 فتح درس
function goLesson(id){
  LESSON_ID = id;
  document.getElementById("index").innerHTML = "";
  loadLesson();
}

// 🔙 رجوع
function backToIndex(){
  LESSON_ID = null;

  document.getElementById("lesson").innerHTML = "";
  document.getElementById("nav").innerHTML = "";
  document.getElementById("grammar").innerHTML = "";
  document.getElementById("words").innerHTML = "";

  loadIndex();
}

// 📚 الفهرس
async function loadIndex(){

  if(!cachedUnits){
    const { data } = await client
      .from("book_units")
      .select(`
        unit_number,
        book_lessons (
          id,
          title,
          lesson_number
        )
      `)
      .order("unit_number");

    cachedUnits = data;
  }

  let html = `<div class="card"><h2>📚 فهرس الكتاب</h2></div>`;

  cachedUnits.forEach(u => {

    html += `<div class="card">`;
    html += `<h3 style="color:#38bdf8;">📘 Unit ${u.unit_number}</h3>`;

    u.book_lessons
      .sort((a,b)=>a.lesson_number - b.lesson_number)
      .forEach(l => {

        html += `
          <div class="word" onclick="goLesson(${l.id})">
            Lesson ${l.lesson_number} - ${l.title}
          </div>
        `;

      });

    html += `</div>`;
  });

  document.getElementById("index").innerHTML = html;
}

// 📖 تحميل الدرس
async function loadLesson(){

  const { data: lesson } = await client
    .from("book_lessons")
    .select(`
      id,
      title,
      lesson_number,
      unit_id,
      book_units (
        unit_number
      )
    `)
    .eq("id", LESSON_ID)
    .single();

  if(!lesson) return;

  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <div class="title">
        Unit ${lesson.book_units?.unit_number}
        - Lesson ${lesson.lesson_number}
        <br>
        📘 ${lesson.title}
      </div>
    </div>
  `;

  // ⬅️➡️ تنقل
  let { data: prev } = await client
    .from("book_lessons")
    .select("id")
    .eq("unit_id", lesson.unit_id)
    .lt("lesson_number", lesson.lesson_number)
    .order("lesson_number", { ascending: false })
    .limit(1);

  let { data: next } = await client
    .from("book_lessons")
    .select("id")
    .eq("unit_id", lesson.unit_id)
    .gt("lesson_number", lesson.lesson_number)
    .order("lesson_number", { ascending: true })
    .limit(1);

  document.getElementById("nav").innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;">
      <button onclick="backToIndex()">📚 الفهرس</button>

      ${
        prev?.length
        ? `<button onclick="goLesson(${prev[0].id})">⬅️ السابق</button>`
        : `<div></div>`
      }

      ${
        next?.length
        ? `<button onclick="goLesson(${next[0].id})">التالي ➡️</button>`
        : `<div></div>`
      }
    </div>
  `;

  // 📖 القواعد
  const { data: grammar } = await client
    .from("book_grammar")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let gHTML = "";

  grammar?.forEach(g => {
    gHTML += `
      <div class="card grammar">
        <h3>📖 ${g.title}</h3>
        <p>${(g.explanation || "").replace(/\\n|\n/g,"<br>")}</p>
        <div>${(g.examples || "").replace(/\\n|\n/g,"<br>")}</div>
      </div>
    `;
  });

  document.getElementById("grammar").innerHTML = gHTML;

  // 📚 الكلمات
  const { data: words } = await client
    .from("book_words")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let wHTML = "";

  words?.forEach(w => {
    wHTML += `
      <div class="card word">
        <div class="top">
          <div>
            <span class="en">${w.word}</span>
            <span class="ar">${w.translation}</span>
          </div>
          <div>
            <span class="icon" onclick="speak('${w.word}')">🔊</span>
            <span class="icon" onclick="saveWord(this,'${w.word}','${w.translation}')">⭐</span>
          </div>
        </div>

        <div class="example" onclick="speak('${w.example || ""}')">
          ${w.example || ""}
        </div>

        <div class="example-ar">
          ${w.example_ar || ""}
        </div>
      </div>
    `;
  });

  document.getElementById("words").innerHTML = wHTML;

}

// 🚀 تشغيل
loadIndex();

</script>

</body>
</html>
