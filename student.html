<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔌 اختبار Supabase</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  font-family:"Cairo", sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:20px;
}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}
.word{
  margin:10px;
  padding:10px;
  border-bottom:1px solid #334155;
}
</style>

</head>

<body>

<h2>🔌 اختبار الاتصال مع Supabase</h2>

<div class="card" id="status">⏳ جاري الاتصال...</div>

<div class="card" id="data"></div>

<script>

// 🔴 حط بياناتك هنا
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "PUT_YOUR_KEY_HERE";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// اختبار
async function test(){

  let { data, error } = await supabase
    .from("words")
    .select("*");

  if(error){
    document.getElementById("status").innerHTML = "❌ خطأ في الاتصال";
    console.log(error);
    return;
  }

  document.getElementById("status").innerHTML = "✅ تم الاتصال بنجاح";

  if(!data || data.length === 0){
    document.getElementById("data").innerHTML = "⚠️ لا توجد بيانات";
    return;
  }

  let html = "";

  data.forEach(w=>{
    let en = w.word || w.en;
    let ar = w.arabic || w.ar;

    html += `
      <div class="word">
        🇺🇸 ${en} <br>
        🇸🇦 ${ar}
      </div>
    `;
  });

  document.getElementById("data").innerHTML = html;
}

test();

</script>

</body>
</html>
