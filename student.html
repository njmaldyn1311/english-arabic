<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي</title>

<style>

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔝 الأعلى */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  flex-wrap:wrap;
  gap:10px;
}

.user{color:#38bdf8;font-size:14px;}
.points{color:#FFD700;font-size:14px;}

.review{
  background:#6366f1;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
  font-size:14px;
}

/* 📦 كروت */
.card{
  background:#1e293b;
  margin:15px;
  padding:18px;
  border-radius:18px;
}

/* 📱 استجابة */
@media (max-width:480px){
  .card{margin:12px;}
  .top{padding:10px;}
}

/* ⭐ الكلمات */
.word{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #334155;
}

.en{color:#38bdf8;}
.ar{color:#f87171;}

/* 📝 الملاحظات */
textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:10px;
  resize:none;
  height:80px;
  font-family:"Cairo";
}

/* زر */
button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

/* 🧠 اختبار */
.quiz button{
  display:block;
  width:100%;
  margin-top:6px;
  background:#334155;
}

</style>
</head>

<body>

<div class="top">
  <div class="user" id="username">👤</div>
  <div class="points">⭐ كلماتك: <span id="count">0</span></div>
  <div class="review" onclick="goHome()">🏠 الرئيسية</div>
</div>

<!-- ⭐ الكلمات -->
<div class="card">
  <h3>⭐ الكلمات المحفوظة</h3>
  <div id="words"></div>
</div>

<!-- 📝 الملاحظات -->
<div class="card">
  <h3>📝 ملاحظاتي</h3>

  <div id="oldNotes" style="color:#cbd5f5;margin-bottom:10px;"></div>

  <textarea id="noteInput" placeholder="اكتب ملاحظة جديدة..."></textarea>

  <button onclick="addNote()">➕ إضافة</button>
</div>

<!-- 🧠 اختبار -->
<div class="card">
  <h3>🧠 اختبار سريع</h3>
  <div id="quiz"></div>
</div>

<script>

/* 👤 الاسم (أول + ثاني فقط) */
let fullName = localStorage.getItem("user") || "طالب";

let parts = fullName.split(" ");
let shortName = parts[0] + (parts[1] ? " " + parts[1] : "");

document.getElementById("username").innerText = "👤 " + shortName;


/* ⭐ الكلمات */
let words = JSON.parse(localStorage.getItem("words") || "[]");
document.getElementById("count").innerText = words.length;

function renderWords(){
  let html="";
  words.forEach(w=>{
    html+=`
      <div class="word">
        <div class="ar">${w.ar}</div>
        <div class="en">${w.en}</div>
      </div>
    `;
  });
  document.getElementById("words").innerHTML = html || "لا توجد كلمات";
}
renderWords();


/* 📝 الملاحظات */
function loadNotes(){
  let notes = JSON.parse(localStorage.getItem("notes") || "[]");

  let html="";
  notes.forEach(n=>{
    html+=`<div>• ${n}</div>`;
  });

  document.getElementById("oldNotes").innerHTML =
    html || "لا توجد ملاحظات";
}

function addNote(){
  let input = document.getElementById("noteInput").value.trim();
  if(!input) return;

  let notes = JSON.parse(localStorage.getItem("notes") || "[]");
  notes.push(input);

  localStorage.setItem("notes", JSON.stringify(notes));

  document.getElementById("noteInput").value = "";

  loadNotes();
}

loadNotes();


/* 🧠 اختبار */
function generateQuiz(){

  if(words.length < 3){
    document.getElementById("quiz").innerHTML = "أضف كلمات أولاً ⭐";
    return;
  }

  let random = words.sort(()=>0.5-Math.random()).slice(0,3);

  let html="";

  random.forEach(q=>{

    let options = words.sort(()=>0.5-Math.random()).slice(0,3);
    options.push(q);
    options = options.sort(()=>0.5-Math.random());

    html+=`<div class="quiz">
      <p>ما معنى: <strong>${q.en}</strong>؟</p>
    `;

    options.forEach(opt=>{
      html+=`
        <button onclick="checkAnswer('${q.ar}','${opt.ar}')">
          ${opt.ar}
        </button>
      `;
    });

    html+=`</div><hr>`;
  });

  document.getElementById("quiz").innerHTML = html;
}

function checkAnswer(correct, answer){
  if(correct === answer){
    alert("✅ صحيح");
  }else{
    alert("❌ خطأ");
  }
}

generateQuiz();


/* 🔙 رجوع */
function goHome(){
  window.location.href="index.html";
}

</script>

</body>
</html>
