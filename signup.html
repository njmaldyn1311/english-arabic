<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل طالب</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
body::before{content:"";position:fixed;width:100%;height:100%;background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;opacity:.08;z-index:-1}
.box{width:100%;max-width:420px;padding:25px;border-radius:20px;background:rgba(255,255,255,.05);backdrop-filter:blur(15px);box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center;color:white}
.stats{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);padding:10px;border-radius:12px;margin-bottom:15px;font-size:14px}
h2{margin-bottom:15px}
input{width:100%;height:50px;padding:0 14px;margin:8px 0;border-radius:12px;border:none;text-align:center;font-size:16px}
input::placeholder{color:#9ca3af}
input:focus{outline:none;box-shadow:0 0 0 2px #38bdf8}
.custom-select{position:relative;background:white;color:black;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:8px 0;font-size:16px}
.options{position:absolute;top:55px;right:0;left:0;background:white;border-radius:12px;display:none;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.2);z-index:10}
.options div{padding:12px;cursor:pointer}
.options div:hover{background:#f1f5f9}
.label{margin-top:15px;margin-bottom:5px;font-size:14px;color:#cbd5f5}
.skills{background:white;border-radius:12px;padding:12px;color:black;text-align:right}
.check{display:flex;align-items:center;gap:10px;margin:8px 0;cursor:pointer}
.check input{display:none}
.check span{width:20px;height:20px;border:2px solid #3b82f6;border-radius:6px;position:relative;flex:0 0 20px}
.check input:checked+span{background:#3b82f6}
.check input:checked+span::after{content:"✓";color:white;position:absolute;top:-2px;right:3px}
button{width:100%;height:50px;margin-top:15px;border:none;border-radius:12px;background:#22c55e;color:white;font-size:16px;cursor:pointer;transition:background .2s,opacity .2s}
button:hover{background:#16a34a}
button:disabled{opacity:.72;cursor:wait}
button.loading{background:#15803d}
.button-content{display:inline-flex;align-items:center;justify-content:center;gap:9px}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#signupStatus{min-height:22px;margin:9px 2px 0;font-size:13px;line-height:1.7;color:#fde68a}
#signupStatus.error{color:#fecaca}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:50}
.popup-box{background:white;color:black;padding:25px;border-radius:20px;text-align:center;width:85%;max-width:300px}
.popup button{margin-top:15px;background:#22c55e;border:none;padding:10px;border-radius:10px;color:white}
</style>
</head>
<body>
<div class="box">
  <div class="stats">🔥 أكثر من 1200 طالب بدأوا التعلم معنا</div>
  <h2>🚀 تسجيل طالب جديد</h2>
  <input id="name" placeholder="اسم الطالب" autocomplete="name">
  <input id="phone" placeholder="رقم الجوال" autocomplete="tel" inputmode="tel">
  <input id="city" placeholder="المدينة" autocomplete="address-level2">
  <input id="district" placeholder="الحي" autocomplete="address-level3">

  <div class="custom-select" onclick="event.stopPropagation(); toggleDropdown()">
    <div id="selected">اختر الجنس</div>
    <div class="options" id="dropdown">
      <div onclick="selectOption(event,'ذكر')">ذكر</div>
      <div onclick="selectOption(event,'أنثى')">أنثى</div>
    </div>
  </div>

  <div class="custom-select" onclick="event.stopPropagation(); toggleLevelDropdown()">
    <div id="selectedLevel">المستوى</div>
    <div class="options" id="levelDropdown">
      <div onclick="selectLevel(event,'مبتدئ')">مبتدئ</div>
      <div onclick="selectLevel(event,'متوسط')">متوسط</div>
      <div onclick="selectLevel(event,'متقدم')">متقدم</div>
    </div>
  </div>

  <div class="label">❗ لا أستطيع</div>
  <div class="skills">
    <label class="check"><input type="checkbox" value="القراءة"><span></span> القراءة</label>
    <label class="check"><input type="checkbox" value="الكتابة"><span></span> الكتابة</label>
    <label class="check"><input type="checkbox" value="التحدث"><span></span> التحدث</label>
    <label class="check"><input type="checkbox" value="كل ما ذكر صحيح"><span></span> كل ما ذكر صحيح</label>
  </div>

  <div class="label">🎯 اهتماماتك المهنية</div>
  <input id="job1" placeholder="مثال: طبيب - مهندس">
  <input id="job2" placeholder="مثال: برمجة - تجارة">
  <input id="job3" placeholder="مثال: سفر - مقابلات">

  <button id="signupBtn" type="button" onclick="signup()">
    <span class="button-content">تسجيل</span>
  </button>
  <div id="signupStatus" role="status" aria-live="polite"></div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h3>🎉 تم التسجيل</h3>
    <p>تم إرسال طلب التسجيل بنجاح</p>
    <button type="button" onclick="goHome()">ابدأ الآن</button>
  </div>
</div>

<script>
'use strict';
let selectedGender = '';
let selectedLevel = '';

function toggleDropdown(){
  document.getElementById('levelDropdown').style.display='none';
  const drop=document.getElementById('dropdown');
  drop.style.display=drop.style.display==='block'?'none':'block';
}
function selectOption(e,value){
  e.stopPropagation();selectedGender=value;
  document.getElementById('selected').innerText=value;
  document.getElementById('dropdown').style.display='none';
}
function toggleLevelDropdown(){
  document.getElementById('dropdown').style.display='none';
  const drop=document.getElementById('levelDropdown');
  drop.style.display=drop.style.display==='block'?'none':'block';
}
function selectLevel(e,value){
  e.stopPropagation();selectedLevel=value;
  document.getElementById('selectedLevel').innerText=value;
  document.getElementById('levelDropdown').style.display='none';
}
document.addEventListener('click',()=>{
  document.getElementById('dropdown').style.display='none';
  document.getElementById('levelDropdown').style.display='none';
});

const WEBHOOK='https://steelblue-frog-379077.hostingersite.com/webhook/signup';
const signupBtn=document.getElementById('signupBtn');
const signupStatus=document.getElementById('signupStatus');

function setSignupLoading(isLoading){
  signupBtn.disabled=isLoading;
  signupBtn.classList.toggle('loading',isLoading);
  signupBtn.innerHTML=isLoading
    ? '<span class="button-content"><span class="spinner" aria-hidden="true"></span> جاري التسجيل...</span>'
    : '<span class="button-content">تسجيل</span>';
  signupBtn.setAttribute('aria-busy',String(isLoading));
}

async function signup(){
  // منع الضغط المتكرر وإظهار حالة التحميل فور بدء العملية.
  if(signupBtn.disabled) return;

  const skills=[...document.querySelectorAll('.skills input:checked')].map(el=>el.value);
  const data={
    name:document.getElementById('name').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    city:document.getElementById('city').value.trim(),
    district:document.getElementById('district').value.trim(),
    gender:selectedGender,
    level:selectedLevel,
    skills,
    job1:document.getElementById('job1').value.trim(),
    job2:document.getElementById('job2').value.trim(),
    job3:document.getElementById('job3').value.trim()
  };

  if(!data.name||!data.phone){alert('يرجى إدخال الاسم ورقم الجوال ⚠️');return;}
  if(!selectedGender||!selectedLevel){alert('اختر الجنس والمستوى ⚠️');return;}

  setSignupLoading(true);
  signupStatus.classList.remove('error');
  signupStatus.textContent='يتم إرسال بياناتك الآن، يرجى عدم إغلاق الصفحة.';

  try{
    // نمنح المتصفح فرصة لرسم زر التحميل قبل بدء طلب الشبكة.
    await new Promise(resolve=>requestAnimationFrame(()=>resolve()));

    const response=await fetch(WEBHOOK,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
    const responseText=await response.text();
    if(!response.ok){
      throw new Error(`فشل التسجيل (${response.status}). ${responseText.slice(0,250)}`);
    }

    signupStatus.textContent='تم إرسال التسجيل بنجاح.';
    document.getElementById('popup').style.display='flex';
  }catch(error){
    console.error('Signup error:',error);
    signupStatus.classList.add('error');
    signupStatus.textContent='تعذر إكمال التسجيل. تحقق من الاتصال وحاول مرة أخرى.';
    alert('تعذر التسجيل حالياً ❌\n' + (error.message||'خطأ في الاتصال'));
  }finally{
    setSignupLoading(false);
  }
}

function goHome(){window.location.href='index.html';}
</script>
</body>
</html>
