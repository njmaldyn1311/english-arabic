<script>

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🧠 قراءة الرابط (lesson_number)
const params = new URLSearchParams(window.location.search);
let LESSON_NUMBER = params.get("lesson");

// 🔊 صوت
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ⭐ حفظ
async function saveWord(el, word, translation){
  await client.from("book_user_words").insert({
    word,
    translation
  });
  el.innerText="✅";
}

// 🔁 تنقل
function goLesson(num){
  window.location.href = `?lesson=${num}`;
}

// 🧠 إذا ما فيه lesson → نجيب أول درس (بالترتيب الصحيح)
async function getLessonNumber(){

  if(LESSON_NUMBER) return;

  const { data } = await client
    .from("book_lessons")
    .select("lesson_number")
    .order("lesson_number", { ascending: true })
    .limit(1)
    .single();

  LESSON_NUMBER = data.lesson_number;
}

// 🚀 تحميل الدرس
async function loadLesson(){

  // 📘 نجيب الدرس حسب الترتيب
  const { data: lesson } = await client
    .from("book_lessons")
    .select(`
      id,
      title,
      lesson_number,
      unit_id,
      book_units (
        unit_number
      )
    `)
    .eq("lesson_number", LESSON_NUMBER)
    .single();

  if(!lesson){
    document.getElementById("lesson").innerHTML = "❌ لا يوجد درس";
    return;
  }

  const LESSON_ID = lesson.id; // نستخدمه داخليًا فقط

  // 📘 العنوان
  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <div class="title">
        Unit ${lesson.book_units?.unit_number}
        - Lesson ${lesson.lesson_number}
        <br>
        📘 ${lesson.title}
      </div>
    </div>
  `;

  // ⬅️➡️ التنقل (حسب الترتيب)
  let { data: prev } = await client
    .from("book_lessons")
    .select("lesson_number")
    .eq("unit_id", lesson.unit_id)
    .lt("lesson_number", lesson.lesson_number)
    .order("lesson_number", { ascending: false })
    .limit(1);

  let { data: next } = await client
    .from("book_lessons")
    .select("lesson_number")
    .eq("unit_id", lesson.unit_id)
    .gt("lesson_number", lesson.lesson_number)
    .order("lesson_number", { ascending: true })
    .limit(1);

  document.getElementById("nav").innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;">

      ${
        prev?.length
        ? `<button onclick="goLesson('${prev[0].lesson_number}')">⬅️ السابق</button>`
        : `<div></div>`
      }

      ${
        next?.length
        ? `<button onclick="goLesson('${next[0].lesson_number}')">التالي ➡️</button>`
        : `<div></div>`
      }

    </div>
  `;

  // 📖 القواعد
  const { data: grammar } = await client
    .from("book_grammar")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let gHTML = "";

  grammar?.forEach(g => {
    gHTML += `
      <div class="card grammar">
        <h3>📖 ${g.title}</h3>
        <p>${(g.explanation || "").replace(/\\n|\n/g, "<br>")}</p>
        <div>${(g.examples || "").replace(/\\n|\n/g, "<br>")}</div>
      </div>
    `;
  });

  document.getElementById("grammar").innerHTML = gHTML;

  // 📚 الكلمات
  const { data: words } = await client
    .from("book_words")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let wHTML = "";

  words?.forEach(w => {
    wHTML += `
      <div class="card word">

        <div class="top">
          <div>
            <span class="en">${w.word}</span>
            <span class="ar">${w.translation}</span>
          </div>

          <div>
            <span class="icon" onclick="speak('${w.word}')">🔊</span>
            <span class="icon" onclick="saveWord(this,'${w.word}','${w.translation}')">⭐</span>
          </div>
        </div>

        <div class="example" onclick="speak('${w.example || ""}')">
          ${w.example || ""}
        </div>

        <div class="example-ar">
          ${w.example_ar || ""}
        </div>

      </div>
    `;
  });

  document.getElementById("words").innerHTML = wHTML;

}

// 🚀 تشغيل
async function start(){
  await getLessonNumber();
  loadLesson();
}

start();

</script>
