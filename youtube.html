<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Learning</title>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 900px;
  margin: auto;
}

/* input */
input {
  padding: 12px;
  width: 100%;
  border-radius: 10px;
  border: none;
  margin: 5px 0;
  font-size: 16px;
}

/* button */
button {
  background: #22c55e;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  margin: 5px;
  font-size: 14px;
}

/* card */
.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
  box-shadow: 0 0 10px #000;
}

/* video responsive */
.video-wrapper {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
}

.video-wrapper iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 15px;
}

/* table */
.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

.table th, .table td {
  border-bottom: 1px solid #334155;
  padding: 10px;
  text-align: left;
  vertical-align: top;
}

.table th {
  color: #22c55e;
}

.en {
  color: #38bdf8;
  font-weight: bold;
}

.ar {
  color: #f87171;
}

.example {
  color: #e2e8f0;
}

.example-ar {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 5px;
}

/* زر الصوت */
.speak-btn {
  background: #0ea5e9;
  border-radius: 8px;
  padding: 5px 8px;
  cursor: pointer;
  font-size: 12px;
}

/* highlight */
.highlight {
  color: #38bdf8;
  font-weight: bold;
  background: rgba(56,189,248,0.1);
  padding: 2px 4px;
  border-radius: 5px;
}

/* موبايل */
@media (max-width: 600px) {
  .table th, .table td {
    font-size: 12px;
    padding: 6px;
  }

  button {
    width: 100%;
  }
}

#loading {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بالذكاء الاصطناعي</h2>

<input type="text" id="url" placeholder="ضع رابط YouTube">

<button onclick="sendUrl()">🔗 تحليل الرابط</button>

<p id="loading">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <div class="video-wrapper">
    <iframe id="videoFrame" frameborder="0" allowfullscreen></iframe>
  </div>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let videoId = "";

// استخراج ID
function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

// عرض الفيديو
function showVideo(url) {
  videoId = getVideoId(url);
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}`;
  document.getElementById("videoBox").style.display = "block";
}

// الانتقال للوقت
function goToTime(sec) {
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}?start=${sec}&autoplay=1`;
}

// تمييز الكلمة
function highlightWord(sentence, word) {
  if (!sentence) return "";
  const regex = new RegExp(`\\b(${word})\\b`, "gi");
  return sentence.replace(regex, `<span class="highlight">$1</span>`);
}

// إرسال
async function sendUrl() {
  const url = document.getElementById("url").value;
  if (!url) return alert("اكتب رابط");

  startLoading();
  showVideo(url);

  const res = await fetch(WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });

  const data = await res.json();
  stopLoading();
  show(data);
}

// عرض البيانات
function show(data) {
  let html = "";

  for (let cat in data) {
    if (!data[cat] || data[cat].length === 0) continue;

    html += `
    <div class="card">
      <h3>${cat}</h3>

      <table class="table">
        <tr>
          <th>Word</th>
          <th>🔊</th>
          <th>Arabic</th>
          <th>Example</th>
        </tr>
    `;

    data[cat].forEach(w => {

      const shortExample = (w.example || "").split(".")[0];
      const highlighted = highlightWord(shortExample, w.en);

      html += `
        <tr>
          <td class="en">${w.en}</td>

          <td>
            <button class="speak-btn" onclick="speak('${w.en}')">🔊</button>
          </td>

          <td class="ar">${w.ar}</td>

          <td onclick="goToTime(${w.time || 0})" style="cursor:pointer;">
            <div class="example">${highlighted}</div>
            <div class="example-ar">${w.example_ar || ""}</div>
          </td>
        </tr>
      `;
    });

    html += `</table></div>`;
  }

  document.getElementById("result").innerHTML = html;
}

// 🔥 صوت احترافي (رجالي + بطيء)
function speak(text) {
  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "en-US";
  utterance.rate = 0.7;   // أبطأ
  utterance.pitch = 0.8;  // أعمق (رجالي)

  const voices = speechSynthesis.getVoices();

  const maleVoice = voices.find(v =>
    v.lang.includes("en") &&
    (v.name.toLowerCase().includes("male") ||
     v.name.toLowerCase().includes("david") ||
     v.name.toLowerCase().includes("mark"))
  );

  if (maleVoice) {
    utterance.voice = maleVoice;
  }

  speechSynthesis.speak(utterance);
}

// loading
function startLoading() {
  document.getElementById("loading").style.display = "block";
}

function stopLoading() {
  document.getElementById("loading").style.display = "none";
}

</script>

</body>
</html>
