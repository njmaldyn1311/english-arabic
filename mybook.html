<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  text-align:center;
}

/* 🔥 الهيدر */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 15px;
}

.home-btn{
  background:#38bdf8;
  padding:8px 15px;
  border-radius:10px;
  border:none;
  color:white;
}

.username{
  font-size:14px;
}

/* الكارد */
.card{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:20px;
}

/* زر */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

/* PDF */
canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

/* أزرار تحت */
.bottom-buttons{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.bottom-buttons button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:13px;
  background:#22c55e;
}

/* ملاحظات */
.note-box{
  width:100%;
  margin-top:10px;
}

textarea{
  width:100%;
  height:60px;
  padding:10px;
  border-radius:10px;
  border:none;
  box-sizing:border-box;
}

/* 🔒 popup */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  width:85%;
  max-width:280px;
}

.buy{
  background:#f59e0b;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  margin-top:10px;
}

.close{
  background:#64748b;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  margin-top:10px;
}
</style>

</head>
<body>

<!-- 🔥 الهيدر -->
<div class="header">
  <div class="username" id="userName">👤</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <button id="openBtn" class="btn download" onclick="openBook()">
    📥 تحميل وفتح
  </button>

  <canvas id="pdf"></canvas>

  <button class="btn orange" onclick="analyzePage()">🧠 تحليل الصفحة</button>

  <div class="note-box">
    <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>
  </div>

  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
    <button onclick="savePage()">⭐ حفظ</button>
    <button onclick="readPage()">🔊 قراءة</button>
  </div>

</div>

<!-- 🔒 popup -->
<div id="alert" class="overlay">
  <div class="popup">
    <h3 id="alertText">🔒 الكتاب للمشتركين فقط</h3>
    <button class="buy" onclick="buy()">📱 شراء عبر واتساب</button>
    <button class="close" onclick="closeAlert()">إغلاق</button>
  </div>
</div>

<script>

// 🔥 Supabase
const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userId = localStorage.getItem("user_id");
let isPaid = false;

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc = null;
let currentPage = 1;

// 👤 تحميل المستخدم
async function checkUser(){

  const { data } = await client
    .from("users")
    .select("name,plan")
    .eq("id", userId)
    .single();

  if(data){
    isPaid = data.plan === "paid";

    let names = (data.name || "").split(" ");
    document.getElementById("userName").innerText =
      "👤 " + (names[0] || "") + " " + (names[1] || "");
  }
}

// 🏠
function goHome(){
  location.href="index.html";
}

// 📥 فتح الكتاب
async function openBook(){

  const btn = document.getElementById("openBtn");

  btn.innerText="⏳ جاري التحميل...";
  btn.disabled=true;

  await checkUser();

  if(!isPaid){
    btn.innerText="📥 تحميل وفتح";
    btn.disabled=false;
    document.getElementById("alert").style.display="flex";
    return;
  }

  try{
    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    await renderPage(currentPage);

    document.getElementById("priceBox").style.display="none";

    btn.innerText="📖 تم فتح الكتاب";

  }catch(e){
    btn.innerText="❌ فشل التحميل";
  }

  btn.disabled=false;
}

// عرض الصفحة
async function renderPage(num){

  const page = await pdfDoc.getPage(num);

  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");

  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext:ctx, viewport }).promise;

  // 🔥 حفظ آخر صفحة
  client.from("users")
    .update({ last_page: num })
    .eq("id", userId);
}

// التنقل
function nextPage(){
  if(currentPage < pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);
  }
}

function prevPage(){
  if(currentPage > 1){
    currentPage--;
    renderPage(currentPage);
  }
}

// حفظ الصفحة
function savePage(){
  localStorage.setItem("savedPage", currentPage);
  alert("تم حفظ الصفحة ⭐");
}

// قراءة
async function readPage(){

  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();

  let text = content.items.map(i=>i.str).join(" ");

  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";

  speechSynthesis.speak(speech);
}

// تحليل
function analyzePage(){
  alert("تحليل الصفحة 🔥 (اربطه مع AI)");
}

// ملاحظة
function saveNote(){
  let note = document.getElementById("noteInput").value;
  if(!note) return;
  alert("تم حفظ الملاحظة ✅");
}

// شراء
function buy(){
  window.open("https://wa.me/966000000000","_blank");
}

// إغلاق
function closeAlert(){
  document.getElementById("alert").style.display="none";
}

</script>

</body>
</html>
