<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل طالب</title>

<style>
*{ box-sizing:border-box; }

body {
  margin:0;
  font-family:"Cairo",sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px;
}

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.08;
  z-index:-1;
}

.box{
  width:100%;
  max-width:420px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  text-align:center;
  color:white;
}

.stats{
  background:rgba(34,197,94,0.15);
  padding:10px;
  border-radius:12px;
  margin-bottom:15px;
}

input{
  width:100%;
  height:50px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  text-align:center;
}

button{
  width:100%;
  height:50px;
  margin-top:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* 🔔 Toast */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-size:14px;
  z-index:9999;
  display:none;
  max-width:90%;
}

.toast.error{background:#ef4444;}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  color:black;
  padding:25px;
  border-radius:20px;
  text-align:center;
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<div class="box">

<div class="stats">🔥 أكثر من 1200 طالب</div>

<h2>🚀 تسجيل طالب</h2>

<input id="name" placeholder="اسم الطالب">
<input id="phone" placeholder="رقم الجوال">

<button id="signupBtn" onclick="signup()">تسجيل</button>

</div>

<div id="popup" class="popup">
  <div class="popup-box">
    <h3>🎉 تم التسجيل</h3>
    <button onclick="goHome()">ابدأ</button>
  </div>
</div>

<script>

const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/signup";

/* 🔔 Toast */
function showToast(msg,type="success"){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast "+(type==="error"?"error":"");
  t.style.display="block";
  setTimeout(()=>t.style.display="none",3000);
}

/* ⏳ Loading */
function setLoading(state){
  let btn=document.getElementById("signupBtn");
  if(state){
    btn.disabled=true;
    btn.innerText="⏳ جاري التسجيل...";
  }else{
    btn.disabled=false;
    btn.innerText="تسجيل";
  }
}

/* 🚀 signup */
async function signup(){

  let name=document.getElementById("name").value.trim();
  let phone=document.getElementById("phone").value.trim();

  if(!name || !phone){
    showToast("اكتب البيانات","error");
    return;
  }

  setLoading(true);
  showToast("🔄 جاري التسجيل...");

  try{

    let res=await fetch(WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({name,phone})
    });

    let data=await res.json().catch(()=>null);

    if(data && data.exists){
      showToast("⚠️ الرقم موجود","error");
      setLoading(false);
      return;
    }

    showToast("✅ تم التسجيل");

    setTimeout(()=>{
      popup.style.display="flex";
    },800);

  }catch(e){
    showToast("❌ خطأ");
    setLoading(false);
  }
}

function goHome(){
  location.href="index.html";
}

</script>

</body>
</html>
