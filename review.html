<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتابي</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  text-align:center;
}

canvas{
  width:100%;
  max-width:800px;
  margin:auto;
}

.controls{
  margin:10px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
}
</style></head><body><h3>📘 كتابي</h3><div class="controls">
  <button onclick="prev()">⬅️</button>
  <span id="page"></span>
  <button onclick="next()">➡️</button>
</div><canvas id="pdf"></canvas>

<script>

const PDF_URL = "https://YOUR-PDF-LINK.pdf";

let pdfDoc = null;
let pageNum = 1;

// 🔥 تحميل من الكاش أو الإنترنت
async function loadPDF(){

  let cached = localStorage.getItem("myBook");

  if(cached){
    console.log("📦 من الكاش");
    let bytes = Uint8Array.from(atob(cached), c=>c.charCodeAt(0));
    pdfDoc = await pdfjsLib.getDocument({data:bytes}).promise;
  }else{
    console.log("🌐 تحميل أول مرة");

    let res = await fetch(PDF_URL);
    let buffer = await res.arrayBuffer();

    // حفظ في الكاش
    let base64 = btoa(
      new Uint8Array(buffer)
        .reduce((data,byte)=>data+String.fromCharCode(byte),"")
    );

    localStorage.setItem("myBook", base64);

    pdfDoc = await pdfjsLib.getDocument({data:buffer}).promise;
  }

  renderPage(pageNum);
}

// 📄 عرض الصفحة
function renderPage(num){

  pdfDoc.getPage(num).then(page=>{

    let canvas = document.getElementById("pdf");
    let ctx = canvas.getContext("2d");

    let viewport = page.getViewport({scale:1.5});
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    page.render({canvasContext:ctx, viewport:viewport});

    document.getElementById("page").innerText =
      `صفحة ${num} / ${pdfDoc.numPages}`;
  });
}

// ➡️➡️
function next(){
  if(pageNum < pdfDoc.numPages){
    pageNum++;
    renderPage(pageNum);
  }
}

// ⬅️⬅️
function prev(){
  if(pageNum > 1){
    pageNum--;
    renderPage(pageNum);
  }
}

// 🚀 تشغيل
loadPDF();

</script></body>
</html>
