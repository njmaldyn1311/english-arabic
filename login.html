<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الطالب</title>

<style>
*{
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background: linear-gradient(135deg,#0f172a,#1e3a8a);
  padding:15px;
}

/* خلفية */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") center/cover;
  opacity:0.1;
  z-index:-1;
}

/* الكرت */
.box {
  width:100%;
  max-width:400px;
  padding:25px;
  border-radius:20px;
  text-align:center;
  color:white;
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* موبايل */
@media (max-width:480px){
  .box{
    padding:20px;
  }
}

.logo{
  width:70px;
  margin-bottom:10px;
}

h2 {
  margin-bottom:20px;
  font-size:20px;
}

input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin:10px 0;
  text-align:center;
  font-size:16px;
  outline:none;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#16a34a;
}

.link {
  margin-top:15px;
  display:block;
  color:#38bdf8;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<img class="logo" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h2>🔐 دخول الطالب</h2>

<input id="phone" placeholder="📱 رقم الجوال">

<button onclick="login()">دخول</button>

<span class="link" onclick="goSignup()">ليس لديك حساب؟ سجل الآن</span>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/login";

async function login(){

  const phone = document.getElementById("phone").value.trim();

  if(!phone){
    alert("اكتب رقم الجوال");
    return;
  }

  try{

    const res = await fetch(WEBHOOK,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ phone })
    });

    const data = await res.json();

    console.log("🔥 RESPONSE:", data);

    // ✅ التحقق الصحيح
    if(!data || !data.user_id){
      alert("❌ الرقم غير مسجل");
      return;
    }

    // ✅ التخزين
    localStorage.setItem("user_id", data.user_id);
    localStorage.setItem("user", data.name);
    localStorage.setItem("phone", data.phone);

    alert("✅ تم تسجيل الدخول");

    // ✅ تحويل
    window.location.href = "index.html";

  }catch(err){
    console.error(err);
    alert("❌ خطأ في الاتصال");
  }
}

function goSignup(){
  window.location.href = "signup.html";
}

</script>

</body>
</html>
