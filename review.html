<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض الدرس</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  margin:0;
  text-align:center;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:15px;
  margin:15px 0;
  border-radius:15px;
}

.title{
  font-size:22px;
  font-weight:bold;
}

.grammar{
  text-align:right;
  line-height:1.8;
}

.word{
  border-bottom:1px solid #334155;
  padding:10px;
  text-align:left;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.en{color:#38bdf8;font-weight:bold;}
.ar{color:#f87171;}

.example{
  margin-top:5px;
  color:#e2e8f0;
}

.example-ar{
  color:#facc15;
  font-size:16px;
}

.icon{
  cursor:pointer;
  margin-left:8px;
}

.nav{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 20px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<div class="nav">
  <button onclick="prevLesson()">⬅ السابق</button>
  <button onclick="nextLesson()">التالي ➡</button>
</div>

<div id="lesson"></div>
<div id="grammar"></div>
<div id="words"></div>

</div>

<script>

// 🔥 بياناتك
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "YOUR_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 📌 قراءة الرابط
const urlParams = new URLSearchParams(window.location.search);
let LESSON_ID = parseInt(urlParams.get("lesson"));

// 🔊 صوت
function speak(text){
  let u = new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

// ⭐ حفظ
async function saveWord(el, word, translation){
  await client.from("book_user_words").insert({
    word,
    translation
  });
  el.innerText="✅";
}

// ⬅ السابق
function prevLesson(){
  let prev = LESSON_ID - 1;
  if(prev <= 0) return;
  window.location.href = "?lesson=" + prev;
}

// ➡ التالي
function nextLesson(){
  let next = LESSON_ID + 1;
  window.location.href = "?lesson=" + next;
}

// 🧠 تحديد الدرس
async function getLessonId(){

  // ✅ إذا فيه lesson في الرابط
  if(LESSON_ID){
    LESSON_ID = LESSON_ID - 1; // حل +1
    if(LESSON_ID <= 0) LESSON_ID = 1;
    return;
  }

  // 🔥 إذا ما فيه → أول درس
  const { data } = await client
    .from("book_lessons")
    .select("id")
    .order("id")
    .limit(1)
    .single();

  LESSON_ID = data.id;
}

// 🚀 تحميل البيانات
async function loadLesson(){

  const { data: lesson } = await client
    .from("book_lessons")
    .select("*")
    .eq("id", LESSON_ID)
    .single();

  if(!lesson){
    document.getElementById("lesson").innerHTML = "❌ لا يوجد درس";
    return;
  }

  document.getElementById("lesson").innerHTML = `
    <div class="card">
      <div class="title">📘 ${lesson.title}</div>
    </div>
  `;

  // 📖 القواعد
  const { data: grammar } = await client
    .from("book_grammar")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let gHTML = "";

  grammar?.forEach(g => {
    gHTML += `
      <div class="card grammar">
        <h3>📖 ${g.title}</h3>
        <p>${(g.explanation || "").replace(/\n/g, "<br>")}</p>
        <div>${(g.examples || "").replace(/\n/g, "<br>")}</div>
      </div>
    `;
  });

  document.getElementById("grammar").innerHTML = gHTML;

  // 🔤 الكلمات
  const { data: words } = await client
    .from("book_words")
    .select("*")
    .eq("lesson_id", LESSON_ID);

  let wHTML = "";

  words?.forEach(w => {
    wHTML += `
      <div class="card word">

        <div class="top">
          <div>
            <span class="en">${w.word}</span>
            <span class="ar">${w.translation}</span>
          </div>

          <div>
            <span class="icon" onclick="speak('${w.word}')">🔊</span>
            <span class="icon" onclick="saveWord(this,'${w.word}','${w.translation}')">⭐</span>
          </div>
        </div>

        <div class="example">${w.example || ""}</div>
        <div class="example-ar">${w.example_ar || ""}</div>

      </div>
    `;
  });

  document.getElementById("words").innerHTML = wHTML;

}

// 🚀 تشغيل
async function start(){
  await getLessonId();
  loadLesson();
}

start();

</script>

</body>
</html>
