<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(180deg,#020617,#0f172a);
  color:white;
}

/* الفيديو */
.video-box{
  width:95%;
  max-width:800px;
  margin:20px auto;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* الأزرار */
.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:20px;
}

button{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  border:none;
  padding:12px 18px;
  border-radius:999px;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

/* الترجمة */
.sub-en{
  text-align:center;
  font-size:24px;
  color:#38bdf8;
  margin-top:20px;
}

.sub-ar{
  text-align:center;
  font-size:26px;
  color:#facc15;
  margin-bottom:30px;
}

/* الكلمات */
.word{
  background:#020617;
  margin:10px;
  padding:15px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
}

.actions{
  display:flex;
  gap:10px;
}

.icon{
  background:#0f172a;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>

<h2 style="text-align:center">🎥 تعلم بذكاء</h2>

<div class="video-box">
  <div id="player"></div>
</div>

<div class="controls">
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔁 إعادة</button>
  <button onclick="prev()">⏮️ السابق</button>
  <button onclick="next()">⏭️ التالي</button>
</div>

<div class="sub-en" id="subEn"></div>
<div class="sub-ar" id="subAr"></div>

<div id="words"></div>

<div id="toast" class="toast">✔️ تم الحفظ</div>

<script>

/* إعداد */
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let player;
let subtitles=[];
let index=0;
let timer;

/* قراءة playlist */
const params = new URLSearchParams(location.search);
const listId = params.get("list");

/* إنشاء الفيديو */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:listId
    },
    events:{
      onReady:()=>{},
      onStateChange:onChange
    }
  });
}

/* عند تشغيل الفيديو */
function onChange(e){

  if(e.data === YT.PlayerState.PLAYING){
    startSubtitles();
    loadAI();
  }

  if(e.data === YT.PlayerState.PAUSED){
    stopSubtitles();
  }
}

/* تحميل AI */
async function loadAI(){

  subtitles=[];
  index=0;
  words.innerHTML="";

  let vid = player.getVideoData().video_id;
  if(!vid) return;

  let url="https://www.youtube.com/watch?v="+vid;

  let res = await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  let data = await res.json();

  render(data);
}

/* عرض الكلمات */
function render(data){

  let html="";

  for(let cat in data){

    html+=`<h3 style="text-align:center">${cat}</h3>`;

    data[cat].forEach(w=>{

      subtitles.push({
        en:w.example||"",
        ar:w.example_ar||""
      });

      html+=`
      <div class="word">
        <div>
          <div style="color:#38bdf8">${w.en}</div>
          <div style="color:#facc15">${w.ar}</div>
        </div>

        <div class="actions">
          <div class="icon" onclick="save(this)">⭐</div>
          <div class="icon" onclick="speak('${w.en}')">🔊</div>
        </div>
      </div>
      `;
    });
  }

  words.innerHTML=html;
}

/* الترجمة (بدون وقت) */
function startSubtitles(){

  stopSubtitles();

  function run(){

    if(!subtitles[index]) return;

    subEn.innerHTML = subtitles[index].en;
    subAr.innerText = subtitles[index].ar;

    index++;

    timer = setTimeout(run,2500);
  }

  run();
}

function stopSubtitles(){
  clearTimeout(timer);
}

/* صوت */
function speak(t){
  let u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* حفظ */
function save(el){
  el.innerHTML="✔️";
  el.style.background="#22c55e";

  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",1200);
}

/* تحكم */
function play(){ player.playVideo(); }
function pause(){ player.pauseVideo(); }
function restart(){ player.seekTo(0); }
function next(){ player.nextVideo(); }
function prev(){ player.previousVideo(); }

</script>

</body>
</html>
