<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 140px;
  position: relative;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}

.content {
  padding: 70px 20px 20px;
}

h1 { margin: 10px 0; color: white; }
.subtitle { color: #cbd5e1; }

.students {
  color: #22c55e;
  font-weight: bold;
  margin: 10px 0;
}

.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}

button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}

.logout { background: #ef4444; margin-top: 10px; }

.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
  font-weight: bold;
}

.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  font-size: 20px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
}

.notification {
  position: fixed;
  top: 20px;
  right: 50%;
  transform: translateX(50%);
  background: #1e293b;
  color: white;
  padding: 15px 20px;
  border-radius: 15px;
  display: none;
}
</style>
</head>

<body>

<div id="notification" class="notification"></div>

<div class="container">
  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students">👨‍🎓 أكثر من 120 طالب</div>

    <div class="card"><span>📚 الفصل الذكي</span><button onclick="goClass()">ابدأ</button></div>
    <div class="card"><span>📺 تحليل فيديو</span><button onclick="goYoutube()">ابدأ</button></div>
    <div class="card"><span>📄 تحليل PDF</span><button onclick="goPDF()">ابدأ</button></div>
    <div class="card"><span>🔍 البحث</span><button onclick="goSearch()">ابدأ</button></div>
    <div class="card"><span>📝 اختبار</span><button onclick="goTest()">ابدأ</button></div>
    <div class="card"><span>📊 مراجعة</span><button onclick="goReview()">ابدأ</button></div>
    <div class="card"><span>📘 كتابي</span><button onclick="goHeadway()">ابدأ</button></div>
    <div class="card"><span>✨ الأفعال </span><button onclick="goUpdate1()">عرض</button></div>
    <div class="card"><span>🆕 الأسماء</span><button onclick="goUpdate2()">عرض</button></div>
    <div class="card"><span>👤 حسابي</span><button onclick="goProfile()">فتح</button></div>

    <a id="whatsappLink" target="_blank" class="whatsapp">💬 تواصل معي</a>
    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<a id="whatsappFloat" target="_blank" class="whatsapp-float">💬</a>

<script>

// 🔥 user_id موحد
let user_id = localStorage.getItem("user_id");
if(!user_id){
  user_id = "user_" + Math.random().toString(36).substr(2,9);
  localStorage.setItem("user_id", user_id);
}

// 🔐 session_id
if(!localStorage.getItem("session_id")){
  localStorage.setItem("session_id", Date.now());
}

// 🔥 Supabase
const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔥 تحقق (معدل فقط)
function checkAccess(){

  const localSession = localStorage.getItem("session_id");

  client
    .from("users")
    .select("*")
    .eq("id", user_id)
    .single()
    .then(({ data }) => {

      if(!data){

        // ✅ إضافة فقط (جديد → signup → login)
        localStorage.setItem("is_new_user","1");
        location="signup.html";
        return;
      }

      if(data.status === "banned"){
        logout("🚫 تم حظرك");
        return;
      }

      if(data.session_id !== localSession){
        logout("🚫 تم تسجيل الدخول من جهاز آخر");
        return;
      }

      if(data.plan === "free"){
        let created = new Date(data.created_at);
        let now = new Date();
        let days = Math.floor((now - created)/(1000*60*60*24));

        if(days >= 3){
          logout("⏳ انتهت الفترة التجريبية");
        }
      }

    })
    .catch(err=>{
      console.log(err);
    });
}

// 🔁
setInterval(checkAccess, 5000);

window.onload = ()=>{
  checkAccess();
}

// 🔥 تتبع
function track(action){
  fetch(SUPABASE_URL+"/rest/v1/user_activity",{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id:user_id,
      page:"home",
      action:action
    })
  });
}

track("دخول الرئيسية");

// واتساب
let name=localStorage.getItem("user_name")||"طالب";
let msg=encodeURIComponent("السلام عليكم أنا "+name);
let link=`https://wa.me/message/735SJORMFI74H1?text=${msg}`;

whatsappLink.href=link;
whatsappFloat.href=link;

// تنقل
function goClass(){track("الفصل");location="myclass.html";}
function goYoutube(){track("فيديو");location="youtube.html";}
function goPDF(){track("PDF");location="pdf.html";}
function goSearch(){track("بحث");location="search.html";}
function goProfile(){track("حساب");location="student.html";}
function goTest(){track("اختبار");location="test.html";}
function goReview(){track("مراجعة");location="review.html";}
function goHeadway(){track("كتاب");location="headwaybook.html";}
function goUpdate1(){track("ميزة");location="update1.html";}
function goUpdate2(){track("تحديثات");location="update2.html";}

// خروج
function logout(msg){

  if(typeof track === "function"){
    track("خروج");
  }

  localStorage.setItem("force_logout", Date.now());

  localStorage.clear();

  if(msg){
    console.log(msg);
  }

  setTimeout(()=>{
    location="login.html";
  },800);
}

</script>

</body>
</html>
