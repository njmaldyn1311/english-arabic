<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 Watch</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

/* 🔥 كارد الفيديو */
.video-box{
  width:100%;
  max-width:1000px;
  margin:auto;
  aspect-ratio:16/9;
  border-radius:20px;
  overflow:hidden;
  background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

#player{
  width:100%;
  height:100%;
}

#mobilePlayer{
  width:100%;
  height:100%;
  border:0;
  display:none;
}

.controls{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:12px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 مشاهدة الدرس</h2>

<div class="video-box">
  <div id="player"></div>
  <iframe id="mobilePlayer" allowfullscreen></iframe>
</div>

<div class="controls">
  <button onclick="prev()">⏮ السابق</button>
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="next()">⏭ التالي</button>
</div>

</div>

<script>

let player;

const params = new URLSearchParams(location.search);
const listId = params.get("list");

/* 🔥 كشف الجوال */
function isMobile(){
  return /Android|iPhone|iPad/i.test(navigator.userAgent);
}

/* 🔥 الجوال */
function loadMobile(){
  let iframe = document.getElementById("mobilePlayer");
  iframe.style.display = "block";
  document.getElementById("player").style.display = "none";

  iframe.src = "https://www.youtube.com/embed?listType=playlist&list=" + listId;
}

/* 🔥 اللابتوب */
function onYouTubeIframeAPIReady(){

  if(isMobile()){
    loadMobile();
    return;
  }

  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:listId,
      playsinline:1
    }
  });
}

/* 🔥 تحكم */
function play(){
  if(player) player.playVideo();
}

function pause(){
  if(player) player.pauseVideo();
}

function next(){
  if(player) player.nextVideo();
}

function prev(){
  if(player) player.previousVideo();
}

</script>

</body>
</html>
