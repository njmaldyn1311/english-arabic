<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{margin:0;background:#0f172a;font-family:Arial;color:white;text-align:center;}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;}
.home-btn{background:#38bdf8;padding:8px 15px;border-radius:10px;border:none;color:white;}
.username{font-size:14px;}

.card{background:#e5e7eb;color:black;margin:15px;padding:15px;border-radius:20px;}

.btn{width:100%;padding:12px;border:none;border-radius:12px;margin-top:10px;color:white;font-size:16px;}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

canvas{width:100%;border-radius:15px;margin-top:10px;}

.bottom-buttons{display:flex;gap:5px;margin-top:10px;}
.bottom-buttons button{flex:1;padding:10px;border:none;border-radius:10px;color:white;font-size:13px;background:#22c55e;}

.note-box{width:100%;margin-top:10px;}
textarea{width:100%;height:70px;padding:10px;border-radius:10px;border:none;box-sizing:border-box;}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;}
.popup{background:#1e293b;padding:20px;border-radius:15px;width:85%;max-width:300px;text-align:right;}
.buy{background:#f59e0b;width:100%;padding:10px;border:none;border-radius:10px;color:white;margin-top:10px;}
.close{background:#64748b;width:100%;padding:10px;border:none;border-radius:10px;color:white;margin-top:10px;}

.word-box{
  margin-top:15px;
  background:#1e293b;
  padding:10px;
  border-radius:12px;
}
.word-row{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}
</style>

</head>
<body>

<div class="header">
  <div class="username" id="userName">👤</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<h2>📘 كتابي (شرح مباشر)</h2>

<div class="card">

  <button id="openBtn" class="btn download" onclick="openBook()">📥 تحميل وفتح</button>

  <canvas id="pdf"></canvas>

  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
  </div>

  <!-- كلمات الصفحة -->
  <div class="word-box" id="wordsBox">
    ⏳ جاري تحميل الكلمات...
  </div>

</div>

<script>

const client = supabase.createClient(
"https://ofyugbhplaynjeafdrgx.supabase.co",
"sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let userId = localStorage.getItem("user_id");
let pdfDoc=null;
let currentPage=1;

// 👤 الاسم
document.getElementById("userName").innerText =
  "👤 " + (localStorage.getItem("user")||"طالب");

// 🔥 هل معلم؟
let isTeacher = localStorage.getItem("role") === "teacher";

// 📥 فتح الكتاب
async function openBook(){

  const loadingTask = pdfjsLib.getDocument(
    "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf"
  );

  pdfDoc = await loadingTask.promise;

  renderPage(currentPage);
  loadWords();

  listenLive(); // 🔥 متابعة البث
}

// عرض الصفحة
async function renderPage(num){
  const page = await pdfDoc.getPage(num);
  const canvas = document.getElementById("pdf");
  const ctx = canvas.getContext("2d");

  const viewport = page.getViewport({ scale:1.5 });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext:ctx, viewport }).promise;
}

// 🔴 بث الصفحة (للمعلم)
async function broadcastPage(){
  await client.from("live_class")
    .update({current_page:currentPage})
    .eq("id",1);
}

// التالي
function nextPage(){
  if(currentPage < pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);

    if(isTeacher) broadcastPage(); // 🔥
  }
}

// السابق
function prevPage(){
  if(currentPage > 1){
    currentPage--;
    renderPage(currentPage);

    if(isTeacher) broadcastPage(); // 🔥
  }
}

// 🔴 استقبال البث (للطلاب)
function listenLive(){

  client.channel('live')
  .on('postgres_changes',{
    event:'UPDATE',
    schema:'public',
    table:'live_class'
  },payload=>{

    if(!isTeacher){
      currentPage = payload.new.current_page;
      renderPage(currentPage);
      loadWords();
    }

  })
  .subscribe();
}

// 🔊 صوت
function speak(word){
  let s=new SpeechSynthesisUtterance(word);
  s.lang="en-US";
  speechSynthesis.speak(s);
}

// ⭐ حفظ
async function saveWord(word,translation,btn){

  await client.from("user_star_words").insert({
    user_id:userId,
    word,
    translation,
    page:currentPage
  });

  btn.innerText="✔";
}

// 📚 كلمات الصفحة (مثال)
async function loadWords(){

  // تقدر تربطها بتحليل AI لاحقًا
  let demo = [
    {word:"eat",translation:"يأكل"},
    {word:"drink",translation:"يشرب"}
  ];

  let html="";

  demo.forEach(w=>{
    html+=`
      <div class="word-row">
        <div>${w.word} - ${w.translation}</div>
        <div>
          <button onclick="speak('${w.word}')">🔊</button>
          <button onclick="saveWord('${w.word}','${w.translation}',this)">⭐</button>
        </div>
      </div>
    `;
  });

  document.getElementById("wordsBox").innerHTML = html;
}

function goHome(){
  location.href="index.html";
}

</script>

</body>
</html>
