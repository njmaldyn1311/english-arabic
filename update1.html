<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 الأفعال</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* 🔥 الهيدر */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user-name{
  color:#38bdf8;
  font-size:14px;
}

.home{
  background:#1e293b;
  border:1px solid #334155;
  padding:8px 14px;
  border-radius:12px;
  color:#38bdf8;
  cursor:pointer;
}

/* 📦 */
.container{
  padding:15px;
  max-width:900px;
  margin:auto;
}

/* العنوان */
.title{
  text-align:center;
  font-size:24px;
  margin:15px 0;
}

/* 🔥 كرت أفقي */
.card{
  background:#1e293b;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

/* كل عنصر */
.item{
  display:flex;
  align-items:center;
  gap:6px;
  background:#334155;
  padding:8px 10px;
  border-radius:10px;
  font-size:14px;
}

/* زر الصوت */
button{
  border:none;
  background:#22c55e;
  color:white;
  border-radius:6px;
  padding:4px 8px;
  cursor:pointer;
}

/* الترجمة */
.translation{
  background:#0ea5e9;
  padding:8px 12px;
  border-radius:10px;
  font-weight:bold;
}

</style>

</head>
<body>

<div class="header">
  <div class="user-name" id="username">👤</div>
  <button class="home" onclick="goHome()">🏠 الرئيسية</button>
</div>

<div class="container">

  <div class="title">📚 الأفعال</div>

  <div id="list"></div>

</div>

<script>

/////////////////////////////
// 🔥 Supabase (نفس طريقتك)
/////////////////////////////

const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/////////////////////////////
// 👤 اسم المستخدم
/////////////////////////////

let fullName = localStorage.getItem("user") || "طالب";
let parts = fullName.split(" ");

document.getElementById("username").innerText =
  "👤 " + parts[0] + (parts[1] ? " " + parts[1] : "");

/////////////////////////////
// 🔊 صوت
/////////////////////////////

function speak(text){
  if(!text) return;
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

/////////////////////////////
// 📥 تحميل الأفعال
/////////////////////////////

async function load(){

  let { data, error } = await client
    .from("headway_verbs")
    .select("*");

  const container = document.getElementById("list");

  if(error){
    container.innerHTML = "❌ " + error.message;
    return;
  }

  if(!data.length){
    container.innerHTML = "⚠️ لا توجد بيانات";
    return;
  }

  container.innerHTML = "";

  data.forEach(w => {

    container.innerHTML += `
      <div class="card">

        <div class="item">
          ${w.base || w.word}
          <button onclick="speak('${w.base || w.word}')">🔊</button>
        </div>

        <div class="item">
          ${w.past || '-'}
          <button onclick="speak('${w.past}')">🔊</button>
        </div>

        <div class="item">
          ${w.past_participle || '-'}
          <button onclick="speak('${w.past_participle}')">🔊</button>
        </div>

        <div class="translation">
          ${w.translation || ''}
        </div>

      </div>
    `;
  });

}

/////////////////////////////

function goHome(){
  window.location.href="index.html";
}

/////////////////////////////

load();

/////////////////////////////

</script>

</body>
</html>
