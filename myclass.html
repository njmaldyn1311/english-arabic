<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الفصل الذكي</title><style>

body{
  margin:0;
  font-family:"Cairo", sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* header */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
}

.points{
  color:#FFD700;
}

/* container */
.container{
  padding:20px;
  max-width:500px;
  margin:auto;
}

/* card */
.card{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

/* input */
.input{
  width:100%;
  padding:15px;
  border-radius:15px;
  border:none;
  margin-top:10px;
  font-size:16px;
}

/* button */
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
  font-size:18px;
  margin-top:10px;
  cursor:pointer;
}

/* story */
.story{
  line-height:1.8;
}

/* translation */
.translation{
  color:#ddd;
}

/* words */
.word-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
}

.en{
  color:#38bdf8;
  font-weight:bold;
}

.ar{
  color:#f87171;
}

.star{
  background:#facc15;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

/* loading */
.loading{
  text-align:center;
  margin-top:15px;
  color:#ccc;
}

</style></head>
<body><div class="top">
  <div class="user">👤 <span id="username">أحمد</span></div>
  <div class="points">⭐ كلماتك: 0</div>
</div><div class="container">  <h2 style="text-align:center;">📚 الفصل الذكي</h2>  <div class="card">
    <input id="textInput" class="input" placeholder="اكتب الموضوع هنا مثل: الحب"><button class="btn" onclick="generateLesson()">🚀 إنشاء الدرس</button>

<div id="loading" class="loading"></div>

  </div>  <div id="lesson"></div></div><script>

async function generateLesson(){

  let text = document.getElementById("textInput").value;

  if(!text){
    alert("اكتب موضوع");
    return;
  }

  document.getElementById("loading").innerText = "⏳ جاري إنشاء الدرس...";
  document.getElementById("lesson").innerHTML = "";

  try{

    let res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/lesson",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        inputPart:text
      })
    });

    let data = await res.json();

    document.getElementById("loading").innerText = "";

    renderLesson(data);

  }catch(e){
    document.getElementById("loading").innerText = "❌ حصل خطأ";
  }

}

function renderLesson(data){

  function renderSection(title, items){
    if(!items || items.length === 0) return "";

    return `
      <div class="card">
        <h2>${title}</h2>
        ${items.map(w => `
          <div class="word-row">
            <span class="en">${w.en}</span>
            <span class="ar">${w.ar}</span>
            <button class="star">⭐</button>
          </div>
          <hr>
        `).join("")}
      </div>
    `;
  }

  let html = `
    <div class="card">
      <p class="story">${data.story}</p>
      <hr>
      <p class="translation">${data.translation}</p>
    </div>

    ${renderSection("verbs", data.words.verbs)}
    ${renderSection("nouns", data.words.nouns)}
    ${renderSection("adjectives", data.words.adjectives)}
    ${renderSection("phrasal_verbs", data.words.phrasal_verbs)}
    ${renderSection("idioms", data.words.idioms)}
  `;

  document.getElementById("lesson").innerHTML = html;

}

</script></body>
</html>
