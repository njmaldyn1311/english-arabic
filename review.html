<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتابي</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:white;
  text-align:center;
}

/* header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 15px;
}

.home-btn{
  background:#38bdf8;
  padding:8px 15px;
  border:none;
  border-radius:10px;
  color:white;
}

.username{
  font-size:14px;
}

/* card */
.card{
  background:#e5e7eb;
  color:black;
  margin:15px;
  padding:15px;
  border-radius:20px;
}

/* buttons */
.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  color:white;
  font-size:16px;
}

.download{background:#3b82f6;}
.green{background:#22c55e;}
.orange{background:#f59e0b;}

/* pdf */
canvas{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

/* bottom */
.bottom-buttons{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.bottom-buttons button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:13px;
  background:#22c55e;
}

/* notes */
textarea{
  width:100%;
  height:60px;
  padding:10px;
  border-radius:10px;
  border:none;
  box-sizing:border-box;
}

/* analysis */
.analysis-card{
  background:#1e293b;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  color:white;
  text-align:right;
}
</style>

</head>
<body>

<!-- header -->
<div class="header">
  <div class="username" id="userName">👤 ...</div>
  <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
</div>

<h2>📘 كتابي</h2>

<div class="card">

  <!-- السعر -->
  <h2 id="priceBox">💰 سعر الكتاب: 250 ريال</h2>

  <!-- زر -->
  <button id="openBtn" class="btn download" onclick="openBook()">
    📥 تحميل وفتح
  </button>

  <!-- pdf -->
  <canvas id="pdf"></canvas>

  <!-- تحليل -->
  <button class="btn orange" onclick="analyzePage()">
    🧠 تحليل الصفحة
  </button>

  <!-- النتائج -->
  <div id="analysisBox"></div>

  <!-- ملاحظات -->
  <textarea id="noteInput" placeholder="✍️ ملاحظة..."></textarea>

  <button class="btn green" onclick="saveNote()">💾 حفظ</button>

  <!-- أزرار -->
  <div class="bottom-buttons">
    <button onclick="prevPage()">⬅ السابق</button>
    <button onclick="nextPage()">التالي ➡</button>
    <button onclick="savePage()">⭐ حفظ</button>
    <button onclick="readPage()">🔊 قراءة</button>
  </div>

</div>

<script>

const PDF_URL = "https://ofyugbhplaynjeafdrgx.supabase.co/storage/v1/object/public/books/newHEADWAYbeginnerstudentbook.pdf";

let pdfDoc=null;
let currentPage=1;


// 👤 الاسم الأول والثاني
let fullName = localStorage.getItem("name") || "محمد أحمد";
let parts = fullName.split(" ");
document.getElementById("userName").innerText =
  "👤 " + parts[0] + " " + (parts[1] || "");


// 🏠 الرئيسية
function goHome(){
  window.location.href="index.html";
}


// 📥 فتح
async function openBook(){

  const btn=document.getElementById("openBtn");
  btn.innerText="⏳ جاري التحميل...";

  try{
    pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
    await renderPage(currentPage);

    btn.innerText="📖 تم فتح الكتاب";

    // 🔥 إخفاء السعر
    document.getElementById("priceBox").style.display="none";

  }catch{
    btn.innerText="❌ فشل التحميل";
  }
}


// عرض
async function renderPage(num){

  const page = await pdfDoc.getPage(num);

  const canvas=document.getElementById("pdf");
  const ctx=canvas.getContext("2d");

  const viewport=page.getViewport({scale:1.5});

  canvas.height=viewport.height;
  canvas.width=viewport.width;

  await page.render({canvasContext:ctx,viewport}).promise;
}


// تنقل
function nextPage(){
  if(currentPage<pdfDoc.numPages){
    currentPage++;
    renderPage(currentPage);
  }
}

function prevPage(){
  if(currentPage>1){
    currentPage--;
    renderPage(currentPage);
  }
}


// حفظ صفحة
function savePage(){
  localStorage.setItem("savedPage",currentPage);
  alert("تم الحفظ ⭐");
}


// قراءة
async function readPage(){

  const page = await pdfDoc.getPage(currentPage);
  const content = await page.getTextContent();

  let text = content.items.map(i=>i.str).join(" ");

  let speech=new SpeechSynthesisUtterance(text);
  speech.lang="en-US";

  speechSynthesis.speak(speech);
}


// 🧠 تحليل
async function analyzePage(){

  const box=document.getElementById("analysisBox");

  box.innerHTML=`
    <div class="analysis-card">
      ⏳ جاري التحليل...
    </div>
  `;

  try{

    const page=await pdfDoc.getPage(currentPage);
    const content=await page.getTextContent();

    let text=content.items.map(i=>i.str).join(" ");

    const res = await fetch("https://YOUR-N8N-WEBHOOK",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,page:currentPage})
    });

    const data=await res.json();

    box.innerHTML="";

    data.words.forEach(w=>{

      box.innerHTML+=`
        <div class="analysis-card">
          <div style="color:#22c55e;font-weight:bold">
            ${w.word} <span style="color:#facc15">${w.type}</span>
          </div>

          <div>${w.example}</div>

          <div style="color:#94a3b8">
            ${w.translation}
          </div>
        </div>
      `;
    });

  }catch{
    box.innerHTML=`
      <div class="analysis-card" style="background:#7f1d1d">
        ❌ فشل التحليل
      </div>
    `;
  }
}


// ملاحظة
function saveNote(){
  let note=document.getElementById("noteInput").value;
  if(!note)return;
  alert("تم حفظ الملاحظة ✅");
}


// منع نسخ
document.addEventListener("contextmenu",e=>e.preventDefault());

</script>

</body>
</html>
