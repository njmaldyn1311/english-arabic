<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنجلش بالعربي</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 90%;
  max-width: 400px;
  background: #111827;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 140px;
  position: relative;
}
.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 5px solid #1e293b;
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
}
.content { padding: 70px 20px 20px; }
h1 { margin: 10px 0; color: white; }
.subtitle { color: #cbd5e1; }
.students {
  color: #22c55e;
  font-weight: bold;
  margin: 10px 0;
}
.card {
  background: #1e293b;
  border-radius: 20px;
  padding: 15px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}
button {
  background: #22c55e;
  border: none;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  cursor: pointer;
}
.logout { background: #ef4444; margin-top: 10px; }

.whatsapp {
  display: block;
  margin-top: 15px;
  background: #25D366;
  color: white;
  padding: 12px;
  border-radius: 15px;
  text-decoration: none;
  font-weight: bold;
}
.whatsapp-float {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25D366;
  color: white;
  font-size: 20px;
  padding: 15px;
  border-radius: 50%;
  text-decoration: none;
}

/* Alert جميل */
#alertBox{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:999;
}
#alertContent{
  background:#111827;
  padding:15px;
  border-radius:15px;
  width:85%;
  max-width:260px;
  color:white;
  text-align:center;
  animation:scaleIn .2s ease;
}
#alertContent button{
  margin-top:10px;
  padding:8px 15px;
  border-radius:10px;
}
@keyframes scaleIn{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <img src="me.jpeg" class="profile-img">
  </div>

  <div class="content">

    <h1>إنجلش بالعربي</h1>
    <div class="subtitle">تعلم الإنجليزية بطريقة ذكية 🚀</div>

    <div class="students">👨‍🎓 أكثر من 120 طالب</div>

    <div class="card"><span>📚 الفصل الذكي</span><button onclick="goClass()">ابدأ</button></div>
    <div class="card"><span>📺 تحليل فيديو</span><button onclick="goYoutube()">ابدأ</button></div>
    <div class="card"><span>📄 تحليل PDF</span><button onclick="goPDF()">ابدأ</button></div>
    <div class="card"><span>🔍 البحث</span><button onclick="goSearch()">ابدأ</button></div>
    <div class="card"><span>📝 اختبار</span><button onclick="goTest()">ابدأ</button></div>
    <div class="card"><span>📊 مراجعة</span><button onclick="goReview()">فتح</button></div>
    <div class="card"><span>👤 حسابي</span><button onclick="goProfile()">فتح</button></div>

    <div class="card"><span>📘 كتابي</span><button onclick="goBook()">فتح</button></div>
    <div class="card"><span>📊 لوحة التحكم</span><button onclick="goDashboard()">فتح</button></div>
    <div class="card"><span>🚧 ميزة جديدة</span><button onclick="goUpdate1()">قريباً</button></div>
    <div class="card"><span>🔄 تحديثات</span><button onclick="goUpdate2()">عرض</button></div>

    <a id="whatsappLink" target="_blank" class="whatsapp">💬 تواصل معي</a>

    <button class="logout" onclick="logout()">تسجيل خروج</button>

  </div>
</div>

<a id="whatsappFloat" target="_blank" class="whatsapp-float">💬</a>

<!-- Alert -->
<div id="alertBox">
  <div id="alertContent">
    <div id="alertText"></div>
    <button onclick="closeAlert()">حسناً</button>
  </div>
</div>

<script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

// ✅ تحقق الأدمن (حل نهائي)
async function isAdminUser(){

  try{
    const { data } = await client.auth.getUser();

    if(!data.user) return false;

    const { data: userData } = await client
      .from("users")
      .select("phone")
      .eq("id", data.user.id)
      .single();

    if(!userData) return false;

    let phone = userData.phone.replace(/\D/g,'');

    if(phone.startsWith("0")){
      phone = phone.substring(1);
    }

    return phone === "544507401";

  }catch(e){
    console.log(e);
    return false;
  }
}

// Alert
function showAlert(msg){
  document.getElementById("alertText").innerText = msg;
  document.getElementById("alertBox").style.display = "flex";
}
function closeAlert(){
  document.getElementById("alertBox").style.display = "none";
}

// روابط
function goClass(){ location.href="myclass.html"; }
function goYoutube(){ location.href="youtube.html"; }
function goPDF(){ location.href="pdf.html"; }
function goSearch(){ location.href="search.html"; }
function goProfile(){ location.href="student.html"; }
function goTest(){ location.href="test.html"; }
function goReview(){ location.href="review.html"; }
function goBook(){ location.href="headwaybook.html"; }

// 🔐 حماية الأدمن
async function goDashboard(){

  const isAdmin = await isAdminUser();

  if(!isAdmin){
    showAlert("🚫 هذه الصفحة للمسؤول فقط");
    return;
  }

  location.href="mydashboard.html";
}

async function goUpdate1(){

  const isAdmin = await isAdminUser();

  if(!isAdmin){
    showAlert("🚧 الصفحة تحت الإنشاء");
    return;
  }

  location.href="update1.html";
}

async function goUpdate2(){

  const isAdmin = await isAdminUser();

  if(!isAdmin){
    showAlert("🔄 الصفحة تحت التحديث");
    return;
  }

  location.href="update2.html";
}

// واتساب
let name = localStorage.getItem("user_name") || "طالب";
let msg = encodeURIComponent(`السلام عليكم أنا ${name}`);
let link = `https://wa.me/966544507401?text=${msg}`;

document.getElementById("whatsappLink").href = link;
document.getElementById("whatsappFloat").href = link;

// تسجيل دخول
(async ()=>{
  const { data } = await client.auth.getUser();
  if(!data.user){
    showAlert("⚠️ سجل دخول أولاً");
  }
})();

// خروج
function logout(){
  localStorage.clear();
  location.href="login.html";
}

</script>

</body>
</html>
