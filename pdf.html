<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل PDF</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: "Cairo", sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
  color: white;
}

/* الحاوية */
.container {
  width: 100%;
  max-width: 500px;
}

/* الكرت */
.box {
  background: #1e293b;
  padding: 25px;
  border-radius: 20px;
  width: 98%;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  margin-bottom: 20px;
}

/* زر */
button {
  background: #22c55e;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  background: #16a34a;
}

/* عنوان */
.title {
  margin: 15px 0 10px;
  color: #facc15;
}

/* كلمة */
.word {
  padding: 10px;
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.en {
  flex: 1;
  text-align: left;
  color: #38bdf8;
  font-weight: bold;
}

.ar {
  flex: 1;
  text-align: right;
  color: #f87171;
}

/* الأزرار الصغيرة */
.actions {
  display:flex;
  gap:6px;
}

.icon {
  cursor:pointer;
  background:#0f172a;
  padding:6px 8px;
  border-radius:8px;
  font-size:14px;
}

.icon.saved {
  background:#22c55e;
}

/* تحسين input */
input[type="file"]{
  background:#334155;
  color:white;
  padding:10px;
  border-radius:10px;
  border:none;
  width:100%;
}

</style>

</head>

<body>

<div class="container">

  <div class="box">
    <h2>📄 رفع PDF</h2>

    <input type="file" id="file" accept="application/pdf"><br><br>

    <button onclick="upload()">🚀 تحليل</button>

    <p id="status"></p>
  </div>

  <div id="result"></div>

</div>

<script>

// 🔥 Supabase
const SUPABASE_URL = "https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY = "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// user
let user_id = localStorage.getItem("user_id");
if(!user_id){
  user_id = "user_" + Math.random().toString(36).substring(2,10);
  localStorage.setItem("user_id", user_id);
}

// ⭐ حفظ
async function saveWord(el,en,ar){

  try{

    const { data } = await supabase
      .from("user_words")
      .select("*")
      .eq("user_id", user_id)
      .eq("word", en);

    if(data.length > 0){
      el.innerText = "✅";
      el.classList.add("saved");
      return;
    }

    await supabase.from("user_words").insert({
      user_id: user_id,
      word: en,
      translation: ar
    });

    el.innerText = "✅";
    el.classList.add("saved");

  }catch(e){
    alert("❌ خطأ");
  }
}

// رفع
async function upload() {

  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if (!file) return alert("اختر ملف");

  const formData = new FormData();
  formData.append("file", file);

  status.innerText = "⏳ جاري التحليل...";
  result.innerHTML = "";

  try {

    const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/upload-pdf", {
      method: "POST",
      body: formData
    });

    let data = await res.json();

    if (data.raw) {
      try { data = JSON.parse(data.raw); } catch {}
    }

    status.innerText = "✅ تم التحليل";

    function renderList(list) {
      if (!list) return "";

      return list.map(item => `
        <div class="word">
          <span class="en">${item.word || item.phrase || ""}</span>

          <div class="actions">
            <div class="icon" onclick="speak('${item.word || item.phrase}')">🔊</div>
            <div class="icon" onclick="saveWord(this,'${item.word || item.phrase}','${item.arabic || ""}')">⭐</div>
          </div>

          <span class="ar">${item.arabic || ""}</span>
        </div>
      `).join("");
    }

    result.innerHTML = `
      ${data.verbs?.length ? `<div class="box"><h3 class="title">📌 الأفعال</h3>${renderList(data.verbs)}</div>` : ""}

      ${data.nouns?.length ? `<div class="box"><h3 class="title">📌 الأسماء</h3>${renderList(data.nouns)}</div>` : ""}

      ${data.adjectives?.length ? `<div class="box"><h3 class="title">📌 الصفات</h3>${renderList(data.adjectives)}</div>` : ""}

      ${data.idioms?.length ? `<div class="box"><h3 class="title">📌 العبارات</h3>${renderList(data.idioms)}</div>` : ""}

      ${(data.phrasal_verbs?.length || data.phrasalVerbs?.length)
        ? `<div class="box"><h3 class="title">📌 الأفعال المركبة</h3>${renderList(data.phrasal_verbs || data.phrasalVerbs)}</div>`
        : ""
      }
    `;

  } catch (err) {
    status.innerText = "❌ خطأ";
  }
}

// 🔊 صوت
function speak(word) {
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

</script>

</body>
</html>
