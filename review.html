<!DOCTYPE html><html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.num{
  font-size:22px;
  font-weight:bold;
  color:#38bdf8;
}

.search{
  width:100%;
  max-width:280px;
  padding:8px;
  border-radius:8px;
  border:none;
  margin-bottom:15px;
}

.card{
  background:#1e293b;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  cursor:pointer;
}

.row{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

.small{
  font-size:12px;
  color:#94a3b8;
}

.details{
  margin-top:10px;
  background:#0f172a;
  padding:10px;
  border-radius:8px;
  display:none;
}

button{
  margin:5px;
  padding:5px 8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.ban{background:#ef4444;color:white;}
.unban{background:#22c55e;color:white;}
.plan{color:white;}
</style></head><body><div class="container"><h3>📊 Dashboard</h3><div class="stats">
  <div class="stat">👥 <div id="total" class="num">0</div></div>
  <div class="stat">💰 <div id="paid" class="num">0</div></div>
  <div class="stat">🆓 <div id="free" class="num">0</div></div>
</div><input id="search" class="search" placeholder="🔍 بحث"><div id="users"></div></div><script>

const client = supabase.createClient(
  "https://ofyugbhplaynjeafdrgx.supabase.co",
  "sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO"
);

let users=[];

async function load(){

  const { data } = await client
    .from("users")
    .select("*")
    .order("created_at",{ascending:false});

  users=data;

  document.getElementById("total").innerText=data.length;
  document.getElementById("paid").innerText=data.filter(u=>u.plan==="paid").length;
  document.getElementById("free").innerText=data.filter(u=>u.plan==="free").length;

  render(data);
}

function toggleDetails(id){
  let el=document.getElementById("d-"+id);
  el.style.display = el.style.display==="block" ? "none" : "block";
}

function render(list){

  let html="";

  list.forEach(u=>{

    // 🔥 تحليل الاستخدام
    let usage = {
      video: u.video_count || 0,
      social: u.social_count || 0,
      pdf: u.pdf_count || 0,
      words: u.words_count || 0,
      grammar: u.grammar_count || 0
    };

    let topFeature = Object.keys(usage).reduce((a,b)=>
      usage[a]>usage[b]?a:b
    );

    html+=`
    <div class="card" onclick="toggleDetails('${u.id}')">

      <div class="row">
        <div>
          <strong>${u.name||"بدون اسم"}</strong>
          <div class="small">${u.email||""}</div>
        </div>

        <div>${u.plan}</div>
      </div>

      <div class="small">
        📅 ${u.created_at?.slice(0,10)} | ⏱️ ${u.total_time||0}s
      </div>

      <!-- 🔽 التفاصيل -->
      <div id="d-${u.id}" class="details" onclick="event.stopPropagation()">

        <div>📌 المصدر: ${u.source || "غير معروف"}</div>
        <div>🔥 أكثر استخدام: ${topFeature}</div>

        <hr>

        <div>🎥 فيديو: ${usage.video}</div>
        <div>📱 سوشيال: ${usage.social}</div>
        <div>📄 PDF: ${usage.pdf}</div>
        <div>📚 كلمات: ${usage.words}</div>
        <div>📖 قواعد: ${usage.grammar}</div>

        <hr>

        <div>🕒 آخر نشاط: ${u.last_active || "-"}</div>
        <div>⏳ مدة الجلسة: ${u.total_time || 0}s</div>

        <hr>

        <div>
          ${
            u.status==="banned"
            ? `<button class="unban" onclick="unban('${u.id}')">فك الحظر</button>`
            : `<button class="ban" onclick="ban('${u.id}')">حظر</button>`
          }

          <button class="plan" style="
            background:${u.plan==='paid'?'#22c55e':'#38bdf8'}
          " onclick="toggle('${u.id}','${u.plan}')">

            ${u.plan==='paid'?'مدفوع':'تفعيل'}

          </button>
        </div>

      </div>

    </div>`;
  });

  document.getElementById("users").innerHTML=html;
}

document.getElementById("search").oninput=(e)=>{
  let v=e.target.value.toLowerCase();
  render(users.filter(u=>
    (u.name||"").toLowerCase().includes(v) ||
    (u.email||"").toLowerCase().includes(v)
  ));
};

async function ban(id){
  await client.from("users").update({status:"banned"}).eq("id",id);
  load();
}

async function unban(id){
  await client.from("users").update({status:"active"}).eq("id",id);
  load();
}

async function toggle(id,plan){
  let newPlan=plan==="paid"?"free":"paid";

  await client.from("users").update({
    plan:newPlan
  }).eq("id",id);

  load();
}

load();

</script></body>
</html>
