<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 Smart Video Learning</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>
body {
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
  margin:0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

input{
  padding:10px;
  width:90%;
  border-radius:12px;
  border:none;
  margin:10px;
  text-align:center;
}

button{
  background:#22c55e;
  padding:10px 20px;
  border:none;
  border-radius:12px;
  color:white;
  cursor:pointer;
}

/* الفيديو */
#videoBox{
  position:relative;
  margin-top:15px;
}

#player{
  width:100%;
  height:250px;
  border-radius:15px;
}

/* CC */
#ccBtn{
  position:absolute;
  top:10px;
  right:10px;
  background:#000000aa;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

#ccBtn.active{
  background:#22c55e;
}

/* الترجمة */
#subtitle{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
}

.en{
  font-size:16px;
  font-weight:bold;
}

.ar{
  font-size:14px;
  color:#f87171;
}

/* تمييز */
.highlight{
  color:#38bdf8;
}
</style>
</head>

<body>

<div class="container">

<h2>🎬 تعلم من الفيديو (احترافي)</h2>

<input id="url" placeholder="ضع رابط YouTube">

<br>
<button onclick="start()">تحليل</button>

<div id="videoBox" style="display:none;">
  <div id="ccBtn" onclick="toggleCC()">CC</div>

  <div id="player"></div>

  <div id="subtitle">
    <div id="en" class="en"></div>
    <div id="ar" class="ar"></div>
  </div>
</div>

</div>

<script>

let player;
let subtitles = [];
let cc = true;

/* استخراج ID */
function getId(url){
  if(url.includes("youtu.be"))
    return url.split("/").pop();
  return url.split("v=")[1]?.split("&")[0];
}

/* API جاهز */
function onYouTubeIframeAPIReady(){}

/* تشغيل */
async function start(){

  const url = document.getElementById("url").value;
  if(!url) return alert("حط الرابط");

  const id = getId(url);

  document.getElementById("videoBox").style.display="block";

  if(player) player.destroy();

  player = new YT.Player("player",{
    videoId:id,
    events:{
      onReady: runSync
    }
  });

  /* 🔥 جلب البيانات */
  const res = await fetch("https://n8n.srv1495053.hstgr.cloud/webhook/video-ai",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url})
  });

  const data = await res.json();

  subtitles = [];

  for(let cat in data){
    if(!Array.isArray(data[cat])) continue;

    data[cat].forEach(w=>{
      if(w.time !== undefined){
        subtitles.push({
          start:w.time,
          end:w.time+3,
          en:w.example || w.en,
          ar:w.example_ar || w.ar
        });
      }
    });
  }

}

/* 🔥 مزامنة حقيقية */
function runSync(){

  setInterval(()=>{

    if(!cc) return;

    const t = player.getCurrentTime();

    subtitles.forEach(s=>{
      if(t>=s.start && t<=s.end){

        document.getElementById("en").innerHTML = highlight(s.en);
        document.getElementById("ar").innerText = s.ar;

      }
    });

  },300);

}

/* تمييز */
function highlight(text){
  return text.replace(/\b\w+\b/g, w=>`<span class="highlight">${w}</span>`);
}

/* CC */
function toggleCC(){

  cc=!cc;

  const btn=document.getElementById("ccBtn");

  if(cc){
    btn.classList.add("active");
  }else{
    btn.classList.remove("active");
    document.getElementById("en").innerText="";
    document.getElementById("ar").innerText="";
  }

}

</script>

</body>
</html>
