<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AI Video Learning</title>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

/* ⭐ الفيديو ثابت */
#videoBox {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #0f172a;
  padding: 10px 0;
}

#videoFrame {
  width: 100%;
  height: 220px;
  border-radius: 15px;
}

@media (min-width: 768px) {
  #videoFrame {
    height: 350px;
  }
}

input {
  padding: 12px;
  width: 100%;
  border-radius: 10px;
  border: none;
  margin: 5px 0;
  box-sizing: border-box;
}

button {
  background: #22c55e;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  margin: 10px 0;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 15px;
  box-shadow: 0 0 10px #000;
}

h3 {
  color: #22c55e;
}

/* ⭐ إصلاح الجداول */
.table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.table th, .table td {
  border-bottom: 1px solid #334155;
  padding: 10px;
  text-align: left;
  vertical-align: top;
  word-break: break-word;
}

.table th {
  color: #22c55e;
}

.table th:nth-child(1),
.table td:nth-child(1) { width: 25%; }

.table th:nth-child(2),
.table td:nth-child(2) { width: 20%; }

.table th:nth-child(3),
.table td:nth-child(3) { width: 55%; }

.en {
  color: #38bdf8;
  font-weight: bold;
  cursor: pointer;
}

.ar {
  color: #f87171;
}

.example {
  color: #e2e8f0;
}

.example-ar {
  color: #94a3b8;
  font-size: 13px;
}

.highlight {
  color: #38bdf8;
  font-weight: bold;
  background: rgba(56,189,248,0.1);
  padding: 2px 4px;
  border-radius: 5px;
}

#loading {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو بذكاء </h2>

<input type="text" id="url" placeholder="ضع رابط YouTube">

<button onclick="sendUrl()">🔗 تحليل رابط</button>

<p id="loading">⏳ جاري التحليل...</p>

<div id="videoBox" class="card" style="display:none;">
  <iframe id="videoFrame" frameborder="0" allowfullscreen></iframe>
</div>

<div id="result"></div>

</div>

<script>

const WEBHOOK = "https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

let videoId = "";

// استخراج ID
function getVideoId(url) {
  if (url.includes("youtu.be")) {
    return url.split("/").pop().split("?")[0];
  }
  return url.split("v=")[1]?.split("&")[0];
}

// عرض الفيديو
function showVideo(url) {
  videoId = getVideoId(url);
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}`;
  document.getElementById("videoBox").style.display = "block";
}

// الانتقال للتوقيت
function goToTime(sec) {
  document.getElementById("videoFrame").src =
    `https://www.youtube.com/embed/${videoId}?start=${sec}&autoplay=1`;
}

// تمييز الكلمة
function highlightWord(sentence, word) {
  if (!sentence) return "";
  const regex = new RegExp(`\\b(${word})\\b`, "gi");
  return sentence.replace(regex, `<span class="highlight">$1</span>`);
}

// إرسال
async function sendUrl() {
  const url = document.getElementById("url").value;
  if (!url) return alert("اكتب رابط");

  startLoading();
  showVideo(url);

  try {
    const res = await fetch(WEBHOOK, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ url })
    });

    const text = await res.text();
    const data = JSON.parse(text);

    show(data);

  } catch (err) {
    console.error(err);
    alert("❌ مشكلة في البيانات");
  }

  stopLoading();
}

// عرض النتائج (⭐ ذكي)
function show(data) {
  let html = "";

  for (let cat in data) {
    if (!data[cat] || data[cat].length === 0) continue;

    html += `
    <div class="card">
      <h3>${cat}</h3>

      <table class="table">
        <tr>
          <th>Word</th>
          <th>Arabic</th>
          <th>Example</th>
        </tr>
    `;

    data[cat].forEach(w => {

      const word = w.en || w.word || "";
      const arabic = w.ar || w.arabic || "";
      const example = w.example || "";
      const example_ar = w.example_ar || "";
      const time = w.time || 0;

      const shortExample = example.split(".")[0];
      const highlighted = highlightWord(shortExample, word);

      html += `
        <tr>
          <td class="en" onclick="speak('${word}')">${word}</td>
          <td class="ar">${arabic}</td>
          <td onclick="goToTime(${time})" style="cursor:pointer;">
            <div class="example">${highlighted}</div>
            <div class="example-ar">${example_ar}</div>
          </td>
        </tr>
      `;
    });

    html += `</table></div>`;
  }

  document.getElementById("result").innerHTML = html;
}

// ⭐ صوت رجالي بطيء
function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  msg.rate = 0.75;

  const voices = speechSynthesis.getVoices();
  const male = voices.find(v =>
    v.lang.includes("en") &&
    (v.name.toLowerCase().includes("david") ||
     v.name.toLowerCase().includes("male"))
  );

  if (male) msg.voice = male;

  speechSynthesis.speak(msg);
}

// loading
function startLoading() {
  document.getElementById("loading").style.display = "block";
}

function stopLoading() {
  document.getElementById("loading").style.display = "none";
}

</script>

</body>
</html>
