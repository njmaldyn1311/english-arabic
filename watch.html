<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎥 فصل مباشر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{max-width:900px;margin:auto;padding:15px;}

#player{width:100%;height:220px;border-radius:15px;}

.controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
}

button{
  background:#22c55e;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* مسافة أكبر */
.sub-en{color:#38bdf8;font-weight:bold;margin-top:20px;}
.sub-ar{color:#facc15;font-size:18px;font-weight:bold;margin-bottom:25px;}

.card{
  background:#1e293b;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
}

.word-box{
  border-bottom:1px solid #334155;
  padding:10px;
}

.icon{
  cursor:pointer;
  background:#0f172a;
  padding:8px;
  border-radius:10px;
}

/* toast */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#22c55e;
  padding:10px 20px;
  border-radius:12px;
  opacity:0;
}
.toast.show{opacity:1;}

@media(min-width:768px){
  #player{height:360px;}
}
</style>
</head>

<body>

<div class="container">

<h2>🎥 تعلم من الفيديو</h2>

<div id="player"></div>

<div class="controls">
  <button onclick="prev()">⏮ السابق</button>
  <button onclick="play()">▶️ تشغيل</button>
  <button onclick="pause()">⏸️ إيقاف</button>
  <button onclick="restart()">🔄 إعادة</button>
  <button onclick="next()">⏭ التالي</button>
</div>

<div id="subEn" class="sub-en"></div>
<div id="subAr" class="sub-ar"></div>

<div id="result"></div>

</div>

<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL="https://ofyugbhplaynjeafdrgx.supabase.co";
const SUPABASE_KEY="sb_publishable_DH6LH89gqOx_-ovHZP5tTg_SNDHluJO";
const WEBHOOK="https://n8n.srv1495053.hstgr.cloud/webhook/video-ai";

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let player;
let subtitles=[];
let offset = 3; // 🔥 تأخير الترجمة

let room="room1";
let channel;

/* YT */
function onYouTubeIframeAPIReady(){

  player = new YT.Player('player',{
    playerVars:{
      listType:'playlist',
      list:new URLSearchParams(location.search).get("list")
    },
    events:{ onReady: init }
  });

}

/* تحكم */
function play(){ player.playVideo(); sync(); }
function pause(){ player.pauseVideo(); sync(); }
function restart(){ player.seekTo(0,true); sync(); }
function next(){ player.nextVideo(); }
function prev(){ player.previousVideo(); }

/* toast */
function toast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2000);
}

/* حفظ */
async function save(el,word,ar){

  await supa.from("user_star_words").insert({
    user_id:"user_test",
    word,translation:ar
  });

  el.innerText="✅";
  toast("تم الحفظ");
}

/* AI */
async function loadAI(){

  let vid = player.getVideoData().video_id;

  let res=await fetch(WEBHOOK,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      url:"https://www.youtube.com/watch?v="+vid
    })
  });

  let data=await res.json();

  let html="";
  subtitles=[];

  for(let cat in data){

    html+=`<div class="card"><h3>${cat}</h3>`;

    data[cat].forEach(w=>{

      // 🔥 فلترة الجمل القصيرة
      if(!w.example || w.example.length < 5) return;

      subtitles.push({
        time:(w.time||0)+offset,
        en:w.example,
        ar:w.example_ar
      });

      html+=`
      <div class="word-box">
        <div style="display:flex;justify-content:space-between">
          <div>
            <div class="sub-en">${w.en}</div>
            <div class="sub-ar">${w.ar}</div>
          </div>

          <div style="display:flex;gap:8px">
            <div class="icon" onclick="speech('${w.en}')">🔊</div>
            <div class="icon" onclick="save(this,'${w.en}','${w.ar}')">⭐</div>
          </div>
        </div>
      </div>`;
    });

    html+="</div>";
  }

  result.innerHTML=html;
}

/* ترجمة */
setInterval(()=>{

  if(!player) return;

  if(player.getPlayerState() !== 1) return;

  let t = player.getCurrentTime();

  let c = subtitles.find(s=>t>=s.time && t<s.time+4);

  if(c){
    subEn.innerHTML=c.en;
    subAr.innerText=c.ar;
  }

},500);

/* صوت */
function speech(t){
  let u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";
  speechSynthesis.speak(u);
}

/* 👨‍🏫 مزامنة */
function sync(){

  if(!channel) return;

  channel.send({
    type:'broadcast',
    event:'sync',
    payload:{
      time:player.getCurrentTime(),
      video:player.getVideoData().video_id
    }
  });

}

/* استقبال */
function listen(){

  channel = supa.channel(room);

  channel.on('broadcast',{event:'sync'},msg=>{

    let {time,video}=msg.payload;

    if(player.getVideoData().video_id !== video){
      player.loadVideoById(video);
    }

    player.seekTo(time,true);

  }).subscribe();

}

/* 🎙 صوت */
async function startVoice(){
  await navigator.mediaDevices.getUserMedia({audio:true});
  console.log("mic on");
}

/* init */
function init(){
  listen();
  startVoice();

  setTimeout(loadAI,2000);
}

</script>

</body>
</html>
